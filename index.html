<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Tonguebox – Sprich mit deinen Augen</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 10px;
  font-family: Arial, Helvetica, sans-serif;
  background: #eef2f7;
  color: #111;
}

.app {
  max-width: 900px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  font-size: 42px;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  font-size: 23px;
  margin-bottom: 20px;
}

.box {
  background: white;
  border-radius: 22px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

h2 {
  font-size: 27px;
  margin-top: 0;
}


/* TEXTFELD */

#textInput {
  width: 100%;
  min-height: 280px;

  padding: 18px;

  font-size: 31px;
  line-height: 1.4;

  border: 4px solid #333;
  border-radius: 20px;

  resize: vertical;
}


/* FOKUS */

button:focus,
textarea:focus,
select:focus {
  outline: 7px solid orange;
  outline-offset: 4px;
}


/* WORTVORHERSAGE */

.prediction-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);

  gap: 12px;

  margin-top: 15px;
}

.prediction-button {
  min-height: 105px;

  padding: 12px;

  border-radius: 20px;
  border: 4px solid #2e7d32;

  background: #e8f5e9;

  font-size: 23px;
  font-weight: bold;
}


/* HAUPTBUTTONS */

.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 14px;

  margin-top: 18px;
}

.main-button {
  min-height: 115px;

  padding: 12px;

  border: none;
  border-radius: 20px;

  font-size: 24px;
  font-weight: bold;
}

.speak {
  background: #1565c0;
  color: white;
}

.save {
  background: #2e7d32;
  color: white;
}

.clear {
  background: #555;
  color: white;
}

.stop {
  background: #c62828;
  color: white;
}


/* SATZVORSCHLÄGE */

.sentence-grid {
  display: grid;
  grid-template-columns: 1fr;

  gap: 12px;
}

.sentence-button {
  width: 100%;

  min-height: 110px;

  padding: 16px;

  border-radius: 20px;
  border: 4px solid #673ab7;

  background: #ede7f6;

  font-size: 23px;
  font-weight: bold;

  text-align: left;
}


/* JA / NEIN */

.yes-no {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 14px;
}

.yes,
.no {
  min-height: 150px;

  border: none;
  border-radius: 22px;

  font-size: 40px;
  font-weight: bold;

  color: white;
}

.yes {
  background: #2e7d32;
}

.no {
  background: #c62828;
}


/* SCHNELLKOMMUNIKATION */

.quick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 12px;
}

.quick-button {
  min-height: 110px;

  padding: 12px;

  border-radius: 20px;
  border: 4px solid #1976d2;

  background: #e3f2fd;

  font-size: 22px;
  font-weight: bold;
}

.emergency {
  background: #b71c1c;
  color: white;
  border-color: #7f0000;
}


/* STIMME */

select {
  width: 100%;

  min-height: 75px;

  padding: 10px;

  border-radius: 15px;

  font-size: 21px;
}


/* STATUS */

#status {
  margin-top: 15px;

  min-height: 30px;

  font-size: 20px;
  font-weight: bold;
}


/* GESPEICHERT */

.saved-item {
  margin-bottom: 12px;

  padding: 10px;

  background: #f3f3f3;

  border-radius: 18px;
}

.saved-speak {
  width: 100%;

  min-height: 95px;

  border: none;
  border-radius: 16px;

  background: #512da8;
  color: white;

  font-size: 21px;
  font-weight: bold;

  padding: 14px;

  text-align: left;
}

.saved-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 8px;

  margin-top: 8px;
}

.edit-button,
.delete-button {
  min-height: 70px;

  border: none;
  border-radius: 15px;

  font-size: 19px;
  font-weight: bold;
}

.edit-button {
  background: #ffca28;
}

.delete-button {
  background: #c62828;
  color: white;
}


/* IPHONE */

@media (max-width: 600px) {

  h1 {
    font-size: 34px;
  }

  #textInput {
    min-height: 300px;
    font-size: 29px;
  }

  .prediction-button {
    min-height: 110px;
    font-size: 20px;
  }

  .main-button,
  .quick-button,
  .sentence-button {
    min-height: 120px;
    font-size: 21px;
  }

}

</style>
</head>

<body>

<main class="app">

<h1>👅 Tonguebox</h1>

<div class="subtitle">
  Sprich mit deinen Augen
</div>


<!-- TEXTEINGABE -->

<section class="box">

<h2>💬 Text schreiben</h2>

<textarea
  id="textInput"
  placeholder="Hier schreiben..."
  aria-label="Text eingeben"
  autocomplete="off"
  spellcheck="true"
></textarea>


<h2 style="margin-top:22px;">
  🧠 Wortvorhersage
</h2>

<div
  id="predictionBox"
  class="prediction-grid"
></div>


<div class="main-grid">

<button
  class="main-button speak"
  id="speakButton"
>
  🔊 Vorlesen
</button>

<button
  class="main-button save"
  id="saveButton"
>
  ⭐ Speichern
</button>

<button
  class="main-button clear"
  id="clearButton"
>
  🗑 Leeren
</button>

<button
  class="main-button stop"
  id="stopButton"
>
  ⏹ Stopp
</button>

</div>

<div
  id="status"
  role="status"
  aria-live="polite"
></div>

</section>


<!-- SATZVORSCHLÄGE -->

<section class="box">

<h2>✨ Satzvorschläge</h2>

<div
  id="sentenceBox"
  class="sentence-grid"
></div>

</section>


<!-- JA NEIN -->

<section class="box">

<h2>⚡ Sofort antworten</h2>

<div class="yes-no">

<button
  class="yes"
  data-speak="Ja"
>
  ✅ JA
</button>

<button
  class="no"
  data-speak="Nein"
>
  ❌ NEIN
</button>

</div>

</section>


<!-- SCHNELLAKTIONEN -->

<section class="box">

<h2>⚡ Schnell sagen</h2>

<div class="quick-grid">

<button
  class="quick-button"
  data-speak="Hallo"
>
  👋 Hallo
</button>

<button
  class="quick-button"
  data-speak="Danke"
>
  🙏 Danke
</button>

<button
  class="quick-button"
  data-speak="Bitte warten Sie kurz."
>
  ⏳ Bitte warten
</button>

<button
  class="quick-button"
  data-speak="Bitte sagen Sie das noch einmal."
>
  🔁 Noch einmal
</button>

<button
  class="quick-button"
  data-speak="Bitte sprechen Sie langsamer."
>
  🐢 Langsamer
</button>

<button
  class="quick-button"
  data-speak="Ich habe Sie nicht verstanden."
>
  ❓ Nicht verstanden
</button>

<button
  class="quick-button"
  data-speak="Ich möchte etwas trinken."
>
  🥤 Trinken
</button>

<button
  class="quick-button"
  data-speak="Ich möchte etwas essen."
>
  🍽 Essen
</button>

<button
  class="quick-button"
  data-speak="Ich muss auf die Toilette."
>
  🚻 WC
</button>

<button
  class="quick-button"
  data-speak="Ich brauche Hilfe."
>
  🆘 Hilfe
</button>

<button
  class="quick-button"
  data-speak="Bitte geben Sie mir etwas Zeit zum Antworten."
>
  ⏱ Zeit
</button>

<button
  class="quick-button"
  data-speak="Ich kann nicht sprechen. Ich kommuniziere mit einer Augensteuerung."
>
  👁 Augensteuerung
</button>

<button
  class="quick-button emergency"
  data-speak="Das ist ein Notfall. Bitte holen Sie sofort Hilfe."
>
  🚨 NOTFALL
</button>

</div>

</section>


<!-- STIMME -->

<section class="box">

<h2>🗣 Stimme</h2>

<select id="voiceSelect">
  <option>Stimmen werden geladen...</option>
</select>

</section>


<!-- GESPEICHERTE SÄTZE -->

<section class="box">

<h2>⭐ Gespeicherte Sätze</h2>

<div id="savedBox"></div>

</section>

</main>


<script>

document.addEventListener("DOMContentLoaded", function () {


/* =========================================================
   ELEMENTE
========================================================= */

var textInput =
  document.getElementById("textInput");

var predictionBox =
  document.getElementById("predictionBox");

var sentenceBox =
  document.getElementById("sentenceBox");

var voiceSelect =
  document.getElementById("voiceSelect");

var savedBox =
  document.getElementById("savedBox");

var statusBox =
  document.getElementById("status");

var speakButton =
  document.getElementById("speakButton");

var saveButton =
  document.getElementById("saveButton");

var clearButton =
  document.getElementById("clearButton");

var stopButton =
  document.getElementById("stopButton");

var voices = [];


/* =========================================================
   WORTLISTE
========================================================= */

var wordList = [

  "ich",
  "möchte",
  "brauche",
  "habe",
  "bin",
  "kann",

  "bitte",
  "danke",
  "ja",
  "nein",

  "helfen",
  "Hilfe",
  "warten",
  "Zeit",

  "essen",
  "trinken",
  "Wasser",
  "Kaffee",
  "Milch",
  "Zucker",

  "Hunger",
  "Durst",

  "Toilette",
  "WC",

  "Schmerzen",
  "Kopf",
  "Bauch",
  "Rücken",
  "Beine",

  "gut",
  "schlecht",

  "noch",
  "einmal",

  "langsamer",
  "schneller",

  "verstanden",
  "nicht",

  "sprechen",
  "sagen",

  "heute",
  "morgen",
  "jetzt",
  "später",

  "gehen",
  "kommen",

  "mehr",
  "weniger",

  "warm",
  "kalt"

];


/* =========================================================
   KONTEXT-VORHERSAGE
========================================================= */

var contextPredictions = {

  "ich": [
    "möchte",
    "brauche",
    "habe"
  ],

  "ich möchte": [
    "bitte",
    "essen",
    "trinken"
  ],

  "ich brauche": [
    "Hilfe",
    "Zeit",
    "Wasser"
  ],

  "ich habe": [
    "Hunger",
    "Durst",
    "Schmerzen"
  ],

  "ich kann": [
    "nicht",
    "gehen",
    "sprechen"
  ],

  "möchte": [
    "essen",
    "trinken",
    "bitte"
  ],

  "brauche": [
    "Hilfe",
    "Zeit",
    "Wasser"
  ],

  "habe": [
    "Hunger",
    "Durst",
    "Schmerzen"
  ],

  "bitte": [
    "helfen",
    "warten",
    "noch"
  ],

  "kaffee": [
    "Milch",
    "Zucker",
    "bitte"
  ],

  "wasser": [
    "bitte",
    "kalt",
    "trinken"
  ],

  "schmerzen": [
    "Kopf",
    "Bauch",
    "Rücken"
  ],

  "hilfe": [
    "bitte",
    "jetzt",
    "brauche"
  ],

  "toilette": [
    "bitte",
    "jetzt",
    "helfen"
  ],

  "wc": [
    "bitte",
    "jetzt",
    "helfen"
  ],

  "nicht": [
    "verstanden",
    "sprechen",
    "gut"
  ]

};


/* =========================================================
   WORTVORHERSAGE
========================================================= */

function updatePredictions() {

  var text =
    textInput.value;

  var cursor =
    textInput.selectionStart;


  var beforeCursor =
    text.substring(
      0,
      cursor
    );


  var trimmed =
    beforeCursor.trim();


  var suggestions = [];


  /*
    Prüfen, ob gerade ein Wort
    geschrieben wird.
  */

  var match =
    beforeCursor.match(
      /([A-Za-zÄÖÜäöüß]+)$/
    );


  var partialWord =
    match
      ? match[1].toLowerCase()
      : "";


  /*
    Wenn gerade ein Wort begonnen wurde:
    Wörter nach Anfang suchen.
  */

  if (partialWord !== "") {

    suggestions =
      wordList.filter(
        function (word) {

          return word
            .toLowerCase()
            .indexOf(
              partialWord
            ) === 0

            &&

            word.toLowerCase()
            !== partialWord;

        }
      );

  }


  /*
    Wenn kein passender Wortanfang gefunden wurde,
    Kontext verwenden.
  */

  if (suggestions.length === 0) {

    var lower =
      trimmed.toLowerCase();


    var words =
      lower.split(/\s+/);


    var lastTwo =
      words
        .slice(-2)
        .join(" ");


    var lastOne =
      words[
        words.length - 1
      ] || "";


    if (
      contextPredictions[
        lastTwo
      ]
    ) {

      suggestions =
        contextPredictions[
          lastTwo
        ];

    }

    else if (
      contextPredictions[
        lastOne
      ]
    ) {

      suggestions =
        contextPredictions[
          lastOne
        ];

    }

  }


  /*
    Standardvorschläge
  */

  if (
    suggestions.length === 0
  ) {

    suggestions = [
      "Ich",
      "Bitte",
      "Danke"
    ];

  }


  showPredictions(
    suggestions.slice(0,3),
    partialWord
  );

}


/* =========================================================
   BUTTONS ANZEIGEN
========================================================= */

function showPredictions(
  suggestions,
  partialWord
) {

  predictionBox.innerHTML = "";


  suggestions.forEach(
    function (word) {

      var button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "prediction-button";


      button.textContent =
        word;


      button.addEventListener(
        "click",
        function () {

          insertPrediction(
            word,
            partialWord
          );

        }
      );


      predictionBox.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   VORSCHLAG EINFÜGEN
========================================================= */

function insertPrediction(
  word,
  partialWord
) {

  var text =
    textInput.value;


  var start =
    textInput.selectionStart;


  var end =
    textInput.selectionEnd;


  var before =
    text.substring(
      0,
      start
    );


  var after =
    text.substring(
      end
    );


  /*
    Angefangenes Wort entfernen.
  */

  if (
    partialWord &&
    before
      .toLowerCase()
      .endsWith(
        partialWord.toLowerCase()
      )
  ) {

    before =
      before.substring(
        0,
        before.length -
        partialWord.length
      );

  }


  /*
    Falls nötig Leerzeichen ergänzen.
  */

  if (
    before.length > 0 &&
    !before.endsWith(" ")
  ) {

    before += " ";

  }


  var newText =
    before +
    word +
    " " +
    after;


  textInput.value =
    newText;


  var newCursor =
    (
      before +
      word +
      " "
    ).length;


  textInput.focus();


  textInput.setSelectionRange(
    newCursor,
    newCursor
  );


  updatePredictions();

  updateSentenceSuggestions();

}


/* =========================================================
   EINGABE
========================================================= */

textInput.addEventListener(
  "input",
  function () {

    updatePredictions();

    updateSentenceSuggestions();

  }
);


textInput.addEventListener(
  "click",
  updatePredictions
);


textInput.addEventListener(
  "keyup",
  updatePredictions
);


/* =========================================================
   SATZVORSCHLÄGE
========================================================= */

function updateSentenceSuggestions() {

  var text =
    textInput.value
      .trim()
      .toLowerCase();


  var sentences = [];


  if (text === "") {

    sentences = [

      "Ich möchte etwas sagen.",

      "Bitte warten Sie kurz.",

      "Ich brauche Hilfe."

    ];

  }

  else if (
    text.indexOf(
      "kaffee"
    ) !== -1
  ) {

    sentences = [

      "Ich möchte bitte einen Kaffee.",

      "Ich hätte gerne einen Kaffee mit Milch.",

      "Könnten Sie mir bitte einen Kaffee bringen?"

    ];

  }

  else if (
    text.indexOf(
      "wasser"
    ) !== -1
    ||
    text.indexOf(
      "trinken"
    ) !== -1
  ) {

    sentences = [

      "Ich möchte bitte etwas trinken.",

      "Ich hätte gerne etwas Wasser.",

      "Könnten Sie mir bitte etwas zu trinken geben?"

    ];

  }

  else if (
    text.indexOf(
      "essen"
    ) !== -1
    ||
    text.indexOf(
      "hunger"
    ) !== -1
  ) {

    sentences = [

      "Ich möchte bitte etwas essen.",

      "Ich habe Hunger.",

      "Bitte helfen Sie mir beim Essen."

    ];

  }

  else if (
    text.indexOf(
      "hilfe"
    ) !== -1
  ) {

    sentences = [

      "Ich brauche bitte Hilfe.",

      "Könnten Sie mir bitte helfen?",

      "Bitte helfen Sie mir kurz."

    ];

  }

  else if (
    text.indexOf(
      "schmerz"
    ) !== -1
  ) {

    sentences = [

      "Ich habe Schmerzen.",

      "Bitte helfen Sie mir, ich habe Schmerzen.",

      "Ich brauche wegen meiner Schmerzen Hilfe."

    ];

  }

  else if (
    text.indexOf(
      "toilette"
    ) !== -1
    ||
    text.indexOf(
      "wc"
    ) !== -1
  ) {

    sentences = [

      "Ich muss bitte auf die Toilette.",

      "Bitte helfen Sie mir auf die Toilette.",

      "Ich brauche Hilfe beim Toilettengang."

    ];

  }

  else if (
    text.indexOf(
      "nicht verstanden"
    ) !== -1
  ) {

    sentences = [

      "Ich habe Sie nicht verstanden.",

      "Bitte sagen Sie das noch einmal.",

      "Bitte sprechen Sie langsamer."

    ];

  }

  else {

    sentences = [

      makeSentence(
        textInput.value.trim()
      ),

      "Bitte " +
      textInput.value.trim(),

      "Ich möchte sagen: " +
      textInput.value.trim()

    ];

  }


  showSentences(
    sentences
  );

}


/* =========================================================
   SATZBUTTONS
========================================================= */

function showSentences(
  sentences
) {

  sentenceBox.innerHTML = "";


  sentences.forEach(
    function (sentence) {

      if (!sentence) {
        return;
      }


      var button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "sentence-button";


      button.textContent =
        sentence;


      button.addEventListener(
        "click",
        function () {

          textInput.value =
            sentence;


          updatePredictions();

          updateSentenceSuggestions();

          speakText(
            sentence
          );

        }
      );


      sentenceBox.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   SATZ FORMATIEREN
========================================================= */

function makeSentence(text) {

  if (!text) {
    return "";
  }


  var sentence =
    text.charAt(0)
      .toUpperCase()
    +
    text.slice(1);


  if (
    !/[.!?]$/.test(
      sentence
    )
  ) {

    sentence += ".";

  }


  return sentence;

}


/* =========================================================
   STIMMEN
========================================================= */

function loadVoices() {

  voices =
    window.speechSynthesis
      .getVoices();


  voiceSelect.innerHTML = "";


  if (
    voices.length === 0
  ) {

    var emptyOption =
      document.createElement(
        "option"
      );


    emptyOption.textContent =
      "Keine Stimme verfügbar";


    voiceSelect.appendChild(
      emptyOption
    );


    return;

  }


  var savedVoice =
    localStorage.getItem(
      "tongueboxVoice"
    );


  voices.forEach(
    function (voice,index) {

      var option =
        document.createElement(
          "option"
        );


      option.value =
        index;


      option.textContent =
        voice.name +
        " – " +
        voice.lang;


      if (
        savedVoice ===
        voice.name
      ) {

        option.selected =
          true;

      }


      voiceSelect.appendChild(
        option
      );

    }
  );

}


loadVoices();


if (
  "speechSynthesis"
  in window
) {

  window.speechSynthesis
    .onvoiceschanged =
    loadVoices;

}


voiceSelect.addEventListener(
  "change",
  function () {

    var voice =
      voices[
        Number(
          voiceSelect.value
        )
      ];


    if (voice) {

      localStorage.setItem(
        "tongueboxVoice",
        voice.name
      );

    }

  }
);


/* =========================================================
   SPRECHEN
========================================================= */

function speakText(text) {

  if (!text) {
    return;
  }


  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {

    statusBox.textContent =
      "Sprachausgabe wird von diesem Browser nicht unterstützt.";

    return;

  }


  window.speechSynthesis.cancel();


  var utterance =
    new SpeechSynthesisUtterance(
      text
    );


  var voice =
    voices[
      Number(
        voiceSelect.value
      )
    ];


  if (voice) {

    utterance.voice =
      voice;

    utterance.lang =
      voice.lang;

  }


  utterance.rate =
    0.95;


  utterance.volume =
    1;


  utterance.onstart =
    function () {

      statusBox.textContent =
        "🔊 Tonguebox spricht...";

    };


  utterance.onend =
    function () {

      statusBox.textContent =
        "";

    };


  window.speechSynthesis.speak(
    utterance
  );

}


/* =========================================================
   HAUPTBUTTONS
========================================================= */

speakButton.addEventListener(
  "click",
  function () {

    var text =
      textInput.value.trim();


    if (!text) {

      statusBox.textContent =
        "Bitte zuerst etwas schreiben.";

      return;

    }


    speakText(
      text
    );

  }
);


stopButton.addEventListener(
  "click",
  function () {

    window.speechSynthesis.cancel();

    statusBox.textContent =
      "⏹ Gestoppt.";

  }
);


clearButton.addEventListener(
  "click",
  function () {

    textInput.value =
      "";


    updatePredictions();

    updateSentenceSuggestions();


    statusBox.textContent =
      "";

  }
);


/* =========================================================
   SCHNELLBUTTONS
========================================================= */

var quickButtons =
  document.querySelectorAll(
    "[data-speak]"
  );


quickButtons.forEach(
  function (button) {

    button.addEventListener(
      "click",
      function () {

        speakText(
          button.getAttribute(
            "data-speak"
          )
        );

      }
    );

  }
);


/* =========================================================
   SPEICHERN
========================================================= */

function getSavedTexts() {

  var data =
    localStorage.getItem(
      "tongueboxSaved"
    );


  if (!data) {
    return [];
  }


  try {

    return JSON.parse(
      data
    );

  }

  catch (error) {

    return [];

  }

}


saveButton.addEventListener(
  "click",
  function () {

    var text =
      textInput.value.trim();


    if (!text) {

      statusBox.textContent =
        "Bitte zuerst einen Satz schreiben.";

      return;

    }


    var saved =
      getSavedTexts();


    if (
      saved.indexOf(
        text
      ) === -1
    ) {

      saved.push(
        text
      );


      localStorage.setItem(
        "tongueboxSaved",
        JSON.stringify(
          saved
        )
      );

    }


    showSavedTexts();


    statusBox.textContent =
      "⭐ Satz gespeichert.";

  }
);


/* =========================================================
   GESPEICHERTE SÄTZE
========================================================= */

function showSavedTexts() {

  var saved =
    getSavedTexts();


  savedBox.innerHTML =
    "";


  if (
    saved.length === 0
  ) {

    savedBox.innerHTML =
      "<p>Noch keine Sätze gespeichert.</p>";

    return;

  }


  saved.forEach(
    function (text,index) {

      var item =
        document.createElement(
          "div"
        );


      item.className =
        "saved-item";


      var speak =
        document.createElement(
          "button"
        );


      speak.type =
        "button";


      speak.className =
        "saved-speak";


      speak.textContent =
        "🔊 " +
        text;


      speak.addEventListener(
        "click",
        function () {

          speakText(
            text
          );

        }
      );


      var actions =
        document.createElement(
          "div"
        );


      actions.className =
        "saved-actions";


      var edit =
        document.createElement(
          "button"
        );


      edit.type =
        "button";


      edit.className =
        "edit-button";


      edit.textContent =
        "✏️ Bearbeiten";


      edit.addEventListener(
        "click",
        function () {

          textInput.value =
            text;


          saved.splice(
            index,
            1
          );


          localStorage.setItem(
            "tongueboxSaved",
            JSON.stringify(
              saved
            )
          );


          showSavedTexts();

          updatePredictions();

          updateSentenceSuggestions();


          window.scrollTo(
            0,
            0
          );

        }
      );


      var remove =
        document.createElement(
          "button"
        );


      remove.type =
        "button";


      remove.className =
        "delete-button";


      remove.textContent =
        "🗑 Löschen";


      remove.addEventListener(
        "click",
        function () {

          saved.splice(
            index,
            1
          );


          localStorage.setItem(
            "tongueboxSaved",
            JSON.stringify(
              saved
            )
          );


          showSavedTexts();

        }
      );


      actions.appendChild(
        edit
      );


      actions.appendChild(
        remove
      );


      item.appendChild(
        speak
      );


      item.appendChild(
        actions
      );


      savedBox.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   APP START
========================================================= */

updatePredictions();

updateSentenceSuggestions();

showSavedTexts();


});
</script>

</body>
</html>
