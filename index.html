<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Tonguebox KI</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:6px;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef2f6;
  color:#111;
}

.app{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:30px;
  margin:10px 0 14px;
}

button,
textarea,
select,
summary{
  font-family:inherit;
}

button{
  width:100%;
  min-height:95px;
  padding:10px;
  border:none;
  border-radius:18px;
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
}

button:focus,
textarea:focus,
select:focus,
summary:focus{
  outline:6px solid orange;
  outline-offset:3px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

/* JA / NEIN */

.yes{
  background:#2e7d32;
  color:white;
  min-height:135px;
  font-size:38px;
}

.no{
  background:#c62828;
  color:white;
  min-height:135px;
  font-size:38px;
}

/* AUFKLAPPBARE BEREICHE */

details{
  background:white;
  margin-bottom:10px;
  border-radius:18px;
  overflow:hidden;
}

summary{
  list-style:none;
  cursor:pointer;
  min-height:100px;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#dfe7f1;
  font-size:22px;
  font-weight:bold;
}

summary::-webkit-details-marker{
  display:none;
}

summary::after{
  content:"▼";
  font-size:24px;
}

details[open] summary::after{
  content:"▲";
}

.content{
  padding:10px;
}

/* TEXTFELD */

textarea{
  width:100%;
  min-height:230px;
  padding:16px;
  border:4px solid #222;
  border-radius:18px;
  font-size:27px;
  line-height:1.4;
  resize:none;
}

.speak{
  background:#1565c0;
  color:white;
}

.save{
  background:#2e7d32;
  color:white;
}

.clear{
  background:#555;
  color:white;
}

.stop{
  background:#c62828;
  color:white;
}

/* KI */

.ai{
  background:#fff3cd;
  border:3px solid #f9a825;
}

.aiPurple{
  background:#ede7f6;
  border:3px solid #673ab7;
}

.suggestion{
  background:#ede7f6;
  border:3px solid #673ab7;
  text-align:left;
  margin-bottom:9px;
}

/* SCHNELLKOMMUNIKATION */

.quick{
  background:#e3f2fd;
  border:3px solid #1976d2;
}

.emergency{
  background:#b71c1c;
  color:white;
}

/* STIMME */

select{
  width:100%;
  min-height:75px;
  padding:10px;
  border:3px solid #444;
  border-radius:16px;
  font-size:20px;
  background:white;
}

/* STATUS */

#status{
  min-height:28px;
  margin-top:8px;
  font-size:18px;
  font-weight:bold;
}

/* GESPEICHERT */

.saved{
  background:#512da8;
  color:white;
  text-align:left;
  margin-bottom:7px;
}

.savedActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-bottom:12px;
}

.edit{
  background:#ffca28;
  min-height:65px;
}

.delete{
  background:#c62828;
  color:white;
  min-height:65px;
}

/* IPHONE */

@media(max-width:500px){

  body{
    padding:5px;
  }

  h1{
    font-size:27px;
  }

  button{
    min-height:98px;
    font-size:20px;
  }

  .yes,
  .no{
    min-height:140px;
    font-size:35px;
  }

  textarea{
    min-height:240px;
    font-size:26px;
  }

  summary{
    min-height:100px;
    font-size:21px;
  }

}

</style>
</head>

<body>

<main class="app">

<h1>👅 Tonguebox KI</h1>

<!-- JA / NEIN -->

<div class="grid2" style="margin-bottom:10px;">

<button
  class="yes speakPhrase"
  data-text="Ja"
  type="button">
✅ JA
</button>

<button
  class="no speakPhrase"
  data-text="Nein"
  type="button">
❌ NEIN
</button>

</div>


<!-- TEXT SCHREIBEN -->

<details>

<summary>
⌨️ Text schreiben
</summary>

<div class="content">

<textarea
  id="textInput"
  placeholder="Was möchtest du sagen?"
  aria-label="Text eingeben"
  spellcheck="true">
</textarea>

<div class="grid2" style="margin-top:9px;">

<button
  id="speakButton"
  class="speak"
  type="button">
🔊 Sprechen
</button>

<button
  id="saveButton"
  class="save"
  type="button">
⭐ Speichern
</button>

<button
  id="clearButton"
  class="clear"
  type="button">
🗑 Leeren
</button>

<button
  id="stopButton"
  class="stop"
  type="button">
⏹ Stopp
</button>

</div>

<div
  id="status"
  role="status"
  aria-live="polite">
</div>

</div>

</details>


<!-- KI SATZVORSCHLÄGE -->

<details>

<summary>
✨ KI-Vorschläge
</summary>

<div class="content">

<button
  id="smartSuggestions"
  class="aiPurple"
  type="button"
  style="margin-bottom:9px;">
✨ Passende Sätze finden
</button>

<div id="suggestionBox"></div>

</div>

</details>


<!-- KI TEXTASSISTENT -->

<details>

<summary>
🧠 KI Text-Assistent
</summary>

<div class="content">

<div class="grid2">

<button
  id="completeButton"
  class="ai"
  type="button">
✍️ Vervollständigen
</button>

<button
  id="shortButton"
  class="ai"
  type="button">
⚡ Kürzer
</button>

<button
  id="friendlyButton"
  class="ai"
  type="button">
🙂 Freundlicher
</button>

<button
  id="directButton"
  class="ai"
  type="button">
➡️ Direkter
</button>

<button
  id="questionButton"
  class="ai"
  type="button">
❓ Als Frage
</button>

<button
  id="requestButton"
  class="ai"
  type="button">
🙏 Als Bitte
</button>

<button
  id="improveButton"
  class="ai"
  type="button">
✅ Verbessern
</button>

<button
  id="emergencyTextButton"
  class="ai"
  type="button">
🚨 Dringend
</button>

</div>

</div>

</details>


<!-- SCHNELLKOMMUNIKATION -->

<details>

<summary>
⚡ Schnellkommunikation
</summary>

<div class="content">

<div class="grid2">

<button class="quick speakPhrase" data-text="Hallo">
👋 Hallo
</button>

<button class="quick speakPhrase" data-text="Danke">
🙏 Danke
</button>

<button class="quick speakPhrase" data-text="Bitte warten Sie kurz.">
⏳ Warten
</button>

<button class="quick speakPhrase" data-text="Bitte sagen Sie das noch einmal.">
🔁 Nochmal
</button>

<button class="quick speakPhrase" data-text="Ich brauche Hilfe.">
🆘 Hilfe
</button>

<button class="quick speakPhrase" data-text="Ich möchte etwas trinken.">
🥤 Trinken
</button>

<button class="quick speakPhrase" data-text="Ich möchte etwas essen.">
🍽 Essen
</button>

<button class="quick speakPhrase" data-text="Ich muss auf die Toilette.">
🚻 WC
</button>

<button class="quick speakPhrase" data-text="Ich habe Sie nicht verstanden.">
❓ Nicht verstanden
</button>

<button class="quick speakPhrase" data-text="Bitte sprechen Sie langsamer.">
🐢 Langsamer
</button>

<button class="quick speakPhrase" data-text="Bitte geben Sie mir etwas Zeit zum Antworten.">
⏳ Mehr Zeit
</button>

<button class="quick speakPhrase" data-text="Ich kommuniziere mit einer Augensteuerung.">
👁 Augensteuerung
</button>

<button class="quick speakPhrase" data-text="Ich habe Schmerzen.">
🤕 Schmerzen
</button>

<button
  class="emergency speakPhrase"
  data-text="Das ist ein Notfall. Bitte holen Sie sofort Hilfe.">
🚨 NOTFALL
</button>

</div>

</div>

</details>


<!-- STIMME -->

<details>

<summary>
🗣 Stimme auswählen
</summary>

<div class="content">

<select
  id="voiceSelect"
  aria-label="Stimme auswählen">

<option>
Stimmen werden geladen...
</option>

</select>

</div>

</details>


<!-- GESPEICHERTE SÄTZE -->

<details>

<summary>
⭐ Gespeicherte Sätze
</summary>

<div class="content">

<div id="savedBox"></div>

</div>

</details>

</main>


<script>

document.addEventListener("DOMContentLoaded", function(){

var textInput =
  document.getElementById("textInput");

var statusBox =
  document.getElementById("status");

var voiceSelect =
  document.getElementById("voiceSelect");

var suggestionBox =
  document.getElementById("suggestionBox");

var savedBox =
  document.getElementById("savedBox");

var voices = [];


/* =========================================
   BEREICHE ZENTRIEREN
========================================= */

var allDetails =
  document.querySelectorAll("details");

for(var d = 0; d < allDetails.length; d++){

  allDetails[d].addEventListener(
  "toggle",
  function(){

    var current = this;

    if(!current.open){
      return;
    }

    for(var j = 0; j < allDetails.length; j++){

      if(allDetails[j] !== current){
        allDetails[j].open = false;
      }

    }

    setTimeout(function(){

      current.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },180);

  });

}


/* =========================================
   STIMMEN
========================================= */

function loadVoices(){

  if(!("speechSynthesis" in window)){
    return;
  }

  voices =
    window.speechSynthesis.getVoices();

  voiceSelect.innerHTML = "";

  var savedVoice =
    localStorage.getItem(
      "tongueboxVoice"
    );

  if(voices.length === 0){

    var waiting =
      document.createElement("option");

    waiting.textContent =
      "Stimmen werden geladen...";

    voiceSelect.appendChild(waiting);

    return;
  }

  for(var i = 0; i < voices.length; i++){

    var option =
      document.createElement("option");

    option.value = i;

    option.textContent =
      voices[i].name +
      " – " +
      voices[i].lang;

    if(savedVoice === voices[i].name){
      option.selected = true;
    }

    voiceSelect.appendChild(option);

  }

}

loadVoices();

if("speechSynthesis" in window){

  window.speechSynthesis.onvoiceschanged =
    loadVoices;

}

voiceSelect.addEventListener(
"change",
function(){

  var index =
    parseInt(
      voiceSelect.value,
      10
    );

  if(voices[index]){

    localStorage.setItem(
      "tongueboxVoice",
      voices[index].name
    );

  }

});


/* =========================================
   SPRECHEN
========================================= */

function speakText(message){

  message =
    String(message || "").trim();

  if(!message){
    return;
  }

  if(!("speechSynthesis" in window)){

    statusBox.textContent =
      "Sprachausgabe wird nicht unterstützt.";

    return;
  }

  window.speechSynthesis.cancel();

  var speech =
    new SpeechSynthesisUtterance(message);

  var index =
    parseInt(
      voiceSelect.value,
      10
    );

  if(voices[index]){

    speech.voice =
      voices[index];

    speech.lang =
      voices[index].lang;

  }
  else{

    speech.lang = "de-DE";

  }

  speech.rate = 0.95;

  speech.onstart =
  function(){

    statusBox.textContent =
      "🔊 Tonguebox spricht...";

  };

  speech.onend =
  function(){

    statusBox.textContent = "";

  };

  window.speechSynthesis.speak(speech);

}


/* TEXT SPRECHEN */

document
.getElementById("speakButton")
.addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  if(!value){

    statusBox.textContent =
      "Bitte zuerst Text eingeben.";

    return;
  }

  speakText(value);

});


/* STOP */

document
.getElementById("stopButton")
.addEventListener(
"click",
function(){

  window.speechSynthesis.cancel();

  statusBox.textContent =
    "⏹ Gestoppt.";

});


/* LEEREN */

document
.getElementById("clearButton")
.addEventListener(
"click",
function(){

  textInput.value = "";

  suggestionBox.innerHTML = "";

  statusBox.textContent = "";

});


/* SCHNELLBUTTONS */

var phraseButtons =
  document.querySelectorAll(".speakPhrase");

for(var p = 0; p < phraseButtons.length; p++){

  phraseButtons[p].addEventListener(
  "click",
  function(){

    speakText(
      this.getAttribute("data-text")
    );

  });

}


/* =========================================
   LOKALE KI - ABSICHT ERKENNEN
========================================= */

function detectIntent(text){

  var value =
    text.toLowerCase();

  if(
    contains(value,[
      "hilfe",
      "helfen"
    ])
  ){
    return "hilfe";
  }

  if(
    contains(value,[
      "kaffee"
    ])
  ){
    return "kaffee";
  }

  if(
    contains(value,[
      "wasser",
      "trinken",
      "durst"
    ])
  ){
    return "trinken";
  }

  if(
    contains(value,[
      "essen",
      "hunger",
      "hungrig"
    ])
  ){
    return "essen";
  }

  if(
    contains(value,[
      "wc",
      "toilette"
    ])
  ){
    return "wc";
  }

  if(
    contains(value,[
      "schmerz",
      "weh"
    ])
  ){
    return "schmerzen";
  }

  if(
    contains(value,[
      "warten",
      "zeit",
      "moment"
    ])
  ){
    return "warten";
  }

  if(
    contains(value,[
      "verstehe",
      "verstanden",
      "nochmal",
      "noch einmal"
    ])
  ){
    return "verstehen";
  }

  if(
    contains(value,[
      "arzt",
      "ärzt",
      "medizin"
    ])
  ){
    return "arzt";
  }

  return "normal";

}


/* =========================================
   INTELLIGENTE VORSCHLÄGE
========================================= */

document
.getElementById("smartSuggestions")
.addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  var intent =
    detectIntent(value);

  var list = [];

  if(intent === "hilfe"){

    list = [
      "Ich brauche bitte Hilfe.",
      "Könnten Sie mir bitte helfen?",
      "Bitte holen Sie jemanden, der mir helfen kann."
    ];

  }

  else if(intent === "kaffee"){

    list = [
      "Ich möchte bitte einen Kaffee.",
      "Ich hätte gerne einen Kaffee mit Milch.",
      "Könnten Sie mir bitte einen Kaffee bringen?"
    ];

  }

  else if(intent === "trinken"){

    list = [
      "Ich möchte bitte etwas trinken.",
      "Ich hätte gerne Wasser.",
      "Bitte helfen Sie mir beim Trinken."
    ];

  }

  else if(intent === "essen"){

    list = [
      "Ich möchte bitte etwas essen.",
      "Ich habe Hunger.",
      "Bitte helfen Sie mir beim Essen."
    ];

  }

  else if(intent === "wc"){

    list = [
      "Ich muss auf die Toilette.",
      "Bitte helfen Sie mir auf die Toilette.",
      "Ich brauche jetzt Hilfe beim Toilettengang."
    ];

  }

  else if(intent === "schmerzen"){

    list = [
      "Ich habe Schmerzen.",
      "Meine Schmerzen sind stärker geworden.",
      "Bitte helfen Sie mir wegen meiner Schmerzen."
    ];

  }

  else if(intent === "warten"){

    list = [
      "Bitte warten Sie kurz.",
      "Ich brauche etwas Zeit zum Antworten.",
      "Bitte geben Sie mir einen Moment."
    ];

  }

  else if(intent === "verstehen"){

    list = [
      "Ich habe Sie nicht verstanden.",
      "Bitte sagen Sie das noch einmal.",
      "Bitte sprechen Sie langsamer."
    ];

  }

  else if(intent === "arzt"){

    list = [
      "Ich möchte mit einem Arzt sprechen.",
      "Bitte erklären Sie mir das noch einmal.",
      "Bitte geben Sie mir Zeit, meine Antwort zu formulieren."
    ];

  }

  else if(value){

    list = [
      improveText(value),
      friendlyText(value),
      questionText(value)
    ];

  }

  else{

    list = [
      "Ich möchte etwas sagen.",
      "Bitte warten Sie kurz.",
      "Ich brauche Hilfe."
    ];

  }

  showSuggestions(list);

});


/* VORSCHLÄGE ANZEIGEN */

function showSuggestions(list){

  suggestionBox.innerHTML = "";

  for(var i = 0; i < list.length; i++){

    var button =
      document.createElement("button");

    button.type = "button";

    button.className =
      "suggestion";

    button.textContent =
      "✨ " + list[i];

    button.setAttribute(
      "data-text",
      list[i]
    );

    button.addEventListener(
    "click",
    function(){

      var sentence =
        this.getAttribute("data-text");

      textInput.value =
        sentence;

      speakText(sentence);

    });

    suggestionBox.appendChild(button);

  }

}


/* =========================================
   KI TEXTASSISTENT
========================================= */

document
.getElementById("completeButton")
.addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  if(!value){
    return;
  }

  var intent =
    detectIntent(value);

  if(intent === "kaffee"){

    textInput.value =
      "Ich möchte bitte einen Kaffee.";

  }
  else if(intent === "trinken"){

    textInput.value =
      "Ich möchte bitte etwas trinken.";

  }
  else if(intent === "essen"){

    textInput.value =
      "Ich möchte bitte etwas essen.";

  }
  else if(intent === "hilfe"){

    textInput.value =
      "Ich brauche bitte Hilfe.";

  }
  else if(intent === "wc"){

    textInput.value =
      "Ich muss bitte auf die Toilette.";

  }
  else if(intent === "schmerzen"){

    textInput.value =
      "Ich habe Schmerzen und brauche bitte Hilfe.";

  }
  else{

    textInput.value =
      improveText(value);

  }

});


/* KÜRZER */

document
.getElementById("shortButton")
.addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  if(!value){
    return;
  }

  value =
    value.replace(
      /ich würde gerne/gi,
      "Ich möchte"
    );

  value =
    value.replace(
      /ich hätte gerne/gi,
      "Ich möchte"
    );

  value =
    value.replace(
      /könnten sie mir bitte/gi,
      "Bitte"
    );

  value =
    value.replace(
      /ich möchte gerne/gi,
      "Ich möchte"
    );

  value =
    value.replace(
      /bitte geben sie mir einen moment/gi,
      "Bitte warten"
    );

  textInput.value =
    improveText(value);

});


/* FREUNDLICHER */

document
.getElementById("friendlyButton")
.addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  if(!value){
    return;
  }

  textInput.value =
    friendlyText(value);

});


/* DIREKTER */

document
.getElementById("directButton")
.addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  if(!value){
    return;
  }

  value =
    value.replace(
      /könnten sie mir bitte/gi,
      "Bitte"
    );

  value =
    value.replace(
      /ich hätte gerne/gi,
      "Ich möchte"
    );

  value =
    value.replace(
      /ich würde gerne/gi,
      "Ich möchte"
    );

  textInput.value =
    improveText(value);

});


/* FRAGE */

document
.getElementById("questionButton")
.addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  if(!value){
    return;
  }

  textInput.value =
    questionText(value);

});


/* BITTE */

document
.getElementById("requestButton")
.addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  if(!value){
    return;
  }

  value =
    removeEnd(value);

  if(
    value.toLowerCase()
      .indexOf("bitte") === -1
  ){

    value =
      "Bitte " +
      lowerFirst(value);

  }

  textInput.value =
    improveText(value);

});


/* VERBESSERN */

document
.getElementById("improveButton")
.addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  if(!value){
    return;
  }

  textInput.value =
    improveText(value);

});


/* DRINGEND */

document
.getElementById("emergencyTextButton")
.addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  if(!value){

    textInput.value =
      "Ich brauche dringend Hilfe.";

    return;
  }

  var intent =
    detectIntent(value);

  if(intent === "schmerzen"){

    textInput.value =
      "Ich habe starke Schmerzen. Bitte helfen Sie mir sofort.";

  }
  else if(intent === "wc"){

    textInput.value =
      "Ich muss dringend auf die Toilette. Bitte helfen Sie mir jetzt.";

  }
  else if(intent === "hilfe"){

    textInput.value =
      "Ich brauche dringend Hilfe. Bitte kommen Sie sofort.";

  }
  else{

    textInput.value =
      "Dringend: " +
      removeEnd(
        improveText(value)
      ) +
      ".";

  }

});


/* =========================================
   HILFSFUNKTIONEN
========================================= */

function contains(text,list){

  for(var i = 0; i < list.length; i++){

    if(
      text.indexOf(
        list[i]
      ) !== -1
    ){

      return true;

    }

  }

  return false;

}

function removeEnd(value){

  return String(value || "")
    .trim()
    .replace(/[.!?]+$/,"");

}

function lowerFirst(value){

  if(!value){
    return "";
  }

  return (
    value.charAt(0).toLowerCase() +
    value.slice(1)
  );

}

function improveText(value){

  value =
    String(value || "")
      .trim();

  value =
    value.replace(/\s+/g," ");

  value =
    value.replace(
      /\s+([,.!?])/g,
      "$1"
    );

  if(!value){
    return "";
  }

  value =
    value.charAt(0).toUpperCase() +
    value.slice(1);

  if(!/[.!?]$/.test(value)){
    value += ".";
  }

  return value;

}

function friendlyText(value){

  value =
    removeEnd(value);

  if(
    value.toLowerCase()
      .indexOf("bitte") === -1
  ){

    value =
      "Bitte " +
      lowerFirst(value);

  }

  return improveText(value);

}

function questionText(value){

  var lower =
    value.toLowerCase();

  var intent =
    detectIntent(value);

  if(intent === "hilfe"){

    return "Könnten Sie mir bitte helfen?";

  }

  if(intent === "kaffee"){

    return "Könnten Sie mir bitte einen Kaffee bringen?";

  }

  if(intent === "trinken"){

    return "Könnten Sie mir bitte etwas zu trinken geben?";

  }

  if(intent === "essen"){

    return "Könnten Sie mir bitte etwas zu essen geben?";

  }

  if(intent === "wc"){

    return "Könnten Sie mir bitte auf die Toilette helfen?";

  }

  return (
    "Könnten Sie bitte " +
    lowerFirst(
      removeEnd(value)
    ) +
    "?"
  );

}


/* =========================================
   SPEICHERN
========================================= */

function getSaved(){

  try{

    var result =
      JSON.parse(
        localStorage.getItem(
          "tongueboxSaved"
        ) || "[]"
      );

    if(Array.isArray(result)){
      return result;
    }

    return [];

  }
  catch(error){

    return [];

  }

}

function saveList(list){

  localStorage.setItem(
    "tongueboxSaved",
    JSON.stringify(list)
  );

}

document
.getElementById("saveButton")
.addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  if(!value){
    return;
  }

  var saved =
    getSaved();

  if(saved.indexOf(value) === -1){

    saved.push(value);

    saveList(saved);

    statusBox.textContent =
      "⭐ Gespeichert.";

  }
  else{

    statusBox.textContent =
      "Dieser Satz ist bereits gespeichert.";

  }

  showSaved();

});


/* =========================================
   GESPEICHERTE SÄTZE
========================================= */

function showSaved(){

  savedBox.innerHTML = "";

  var saved =
    getSaved();

  if(saved.length === 0){

    savedBox.innerHTML =
      "<p>Noch keine Sätze gespeichert.</p>";

    return;

  }

  for(var i = 0; i < saved.length; i++){

    createSaved(
      saved[i],
      i
    );

  }

}

function createSaved(sentence,index){

  var speak =
    document.createElement("button");

  speak.type = "button";

  speak.className = "saved";

  speak.textContent =
    "🔊 " + sentence;

  speak.addEventListener(
  "click",
  function(){

    speakText(sentence);

  });


  var actions =
    document.createElement("div");

  actions.className =
    "savedActions";


  var edit =
    document.createElement("button");

  edit.type = "button";

  edit.className = "edit";

  edit.textContent =
    "✏️ Bearbeiten";

  edit.addEventListener(
  "click",
  function(){

    textInput.value =
      sentence;

    var textSection =
      textInput.closest("details");

    if(textSection){

      textSection.open = true;

    }

    setTimeout(function(){

      textInput.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },150);

  });


  var remove =
    document.createElement("button");

  remove.type = "button";

  remove.className = "delete";

  remove.textContent =
    "🗑 Löschen";

  remove.addEventListener(
  "click",
  function(){

    var saved =
      getSaved();

    saved.splice(
      index,
      1
    );

    saveList(saved);

    showSaved();

  });


  actions.appendChild(edit);

  actions.appendChild(remove);

  savedBox.appendChild(speak);

  savedBox.appendChild(actions);

}

showSaved();

});
</script>
