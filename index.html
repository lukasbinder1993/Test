<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Tonguebox – Sprich mit deinen Augen</title>

<style>

/* =========================================
   GRUNDEINSTELLUNGEN
========================================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 6px;

  font-family: Arial, Helvetica, sans-serif;

  background: #eef2f6;
  color: #111;
}

.app {
  max-width: 720px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 30px;
  margin: 8px 0 12px;
}

h2 {
  font-size: 22px;
  margin: 5px 0 12px;
}

.card {
  background: white;

  border-radius: 18px;

  padding: 10px;

  margin-bottom: 10px;
}


/* =========================================
   TEXTEINGABE
========================================= */

textarea {
  width: 100%;

  min-height: 230px;

  padding: 16px;

  font-size: 27px;
  line-height: 1.4;

  border: 4px solid #222;

  border-radius: 18px;

  resize: vertical;

  background: white;
}


/* =========================================
   BUTTONS
========================================= */

button {
  width: 100%;

  min-height: 92px;

  border: none;

  border-radius: 18px;

  padding: 10px;

  font-size: 21px;

  font-weight: bold;

  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}


/* Fokus für Blicksteuerung / Tastatur */

button:focus,
textarea:focus,
select:focus,
summary:focus {
  outline: 6px solid #ff9800;
  outline-offset: 3px;
}


/* =========================================
   RASTER
========================================= */

.grid2 {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 9px;
}


/* =========================================
   HAUPTBUTTONS
========================================= */

.speak {
  background: #1565c0;
  color: white;
}

.save {
  background: #2e7d32;
  color: white;
}

.clear {
  background: #555;
  color: white;
}

.stop {
  background: #d32f2f;
  color: white;
}


/* =========================================
   JA / NEIN
========================================= */

.yes {
  background: #2e7d32;

  color: white;

  font-size: 38px;

  min-height: 135px;
}

.no {
  background: #c62828;

  color: white;

  font-size: 38px;

  min-height: 135px;
}


/* =========================================
   SCHNELLKOMMUNIKATION
========================================= */

.quick {
  background: #e3f2fd;

  border: 3px solid #1976d2;
}

.emergency {
  background: #b71c1c;

  color: white;
}


/* =========================================
   TEXT ASSISTENT
========================================= */

.assistant {
  background: #fff3cd;

  border: 3px solid #f9a825;
}


/* =========================================
   VORSCHLÄGE
========================================= */

.suggestion {
  background: #ede7f6;

  border: 3px solid #673ab7;

  text-align: left;

  margin-bottom: 9px;

  min-height: 90px;
}


/* =========================================
   LAUTSTÄRKE
========================================= */

.volumeButton {
  background: #e8f5e9;

  border: 3px solid #2e7d32;
}

#volumeDisplay {
  text-align: center;

  font-size: 26px;

  font-weight: bold;

  margin-bottom: 10px;
}


/* =========================================
   STIMMEN
========================================= */

select {
  width: 100%;

  min-height: 80px;

  padding: 12px;

  font-size: 20px;

  border: 3px solid #444;

  border-radius: 16px;

  background: white;
}


/* =========================================
   STATUS
========================================= */

#status {
  min-height: 28px;

  margin-top: 9px;

  font-size: 18px;

  font-weight: bold;
}


/* =========================================
   GESPEICHERTE SÄTZE
========================================= */

.savedSentence {
  background: #512da8;

  color: white;

  text-align: left;

  margin-bottom: 7px;
}

.savedActions {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 7px;

  margin-bottom: 15px;
}

.editButton {
  background: #ffca28;

  min-height: 68px;
}

.deleteButton {
  background: #c62828;

  color: white;

  min-height: 68px;
}


/* =========================================
   AUFKLAPPBARE KATEGORIEN
========================================= */

details {
  background: white;

  border-radius: 18px;

  margin-bottom: 10px;

  overflow: hidden;
}

summary {
  list-style: none;

  cursor: pointer;

  min-height: 95px;

  padding: 18px 16px;

  font-size: 23px;

  font-weight: bold;

  display: flex;

  align-items: center;

  justify-content: space-between;

  background: #dfe7f1;
}

summary::-webkit-details-marker {
  display: none;
}

summary::after {
  content: "▼";

  font-size: 23px;
}

details[open] summary::after {
  content: "▲";
}

.categoryContent {
  padding: 10px;
}


/* =========================================
   IPHONE
========================================= */

@media (max-width: 500px) {

  body {
    padding: 5px;
  }

  h1 {
    font-size: 28px;
  }

  textarea {
    min-height: 240px;

    font-size: 26px;
  }

  button {
    min-height: 98px;

    font-size: 20px;
  }

  .yes,
  .no {
    min-height: 140px;

    font-size: 36px;
  }

  summary {
    min-height: 100px;

    font-size: 21px;
  }

}

</style>
</head>

<script>

document.addEventListener(
"DOMContentLoaded",
function () {


/* =========================================
   ELEMENTE
========================================= */

var textInput =
  document.getElementById("textInput");

var statusBox =
  document.getElementById("status");

var voiceSelect =
  document.getElementById("voiceSelect");

var suggestionBox =
  document.getElementById("suggestionBox");

var savedBox =
  document.getElementById("savedBox");

var volumeDisplay =
  document.getElementById("volumeDisplay");


var voices = [];



/* =========================================
   LAUTSTÄRKE
========================================= */

var volume =
  parseFloat(
    localStorage.getItem(
      "tongueboxVolume"
    )
  );


if (
  isNaN(volume) ||
  volume < 0 ||
  volume > 1
) {

  volume = 1;

}


function updateVolume() {

  volumeDisplay.textContent =
    "Lautstärke: " +
    Math.round(
      volume * 100
    ) +
    " %";

}


function saveVolume() {

  volume =
    Math.round(
      volume * 10
    ) / 10;


  localStorage.setItem(
    "tongueboxVolume",
    String(volume)
  );


  updateVolume();

}


document
.getElementById("volumeUp")
.addEventListener(
"click",
function () {

  volume += 0.1;

  if (volume > 1) {
    volume = 1;
  }

  saveVolume();

}
);


document
.getElementById("volumeDown")
.addEventListener(
"click",
function () {

  volume -= 0.1;

  if (volume < 0) {
    volume = 0;
  }

  saveVolume();

}
);


updateVolume();



/* =========================================
   STIMMEN LADEN
========================================= */

function loadVoices() {

  if (
    !("speechSynthesis" in window)
  ) {
    return;
  }


  voices =
    window.speechSynthesis
      .getVoices();


  voiceSelect.innerHTML = "";


  if (voices.length === 0) {

    var noVoice =
      document.createElement(
        "option"
      );

    noVoice.textContent =
      "Stimmen werden geladen...";

    voiceSelect.appendChild(
      noVoice
    );

    return;

  }


  var savedVoice =
    localStorage.getItem(
      "tongueboxVoice"
    );


  for (
    var i = 0;
    i < voices.length;
    i++
  ) {

    var option =
      document.createElement(
        "option"
      );


    option.value =
      String(i);


    option.textContent =
      voices[i].name +
      " – " +
      voices[i].lang;


    if (
      savedVoice ===
      voices[i].name
    ) {

      option.selected = true;

    }


    voiceSelect.appendChild(
      option
    );

  }

}


loadVoices();


if (
  "speechSynthesis" in window
) {

  window.speechSynthesis
    .onvoiceschanged =
    loadVoices;

}


voiceSelect.addEventListener(
"change",
function () {

  var index =
    parseInt(
      voiceSelect.value,
      10
    );


  if (
    !isNaN(index) &&
    voices[index]
  ) {

    localStorage.setItem(
      "tongueboxVoice",
      voices[index].name
    );

  }

}
);



/* =========================================
   SPRECHEN
========================================= */

function speakText(message) {

  message =
    String(message || "")
      .trim();


  if (!message) {
    return;
  }


  if (
    !("speechSynthesis" in window)
  ) {

    statusBox.textContent =
      "Sprachausgabe wird von diesem Browser nicht unterstützt.";

    return;

  }


  window.speechSynthesis.cancel();


  var speech =
    new SpeechSynthesisUtterance(
      message
    );


  var voiceIndex =
    parseInt(
      voiceSelect.value,
      10
    );


  if (
    !isNaN(voiceIndex) &&
    voices[voiceIndex]
  ) {

    speech.voice =
      voices[voiceIndex];

    speech.lang =
      voices[voiceIndex].lang;

  }
  else {

    speech.lang =
      "de-DE";

  }


  speech.rate = 0.95;

  speech.pitch = 1;

  speech.volume =
    volume;


  speech.onstart =
  function () {

    statusBox.textContent =
      "🔊 Tonguebox spricht...";

  };


  speech.onend =
  function () {

    statusBox.textContent =
      "";

  };


  speech.onerror =
  function () {

    statusBox.textContent =
      "Sprachausgabe konnte nicht gestartet werden.";

  };


  window.speechSynthesis.speak(
    speech
  );

}



/* =========================================
   HAUPTTEXT SPRECHEN
========================================= */

document
.getElementById("speakButton")
.addEventListener(
"click",
function () {

  var value =
    textInput.value.trim();


  if (!value) {

    statusBox.textContent =
      "Bitte zuerst etwas schreiben.";

    return;

  }


  speakText(value);

}
);



/* =========================================
   STOPP
========================================= */

document
.getElementById("stopButton")
.addEventListener(
"click",
function () {

  if (
    "speechSynthesis" in window
  ) {

    window.speechSynthesis.cancel();

  }


  statusBox.textContent =
    "⏹ Sprachausgabe gestoppt.";

}
);



/* =========================================
   LEEREN
========================================= */

document
.getElementById("clearButton")
.addEventListener(
"click",
function () {

  textInput.value = "";

  suggestionBox.innerHTML = "";

  statusBox.textContent = "";

  textInput.focus();

}
);



/* =========================================
   SCHNELLBUTTONS
========================================= */

var phraseButtons =
  document.querySelectorAll(
    ".speakPhrase"
  );


for (
  var p = 0;
  p < phraseButtons.length;
  p++
) {

  phraseButtons[p]
    .addEventListener(
    "click",
    function () {

      var message =
        this.getAttribute(
          "data-text"
        );

      speakText(message);

    }
  );

}



/* =========================================
   INTELLIGENTE VORSCHLÄGE
========================================= */

function createSuggestions() {

  var value =
    textInput.value.trim();

  var lower =
    value.toLowerCase();

  var suggestions = [];


  if (!value) {

    suggestions = [
      "Ich möchte etwas sagen.",
      "Bitte warten Sie kurz.",
      "Ich brauche Hilfe."
    ];

  }

  else if (
    containsAny(
      lower,
      ["kaffee", "coffee"]
    )
  ) {

    suggestions = [
      "Ich möchte bitte einen Kaffee.",
      "Ich hätte gerne einen Kaffee mit Milch.",
      "Könnten Sie mir bitte einen Kaffee bringen?"
    ];

  }

  else if (
    containsAny(
      lower,
      ["wasser", "trinken", "durst"]
    )
  ) {

    suggestions = [
      "Ich möchte bitte etwas trinken.",
      "Ich hätte gerne Wasser.",
      "Bitte helfen Sie mir beim Trinken."
    ];

  }

  else if (
    containsAny(
      lower,
      ["essen", "hunger", "hungrig"]
    )
  ) {

    suggestions = [
      "Ich möchte bitte etwas essen.",
      "Ich habe Hunger.",
      "Bitte helfen Sie mir beim Essen."
    ];

  }

  else if (
    containsAny(
      lower,
      ["hilfe", "helfen"]
    )
  ) {

    suggestions = [
      "Ich brauche bitte Hilfe.",
      "Könnten Sie mir bitte helfen?",
      "Bitte holen Sie jemanden."
    ];

  }

  else if (
    containsAny(
      lower,
      ["schmerz", "weh"]
    )
  ) {

    suggestions = [
      "Ich habe Schmerzen.",
      "Bitte helfen Sie mir wegen meiner Schmerzen.",
      "Ich möchte zeigen, wo ich Schmerzen habe."
    ];

  }

  else if (
    containsAny(
      lower,
      ["wc", "toilette"]
    )
  ) {

    suggestions = [
      "Ich muss auf die Toilette.",
      "Bitte helfen Sie mir auf die Toilette.",
      "Ich brauche Hilfe beim Toilettengang."
    ];

  }

  else if (
    containsAny(
      lower,
      ["warten", "warte", "zeit"]
    )
  ) {

    suggestions = [
      "Bitte warten Sie kurz.",
      "Ich brauche etwas Zeit zum Antworten.",
      "Bitte geben Sie mir einen Moment."
    ];

  }

  else if (
    containsAny(
      lower,
      ["verstehe", "verstanden", "versteh"]
    )
  ) {

    suggestions = [
      "Ich habe Sie nicht verstanden.",
      "Bitte sagen Sie das noch einmal.",
      "Bitte sprechen Sie langsamer."
    ];

  }

  else {

    suggestions = [
      cleanSentence(value),
      friendlyText(value),
      questionText(value)
    ];

  }


  displaySuggestions(
    suggestions
  );

}



function displaySuggestions(
  suggestions
) {

  suggestionBox.innerHTML = "";


  for (
    var i = 0;
    i < suggestions.length;
    i++
  ) {

    var button =
      document.createElement(
        "button"
      );


    button.type =
      "button";


    button.className =
      "suggestion";


    button.textContent =
      "✨ " +
      suggestions[i];


    button.setAttribute(
      "data-suggestion",
      suggestions[i]
    );


    button.addEventListener(
    "click",
    function () {

      var sentence =
        this.getAttribute(
          "data-suggestion"
        );


      textInput.value =
        sentence;


      speakText(
        sentence
      );

    }
    );


    suggestionBox.appendChild(
      button
    );

  }

}

/* =========================================
   HILFSFUNKTIONEN
========================================= */

function containsAny(
  text,
  words
) {

  for (
    var i = 0;
    i < words.length;
    i++
  ) {

    if (
      text.indexOf(
        words[i]
      ) !== -1
    ) {

      return true;

    }

  }


  return false;

}



function removeEnding(
  value
) {

  return value.replace(
    /[.!?]+$/,
    ""
  );

}



function cleanSentence(
  value
) {

  value =
    String(value || "")
      .trim();


  if (!value) {

    return "";

  }


  value =
    value.replace(
      /\s+/g,
      " "
    );


  value =
    value.charAt(0)
      .toUpperCase() +
    value.slice(1);


  if (
    !/[.!?]$/.test(value)
  ) {

    value += ".";

  }


  return value;

}



function lowerFirst(
  value
) {

  if (!value) {
    return "";
  }


  return (
    value.charAt(0)
      .toLowerCase() +
    value.slice(1)
  );

}



function friendlyText(
  value
) {

  value =
    removeEnding(
      value.trim()
    );


  if (
    value.toLowerCase()
      .indexOf("bitte") !== -1
  ) {

    return cleanSentence(
      value
    );

  }


  return cleanSentence(
    "Bitte " +
    lowerFirst(value)
  );

}



function formalText(
  value
) {

  var lower =
    value.toLowerCase();


  if (
    lower.indexOf("kaffee") !== -1
  ) {

    return "Könnten Sie mir bitte einen Kaffee bringen?";

  }


  if (
    lower.indexOf("wasser") !== -1
  ) {

    return "Könnten Sie mir bitte Wasser geben?";

  }


  if (
    lower.indexOf("trinken") !== -1
  ) {

    return "Könnten Sie mir bitte etwas zu trinken geben?";

  }


  if (
    lower.indexOf("essen") !== -1
  ) {

    return "Könnten Sie mir bitte etwas zu essen geben?";

  }


  if (
    lower.indexOf("hilfe") !== -1
  ) {

    return "Könnten Sie mir bitte helfen?";

  }


  return (
    "Könnten Sie bitte " +
    lowerFirst(
      removeEnding(
        value
      )
    ) +
    "?"
  );

}



function questionText(
  value
) {

  var lower =
    value.toLowerCase();


  if (
    lower.indexOf("kaffee") !== -1
  ) {

    return "Könnten Sie mir bitte einen Kaffee bringen?";

  if (

  if (

  }


  if (

  ) {

  }


  return (

        value
      )
    ) +
    "?"
  );

}



/* =========================================
   GESPEICHERTE SÄTZE
========================================= */

function getSavedTexts() {

  try {

    var data =
      localStorage.getItem(
        "tongueboxSaved"
      );


    if (!data) {
      return [];
    }


    var parsed =
      JSON.parse(data);


    if (
      Array.isArray(parsed)
    ) {

      return parsed;

    }


    return [];

  }
  catch (error) {

    return [];

  }

}



function saveTexts(
  texts
) {

  localStorage.setItem(
    "tongueboxSaved",
    JSON.stringify(texts)
  );

}



document
.getElementById("saveButton")
.addEventListener(
"click",
function () {

  var value =
    textInput.value.trim();


  if (!value) {

    statusBox.textContent =
      "Bitte zuerst etwas schreiben.";

    return;

  }


  var saved =
    getSavedTexts();


  if (
    saved.indexOf(value) === -1
  ) {

    saved.push(value);

    saveTexts(saved);


    statusBox.textContent =
      "⭐ Satz gespeichert.";

  }
  else {

    statusBox.textContent =
      "Dieser Satz ist bereits gespeichert.";

  }


  displaySavedTexts();

}
);



function displaySavedTexts() {

  savedBox.innerHTML = "";


  var saved =
    getSavedTexts();


  if (
    saved.length === 0
  ) {

    savedBox.innerHTML =
      "<p>Noch keine Sätze gespeichert.</p>";

    return;

  }


  for (
    var i = 0;
    i < saved.length;
    i++
  ) {

    createSavedItem(
      saved[i],
      i
    );

  }

}



function createSavedItem(
  sentence,
  index
) {

  var speakButton =
    document.createElement(
      "button"
    );


  speakButton.type =
    "button";


  speakButton.className =
    "savedSentence";


  speakButton.textContent =
    "🔊 " + sentence;


  speakButton.addEventListener(
  "click",
  function () {

    speakText(sentence);

  }
  );


  var actions =
    document.createElement(
      "div"
    );


  actions.className =
    "savedActions";


  var edit =
    document.createElement(
      "button"
    );


  edit.type =
    "button";


  edit.className =
    "editButton";


  edit.textContent =
    "✏️ Bearbeiten";


  edit.addEventListener(
  "click",
  function () {

    textInput.value =
      sentence;


    statusBox.textContent =
      "✏️ Satz ins Textfeld geladen.";


    window.scrollTo(
      0,
      0
    );


    textInput.focus();

  }
  );


  var remove =
    document.createElement(
      "button"
    );


  remove.type =
    "button";


  remove.className =
    "deleteButton";


  remove.textContent =
    "🗑 Löschen";


  remove.addEventListener(
  "click",
  function () {

    var current =
      getSavedTexts();


    current.splice(
      index,
      1
    );


    saveTexts(
      current
    );


    displaySavedTexts();


    statusBox.textContent =
      "🗑 Satz gelöscht.";

  }
  );


  actions.appendChild(
    edit
  );


  actions.appendChild(
    remove
  );


  savedBox.appendChild(
    speakButton
  );


  savedBox.appendChild(
    actions
  );

}
