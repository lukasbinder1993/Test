/* =========================================
   THEMA FINDEN
========================================= */

function detectTopic(input) {

    const text =
        input.toLowerCase().trim();


    for(const topicName in topicGroups) {

        const topic =
            topicGroups[topicName];


        const found =
            topic.keywords.some(
                function(keyword) {

                    return text.includes(keyword);

                }
            );


        if(found) {

            return topicName;

        }

    }


    return null;

}


/* =========================================
   THEMENVORSCHLÄGE HOLEN
========================================= */

function getTopicSuggestions(input) {

    const topicName =
        detectTopic(input);


    if(!topicName) {

        return [];

    }


    return topicGroups[
        topicName
    ].suggestions;

}


/* =========================================
   VORSCHLÄGE AKTUALISIEREN
========================================= */

function updateSuggestions() {

    const input =
        textField.value.trim();

    const usage =
        getUsageData();


    aiSuggestions.innerHTML = "";

    inlinePredictions.innerHTML = "";


    /* =====================================
       1. ZUERST THEMA ERKENNEN
    ===================================== */

    const topicSuggestions =
        getTopicSuggestions(input);


    if(topicSuggestions.length > 0) {

        topicSuggestions
        .slice(0,6)
        .forEach(function(sentence) {

            createSuggestionButton(
                sentence,
                aiSuggestions
            );

        });


        topicSuggestions
        .slice(0,3)
        .forEach(function(sentence) {

            createSuggestionButton(
                sentence,
                inlinePredictions
            );

        });


        return;

    }


    /* =====================================
       2. FALLS KEIN THEMA ERKANNT:
          normale Satzsuche
    ===================================== */

    const ranked =
        sentenceLibrary
        .map(function(item) {

            return {

                text:
                    item.text,

                context:
                    item.context,

                score:
                    suggestionScore(
                        item,
                        input,
                        usage
                    )

            };

        })

        .sort(function(a,b) {

            return b.score - a.score;

        });


    ranked
    .slice(0,6)
    .forEach(function(item) {

        createSuggestionButton(
            item.text,
            aiSuggestions
        );

    });


    ranked
    .slice(0,3)
    .forEach(function(item) {

        createSuggestionButton(
            item.text,
            inlinePredictions
        );

    });

}
