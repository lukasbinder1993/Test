<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Tonguebox – Sprich mit deinen Augen</title>

<style>

/* =========================================================
   GRUNDEINSTELLUNGEN
========================================================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 10px;
  font-family: Arial, Helvetica, sans-serif;
  background: #eef3f8;
  color: #111;
}

.app {
  max-width: 1000px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  font-size: 42px;
  margin: 10px 0 4px;
}

.subtitle {
  text-align: center;
  font-size: 24px;
  margin-bottom: 20px;
}

h2 {
  font-size: 28px;
  margin-top: 0;
}

.box {
  background: white;
  padding: 18px;
  margin-bottom: 18px;
  border-radius: 22px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12);
}


/* =========================================================
   FOKUS / BLICKERFASSUNG / TASTATUR
========================================================= */

button:focus,
textarea:focus,
select:focus,
input:focus {
  outline: 7px solid orange;
  outline-offset: 4px;
}


/* =========================================================
   TEXTFELD
========================================================= */

textarea {
  width: 100%;
  min-height: 280px;
  padding: 20px;
  font-size: 32px;
  line-height: 1.4;
  border: 4px solid #333;
  border-radius: 20px;
  resize: vertical;
}


/* =========================================================
   ALLGEMEINE BUTTONS
========================================================= */

button {
  cursor: pointer;
  font-family: inherit;
}


/* =========================================================
   WORTVORHERSAGE
========================================================= */

.word-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 14px;
}

.word-button {
  min-height: 105px;
  padding: 12px;
  font-size: 23px;
  font-weight: bold;
  background: #e8f5e9;
  border: 4px solid #2e7d32;
  border-radius: 20px;
}


/* =========================================================
   SATZVORSCHLÄGE
========================================================= */

.sentence-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

.sentence-button {
  width: 100%;
  min-height: 115px;
  padding: 18px;
  text-align: left;
  font-size: 23px;
  font-weight: bold;
  background: #ede7f6;
  border: 4px solid #673ab7;
  border-radius: 20px;
}


/* =========================================================
   HAUPTAKTIONEN
========================================================= */

.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 16px;
}

.main-button {
  min-height: 120px;
  padding: 15px;
  font-size: 25px;
  font-weight: bold;
  border: none;
  border-radius: 20px;
}

.speak {
  background: #1565c0;
  color: white;
}

.suggestions {
  background: #673ab7;
  color: white;
}

.save {
  background: #2e7d32;
  color: white;
}

.clear {
  background: #555;
  color: white;
}

.stop {
  background: #c62828;
  color: white;
}


/* =========================================================
   INTELLIGENTE TEXTWERKZEUGE
========================================================= */

.smart-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.smart-button {
  min-height: 110px;
  padding: 15px;
  font-size: 22px;
  font-weight: bold;
  background: #fff8e1;
  border: 4px solid #f9a825;
  border-radius: 20px;
}


/* =========================================================
   JA / NEIN
========================================================= */

.yes-no {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.yes,
.no {
  min-height: 155px;
  font-size: 40px;
  font-weight: bold;
  border: none;
  border-radius: 22px;
}

.yes {
  background: #2e7d32;
  color: white;
}

.no {
  background: #c62828;
  color: white;
}


/* =========================================================
   SCHNELLKOMMUNIKATION
========================================================= */

.quick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.quick-button {
  min-height: 115px;
  padding: 15px;
  font-size: 23px;
  font-weight: bold;
  background: #e3f2fd;
  border: 4px solid #1976d2;
  border-radius: 20px;
}

.help-button {
  background: #fff3cd;
  border-color: #ff9800;
}

.emergency-button {
  background: #b71c1c;
  color: white;
  border-color: #7f0000;
}


/* =========================================================
   STIMMEN
========================================================= */

label {
  display: block;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 10px;
}

.voice-search {
  width: 100%;
  min-height: 70px;
  padding: 12px;
  margin-bottom: 12px;
  font-size: 22px;
  border: 3px solid #555;
  border-radius: 14px;
}

select {
  width: 100%;
  min-height: 80px;
  padding: 10px;
  font-size: 22px;
  border-radius: 14px;
}


/* =========================================================
   LAUTSTÄRKE
========================================================= */

input[type="range"] {
  width: 100%;
  min-height: 60px;
}

.range-value {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}


/* =========================================================
   STATUS
========================================================= */

#status {
  min-height: 35px;
  margin-top: 12px;
  font-size: 21px;
  font-weight: bold;
}


/* =========================================================
   GESPEICHERTE SÄTZE
========================================================= */

.saved-list {
  display: grid;
  gap: 15px;
}

.saved-item {
  padding: 12px;
  background: #f5f5f5;
  border-radius: 18px;
}

.saved-speak {
  width: 100%;
  min-height: 100px;
  padding: 15px;
  text-align: left;
  background: #512da8;
  color: white;
  border: none;
  border-radius: 18px;
  font-size: 22px;
  font-weight: bold;
}

.saved-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

.edit-button,
.delete-button {
  min-height: 75px;
  border: none;
  border-radius: 16px;
  font-size: 20px;
  font-weight: bold;
}

.edit-button {
  background: #ffca28;
}

.delete-button {
  background: #c62828;
  color: white;
}


/* =========================================================
   KATEGORIEN
========================================================= */

.category-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.category-button {
  min-height: 105px;
  padding: 14px;
  font-size: 22px;
  font-weight: bold;
  background: #f3e5f5;
  border: 4px solid #8e24aa;
  border-radius: 20px;
}


/* =========================================================
   IPHONE / KLEINE BILDSCHIRME
========================================================= */

@media (max-width: 600px) {

  body {
    padding: 6px;
  }

  h1 {
    font-size: 35px;
  }

  h2 {
    font-size: 25px;
  }

  textarea {
    min-height: 300px;
    font-size: 29px;
  }

  .word-button {
    min-height: 110px;
    font-size: 20px;
  }

  .main-button,
  .smart-button,
  .quick-button,
  .category-button,
  .sentence-button {
    min-height: 120px;
    font-size: 21px;
  }

  .yes,
  .no {
    min-height: 160px;
    font-size: 38px;
  }

}

</style>
</head>


<body>

<main class="app">

  <!-- =====================================================
       TITEL
  ====================================================== -->

  <h1>👅 Tonguebox</h1>

  <div class="subtitle">
    Sprich mit deinen Augen
  </div>


  <!-- =====================================================
       TEXTEINGABE
  ====================================================== -->

  <section class="box">

    <h2>💬 Was möchtest du sagen?</h2>

    <textarea
      id="textInput"
      aria-label="Text eingeben"
      placeholder="Hier schreiben..."
      autocomplete="off"
      spellcheck="true"
    ></textarea>


    <!-- Wortvorhersage -->

    <h2 style="margin-top:20px;">
      🧠 Wortvorhersage
    </h2>

    <div
      id="wordSuggestions"
      class="word-grid"
      aria-label="Wortvorhersage"
    ></div>


    <!-- Hauptaktionen -->

    <div class="main-grid">

      <button
        class="main-button speak"
        onclick="speakInput()"
      >
        🔊 VORLESEN
      </button>

      <button
        class="main-button suggestions"
        onclick="createSentenceSuggestions()"
      >
        ✨ SATZVORSCHLÄGE
      </button>

      <button
        class="main-button save"
        onclick="saveText()"
      >
        ⭐ SPEICHERN
      </button>

      <button
        class="main-button clear"
        onclick="clearText()"
      >
        🗑 LEEREN
      </button>

      <button
        class="main-button stop"
        onclick="stopSpeaking()"
      >
        ⏹ STOPP
      </button>

    </div>


    <div
      id="status"
      role="status"
      aria-live="polite"
    ></div>

  </section>


  <!-- =====================================================
       SATZVORSCHLÄGE
  ====================================================== -->

  <section class="box">

    <h2>✨ Intelligente Satzvorschläge</h2>

    <div
      id="sentenceSuggestions"
      class="sentence-grid"
    >
      <p>
        Schreibe einige Wörter in das Textfeld.
      </p>
    </div>

  </section>


  <!-- =====================================================
       TEXTWERKZEUGE
  ====================================================== -->

  <section class="box">

    <h2>🧠 Text verbessern</h2>

    <div class="smart-grid">

      <button
        class="smart-button"
        onclick="completeSentence()"
      >
        ✍️ Satz vervollständigen
      </button>

      <button
        class="smart-button"
        onclick="makeShorter()"
      >
        ⚡ Kürzer machen
      </button>

      <button
        class="smart-button"
        onclick="makeFriendly()"
      >
        🙂 Freundlicher
      </button>

      <button
        class="smart-button"
        onclick="makeFormal()"
      >
        👔 Höflicher
      </button>

      <button
        class="smart-button"
        onclick="makeSimple()"
      >
        💬 Einfach formulieren
      </button>

      <button
        class="smart-button"
        onclick="correctText()"
      >
        ✅ Text verbessern
      </button>

    </div>

  </section>


  <!-- =====================================================
       JA / NEIN
  ====================================================== -->

  <section class="box">

    <h2>⚡ Sofort antworten</h2>

    <div class="yes-no">

      <button
        class="yes"
        onclick="speakText('Ja')"
      >
        ✅ JA
      </button>

      <button
        class="no"
        onclick="speakText('Nein')"
      >
        ❌ NEIN
      </button>

    </div>

  </section>


  <!-- =====================================================
       KATEGORIEN
  ====================================================== -->

  <section class="box">

    <h2>📂 Kommunikation</h2>

    <div class="category-grid">

      <button
        class="category-button"
        onclick="showCategory('alltag')"
      >
        🏠 Alltag
      </button>

      <button
        class="category-button"
        onclick="showCategory('essen')"
      >
        🍽 Essen & Trinken
      </button>

      <button
        class="category-button"
        onclick="showCategory('hilfe')"
      >
        🆘 Hilfe
      </button>

      <button
        class="category-button"
        onclick="showCategory('gesundheit')"
      >
        🏥 Gesundheit
      </button>

      <button
        class="category-button"
        onclick="showCategory('gespraech')"
      >
        💬 Gespräch
      </button>

      <button
        class="category-button"
        onclick="showCategory('technik')"
      >
        💻 Technik
      </button>

    </div>

    <div
      id="categoryPhrases"
      class="sentence-grid"
      style="margin-top:16px;"
    ></div>

  </section>


  <!-- =====================================================
       SCHNELLKOMMUNIKATION
  ====================================================== -->

  <section class="box">

    <h2>⚡ Schnell sagen</h2>

    <div class="quick-grid">

      <button
        class="quick-button"
        onclick="speakText('Hallo')"
      >
        👋 Hallo
      </button>

      <button
        class="quick-button"
        onclick="speakText('Danke')"
      >
        🙏 Danke
      </button>

      <button
        class="quick-button"
        onclick="speakText('Bitte warten Sie kurz. Ich brauche etwas Zeit zum Antworten.')"
      >
        ⏳ Bitte warten
      </button>

      <button
        class="quick-button"
        onclick="speakText('Bitte sagen Sie das noch einmal.')"
      >
        🔁 Noch einmal
      </button>

      <button
        class="quick-button"
        onclick="speakText('Bitte sprechen Sie langsamer.')"
      >
        🐢 Langsamer
      </button>

      <button
        class="quick-button"
        onclick="speakText('Ich habe Sie nicht verstanden.')"
      >
        ❓ Nicht verstanden
      </button>

      <button
        class="quick-button"
        onclick="speakText('Ich möchte etwas trinken.')"
      >
        🥤 Trinken
      </button>

      <button
        class="quick-button"
        onclick="speakText('Ich möchte etwas essen.')"
      >
        🍽 Essen
      </button>

      <button
        class="quick-button"
        onclick="speakText('Ich muss auf die Toilette.')"
      >
        🚻 WC
      </button>

      <button
        class="quick-button help-button"
        onclick="speakText('Ich brauche Hilfe.')"
      >
        🆘 Hilfe
      </button>

      <button
        class="quick-button"
        onclick="speakText('Bitte geben Sie mir etwas Zeit zum Antworten.')"
      >
        ⏱ Zeit
      </button>

      <button
        class="quick-button"
        onclick="speakText('Ich kann nicht sprechen. Ich kommuniziere mit einer Augensteuerung.')"
      >
        👁 Augensteuerung
      </button>

      <button
        class="quick-button emergency-button"
        onclick="speakText('Das ist ein Notfall. Bitte holen Sie sofort Hilfe.')"
      >
        🚨 NOTFALL
      </button>

    </div>

  </section>


  <!-- =====================================================
       STIMME
  ====================================================== -->

  <section class="box">

    <h2>🗣 Stimme</h2>

    <label for="voiceSearch">
      Stimme suchen
    </label>

    <input
      id="voiceSearch"
      class="voice-search"
      type="text"
      placeholder="z. B. German, Deutsch, Anna..."
      oninput="filterVoices()"
    >

    <label for="voiceSelect">
      Stimme auswählen
    </label>

    <select
      id="voiceSelect"
      aria-label="Stimme auswählen"
    ></select>


    <h2 style="margin-top:25px;">
      🔊 Lautstärke
    </h2>

    <input
      id="volume"
      type="range"
      min="0"
      max="1"
      step="0.1"
      value="1"
      oninput="updateVolume()"
    >

    <div
      id="volumeValue"
      class="range-value"
    >
      100 %
    </div>

  </section>


  <!-- =====================================================
       GESPEICHERTE SÄTZE
  ====================================================== -->

  <section class="box">

    <h2>⭐ Meine gespeicherten Sätze</h2>

    <div
      id="savedTexts"
      class="saved-list"
    ></div>

  </section>

</main>


<script>

/* =========================================================
   ELEMENTE
========================================================= */

const textInput =
  document.getElementById("textInput");

const wordBox =
  document.getElementById("wordSuggestions");

const sentenceBox =
  document.getElementById("sentenceSuggestions");

const statusBox =
  document.getElementById("status");

const voiceSelect =
  document.getElementById("voiceSelect");

const voiceSearch =
  document.getElementById("voiceSearch");

const volumeSlider =
  document.getElementById("volume");

const volumeValue =
  document.getElementById("volumeValue");

const savedBox =
  document.getElementById("savedTexts");

const categoryBox =
  document.getElementById("categoryPhrases");

let voices = [];


/* =========================================================
   SPRACHAUSGABE
========================================================= */

function loadVoices() {

  voices =
    window.speechSynthesis.getVoices();

  displayVoices(voices);

}


function displayVoices(list) {

  voiceSelect.innerHTML = "";

  if (list.length === 0) {

    const option =
      document.createElement("option");

    option.textContent =
      "Keine Stimmen gefunden";

    voiceSelect.appendChild(option);

    return;

  }


  const savedVoice =
    localStorage.getItem(
      "tongueboxVoiceName"
    );


  list.forEach(voice => {

    const option =
      document.createElement("option");

    option.value =
      voice.name;

    option.textContent =
      voice.name +
      " – " +
      voice.lang;


    if (
      savedVoice ===
      voice.name
    ) {
      option.selected = true;
    }


    voiceSelect.appendChild(option);

  });

}


window.speechSynthesis.onvoiceschanged =
  loadVoices;

loadVoices();


voiceSelect.addEventListener(
  "change",
  function() {

    localStorage.setItem(
      "tongueboxVoiceName",
      voiceSelect.value
    );

  }
);


function filterVoices() {

  const search =
    voiceSearch.value
      .toLowerCase()
      .trim();


  const filtered =
    voices.filter(
      voice =>

        voice.name
          .toLowerCase()
          .includes(search)

        ||

        voice.lang
          .toLowerCase()
          .includes(search)

    );


  displayVoices(filtered);

}


function getSelectedVoice() {

  const name =
    voiceSelect.value;


  return voices.find(
    voice =>
      voice.name === name
  );

}


function speakText(text) {

  if (!text) return;


  window.speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  const voice =
    getSelectedVoice();


  if (voice) {

    speech.voice = voice;
    speech.lang = voice.lang;

  }


  speech.volume =
    Number(
      volumeSlider.value
    );


  speech.rate = 0.95;


  speech.onstart =
    function() {

      showStatus(
        "🔊 Tonguebox spricht..."
      );

    };


  speech.onend =
    function() {

      showStatus("");

    };


  window.speechSynthesis.speak(
    speech
  );

}


function speakInput() {

  const text =
    textInput.value.trim();


  if (!text) {

    showStatus(
      "Bitte zuerst etwas schreiben."
    );

    return;

  }


  speakText(text);

}


function stopSpeaking() {

  window.speechSynthesis.cancel();

  showStatus(
    "⏹ Sprachausgabe gestoppt."
  );

}


/* =========================================================
   LAUTSTÄRKE
========================================================= */

function updateVolume() {

  const value =
    Math.round(
      Number(
        volumeSlider.value
      ) * 100
    );


  volumeValue.textContent =
    value + " %";


  localStorage.setItem(
    "tongueboxVolume",
    volumeSlider.value
  );

}


function loadVolume() {

  const saved =
    localStorage.getItem(
      "tongueboxVolume"
    );


  if (saved !== null) {

    volumeSlider.value =
      saved;

  }


  updateVolume();

}


/* =========================================================
   WORTDATENBANK
========================================================= */

const predictionDatabase = {

  "ich": [
    "möchte",
    "brauche",
    "habe"
  ],

  "möchte": [
    "bitte",
    "etwas",
    "gerne"
  ],

  "brauche": [
    "Hilfe",
    "Zeit",
    "etwas"
  ],

  "habe": [
    "Schmerzen",
    "Hunger",
    "Durst"
  ],

  "bitte": [
    "helfen",
    "warten",
    "noch einmal"
  ],

  "kann": [
    "nicht",
    "ich",
    "jemand"
  ],

  "nicht": [
    "sprechen",
    "verstehen",
    "jetzt"
  ],

  "essen": [
    "bitte",
    "möchte",
    "helfen"
  ],

  "trinken": [
    "Wasser",
    "Kaffee",
    "bitte"
  ],

  "kaffee": [
    "Milch",
    "Zucker",
    "bitte"
  ],

  "wasser": [
    "bitte",
    "kalt",
    "trinken"
  ],

  "schmerzen": [
    "Kopf",
    "Rücken",
    "Bauch"
  ],

  "hilfe": [
    "bitte",
    "jetzt",
    "brauche"
  ],

  "toilette": [
    "bitte",
    "helfen",
    "jetzt"
  ],

  "wc": [
    "bitte",
    "helfen",
    "jetzt"
  ],

  "können": [
    "Sie",
    "wir",
    "bitte"
  ],

  "sie": [
    "mir",
    "bitte",
    "das"
  ],

  "mir": [
    "bitte",
    "helfen",
    "sagen"
  ],

  "default": [
    "Ich",
    "Bitte",
    "Danke"
  ]

};


/* =========================================================
   WORTVORHERSAGE
========================================================= */

textInput.addEventListener(
  "input",
  updateWordSuggestions
);


function getLastWord() {

  const text =
    textInput.value
      .trim()
      .toLowerCase();


  if (!text) return "";


  const words =
    text.split(/\s+/);


  return words[
    words.length - 1
  ]
  .replace(
    /[.,!?;:]/g,
    ""
  );

}


function updateWordSuggestions() {

  const lastWord =
    getLastWord();


  let suggestions =
    predictionDatabase[
      lastWord
    ];


  if (!suggestions) {

    suggestions =
      smartWordGuess(
        lastWord
      );

  }


  showWordSuggestions(
    suggestions
  );

}


function smartWordGuess(lastWord) {

  if (
    lastWord.startsWith("helf")
  ) {

    return [
      "mir",
      "bitte",
      "jetzt"
    ];

  }


  if (
    lastWord.startsWith("trink")
  ) {

    return [
      "Wasser",
      "Kaffee",
      "bitte"
    ];

  }


  if (
    lastWord.startsWith("schmerz")
  ) {

    return [
      "Kopf",
      "Rücken",
      "Bauch"
    ];

  }


  if (
    lastWord.startsWith("dank")
  ) {

    return [
      "dir",
      "Ihnen",
      "vielmals"
    ];

  }


  return [
    "bitte",
    "möchte",
    "brauche"
  ];

}


function showWordSuggestions(
  suggestions
) {

  wordBox.innerHTML = "";


  suggestions
    .slice(0,3)
    .forEach(
      word => {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "word-button";


        button.textContent =
          word;


        button.onclick =
          function() {

            addWord(
              word
            );

          };


        wordBox.appendChild(
          button
        );

      }
    );

}


function addWord(word) {

  let text =
    textInput.value;


  if (
    text &&
    !text.endsWith(" ")
  ) {

    text += " ";

  }


  textInput.value =
    text +
    word +
    " ";


  textInput.focus();


  updateWordSuggestions();

}


/* =========================================================
   INTELLIGENTE SATZVORSCHLÄGE
========================================================= */

function createSentenceSuggestions() {

  const text =
    textInput.value
      .trim();


  if (!text) {

    showStatus(
      "Bitte zuerst einige Wörter schreiben."
    );

    return;

  }


  const lower =
    text.toLowerCase();


  let suggestions = [];


  if (
    lower.includes("kaffee")
  ) {

    suggestions = [

      "Ich hätte bitte gerne einen Kaffee.",

      "Könnten Sie mir bitte einen Kaffee bringen?",

      "Ich möchte bitte einen Kaffee."

    ];

  }

  else if (
    lower.includes("wasser")
    ||
    lower.includes("trinken")
  ) {

    suggestions = [

      "Ich möchte bitte etwas trinken.",

      "Könnten Sie mir bitte etwas zu trinken geben?",

      "Ich hätte bitte gerne Wasser."

    ];

  }

  else if (
    lower.includes("essen")
    ||
    lower.includes("hunger")
  ) {

    suggestions = [

      "Ich möchte bitte etwas essen.",

      "Ich habe Hunger.",

      "Könnten Sie mir bitte beim Essen helfen?"

    ];

  }

  else if (
    lower.includes("toilette")
    ||
    lower.includes("wc")
  ) {

    suggestions = [

      "Ich muss bitte auf die Toilette.",

      "Könnten Sie mir bitte beim Toilettengang helfen?",

      "Ich brauche bitte Hilfe auf der Toilette."

    ];

  }

  else if (
    lower.includes("schmerz")
  ) {

    suggestions = [

      "Ich habe Schmerzen.",

      "Ich habe im Moment Schmerzen und brauche Hilfe.",

      "Bitte helfen Sie mir, ich habe Schmerzen."

    ];

  }

  else if (
    lower.includes("hilfe")
  ) {

    suggestions = [

      "Ich brauche bitte Hilfe.",

      "Könnten Sie mir bitte helfen?",

      "Bitte helfen Sie mir kurz."

    ];

  }

  else if (
    lower.includes("warte")
    ||
    lower.includes("zeit")
  ) {

    suggestions = [

      "Bitte warten Sie kurz.",

      "Ich brauche etwas Zeit zum Antworten.",

      "Bitte geben Sie mir einen Moment."

    ];

  }

  else {

    const cleaned =
      capitalizeSentence(
        text
      );


    suggestions = [

      cleaned,

      "Bitte " +
      lowerFirst(
        cleaned
      ),

      "Ich möchte sagen: " +
      cleaned

    ];

  }


  showSentenceSuggestions(
    suggestions
  );

}


/* =========================================================
   SATZVORSCHLÄGE ANZEIGEN
========================================================= */

function showSentenceSuggestions(
  suggestions
) {

  sentenceBox.innerHTML = "";


  suggestions
    .slice(0,3)
    .forEach(
      sentence => {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "sentence-button";


        button.textContent =
          "✨ " +
          sentence;


        button.onclick =
          function() {

            textInput.value =
              sentence;


            updateWordSuggestions();


            speakText(
              sentence
            );

          };


        sentenceBox.appendChild(
          button
        );

      }
    );

}


/* =========================================================
   SATZ VERVOLLSTÄNDIGEN
========================================================= */

function completeSentence() {

  const text =
    textInput.value
      .trim();


  if (!text) {

    showStatus(
      "Bitte zuerst etwas schreiben."
    );

    return;

  }


  const lower =
    text.toLowerCase();


  let result =
    text;


  if (
    lower === "ich möchte"
  ) {

    result =
      "Ich möchte bitte etwas sagen.";

  }

  else if (
    lower === "ich brauche"
  ) {

    result =
      "Ich brauche bitte Hilfe.";

  }

  else if (
    lower.includes("kaffee")
  ) {

    result =
      "Ich hätte bitte gerne einen Kaffee.";

  }

  else if (
    lower.includes("wasser")
  ) {

    result =
      "Ich hätte bitte gerne etwas Wasser.";

  }

  else if (
    lower.includes("hilfe")
  ) {

    result =
      "Ich brauche bitte Hilfe.";

  }

  else if (
    lower.includes("toilette")
  ) {

    result =
      "Ich muss bitte auf die Toilette.";

  }

  else {

    result =
      capitalizeSentence(
        text
      );

  }


  setText(
    result
  );

}


/* =========================================================
   KÜRZER FORMULIEREN
========================================================= */

function makeShorter() {

  let text =
    textInput.value.trim();


  if (!text) return;


  const replacements = [

    [
      "Könnten Sie mir bitte",
      "Bitte"
    ],

    [
      "Ich würde gerne",
      "Ich möchte"
    ],

    [
      "Ich hätte gerne",
      "Ich möchte"
    ],

    [
      "Bitte geben Sie mir einen Moment",
      "Bitte warten"
    ],

    [
      "Ich brauche etwas Zeit zum Antworten",
      "Bitte warten"
    ]

  ];


  replacements.forEach(
    item => {

      text =
        text.replace(
          new RegExp(
            escapeRegExp(
              item[0]
            ),
            "gi"
          ),

          item[1]
        );

    }
  );


  setText(
    capitalizeSentence(
      text
    )
  );

}


/* =========================================================
   FREUNDLICHER
========================================================= */

function makeFriendly() {

  let text =
    textInput.value.trim();


  if (!text) return;


  if (
    !text
      .toLowerCase()
      .includes("bitte")
  ) {

    text =
      "Bitte " +
      lowerFirst(
        text
      );

  }


  setText(
    capitalizeSentence(
      text
    )
  );

}


/* =========================================================
   HÖFLICHER
========================================================= */

function makeFormal() {

  const text =
    textInput.value.trim();


  if (!text) return;


  let result =
    text;


  if (
    text
      .toLowerCase()
      .startsWith("ich möchte")
  ) {

    result =

  ) {

        text
      );

  }


  setText(
    capitalizeSentence(
      result
    )
  );

}


/* =========================================================
   EINFACHER FORMULIEREN
========================================================= */

function makeSimple() {

  let text =
    textInput.value.trim();


  if (!text) return;


  const replacements = {

    "könnten sie mir bitte":
      "bitte",

    "ich würde gerne":
      "ich möchte",

    "ich hätte gerne":
      "ich möchte",

    "augenblick":
      "Moment",

    "benötige":
      "brauche",

    "unterstützung":
      "Hilfe"

  };


  Object.entries(
    replacements
  )
  .forEach(

        text.replace(

            "gi"
          ),
          to
        );

    }
  );


  setText(
    capitalizeSentence(
      text
    )
  );

}


/* =========================================================
   TEXT VERBESSERN
========================================================= */

function correctText() {

  let text =
    textInput.value.trim();


  if (!text) return;


  text =
    text
      .replace(
        /\s+/g,
        " "
      )
      .replace(
        /\s+([,.!?])/g,
        "$1"
      );


  text =
    capitalizeSentence(
      text
    );


  setText(
    text
  );


  showStatus(
    "✅ Text wurde verbessert."
  );

}


/* =========================================================
   TEXT SETZEN

function setText(text) {

/* =========================================================
   SPEICHERN
========================================================= */

function getSavedTexts() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "tongueboxTexte"
      ) || "[]"
    );

  }

  catch {

    return [];

  }

}


function saveText() {

  const text =
    textInput.value.trim();


  if (!text) {

    showStatus(
      "Bitte zuerst einen Satz schreiben."
    );

    return;

  }


  const savedTexts =
    getSavedTexts();


  if (
    savedTexts.includes(
      text
    )
  ) {

    showStatus(
      "Dieser Satz ist bereits gespeichert."
    );

    return;

  }


  savedTexts.push(
    text
  );


  localStorage.setItem(
    "tongueboxTexte",
    JSON.stringify(
      savedTexts
    )
  );


  showSavedTexts();


  showStatus(
    "⭐ Satz gespeichert."
  );

}


/* =========================================================
   GESPEICHERTE SÄTZE ANZEIGEN
========================================================= */

function showSavedTexts() {

  const savedTexts =
    getSavedTexts();


  savedBox.innerHTML = "";


  if (
    savedTexts.length === 0
  ) {

    savedBox.innerHTML =
      "<p>Noch keine Sätze gespeichert.</p>";

    return;

  }


  savedTexts.forEach(
    (text,index) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "saved-item";


      const speakButton =
        document.createElement(
          "button"
        );


      speakButton.className =
        "saved-speak";


      speakButton.textContent =
        "🔊 " +
        text;


      speakButton.onclick =
        function() {

          speakText(
            text
          );

        };


      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "saved-actions";


      const editButton =
        document.createElement(
          "button"
        );


      editButton.className =
        "edit-button";


      editButton.textContent =
        "✏️ Bearbeiten";


      editButton.onclick =
        function() {

          editSavedText(
            index
          );

        };


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "delete-button";


      deleteButton.textContent =
        "🗑 Löschen";


      deleteButton.onclick =
        function() {

          deleteSavedText(
            index
          );

        };


      actions.appendChild(
        editButton
      );

      actions.appendChild(
        deleteButton
      );


      item.appendChild(
        speakButton
      );

      item.appendChild(
        actions
      );


      savedBox.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   GESPEICHERTEN SATZ BEARBEITEN
========================================================= */

function editSavedText(
  index
) {

  const savedTexts =
    getSavedTexts();


  const oldText =
    savedTexts[
      index
    ];


  textInput.value =
    oldText;


  savedTexts.splice(
    index,
    1
  );


  localStorage.setItem(
    "tongueboxTexte",
    JSON.stringify(
      savedTexts
    )
  );


  showSavedTexts();

  updateWordSuggestions();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });


  showStatus(
    "✏️ Satz kann jetzt bearbeitet werden."
  );

}


/* =========================================================
   SATZ LÖSCHEN
========================================================= */

function deleteSavedText(
  index
) {

  const savedTexts =
    getSavedTexts();


  savedTexts.splice(
    index,
    1
  );


  localStorage.setItem(
    "tongueboxTexte",
    JSON.stringify(
      savedTexts
    )
  );


  showSavedTexts();


  showStatus(
    "🗑 Satz gelöscht."
  );

}


/* =========================================================
   HILFSFUNKTIONEN
========================================================= */

function capitalizeSentence(
  text
) {

  text =
    text.trim();


  if (!text) return "";


  text =
    text.charAt(0)
      .toUpperCase()
    +
    text.slice(1);


  if (
    !/[.!?]$/.test(
      text
    )
  ) {

    text += ".";

  }


  return text;

}


function lowerFirst(
  text
) {

  if (!text) return "";


  return (
    text.charAt(0)
      .toLowerCase()
    +
    text.slice(1)
  );

}


function escapeRegExp(
  string
) {

  return string.replace(
    /[.*+?^${}()|[\]\\]/g,
    "\\$&"
  );

}


function showStatus(
  message
) {

  statusBox.textContent =
    message;

}


/* =========================================================
   START
========================================================= */

loadVolume();

updateWordSuggestions();

showSavedTexts();
