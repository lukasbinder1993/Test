<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Tonguebox KI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:6px;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef2f6;
  color:#111;
}

.app{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:30px;
  margin:10px 0 6px;
}

#timeInfo{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

button,
textarea,
select,
summary{
  font-family:inherit;
}

button{
  width:100%;
  min-height:95px;
  padding:10px;
  border:none;
  border-radius:18px;
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
}

button:focus,
textarea:focus,
select:focus,
summary:focus{
  outline:6px solid orange;
  outline-offset:3px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

/* JA / NEIN */

.yes{
  background:#2e7d32;
  color:white;
  min-height:135px;
  font-size:38px;
}

.no{
  background:#c62828;
  color:white;
  min-height:135px;
  font-size:38px;
}

/* BEREICHE */

details{
  background:white;
  margin-bottom:10px;
  border-radius:18px;
  overflow:hidden;
}

summary{
  list-style:none;
  cursor:pointer;
  min-height:100px;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#dfe7f1;
  font-size:22px;
  font-weight:bold;
}

summary::-webkit-details-marker{
  display:none;
}

summary::after{
  content:"▼";
  font-size:24px;
}

details[open] summary::after{
  content:"▲";
}

.content{
  padding:10px;
}

/* TEXT */

textarea{
  width:100%;
  min-height:230px;
  padding:16px;
  border:4px solid #222;
  border-radius:18px;
  font-size:27px;
  line-height:1.4;
  resize:none;
}

.speak{
  background:#1565c0;
  color:white;
}

.save{
  background:#2e7d32;
  color:white;
}

.clear{
  background:#555;
  color:white;
}

.stop{
  background:#c62828;
  color:white;
}

/* INTELLIGENTE BEREICHE */

.smart{
  background:#ede7f6;
  border:3px solid #673ab7;
}

.assistant{
  background:#fff3cd;
  border:3px solid #f9a825;
}

.suggestion{
  background:#ede7f6;
  border:3px solid #673ab7;
  text-align:left;
  margin-bottom:9px;
}

/* SCHNELL */

.quick{
  background:#e3f2fd;
  border:3px solid #1976d2;
}

.timeButton{
  background:#fff8e1;
  border:3px solid #ffb300;
}

.emergency{
  background:#b71c1c;
  color:white;
}

/* STIMME */

select{
  width:100%;
  min-height:75px;
  padding:10px;
  border:3px solid #444;
  border-radius:16px;
  font-size:20px;
  background:white;
}

/* STATUS */

#status{
  min-height:28px;
  margin-top:8px;
  font-size:18px;
  font-weight:bold;
}

/* GESPEICHERT */

.saved{
  background:#512da8;
  color:white;
  text-align:left;
  margin-bottom:7px;
}

.savedActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-bottom:12px;
}

.edit{
  background:#ffca28;
  min-height:65px;
}

.delete{
  background:#c62828;
  color:white;
  min-height:65px;
}

/* IPHONE */

@media(max-width:500px){

  body{
    padding:5px;
  }

  h1{
    font-size:27px;
  }

  button{
    min-height:98px;
    font-size:20px;
  }

  .yes,
  .no{
    min-height:140px;
    font-size:35px;
  }

  textarea{
    min-height:240px;
    font-size:26px;
  }

  summary{
    min-height:100px;
    font-size:21px;
  }
}
</style>
</head>

<body>

<main class="app">

<h1>👅 Tonguebox KI</h1>

<div id="timeInfo">
Tageszeit wird erkannt...
</div>

<!-- JA / NEIN -->

<div class="grid2" style="margin-bottom:10px;">

<button
  class="yes speakPhrase"
  data-text="Ja"
  type="button">
✅ JA
</button>

<button
  class="no speakPhrase"
  data-text="Nein"
  type="button">
❌ NEIN
</button>

</div>


<!-- TAGESZEIT -->

<details>

<summary>
🕒 Passend zur Tageszeit
</summary>

<div class="content">

<div id="timeButtons" class="grid2"></div>

</div>

</details>


<!-- TEXT SCHREIBEN -->

<details>

<summary>
⌨️ Text schreiben
</summary>

<div class="content">

<textarea
  id="textInput"
  placeholder="Was möchtest du sagen?"
  aria-label="Text eingeben"
  spellcheck="true">
</textarea>

<div class="grid2" style="margin-top:9px;">

<button id="speakButton" class="speak" type="button">
🔊 Sprechen
</button>

<button id="saveButton" class="save" type="button">
⭐ Speichern
</button>

<button id="clearButton" class="clear" type="button">
🗑 Leeren
</button>

<button id="stopButton" class="stop" type="button">
⏹ Stopp
</button>

</div>

<div id="status" role="status" aria-live="polite"></div>

</div>

</details>


<!-- INTELLIGENTE VORSCHLÄGE -->

<details>

<summary>
✨ Intelligente Vorschläge
</summary>

<div class="content">

<button
  id="suggestionButton"
  class="smart"
  type="button"
  style="margin-bottom:9px;">
✨ Vorschläge erstellen
</button>

<div id="suggestionBox"></div>

</div>

</details>


<!-- TEXT-ASSISTENT -->

<details>

<summary>
🧠 Text-Assistent
</summary>

<div class="content">

<div class="grid2">

<button id="completeButton" class="assistant" type="button">
✍️ Vervollständigen
</button>

<button id="friendlyButton" class="assistant" type="button">
🙂 Freundlicher
</button>

<button id="shortButton" class="assistant" type="button">
⚡ Kürzer
</button>

<button id="questionButton" class="assistant" type="button">
❓ Als Frage
</button>

</div>

</div>

</details>


<!-- SCHNELLKOMMUNIKATION -->

<details>

<summary>
⚡ Schnellkommunikation
</summary>

<div class="content">

<div class="grid2">

<button class="quick speakPhrase" data-text="Hallo" type="button">
👋 Hallo
</button>

<button class="quick speakPhrase" data-text="Danke" type="button">
🙏 Danke
</button>

<button class="quick speakPhrase" data-text="Bitte warten Sie kurz." type="button">
⏳ Warten
</button>

<button class="quick speakPhrase" data-text="Bitte sagen Sie das noch einmal." type="button">
🔁 Nochmal
</button>

<button class="quick speakPhrase" data-text="Ich brauche Hilfe." type="button">
🆘 Hilfe
</button>

<button class="quick speakPhrase" data-text="Ich möchte etwas trinken." type="button">
🥤 Trinken
</button>

<button class="quick speakPhrase" data-text="Ich möchte etwas essen." type="button">
🍽 Essen
</button>

<button class="quick speakPhrase" data-text="Ich muss auf die Toilette." type="button">
🚻 WC
</button>

<button class="quick speakPhrase" data-text="Ich habe Sie nicht verstanden." type="button">
❓ Nicht verstanden
</button>

<button class="quick speakPhrase" data-text="Bitte sprechen Sie langsamer." type="button">
🐢 Langsamer
</button>

<button class="quick speakPhrase" data-text="Bitte geben Sie mir etwas Zeit zum Antworten." type="button">
⏳ Mehr Zeit
</button>

<button class="quick speakPhrase" data-text="Ich kommuniziere mit einer Augensteuerung." type="button">
👁 Augensteuerung
</button>

<button class="quick speakPhrase" data-text="Ich habe Schmerzen." type="button">
🤕 Schmerzen
</button>

<button
  class="emergency speakPhrase"
  data-text="Das ist ein Notfall. Bitte holen Sie sofort Hilfe."
  type="button">
🚨 NOTFALL
</button>

</div>

</div>

</details>


<!-- STIMME -->

<details>

<summary>
🗣 Stimme auswählen
</summary>

<div class="content">

<select id="voiceSelect" aria-label="Stimme auswählen">
<option>Stimmen werden geladen...</option>
</select>

</div>

</details>


<!-- GESPEICHERT -->

<details>

<summary>
⭐ Gespeicherte Sätze
</summary>

<div class="content">

<div id="savedBox"></div>

</div>

</details>

</main>


<script>
document.addEventListener("DOMContentLoaded", function(){

var textInput =
  document.getElementById("textInput");

var statusBox =
  document.getElementById("status");

var voiceSelect =
  document.getElementById("voiceSelect");

var suggestionBox =
  document.getElementById("suggestionBox");

var savedBox =
  document.getElementById("savedBox");

var timeButtons =
  document.getElementById("timeButtons");

var timeInfo =
  document.getElementById("timeInfo");

var voices = [];


/* =====================================
   TAGESZEIT
===================================== */

function getDayTime(){

  var hour =
    new Date().getHours();

  if(hour >= 5 && hour < 11){
    return "morgen";
  }

  if(hour >= 11 && hour < 15){
    return "mittag";
  }

  if(hour >= 15 && hour < 18){
    return "nachmittag";
  }

  if(hour >= 18 && hour < 23){
    return "abend";
  }

  return "nacht";
}


function getGreeting(){

  var time =
    getDayTime();

  if(time === "morgen"){
    return "Guten Morgen";
  }

  if(time === "mittag"){
    return "Guten Appetit";
  }

  if(time === "nachmittag"){
    return "Guten Nachmittag";
  }

  if(time === "abend"){
    return "Guten Abend";
  }

  return "Gute Nacht";
}


function getTimePhrases(){

  var time =
    getDayTime();

  if(time === "morgen"){

    return [
      "Guten Morgen.",
      "Guten Morgen, wie geht es Ihnen?",
      "Ich möchte bitte frühstücken.",
      "Ich hätte gerne einen Kaffee.",
      "Ich möchte etwas trinken.",
      "Was ist heute geplant?"
    ];

  }

  if(time === "mittag"){

    return [
      "Guten Appetit.",
      "Guten Appetit zusammen.",
      "Ich wünsche Ihnen einen guten Appetit.",
      "Ich möchte etwas essen.",
      "Bitte helfen Sie mir beim Essen.",
      "Ich hätte gerne etwas zu trinken."
    ];

  }

  if(time === "nachmittag"){

    return [
      "Guten Nachmittag.",
      "Ich hätte gerne einen Kaffee.",
      "Ich möchte etwas trinken.",
      "Ich brauche eine kurze Pause.",
      "Wie geht es Ihnen?",
      "Was machen wir heute noch?"
    ];

  }

  if(time === "abend"){

    return [
      "Guten Abend.",
      "Guten Abend, wie geht es Ihnen?",
      "Ich wünsche Ihnen einen schönen Abend.",
      "Ich möchte etwas essen.",
      "Ich möchte mich ausruhen.",
      "Danke für heute."
    ];

  }

  return [
    "Gute Nacht.",
    "Ich möchte schlafen.",
    "Ich brauche Hilfe.",
    "Ich muss auf die Toilette.",
    "Ich habe Schmerzen.",
    "Bitte helfen Sie mir."
  ];

}


function updateTimeArea(){

  var time =
    getDayTime();

  var labels = {
    morgen:"🌅 Guten Morgen",
    mittag:"🍽 Guten Appetit",
    nachmittag:"🌤 Guten Nachmittag",
    abend:"🌙 Guten Abend",
    nacht:"🌙 Gute Nacht"
  };

  timeInfo.textContent =
    labels[time];

  timeButtons.innerHTML = "";

  var phrases =
    getTimePhrases();

  for(var i = 0; i < phrases.length; i++){

    var button =
      document.createElement("button");

    button.type = "button";
    button.className = "timeButton";
    button.textContent = phrases[i];

    button.setAttribute(
      "data-text",
      phrases[i]
    );

    button.addEventListener(
    "click",
    function(){

      speakText(
        this.getAttribute("data-text")
      );

    });

    timeButtons.appendChild(button);

  }

}

updateTimeArea();

/* Tageszeit regelmäßig aktualisieren */
setInterval(updateTimeArea,300000);


/* =====================================
   AUTOMATISCHE ZENTRIERUNG
===================================== */

var details =
  document.querySelectorAll("details");

for(var d = 0; d < details.length; d++){

  details[d].addEventListener(
  "toggle",
  function(){

    var current = this;

    if(!current.open){
      return;
    }

    for(var j = 0; j < details.length; j++){

      if(details[j] !== current){
        details[j].open = false;
      }

    }

    setTimeout(function(){

      current.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },180);

  });

}


/* =====================================
   STIMMEN
===================================== */

function loadVoices(){

  if(!("speechSynthesis" in window)){
    return;
  }

  voices =
    window.speechSynthesis.getVoices();

  voiceSelect.innerHTML = "";

  var savedVoice =
    localStorage.getItem("tongueboxVoice");

  if(voices.length === 0){

    var loading =
      document.createElement("option");

    loading.textContent =
      "Stimmen werden geladen...";

    voiceSelect.appendChild(loading);

    return;
  }

  for(var i = 0; i < voices.length; i++){

    var option =
      document.createElement("option");

    option.value = i;

    option.textContent =
      voices[i].name +
      " – " +
      voices[i].lang;

    if(savedVoice === voices[i].name){
      option.selected = true;
    }

    voiceSelect.appendChild(option);

  }

}

loadVoices();

if("speechSynthesis" in window){

  speechSynthesis.onvoiceschanged =
    loadVoices;

}

voiceSelect.addEventListener(
"change",
function(){

  var index =
    parseInt(
      voiceSelect.value,
      10
    );

  if(voices[index]){

    localStorage.setItem(
      "tongueboxVoice",
      voices[index].name
    );

  }

});


/* =====================================
   SPRECHEN
===================================== */

function speakText(message){

  message =
    String(message || "").trim();

  if(!message){
    return;
  }

  if(!("speechSynthesis" in window)){

    statusBox.textContent =
      "Sprachausgabe wird nicht unterstützt.";

    return;
  }

  speechSynthesis.cancel();

  var speech =
    new SpeechSynthesisUtterance(message);

  var index =
    parseInt(
      voiceSelect.value,
      10
    );

  if(voices[index]){

    speech.voice =
      voices[index];

    speech.lang =
      voices[index].lang;

  }
  else{

    speech.lang =
      "de-DE";

  }

  speech.rate = 0.95;

  speech.onstart = function(){

    statusBox.textContent =
      "🔊 Tonguebox spricht...";

  };

  speech.onend = function(){

    statusBox.textContent = "";

  };

  speechSynthesis.speak(speech);

}


/* JA / NEIN + SCHNELL */

var phraseButtons =
  document.querySelectorAll(".speakPhrase");

for(var p = 0; p < phraseButtons.length; p++){

  phraseButtons[p].addEventListener(
  "click",
  function(){

    speakText(
      this.getAttribute("data-text")
    );

  });

}


/* =====================================
   TEXT SPRECHEN
===================================== */

document
.getElementById("speakButton")
.addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  if(!value){

    statusBox.textContent =
      "Bitte zuerst Text eingeben.";

    return;
  }

  speakText(value);

});


document
.getElementById("stopButton")
.addEventListener(
"click",
function(){

  speechSynthesis.cancel();

  statusBox.textContent =
    "⏹ Gestoppt.";

});


document
.getElementById("clearButton")
.addEventListener(
"click",
function(){

  textInput.value = "";

  suggestionBox.innerHTML = "";

  statusBox.textContent = "";

});


/* =====================================
   TAGESZEITABHÄNGIGE
   INTELLIGENTE VORSCHLÄGE
===================================== */

document
.getElementById("suggestionButton")
.addEventListener(
"click",
function(){

  var text =
    textInput.value.trim();

  var lower =
    text.toLowerCase();

  var time =
    getDayTime();

  var greeting =
    getGreeting();

  var list = [];


  /* KEIN TEXT */

  if(!text){

    list =
      getTimePhrases().slice(0,3);

  }


  /* HALLO / GRÜSSEN */

  else if(
    lower.indexOf("hallo") !== -1 ||
    lower.indexOf("grüß") !== -1
  ){

    list = [
      greeting + ".",
      greeting + ", schön Sie zu sehen.",
      greeting + ", wie geht es Ihnen?"
    ];

  }


  /* KAFFEE */

  else if(
    lower.indexOf("kaffee") !== -1
  ){

    if(time === "morgen"){

      list = [
        "Guten Morgen, ich hätte gerne einen Kaffee.",
        "Guten Morgen, könnten Sie mir bitte einen Kaffee bringen?",
        "Ich möchte zum Frühstück gerne einen Kaffee."
      ];

    }

    else if(time === "nachmittag"){

      list = [
        "Guten Nachmittag, ich hätte gerne einen Kaffee.",
        "Ich hätte jetzt gerne einen Kaffee.",
        "Könnten Sie mir bitte einen Kaffee bringen?"
      ];

    }

    else{

      list = [
        greeting + ", ich hätte gerne einen Kaffee.",
        "Ich möchte bitte einen Kaffee.",
        "Könnten Sie mir bitte einen Kaffee bringen?"
      ];

    }

  }


  /* ESSEN */

  else if(
    lower.indexOf("essen") !== -1 ||
    lower.indexOf("hunger") !== -1
  ){

    if(time === "mittag"){

      list = [
        "Guten Appetit.",
        "Guten Appetit zusammen.",
        "Bitte helfen Sie mir beim Essen."
      ];

    }

    else if(time === "abend"){

      list = [
        "Guten Abend, ich möchte etwas essen.",
        "Ich hätte gerne etwas zu essen.",
        "Bitte helfen Sie mir beim Abendessen."
      ];

    }

    else if(time === "morgen"){

      list = [
        "Guten Morgen, ich möchte frühstücken.",
        "Ich hätte gerne etwas zum Frühstück.",
        "Bitte helfen Sie mir beim Frühstück."
      ];

    }

    else{

      list = [
        "Ich möchte etwas essen.",
        "Ich habe Hunger.",
        "Bitte helfen Sie mir beim Essen."
      ];

    }

  }


  /* TRINKEN */

  else if(
    lower.indexOf("trinken") !== -1 ||
    lower.indexOf("wasser") !== -1 ||
    lower.indexOf("durst") !== -1
  ){

    list = [
      greeting + ", ich möchte bitte etwas trinken.",
      "Ich hätte gerne Wasser.",
      "Bitte helfen Sie mir beim Trinken."
    ];

  }


  /* HILFE */

  else if(
    lower.indexOf("hilfe") !== -1 ||
    lower.indexOf("helfen") !== -1
  ){

    list = [
      greeting + ", ich brauche bitte Hilfe.",
      "Könnten Sie mir bitte helfen?",
      "Bitte helfen Sie mir kurz."
    ];

  }


  /* WC */

  else if(
    lower.indexOf("wc") !== -1 ||
    lower.indexOf("toilette") !== -1
  ){

    list = [
      "Ich muss auf die Toilette.",
      "Bitte helfen Sie mir auf die Toilette.",
      "Ich brauche jetzt Hilfe beim Toilettengang."
    ];

  }


  /* SCHMERZEN */

  else if(
    lower.indexOf("schmerz") !== -1 ||
    lower.indexOf("weh") !== -1
  ){

    list = [
      "Ich habe Schmerzen.",
      "Meine Schmerzen sind stärker geworden.",
      "Bitte helfen Sie mir wegen meiner Schmerzen."
    ];

  }


  /* ALLGEMEIN */

  else{

    list = [
      greeting + ", " + lowerFirst(cleanText(text)),
      friendlyText(text),
      questionText(text)
    ];

  }

  showSuggestions(list);

});


function showSuggestions(list){

  suggestionBox.innerHTML = "";

  for(var i = 0; i < list.length; i++){

    var button =
      document.createElement("button");

    button.type = "button";
    button.className = "suggestion";

    button.textContent =
      "✨ " + list[i];

    button.setAttribute(
      "data-text",
      list[i]
    );

    button.addEventListener(
    "click",
    function(){

      var sentence =
        this.getAttribute("data-text");

      textInput.value =
        sentence;

      speakText(sentence);

    });

    suggestionBox.appendChild(button);

  }

}


/* =====================================
   TEXTASSISTENT
===================================== */

document
.getElementById("completeButton")
.addEventListener(
"click",
function(){

  var text =
    textInput.value.trim();

  var lower =
    text.toLowerCase();

  var time =
    getDayTime();

  if(!text){
    return;
  }

  if(lower.indexOf("kaffee") !== -1){

    if(time === "morgen"){

      textInput.value =
        "Guten Morgen, ich hätte gerne einen Kaffee.";

    }
    else{

      textInput.value =
        "Ich hätte gerne einen Kaffee.";

    }

  }

  else if(
    lower.indexOf("essen") !== -1 ||
    lower.indexOf("hunger") !== -1
  ){

    if(time === "morgen"){

      textInput.value =
        "Guten Morgen, ich möchte frühstücken.";

    }

    else if(time === "mittag"){

      textInput.value =
        "Guten Appetit, ich möchte jetzt etwas essen.";

    }

    else if(time === "abend"){

      textInput.value =
        "Guten Abend, ich möchte etwas essen.";

    }

    else{

      textInput.value =
        "Ich möchte etwas essen.";

    }

  }

  else if(
    lower.indexOf("trinken") !== -1
  ){

    textInput.value =
      getGreeting() +
      ", ich möchte bitte etwas trinken.";

  }

  else if(
    lower.indexOf("hilfe") !== -1
  ){

    textInput.value =
      "Ich brauche bitte Hilfe.";

  }

  else{

    textInput.value =
      cleanText(text);

  }

});


/* FREUNDLICHER */

document
.getElementById("friendlyButton")
.addEventListener(
"click",
function(){

  textInput.value =
    friendlyText(
      textInput.value
    );

});


/* KÜRZER */

document
.getElementById("shortButton")
.addEventListener(
"click",
function(){

  var text =
    textInput.value;

  text =
    text.replace(
      /ich hätte gerne/gi,
      "Ich möchte"
    );

  text =
    text.replace(
      /ich würde gerne/gi,
      "Ich möchte"
    );

  text =
    text.replace(
      /könnten sie mir bitte/gi,
      "Bitte"
    );

  textInput.value =
    cleanText(text);

});

    );

/* =====================================
   HILFSFUNKTIONEN
===================================== */

function cleanText(text){

  text =
    String(text || "")
      .trim();

  if(!text){
    return "";
  }

  text =
    text.replace(/\s+/g," ");

  text =
    text.charAt(0).toUpperCase() +
    text.slice(1);

  if(!/[.!?]$/.test(text)){
    text += ".";
  }

  return text;

}


function lowerFirst(text){

  text =
    String(text || "");

  if(!text){
    return "";
  }

  return (
    text.charAt(0).toLowerCase() +
    text.slice(1)
  );

}


function friendlyText(text){

  text =
    String(text || "")
      .trim()
      .replace(/[.!?]+$/,"");

  if(!text){
    return "";
  }

  if(
    text.toLowerCase()
      .indexOf("bitte") === -1
  ){

    text =
      "Bitte " +
      lowerFirst(text);

  }

  return cleanText(text);

}


function questionText(text){

  text =
    String(text || "")
      .trim()
      .replace(/[.!?]+$/,"");

  if(!text){
    return "";
  }

  var lower =
    text.toLowerCase();

  if(lower.indexOf("kaffee") !== -1){

    return "Könnten Sie mir bitte einen Kaffee bringen?";

  }

  if(
    lower.indexOf("trinken") !== -1 ||
    lower.indexOf("wasser") !== -1
  ){

    return "Könnten Sie mir bitte etwas zu trinken geben?";

  }

  if(
    lower.indexOf("essen") !== -1
  ){

    return "Könnten Sie mir bitte etwas zu essen geben?";

  }

  if(
    lower.indexOf("hilfe") !== -1
  ){

    return "Könnten Sie mir bitte helfen?";

  }

  return (
    "Könnten Sie bitte " +
    lowerFirst(text) +
    "?"
  );

}


/* =====================================
   SPEICHERN
===================================== */

function getSaved(){

  try{

    var saved =
      JSON.parse(
        localStorage.getItem(
          "tongueboxSaved"
        ) || "[]"
      );

    if(Array.isArray(saved)){
      return saved;
    }

    return [];

  }
  catch(error){

    return [];

  }

}


function saveSaved(list){

  localStorage.setItem(
    "tongueboxSaved",
    JSON.stringify(list)
  );

}


document
.getElementById("saveButton")
.addEventListener(
"click",
function(){

  var text =
    textInput.value.trim();

  if(!text){

    statusBox.textContent =
      "Bitte zuerst Text eingeben.";

    return;

  }

  var saved =
    getSaved();

  if(saved.indexOf(text) === -1){

    saved.push(text);

    saveSaved(saved);

    statusBox.textContent =
      "⭐ Gespeichert.";

  }
  else{

    statusBox.textContent =
      "Dieser Satz ist bereits gespeichert.";

  }

  showSaved();

});


/* =====================================
   GESPEICHERTE SÄTZE
===================================== */

function showSaved(){

  savedBox.innerHTML = "";

  var saved =
    getSaved();

  if(saved.length === 0){

    savedBox.innerHTML =
      "<p>Noch keine Sätze gespeichert.</p>";

    return;

  }

  for(var i = 0; i < saved.length; i++){

    createSavedItem(
      saved[i],
      i
    );

  }

}


function createSavedItem(sentence,index){

  var speak =
    document.createElement("button");

  speak.type = "button";
  speak.className = "saved";

  speak.textContent =
    "🔊 " + sentence;

  speak.addEventListener(
  "click",
  function(){

    speakText(sentence);

  });


  var actions =
    document.createElement("div");

  actions.className =
    "savedActions";


  var edit =
    document.createElement("button");

  edit.type = "button";
  edit.className = "edit";

  edit.textContent =
    "✏️ Bearbeiten";

  edit.addEventListener(
  "click",
  function(){

    textInput.value =
      sentence;

    var textSection =
      textInput.closest("details");

    if(textSection){
      textSection.open = true;
    }

    setTimeout(function(){

      textInput.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },180);

  });


  var remove =
    document.createElement("button");

  remove.type = "button";
  remove.className = "delete";

  remove.textContent =
    "🗑 Löschen";

  remove.addEventListener(
  "click",
  function(){

    var saved =
      getSaved();

    saved.splice(index,1);

    saveSaved(saved);

    showSaved();

  });


  actions.appendChild(edit);
  actions.appendChild(remove);

  savedBox.appendChild(speak);
  savedBox.appendChild(actions);

}

showSaved();

});
</script>
