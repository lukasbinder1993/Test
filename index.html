<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tonguebox KI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#10232a;font-family:Arial,Helvetica,sans-serif}
main{max-width:720px;margin:auto;padding:14px 12px 70px}
h1{text-align:center;font-size:42px;margin:10px 0 2px}
.sub{text-align:center;font-size:21px;font-weight:700;margin:0 0 14px}
.note,.status{padding:14px;border-radius:18px;text-align:center;font-weight:800;margin:12px 0}
.note{background:#eefafb;border:2px solid #087f8c}
.status{background:#f3f6f7;min-height:54px}
.acc{border:2px solid #cbd7da;border-radius:22px;overflow:hidden;margin:18px 0;background:#fff}
.accHead{width:100%;min-height:110px;border:0;background:#eaf5f6;color:#10232a;padding:18px;font-size:26px;font-weight:900;text-align:left;display:flex;justify-content:space-between;align-items:center}
.panel{display:none;padding:15px}
.panel.open{display:block}
.grid,.answers,.quick{display:grid;grid-template-columns:1fr 1fr;gap:16px}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.action,.answer,.quick button{border:0;border-radius:20px;min-height:112px;padding:17px;font-size:24px;font-weight:900}
.start,.answer,.primary{background:#087f8c;color:#fff}
.stop,.quick button{background:#edf2f3;color:#10232a}
.answer{min-height:125px}
.question{margin-top:15px;padding:15px;border:2px solid #cbd7da;border-radius:18px;background:#f7f9fa;font-size:22px;min-height:82px}
.question small{display:block;font-size:15px;font-weight:800;margin-bottom:6px}
textarea{width:100%;min-height:130px;border:3px solid #cbd7da;border-radius:18px;padding:15px;font:inherit;font-size:22px}
.full{width:100%;border:0;border-radius:20px;min-height:105px;margin-top:14px;padding:16px;font-size:24px;font-weight:900}
button:focus-visible,textarea:focus-visible{outline:7px solid #ffd400;outline-offset:4px}
@media(max-width:600px){
 .answers{grid-template-columns:1fr}
 .answer{min-height:118px}
 .accHead{min-height:105px}
}
</style>
</head>
<body>
<main>
<h1>🧠 Tonguebox</h1>
<p class="sub">Sprich mit deinen Augen</p>
<div class="note">✨ KI-generierte Antwortvorschläge<br>Internetverbindung erforderlich</div>
<div id="status" class="status" role="status" aria-live="polite">Bereit.</div>

<section class="acc">
<button class="accHead" data-panel="listenPanel" aria-expanded="true">🎧 Frage erkennen <span>⌃</span></button>
<div id="listenPanel" class="panel open">
 <div class="grid">
  <button id="listen" class="action start">🎧 Zuhören</button>
  <button id="stop" class="action stop">⏹ Stopp</button>
 </div>
 <div class="question"><small>Erkannte Frage</small><span id="question">Noch keine Frage erkannt.</span></div>
</div>
</section>

<section class="acc">
<button class="accHead" data-panel="answerPanel" aria-expanded="false">⚡ KI-Antworten <span>⌄</span></button>
<div id="answerPanel" class="panel">
 <div id="answers" class="answers" role="group" aria-label="KI-Antwortvorschläge"></div>
</div>
</section>

<section class="acc">
<button class="accHead" data-panel="quickPanel" aria-expanded="false">💬 Sofort-Kommunikation <span>⌄</span></button>
<div id="quickPanel" class="panel">
 <div class="quick">
  <button data-say="Ja.">✅ Ja</button>
  <button data-say="Nein.">❌ Nein</button>
  <button data-say="Einen Moment bitte.">⏳ Moment</button>
  <button data-say="Bitte wiederholen.">🔁 Wiederholen</button>
  <button data-say="Bitte langsamer sprechen.">🐢 Langsamer</button>
  <button data-say="Ich brauche bitte Hilfe.">🙏 Hilfe</button>
 </div>
</div>
</section>

<section class="acc">
<button class="accHead" data-panel="manualPanel" aria-expanded="false">✍️ Selbst schreiben <span>⌄</span></button>
<div id="manualPanel" class="panel">
 <textarea id="text" placeholder="Frage oder eigenen Satz eingeben"></textarea>
 <button id="ask" class="full primary">✨ KI-Antworten erzeugen</button>
 <button id="sayOwn" class="full stop">🔊 Meinen Text sprechen</button>
</div>
</section>
</main>

<script>
const ENDPOINT="https://tonguebox-ai.restless-bush-f37f.workers.dev/";
const statusEl=document.getElementById("status");
const qEl=document.getElementById("question");
const answersEl=document.getElementById("answers");
const textEl=document.getElementById("text");
let recognition=null;
let listening=false;
let speaking=false;

function setStatus(t){statusEl.textContent=t}

function openPanel(id){
 document.querySelectorAll(".accHead").forEach(h=>{
  const p=document.getElementById(h.dataset.panel);
  const active=h.dataset.panel===id;
  h.setAttribute("aria-expanded",active);
  h.querySelector("span").textContent=active?"⌃":"⌄";
  p.classList.toggle("open",active);
 });
 const h=document.querySelector('[data-panel="'+id+'"]');
 if(h)setTimeout(()=>h.scrollIntoView({behavior:"smooth",block:"start"}),80);
}

document.querySelectorAll(".accHead").forEach(h=>{
 h.addEventListener("click",()=>{
  const p=document.getElementById(h.dataset.panel);
  const wasOpen=p.classList.contains("open");
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("open"));
  document.querySelectorAll(".accHead").forEach(x=>{
   x.setAttribute("aria-expanded","false");
   x.querySelector("span").textContent="⌄";
  });
  if(!wasOpen){
   p.classList.add("open");
   h.setAttribute("aria-expanded","true");
   h.querySelector("span").textContent="⌃";
  }
 });
});

function speak(t){
 if(!t)return;
 speaking=true;
 if(recognition){try{recognition.stop()}catch(e){}}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);
 u.lang="de-AT";
 u.onend=u.onerror=()=>{
  speaking=false;
  if(listening)startRecognition();
 };
 speechSynthesis.speak(u);
}

function renderReplies(list){
 const fallback=["Ja.","Nein.","Einen Moment bitte.","Bitte wiederholen."];
 let arr=Array.isArray(list)?list.filter(x=>typeof x==="string"&&x.trim()).slice(0,4):[];
 while(arr.length<4)arr.push(fallback[arr.length]);
 answersEl.innerHTML="";
 arr.forEach(t=>{
  const b=document.createElement("button");
  b.className="answer";
  b.type="button";
  b.textContent=t;
  b.addEventListener("click",()=>speak(t));
  answersEl.appendChild(b);
 });
}

renderReplies(["Ja.","Nein.","Einen Moment bitte.","Bitte wiederholen."]);

async function askAI(question){
 const q=(question||"").trim();
 if(!q){setStatus("Bitte zuerst eine Frage eingeben.");return}
 qEl.textContent=q;
 setStatus("✨ KI erstellt Antworten …");
 try{
  const r=await fetch(ENDPOINT,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({question:q})
  });
  const data=await r.json();
  if(!r.ok)throw new Error(data.detail||data.error||("HTTP "+r.status));
  renderReplies(data.replies);
  setStatus("✨ KI-Antworten sind bereit.");
  openPanel("answerPanel");
 }catch(err){
  console.error(err);
  setStatus("KI-Verbindung nicht erreichbar. Sofort-Antworten sind verfügbar.");
  openPanel("answerPanel");
 }
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
 recognition=new SR();
 recognition.lang="de-AT";
 recognition.continuous=false;
 recognition.interimResults=true;
 recognition.onresult=e=>{
  let finalText="",interim="";
  for(let i=e.resultIndex;i<e.results.length;i++){
   const t=e.results[i][0].transcript;
   if(e.results[i].isFinal)finalText+=t;else interim+=t;
  }
  qEl.textContent=finalText||interim||"Ich höre zu …";
  if(finalText.trim())askAI(finalText);
 };
 recognition.onend=()=>{
  if(listening&&!speaking)setTimeout(startRecognition,600);
 };
 recognition.onerror=e=>{
  if(e.error!=="aborted")setStatus("Spracherkennung: "+e.error);
 };
}else{
 document.getElementById("listen").disabled=true;
 setStatus("Automatisches Zuhören wird in diesem Browser nicht unterstützt. Bitte „Selbst schreiben“ verwenden.");
}

function startRecognition(){
 if(!recognition||speaking||!listening)return;
 try{recognition.start();setStatus("🎧 Ich höre zu …")}catch(e){}
}

document.getElementById("listen").addEventListener("click",()=>{listening=true;startRecognition()});
document.getElementById("stop").addEventListener("click",()=>{
 listening=false;
 if(recognition){try{recognition.stop()}catch(e){}}
 setStatus("Zuhören gestoppt.");
});
document.getElementById("ask").addEventListener("click",()=>askAI(textEl.value));
document.getElementById("sayOwn").addEventListener("click",()=>speak(textEl.value.trim()));
document.querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",()=>speak(b.dataset.say)));
</script>
</body>
</html>
