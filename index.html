<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tonguebox KI – Sprich mit deinen Augen</title>

  <style>

    /* =====================================================
       GRUNDDESIGN
    ====================================================== */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 10px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #eef3f8;
      color: #111;
    }

    .app {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 42px;

      margin:
        10px 0 4px;
    }

    .subtitle {
      text-align: center;

      font-size: 23px;

      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      font-size: 28px;
    }

    .box {
      background: white;

      padding: 18px;

      margin-bottom: 18px;

      border-radius: 22px;

      box-shadow:
        0 4px 14px
        rgba(0,0,0,0.12);
    }


    /* =====================================================
       BLICKERFASSUNG / FOKUS
    ====================================================== */

    button:focus,
    textarea:focus,
    select:focus {

      outline:
        7px solid orange;

      outline-offset: 4px;
    }


    /* =====================================================
       TEXTFELD
    ====================================================== */

    textarea {

      width: 100%;

      min-height: 270px;

      padding: 20px;

      font-size: 31px;

      line-height: 1.4;

      border:
        4px solid #333;

      border-radius: 20px;

      resize: vertical;
    }


    /* =====================================================
       WORTVORHERSAGE
    ====================================================== */

    .word-grid {

      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 12px;

      margin-top: 14px;
    }

    .word-button {

      min-height: 100px;

      padding: 10px;

      font-size: 22px;

      font-weight: bold;

      border:
        4px solid #2e7d32;

      border-radius: 20px;

      background: #e8f5e9;

      color: #111;
    }


    /* =====================================================
       HAUPTAKTIONEN
    ====================================================== */

    .main-grid {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 14px;

      margin-top: 15px;
    }

    .main-button {

      min-height: 115px;

      padding: 15px;

      border: none;

      border-radius: 20px;

      font-size: 25px;

      font-weight: bold;
    }

    .speak {
      background: #1565c0;
      color: white;
    }

    .ai {
      background: #673ab7;
      color: white;
    }

    .save {
      background: #2e7d32;
      color: white;
    }

    .clear {
      background: #555;
      color: white;
    }


    /* =====================================================
       KI-WERKZEUGE
    ====================================================== */

    .ai-tools {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 14px;
    }

    .ai-tool {

      min-height: 110px;

      padding: 14px;

      font-size: 23px;

      font-weight: bold;

      border-radius: 20px;

      border:
        4px solid #673ab7;

      background: #ede7f6;
    }


    /* =====================================================
       KI SATZVORSCHLÄGE
    ====================================================== */

    .ai-suggestions {

      display: grid;

      grid-template-columns: 1fr;

      gap: 14px;
    }

    .ai-suggestion {

      width: 100%;

      min-height: 125px;

      padding: 18px;

      text-align: left;

      font-size: 24px;

      font-weight: bold;

      border-radius: 20px;

      border:
        4px solid #673ab7;

      background: #f3e5f5;
    }


    /* =====================================================
       JA / NEIN
    ====================================================== */

    .yes-no {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 16px;
    }

    .yes,
    .no {

      min-height: 150px;

      border: none;

      border-radius: 22px;

      font-size: 39px;

      font-weight: bold;
    }

    .yes {
      background: #2e7d32;
      color: white;
    }

    .no {
      background: #c62828;
      color: white;
    }


    /* =====================================================
       SCHNELLAKTIONEN
    ====================================================== */

    .quick-grid {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 14px;
    }

    .quick {

      min-height: 115px;

      padding: 14px;

      border:
        4px solid #1976d2;

      border-radius: 20px;

      background: #e3f2fd;

      font-size: 23px;

      font-weight: bold;
    }

    .help {

      border-color: #ff9800;

      background: #fff3cd;
    }

    .emergency {

      background: #b71c1c;

      color: white;

      border-color: #7f0000;
    }


    /* =====================================================
       STIMME
    ====================================================== */

    label {

      display: block;

      margin-bottom: 10px;

      font-size: 22px;

      font-weight: bold;
    }

    select {

      width: 100%;

      min-height: 80px;

      padding: 10px;

      font-size: 22px;

      border-radius: 16px;
    }


    /* =====================================================
       STATUS
    ====================================================== */

    #status {

      margin-top: 14px;

      padding: 12px;

      font-size: 20px;

      font-weight: bold;
    }


    /* =====================================================
       GESPEICHERTE SÄTZE
    ====================================================== */

    .saved-item {

      margin-bottom: 15px;

      padding: 10px;

      border-radius: 18px;

      background: #f5f5f5;
    }

    .saved-speak {

      width: 100%;

      min-height: 100px;

      padding: 15px;

      text-align: left;

      border: none;

      border-radius: 18px;

      background: #512da8;

      color: white;

      font-size: 22px;

      font-weight: bold;
    }

    .saved-delete {

      width: 100%;

      min-height: 80px;

      margin-top: 8px;

      border: none;

      border-radius: 18px;

      background: #c62828;

      color: white;

      font-size: 21px;

      font-weight: bold;
    }


    /* =====================================================
       IPHONE
    ====================================================== */

    @media(max-width:600px) {

      body {
        padding: 6px;
      }

      h1 {
        font-size: 34px;
      }

      textarea {

        min-height: 290px;

        font-size: 29px;
      }

      .word-button {

        min-height: 105px;

        font-size: 19px;
      }

      .main-button,
      .ai-tool,
      .quick {

        min-height: 120px;

        font-size: 21px;
      }

      .yes,
      .no {

        min-height: 155px;

        font-size: 37px;
      }

    }

  </style>
</head>


<body>

<main class="app">


  <!-- ===================================================
       KOPF
  ==================================================== -->

  <h1>👅 Tonguebox KI</h1>

  <div class="subtitle">
    Sprich mit deinen Augen
  </div>


  <!-- ===================================================
       TEXT
  ==================================================== -->

  <section class="box">

    <h2>💬 Was möchtest du sagen?</h2>

    <textarea
      id="textInput"
      aria-label="Text eingeben"
      placeholder="Schreibe nur ein Wort, mehrere Wörter oder einen ganzen Satz..."
    ></textarea>


    <!-- KI-Wortvorhersage -->

    <h2 style="margin-top:20px;">
      🧠 Wortvorhersage
    </h2>

    <div
      id="wordSuggestions"
      class="word-grid"
    ></div>


    <!-- Hauptbuttons -->

    <div class="main-grid">

      <button
        class="main-button speak"
        onclick="speakInput()"
      >
        🔊 VORLESEN
      </button>


      <button
        class="main-button ai"
        onclick="getSentenceSuggestions()"
      >
        ✨ KI-SÄTZE
      </button>


      <button
        class="main-button save"
        onclick="saveText()"
      >
        ⭐ SPEICHERN
      </button>


      <button
        class="main-button clear"
        onclick="clearText()"
      >
        🗑 LEEREN
      </button>

    </div>


    <div
      id="status"
      role="status"
      aria-live="polite"
    ></div>

  </section>


  <!-- ===================================================
       KI-WERKZEUGE
  ==================================================== -->

  <section class="box">

    <h2>🤖 KI-Kommunikationshilfe</h2>

    <div class="ai-tools">


      <button
        class="ai-tool"
        onclick="aiAction('complete')"
      >
        ✍️ Satz vervollständigen
      </button>


      <button
        class="ai-tool"
        onclick="aiAction('shorten')"
      >
        ⚡ Kürzer machen
      </button>


      <button
        class="ai-tool"
        onclick="aiAction('friendly')"
      >
        🙂 Freundlicher
      </button>


      <button
        class="ai-tool"
        onclick="aiAction('simple')"
      >
        💬 Einfacher formulieren
      </button>


      <button
        class="ai-tool"
        onclick="aiAction('formal')"
      >
        👔 Höflich formulieren
      </button>


      <button
        class="ai-tool"
        onclick="aiAction('correct')"
      >
        ✅ Text verbessern
      </button>

    </div>

  </section>


  <!-- ===================================================
       KI-VORSCHLÄGE
  ==================================================== -->

  <section class="box">

    <h2>✨ KI-Vorschläge</h2>

    <div
      id="aiSuggestions"
      class="ai-suggestions"
    >

      Schreibe etwas in das Textfeld.

    </div>

  </section>


  <!-- ===================================================
       JA / NEIN
  ==================================================== -->

  <section class="box">

    <h2>⚡ Sofort antworten</h2>

    <div class="yes-no">

      <button
        class="yes"
        onclick="speakText('Ja')"
      >
        ✅ JA
      </button>

      <button
        class="no"
        onclick="speakText('Nein')"
      >
        ❌ NEIN
      </button>

    </div>

  </section>


  <!-- ===================================================
       SCHNELLAKTIONEN
  ==================================================== -->

  <section class="box">

    <h2>⚡ Schnell sagen</h2>

    <div class="quick-grid">


      <button
        class="quick"
        onclick="speakText('Hallo')"
      >
        👋 Hallo
      </button>


      <button
        class="quick"
        onclick="speakText('Danke')"
      >
        🙏 Danke
      </button>


      <button
        class="quick"
        onclick="speakText('Bitte warten Sie kurz. Ich brauche etwas Zeit zum Antworten.')"
      >
        ⏳ Bitte warten
      </button>


      <button
        class="quick"
        onclick="speakText('Bitte sagen Sie das noch einmal.')"
      >
        🔁 Noch einmal
      </button>


      <button
        class="quick"
        onclick="speakText('Bitte sprechen Sie langsamer.')"
      >
        🐢 Langsamer
      </button>


      <button
        class="quick"
        onclick="speakText('Ich habe Sie nicht verstanden.')"
      >
        ❓ Nicht verstanden
      </button>


      <button
        class="quick"
        onclick="speakText('Ich möchte etwas trinken.')"
      >
        🥤 Trinken
      </button>


      <button
        class="quick"
        onclick="speakText('Ich möchte etwas essen.')"
      >
        🍽 Essen
      </button>


      <button
        class="quick"
        onclick="speakText('Ich muss auf die Toilette.')"
      >
        🚻 WC
      </button>


      <button
        class="quick help"
        onclick="speakText('Ich brauche Hilfe.')"
      >
        🆘 Hilfe
      </button>


      <button
        class="quick"
        onclick="speakText('Bitte geben Sie mir etwas Zeit zum Antworten.')"
      >
        ⏱ Zeit
      </button>


      <button
        class="quick"
        onclick="speakText('Ich kann nicht sprechen. Ich kommuniziere mit einer Augensteuerung.')"
      >
        👁 Augensteuerung
      </button>


      <button
        class="quick emergency"
        onclick="speakText('Das ist ein Notfall. Bitte holen Sie sofort Hilfe.')"
      >
        🚨 NOTFALL
      </button>

    </div>

  </section>


  <!-- ===================================================
       STIMME
  ==================================================== -->

  <section class="box">

    <h2>🗣 Stimme</h2>

    <label for="voiceSelect">
      Stimme auswählen
    </label>

    <select
      id="voiceSelect"
    ></select>

  </section>


  <!-- ===================================================
       GESPEICHERTE SÄTZE
  ==================================================== -->

  <section class="box">

    <h2>⭐ Meine Sätze</h2>

    <div id="savedTexts"></div>

  </section>


</main>


<script>

  /* =====================================================
     HIER DEINE CLOUDFLARE-ADRESSE EINTRAGEN
  ====================================================== */

  const WORKER_URL =
    "https://DEIN-WORKER.workers.dev";


  /* =====================================================
     HTML-ELEMENTE
  ====================================================== */

  const textInput =
    document.getElementById(
      "textInput"
    );

  const statusBox =
    document.getElementById(
      "status"
    );

  const wordBox =
    document.getElementById(
      "wordSuggestions"
    );

  const aiBox =
    document.getElementById(
      "aiSuggestions"
    );

  const voiceSelect =
    document.getElementById(
      "voiceSelect"
    );

  const savedBox =
    document.getElementById(
      "savedTexts"
    );


  let voices = [];

  let wordTimer = null;

  let lastPredictionText = "";


  /* =====================================================
     STATUS
  ====================================================== */

  function status(message) {

    statusBox.textContent =
      message;

  }


  /* =====================================================
     SPRACHAUSGABE
  ====================================================== */

  function loadVoices() {

    voices =
      speechSynthesis.getVoices();

    voiceSelect.innerHTML = "";


    voices.forEach(
      (voice,index) => {

        const option =
          document.createElement(
            "option"
          );

        option.value = index;

        option.textContent =
          voice.name +
          " – " +
          voice.lang;

        voiceSelect.appendChild(
          option
        );

      }
    );


    const saved =
      localStorage.getItem(
        "tongueboxVoice"
      );


    if (
      saved !== null &&
      voices[saved]
    ) {

      voiceSelect.value =
        saved;

    }

  }


  speechSynthesis.onvoiceschanged =
    loadVoices;

  loadVoices();


  voiceSelect.addEventListener(
    "change",
    () => {

      localStorage.setItem(
        "tongueboxVoice",
        voiceSelect.value
      );

    }
  );


  function speakText(text) {

    if (!text) return;


    speechSynthesis.cancel();


    const speech =
      new SpeechSynthesisUtterance(
        text
      );


    const voice =
      voices[
        voiceSelect.value
      ];


    if (voice) {

      speech.voice =
        voice;

      speech.lang =
        voice.lang;

    }


    speech.rate = 0.95;

    speech.volume = 1;


    speechSynthesis.speak(
      speech
    );

  }


  function speakInput() {

    const text =
      textInput.value.trim();


    if (!text) {

      status(
        "Bitte zuerst etwas schreiben."
      );

      return;

    }


    speakText(text);

  }


  /* =====================================================
     KI ANFRAGE
  ====================================================== */

  async function callAI(
    action,
    text
  ) {

    const response =
      await fetch(
        WORKER_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              action: action,

              text: text

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(

        data.error ||

        "KI-Anfrage fehlgeschlagen."

      );

    }


    return data;

  }


  /* =====================================================
     KI-SATZVORSCHLÄGE
  ====================================================== */

  async function getSentenceSuggestions() {

    const text =
      textInput.value.trim();


    if (!text) {

      status(
        "Schreibe zuerst einige Wörter."
      );

      return;

    }


    status(
      "✨ KI erstellt Sätze..."
    );


    try {

      const data =
        await callAI(
          "sentences",
          text
        );


      showSuggestions(
        data.suggestions
      );


      status(
        "✨ Wähle einen Satz."
      );

    }

    catch(error) {

      status(
        "❌ " +
        error.message
      );

    }

  }


  /* =====================================================
     KI-WERKZEUGE
  ====================================================== */

  async function aiAction(
    action
  ) {

    const text =
      textInput.value.trim();


    if (!text) {

      status(
        "Bitte zuerst Text eingeben."
      );

      return;

    }


    status(
      "🤖 KI bearbeitet den Text..."
    );


    try {

      const data =
        await callAI(
          action,
          text
        );


      if (data.text) {

        textInput.value =
          data.text;

        speakText(
          data.text
        );


        updateWordSuggestions();

      }


      status(
        "✅ Fertig."
      );

    }

    catch(error) {

      status(
        "❌ " +
        error.message
      );

    }

  }


  /* =====================================================
     KI-VORSCHLÄGE ANZEIGEN
  ====================================================== */

  function showSuggestions(
    suggestions
  ) {

    aiBox.innerHTML = "";


    if (
      !Array.isArray(
        suggestions
      )
    ) {

      return;

    }


    suggestions
      .slice(0,3)
      .forEach(
        suggestion => {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "ai-suggestion";


          button.textContent =
            "✨ " +
            suggestion;


          button.onclick =
            () => {

              textInput.value =
                suggestion;


              updateWordSuggestions();


              speakText(
                suggestion
              );

            };


          aiBox.appendChild(
            button
          );

        }
      );

  }


  /* =====================================================
     KI-WORTVORHERSAGE
  ====================================================== */

  textInput.addEventListener(
    "input",
    () => {

      clearTimeout(
        wordTimer
      );


      wordTimer =
        setTimeout(
          updateWordSuggestions,
          450
        );

    }
  );


  async function updateWordSuggestions() {

    const text =
      textInput.value.trim();


    if (!text) {

      showWords([
        "Ich",
        "Bitte",
        "Danke"
      ]);

      return;

    }


    if (
      text ===
      lastPredictionText
    ) {

      return;

    }


    lastPredictionText =
      text;


    try {

      const data =
        await callAI(
          "words",
          text
        );


      if (
        Array.isArray(
          data.words
        )
      ) {

        showWords(
          data.words
        );

      }

    }

    catch(error) {

      /*
        Bei einem KI-Fehler
        bleiben einfache Wörter verfügbar.
      */

      showWords([
        "bitte",
        "möchte",
        "brauche"
      ]);

    }

  }


  function showWords(
    words
  ) {

    wordBox.innerHTML = "";


    words
      .slice(0,3)
      .forEach(
        word => {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "word-button";


          button.textContent =
            word;


          button.onclick =
            () => {

              addWord(
                word
              );

            };


          wordBox.appendChild(
            button
          );

        }
      );

  }


  function addWord(
    word
  ) {

    let text =
      textInput.value;


    if (
      text &&
      !text.endsWith(" ")
    ) {

      text += " ";

    }


    textInput.value =
      text +
      word +
      " ";


    lastPredictionText =
      "";


    updateWordSuggestions();

  }


  /* =====================================================
     LEEREN
  ====================================================== */

  function clearText() {

    textInput.value = "";

    aiBox.innerHTML =
      "Schreibe etwas in das Textfeld.";


    lastPredictionText = "";


    showWords([
      "Ich",
      "Bitte",
      "Danke"
    ]);


    status("");

  }


  /* =====================================================
     SPEICHERN
  ====================================================== */

  function getSavedTexts() {

    try {

      return JSON.parse(

        localStorage.getItem(
          "tongueboxTexte"
        ) || "[]"

      );

    }

    catch {

      return [];

    }

  }


  function saveText() {

    const text =
      textInput.value.trim();


    if (!text) {

      status(
        "Bitte zuerst einen Satz eingeben."
      );

      return;

    }


    const texts =
      getSavedTexts();


    if (
      !texts.includes(
        text
      )
    ) {

      texts.push(
        text
      );


      localStorage.setItem(

        "tongueboxTexte",

        JSON.stringify(
          texts
        )

      );

    }


    showSavedTexts();


    status(
      "⭐ Satz gespeichert."
    );

  }


  function showSavedTexts() {

    const texts =
      getSavedTexts();


    savedBox.innerHTML = "";


    if (
      texts.length === 0
    ) {

      savedBox.textContent =
        "Noch keine Sätze gespeichert.";

      return;

    }


    texts.forEach(
      (text,index) => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "saved-item";


        const speak =
          document.createElement(
            "button"
          );


        speak.className =
          "saved-speak";


        speak.textContent =
          "🔊 " +
          text;


        speak.onclick =
          () => {

            speakText(
              text
            );

          };


        const remove =
          document.createElement(
            "button"
          );


        remove.className =
          "saved-delete";


        remove.textContent =
          "🗑 Löschen";


        remove.onclick =
          () => {

            deleteSavedText(
              index
            );

          };


        item.appendChild(
          speak
        );

        item.appendChild(
          remove
        );


        savedBox.appendChild(
          item
        );

      }
    );

  }


  function deleteSavedText(
    index
  ) {

    const texts =
      getSavedTexts();


    texts.splice(
      index,
      1
    );


    localStorage.setItem(

      "tongueboxTexte",

      JSON.stringify(
        texts
      )

    );


    showSavedTexts();

  }


  /* =====================================================
     START
  ====================================================== */

  showWords([
    "Ich",
    "Bitte",
    "Danke"
  ]);

  showSavedTexts();

</script>

</body>
</html>
