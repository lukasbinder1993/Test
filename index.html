<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Tonguebox KI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:6px;
  background:#eef2f6;
  font-family:Arial,Helvetica,sans-serif;
  color:#111;
}

.app{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:30px;
  margin:8px 0 12px;
}

h2{
  font-size:22px;
  margin:4px 0 10px;
}

.card{
  background:white;
  padding:10px;
  margin-bottom:10px;
  border-radius:18px;
}

textarea{
  width:100%;
  min-height:220px;
  padding:15px;
  font-size:27px;
  line-height:1.35;
  border:4px solid #222;
  border-radius:18px;
  resize:none;
}

button,
select{
  width:100%;
  min-height:90px;
  font-size:21px;
  font-weight:bold;
  border-radius:18px;
}

button{
  border:none;
  cursor:pointer;
}

button:focus,
textarea:focus,
select:focus{
  outline:6px solid orange;
  outline-offset:3px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.speak{
  background:#1565c0;
  color:white;
}

.ai{
  background:#6a1b9a;
  color:white;
}

.save{
  background:#2e7d32;
  color:white;
}

.clear{
  background:#555;
  color:white;
}

.yes{
  background:#2e7d32;
  color:white;
  font-size:34px;
  min-height:125px;
}

.no{
  background:#c62828;
  color:white;
  font-size:34px;
  min-height:125px;
}

.smart{
  background:#fff3cd;
  border:3px solid #f9a825;
}

.quick{
  background:#e3f2fd;
  border:3px solid #1976d2;
}

.emergency{
  background:#b71c1c;
  color:white;
}

.volumeButton{
  background:#e8f5e9;
  border:3px solid #2e7d32;
}

#volumeDisplay{
  text-align:center;
  font-size:26px;
  font-weight:bold;
  margin:12px 0;
}

.suggestion{
  background:#ede7f6;
  border:3px solid #673ab7;
  text-align:left;
  padding:14px;
  margin-bottom:8px;
  min-height:85px;
}

select{
  padding:10px;
  background:white;
  border:3px solid #444;
}

.savedButton{
  background:#512da8;
  color:white;
  text-align:left;
  padding:14px;
  margin-bottom:7px;
}

.deleteButton{
  background:#c62828;
  color:white;
  min-height:65px;
  margin-bottom:12px;
}

#status{
  font-size:18px;
  font-weight:bold;
  min-height:25px;
  margin-top:8px;
}

@media(max-width:500px){

  textarea{
    min-height:240px;
    font-size:26px;
  }

  button{
    min-height:95px;
    font-size:20px;
  }

}
</style>
</head>

<body>

<main class="app">

<h1>👅 Tonguebox KI</h1>


<div class="card">

<textarea
id="text"
placeholder="Was möchtest du sagen?"
aria-label="Text eingeben">
</textarea>

<div class="grid2" style="margin-top:9px;">

<button class="speak" id="speak">
🔊 Sprechen
</button>

<button class="ai" id="aiSuggestions">
✨ Vorschläge
</button>

<button class="save" id="save">
⭐ Speichern
</button>

<button class="clear" id="clear">
🗑 Leeren
</button>

</div>

<div id="status"></div>

</div>


<!-- LAUTSTÄRKE -->

<div class="card">

<h2>🔊 Lautstärke</h2>

<div id="volumeDisplay">
Lautstärke: 100 %
</div>

<div class="grid2">

<button
class="volumeButton"
id="volumeDown">
🔉 LEISER
</button>

<button
class="volumeButton"
id="volumeUp">
🔊 LAUTER
</button>

</div>

</div>


<!-- VORSCHLÄGE -->

<div class="card">

<h2>✨ Intelligente Vorschläge</h2>

<div id="suggestions"></div>

</div>


<!-- TEXT-ASSISTENT -->

<div class="card">

<h2>🧠 Text-Assistent</h2>

<div class="grid2">

<button class="smart" onclick="completeText()">
✍️ Vervollständigen
</button>

<button class="smart" onclick="makeShort()">
⚡ Kürzer
</button>

<button class="smart" onclick="makeFriendly()">
🙂 Freundlicher
</button>

<button class="smart" onclick="makeFormal()">
👔 Höflicher
</button>

</div>

</div>


<!-- JA / NEIN -->

<div class="card">

<div class="grid2">

<button class="yes" data-speak="Ja">
✅ JA
</button>

<button class="no" data-speak="Nein">
❌ NEIN
</button>

</div>

</div>


<!-- SCHNELLKOMMUNIKATION -->

<div class="card">

<h2>⚡ Schnellkommunikation</h2>

<div class="grid2">

<button class="quick" data-speak="Hallo">
👋 Hallo
</button>

<button class="quick" data-speak="Danke">
🙏 Danke
</button>

<button
class="quick"
data-speak="Bitte warten Sie kurz. Ich brauche etwas Zeit zum Antworten.">
⏳ Warten
</button>

<button
class="quick"
data-speak="Bitte sagen Sie das noch einmal.">
🔁 Nochmal
</button>

<button
class="quick"
data-speak="Ich brauche Hilfe.">
🆘 Hilfe
</button>

<button
class="quick"
data-speak="Ich möchte etwas trinken.">
🥤 Trinken
</button>

<button
class="quick"
data-speak="Ich möchte etwas essen.">
🍽 Essen
</button>

<button
class="quick"
data-speak="Ich muss auf die Toilette.">
🚻 WC
</button>

<button
class="quick"
data-speak="Ich habe Sie nicht verstanden.">
❓ Nicht verstanden
</button>

<button
class="quick"
data-speak="Bitte sprechen Sie langsamer.">
🐢 Langsamer
</button>

<button
class="quick"
data-speak="Ich kann nicht sprechen. Ich kommuniziere mit einer Augensteuerung.">
👁 Kommunikation
</button>

<button
class="emergency"
data-speak="Das ist ein Notfall. Bitte holen Sie sofort Hilfe.">
🚨 NOTFALL
</button>

</div>

</div>


<!-- STIMME -->

<div class="card">

<h2>🗣 Stimme</h2>

<select id="voice">
<option>Stimmen werden geladen...</option>
</select>

</div>


<!-- GESPEICHERT -->

<div class="card">

<h2>⭐ Gespeicherte Sätze</h2>

<div id="saved"></div>

</div>

</main>


<script>

var text = document.getElementById("text");
var voiceSelect = document.getElementById("voice");
var suggestionBox = document.getElementById("suggestions");
var savedBox = document.getElementById("saved");
var statusBox = document.getElementById("status");
var volumeDisplay = document.getElementById("volumeDisplay");

var voices = [];


/* LAUTSTÄRKE LADEN */

var volume = parseFloat(
  localStorage.getItem("tongueboxVolume")
);

if(isNaN(volume)){
  volume = 1;
}

updateVolumeDisplay();


/* LAUTER */

document.getElementById("volumeUp")
.onclick = function(){

  volume += 0.1;

  if(volume > 1){
    volume = 1;
  }

  saveVolume();

};


/* LEISER */

document.getElementById("volumeDown")
.onclick = function(){

  volume -= 0.1;

  if(volume < 0){
    volume = 0;
  }

  saveVolume();

};


/* LAUTSTÄRKE SPEICHERN */

function saveVolume(){

  volume =
    Math.round(volume * 10) / 10;

  localStorage.setItem(
    "tongueboxVolume",
    volume
  );

  updateVolumeDisplay();

}


/* ANZEIGE */

function updateVolumeDisplay(){

  var percent =
    Math.round(volume * 100);

  volumeDisplay.textContent =
    "Lautstärke: " +
    percent +
    " %";

}


/* STIMMEN */

function loadVoices(){

  voices =
    speechSynthesis.getVoices();

  voiceSelect.innerHTML = "";

  var savedVoice =
    localStorage.getItem(
      "tongueboxVoice"
    );

  voices.forEach(function(voice,index){

    var option =
      document.createElement("option");

    option.value = index;

    option.textContent =
      voice.name +
      " – " +
      voice.lang;

    if(savedVoice === voice.name){
      option.selected = true;
    }

    voiceSelect.appendChild(option);

  });

}

loadVoices();

speechSynthesis.onvoiceschanged =
  loadVoices;


voiceSelect.onchange = function(){

  var selected =
    voices[Number(voiceSelect.value)];

  if(selected){

    localStorage.setItem(
      "tongueboxVoice",
      selected.name
    );

  }

};


/* SPRECHEN */

function speakText(message){

  if(!message){
    return;
  }

  speechSynthesis.cancel();

  var speech =
    new SpeechSynthesisUtterance(
      message
    );

  var selected =
    voices[Number(voiceSelect.value)];

  if(selected){

    speech.voice = selected;
    speech.lang = selected.lang;

  }

  speech.rate = 0.95;

  /* HIER WIRD DIE LAUTSTÄRKE VERWENDET */
  speech.volume = volume;

  speech.onstart = function(){

    statusBox.textContent =
      "🔊 Tonguebox spricht...";

  };

  speech.onend = function(){

    statusBox.textContent = "";

  };

  speechSynthesis.speak(speech);

}


/* SPRECHEN */

document.getElementById("speak")
.onclick = function(){

  var value =
    text.value.trim();

  if(!value){

    statusBox.textContent =
      "Bitte zuerst etwas schreiben.";

    return;
  }

  speakText(value);

};


/* INTELLIGENTE VORSCHLÄGE */

function getAISuggestions(){

  var input =
    text.value.trim();

  var lower =
    input.toLowerCase();

  var list = [];

  if(!input){

    list = [
      "Ich möchte etwas sagen.",
      "Bitte warten Sie kurz.",
      "Ich brauche Hilfe."
    ];

  }

  else if(lower.includes("kaffee")){

    list = [
      "Ich möchte bitte einen Kaffee.",
      "Ich hätte gerne einen Kaffee mit Milch.",
      "Könnten Sie mir bitte einen Kaffee bringen?"
    ];

  }

  else if(
    lower.includes("wasser") ||
    lower.includes("trinken")
  ){

    list = [
      "Ich möchte bitte etwas trinken.",
      "Ich hätte gerne Wasser.",
      "Könnten Sie mir bitte etwas zu trinken geben?"
    ];

  }

  else if(
    lower.includes("essen") ||
    lower.includes("hunger")
  ){

    list = [
      "Ich möchte bitte etwas essen.",
      "Ich habe Hunger.",
      "Bitte helfen Sie mir beim Essen."
    ];

  }

  else if(lower.includes("hilfe")){

    list = [
      "Ich brauche bitte Hilfe.",
      "Könnten Sie mir bitte helfen?",
      "Bitte holen Sie jemanden."
    ];

  }

  else if(lower.includes("schmerz")){

    list = [
      "Ich habe Schmerzen.",
      "Bitte helfen Sie mir, ich habe Schmerzen.",
      "Ich möchte sagen, wo ich Schmerzen habe."
    ];

  }

  else if(
    lower.includes("toilette") ||
    lower.includes("wc")
  ){

    list = [
      "Ich muss auf die Toilette.",
      "Bitte helfen Sie mir auf die Toilette.",
      "Ich brauche Hilfe beim Toilettengang."
    ];

  }

  else{

    var sentence =
      cleanSentence(input);

    list = [
      sentence,
      "Bitte " + lowerFirst(sentence),
      "Ich möchte sagen: " + sentence
    ];

  }

  showSuggestions(list);

}


/* VORSCHLÄGE ANZEIGEN */

function showSuggestions(list){

  suggestionBox.innerHTML = "";

  list.forEach(function(sentence){

    var button =
      document.createElement("button");

    button.className =
      "suggestion";

    button.textContent =
      "✨ " + sentence;

    button.onclick = function(){

      text.value =
        sentence;

      speakText(sentence);

    };

    suggestionBox.appendChild(
      button
    );

  });

}


document.getElementById("aiSuggestions")
.onclick =
  getAISuggestions;


/* VERVOLLSTÄNDIGEN */

function completeText(){

  var value =
    text.value.trim();

  var lower =
    value.toLowerCase();

  if(!value){
    return;
  }

  if(lower.includes("kaffee")){

    text.value =
      "Ich möchte bitte einen Kaffee.";

  }

  else if(lower.includes("trinken")){

    text.value =
      "Ich möchte bitte etwas trinken.";

  }

  else if(lower.includes("essen")){

    text.value =
      "Ich möchte bitte etwas essen.";

  }

  else if(lower.includes("hilfe")){

    text.value =
      "Ich brauche bitte Hilfe.";

  }

  else{

    text.value =
      cleanSentence(value);

  }

  getAISuggestions();

}


/* KÜRZER */

function makeShort(){

  var value =
    text.value.trim();

  if(!value){
    return;
  }

  value = value
    .replace(
      /könnten sie mir bitte/gi,
      "Bitte"
    )
    .replace(
      /ich würde gerne/gi,
      "Ich möchte"
    )
    .replace(
      /ich hätte gerne/gi,
      "Ich möchte"
    );

  text.value =
    cleanSentence(value);

  getAISuggestions();

}


/* FREUNDLICHER */

function makeFriendly(){

  var value =
    text.value.trim();

  if(!value){
    return;
  }

  if(
    !value
      .toLowerCase()
      .includes("bitte")
  ){

    value =
      "Bitte " +
      lowerFirst(value);

  }

  text.value =
    cleanSentence(value);

  getAISuggestions();

}


/* HÖFLICHER */

function makeFormal(){

  var value =
    text.value.trim();

  if(!value){
    return;
  }

  if(
    value
      .toLowerCase()
      .startsWith("ich möchte")
  ){

    value =
      value.replace(
        /^ich möchte/i,
        "Ich hätte bitte gerne"
      );

  }

  text.value =
    cleanSentence(value);

  getAISuggestions();

}


/* SATZ BEREINIGEN */

function cleanSentence(value){

  value = value.trim();

  if(!value){
    return "";
  }

  value =
    value.charAt(0).toUpperCase()
    +
    value.slice(1);

  if(!/[.!?]$/.test(value)){
    value += ".";
  }

  return value;

}


function lowerFirst(value){

  if(!value){
    return "";
  }

  return (
    value.charAt(0).toLowerCase()
    +
    value.slice(1)
  );

}


/* SCHNELLBUTTONS */

document
.querySelectorAll("[data-speak]")
.forEach(function(button){

  button.onclick = function(){

    speakText(
      this.getAttribute(
        "data-speak"
      )
    );

  };

});


/* LEEREN */

document.getElementById("clear")
.onclick = function(){

  text.value = "";

  suggestionBox.innerHTML = "";

  statusBox.textContent = "";

  text.focus();

};


/* SPEICHERN */

function getSaved(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "tongueboxSaved"
      ) || "[]"
    );

  }

  catch(error){

    return [];

  }

}


document.getElementById("save")
.onclick = function(){

  var value =
    text.value.trim();

  if(!value){
    return;
  }

  var saved =
    getSaved();

  if(!saved.includes(value)){

    saved.push(value);

    localStorage.setItem(
      "tongueboxSaved",
      JSON.stringify(saved)
    );

  }

  showSaved();

  statusBox.textContent =
    "⭐ Gespeichert.";

};


/* GESPEICHERTE SÄTZE */

function showSaved(){

  savedBox.innerHTML = "";

  var saved =
    getSaved();

  if(saved.length === 0){

    savedBox.innerHTML =
      "<p>Noch keine Sätze gespeichert.</p>";

    return;
  }

  saved.forEach(function(sentence,index){

    var speakButton =
      document.createElement("button");

    speakButton.className =
      "savedButton";

    speakButton.textContent =
      "🔊 " + sentence;

    speakButton.onclick = function(){

      speakText(sentence);

    };


    var deleteButton =
      document.createElement("button");

    deleteButton.className =
      "deleteButton";

    deleteButton.textContent =
      "🗑 Löschen";

    deleteButton.onclick = function(){

      var current =
        getSaved();

      current.splice(index,1);

      localStorage.setItem(
        "tongueboxSaved",
        JSON.stringify(current)
      );

      showSaved();

    };


    savedBox.appendChild(
      speakButton
    );

    savedBox.appendChild(
      deleteButton
    );

  });

}


showSaved();
getAISuggestions();

</script>

</body>
</html>
