<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Tonguebox – Sprich mit deinen Augen</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 10px;
  font-family: Arial, Helvetica, sans-serif;
  background: #eef2f7;
  color: #111;
}

.app {
  max-width: 900px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  font-size: 42px;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  font-size: 23px;
  margin-bottom: 20px;
}

.box {
  background: white;
  border-radius: 22px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

h2 {
  font-size: 27px;
  margin-top: 0;
}


/* TEXTFELD */

#textInput {
  width: 100%;
  min-height: 300px;
  padding: 18px;
  font-size: 31px;
  line-height: 1.4;
  border: 4px solid #333;
  border-radius: 20px;
  resize: vertical;
}


/* FOKUS */

button:focus,
textarea:focus,
select:focus {
  outline: 7px solid orange;
  outline-offset: 4px;
}


/* HAUPTBUTTONS */

.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 18px;
}

.main-button {
  min-height: 115px;
  padding: 12px;
  border: none;
  border-radius: 20px;
  font-size: 24px;
  font-weight: bold;
}

.speak {
  background: #1565c0;
  color: white;
}

.save {
  background: #2e7d32;
  color: white;
}

.clear {
  background: #555;
  color: white;
}

.stop {
  background: #c62828;
  color: white;
}


/* SATZVORSCHLÄGE */

.sentence-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.sentence-button {
  width: 100%;
  min-height: 110px;
  padding: 16px;
  border-radius: 20px;
  border: 4px solid #673ab7;
  background: #ede7f6;
  font-size: 23px;
  font-weight: bold;
  text-align: left;
}


/* JA / NEIN */

.yes-no {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.yes,
.no {
  min-height: 150px;
  border: none;
  border-radius: 22px;
  font-size: 40px;
  font-weight: bold;
  color: white;
}

.yes {
  background: #2e7d32;
}

.no {
  background: #c62828;
}


/* SCHNELLKOMMUNIKATION */

.quick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.quick-button {
  min-height: 110px;
  padding: 12px;
  border-radius: 20px;
  border: 4px solid #1976d2;
  background: #e3f2fd;
  font-size: 22px;
  font-weight: bold;
}

.emergency {
  background: #b71c1c;
  color: white;
  border-color: #7f0000;
}


/* STIMME */

select {
  width: 100%;
  min-height: 75px;
  padding: 10px;
  border-radius: 15px;
  font-size: 21px;
}


/* STATUS */

#status {
  margin-top: 15px;
  min-height: 30px;
  font-size: 20px;
  font-weight: bold;
}


/* GESPEICHERTE SÄTZE */

.saved-item {
  margin-bottom: 12px;
  padding: 10px;
  background: #f3f3f3;
  border-radius: 18px;
}

.saved-speak {
  width: 100%;
  min-height: 95px;
  border: none;
  border-radius: 16px;
  background: #512da8;
  color: white;
  font-size: 21px;
  font-weight: bold;
  padding: 14px;
  text-align: left;
}

.saved-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

.edit-button,
.delete-button {
  min-height: 70px;
  border: none;
  border-radius: 15px;
  font-size: 19px;
  font-weight: bold;
}

.edit-button {
  background: #ffca28;
}

.delete-button {
  background: #c62828;
  color: white;
}


/* IPHONE */

@media (max-width: 600px) {

  h1 {
    font-size: 34px;
  }

  #textInput {
    min-height: 320px;
    font-size: 29px;
  }

  .main-button,
  .quick-button,
  .sentence-button {
    min-height: 120px;
    font-size: 21px;
  }

  .yes,
  .no {
    min-height: 155px;
    font-size: 38px;
  }

}

</style>
</head>

<body>

<main class="app">

<h1>👅 Tonguebox</h1>

<div class="subtitle">
  Sprich mit deinen Augen
</div>


<!-- TEXTEINGABE -->

<section class="box">

<h2>💬 Was möchtest du sagen?</h2>

<textarea
  id="textInput"
  placeholder="Hier schreiben..."
  aria-label="Text eingeben"
  spellcheck="true"
></textarea>


<div class="main-grid">

<button
  class="main-button speak"
  id="speakButton"
>
  🔊 VORLESEN
</button>

<button
  class="main-button save"
  id="saveButton"
>
  ⭐ SPEICHERN
</button>

<button
  class="main-button clear"
  id="clearButton"
>
  🗑 LEEREN
</button>

<button
  class="main-button stop"
  id="stopButton"
>
  ⏹ STOPP
</button>

</div>

<div
  id="status"
  role="status"
  aria-live="polite"
></div>

</section>


<!-- SATZVORSCHLÄGE -->

<section class="box">

<h2>✨ Satzvorschläge</h2>

<div
  id="sentenceBox"
  class="sentence-grid"
></div>

</section>


<!-- JA / NEIN -->

<section class="box">

<h2>⚡ Sofort antworten</h2>

<div class="yes-no">

<button
  class="yes"
  data-speak="Ja"
>
  ✅ JA
</button>

<button
  class="no"
  data-speak="Nein"
>
  ❌ NEIN
</button>

</div>

</section>


<!-- SCHNELLKOMMUNIKATION -->

<section class="box">

<h2>⚡ Schnell sagen</h2>

<div class="quick-grid">

<button
  class="quick-button"
  data-speak="Hallo"
>
  👋 Hallo
</button>

<button
  class="quick-button"
  data-speak="Danke"
>
  🙏 Danke
</button>

<button
  class="quick-button"
  data-speak="Bitte warten Sie kurz. Ich brauche etwas Zeit zum Antworten."
>
  ⏳ Bitte warten
</button>

<button
  class="quick-button"
  data-speak="Bitte sagen Sie das noch einmal."
>
  🔁 Noch einmal
</button>

<button
  class="quick-button"
  data-speak="Bitte sprechen Sie langsamer."
>
  🐢 Langsamer
</button>

<button
  class="quick-button"
  data-speak="Ich habe Sie nicht verstanden."
>
  ❓ Nicht verstanden
</button>

<button
  class="quick-button"
  data-speak="Ich möchte etwas trinken."
>
  🥤 Trinken
</button>

<button
  class="quick-button"
  data-speak="Ich möchte etwas essen."
>
  🍽 Essen
</button>

<button
  class="quick-button"
  data-speak="Ich muss auf die Toilette."
>
  🚻 WC
</button>

<button
  class="quick-button"
  data-speak="Ich brauche Hilfe."
>
  🆘 Hilfe
</button>

<button
  class="quick-button"
  data-speak="Bitte geben Sie mir etwas Zeit zum Antworten."
>
  ⏱ Zeit zum Antworten
</button>

<button
  class="quick-button"
  data-speak="Ich kann nicht sprechen. Ich kommuniziere mit einer Augensteuerung."
>
  👁 Augensteuerung
</button>

<button
  class="quick-button emergency"
  data-speak="Das ist ein Notfall. Bitte holen Sie sofort Hilfe."
>
  🚨 NOTFALL
</button>

</div>

</section>


<!-- STIMME -->

<section class="box">

<h2>🗣 Stimme auswählen</h2>

<select id="voiceSelect">
  <option>Stimmen werden geladen...</option>
</select>

</section>


<!-- GESPEICHERTE SÄTZE -->

<section class="box">

<h2>⭐ Gespeicherte Sätze</h2>

<div id="savedBox"></div>

</section>

</main>


<script>

document.addEventListener("DOMContentLoaded", function () {

var textInput =
  document.getElementById("textInput");

var sentenceBox =
  document.getElementById("sentenceBox");

var voiceSelect =
  document.getElementById("voiceSelect");

var savedBox =
  document.getElementById("savedBox");

var statusBox =
  document.getElementById("status");

var speakButton =
  document.getElementById("speakButton");

var saveButton =
  document.getElementById("saveButton");

var clearButton =
  document.getElementById("clearButton");

var stopButton =
  document.getElementById("stopButton");

var voices = [];


/* =====================================================
   STIMMEN LADEN
===================================================== */

function loadVoices() {

  voices =
    window.speechSynthesis.getVoices();

  voiceSelect.innerHTML = "";

  if (voices.length === 0) {

    var option =
      document.createElement("option");

    option.textContent =
      "Keine Stimme verfügbar";

    voiceSelect.appendChild(option);

    return;
  }


  var savedVoice =
    localStorage.getItem(
      "tongueboxVoice"
    );


  for (
    var i = 0;
    i < voices.length;
    i++
  ) {

    var option =
      document.createElement("option");

    option.value = i;

    option.textContent =
      voices[i].name +
      " – " +
      voices[i].lang;


    if (
      savedVoice ===
      voices[i].name
    ) {

      option.selected = true;

    }


    voiceSelect.appendChild(option);

  }

}


loadVoices();


if (
  "speechSynthesis"
  in window
) {

  window.speechSynthesis.onvoiceschanged =
    loadVoices;

}


voiceSelect.addEventListener(
  "change",
  function () {

    var index =
      Number(
        voiceSelect.value
      );

    if (voices[index]) {

      localStorage.setItem(
        "tongueboxVoice",
        voices[index].name
      );

    }

  }
);


/* =====================================================
   SPRECHEN
===================================================== */

function speakText(text) {

  if (!text) {
    return;
  }


  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {

    statusBox.textContent =
      "Sprachausgabe wird von diesem Browser nicht unterstützt.";

    return;

  }


  window.speechSynthesis.cancel();


  var speech =
    new SpeechSynthesisUtterance(
      text
    );


  var voiceIndex =
    Number(
      voiceSelect.value
    );


  if (
    voices[
      voiceIndex
    ]
  ) {

    speech.voice =
      voices[
        voiceIndex
      ];

    speech.lang =
      voices[
        voiceIndex
      ].lang;

  }


  speech.rate = 0.95;
  speech.volume = 1;


  speech.onstart =
    function () {

      statusBox.textContent =
        "🔊 Tonguebox spricht...";

    };


  speech.onend =
    function () {

      statusBox.textContent =
        "";

    };


  window.speechSynthesis.speak(
    speech
  );

}


/* =====================================================
   VORLESEN
===================================================== */

speakButton.addEventListener(
  "click",
  function () {

    var text =
      textInput.value.trim();


    if (!text) {

      statusBox.textContent =
        "Bitte zuerst etwas schreiben.";

      return;

    }


    speakText(
      text
    );

  }
);


/* =====================================================
   STOPP
===================================================== */

stopButton.addEventListener(
  "click",
  function () {

    window.speechSynthesis.cancel();

    statusBox.textContent =
      "⏹ Sprachausgabe gestoppt.";

  }
);


/* =====================================================
   LEEREN
===================================================== */

clearButton.addEventListener(
  "click",
  function () {

    textInput.value = "";

    statusBox.textContent = "";

    updateSentenceSuggestions();

    textInput.focus();

  }
);


/* =====================================================
   SATZVORSCHLÄGE
===================================================== */

textInput.addEventListener(
  "input",
  updateSentenceSuggestions
);


function updateSentenceSuggestions() {

  var originalText =
    textInput.value.trim();

  var text =
    originalText.toLowerCase();


  var sentences = [];


  if (text === "") {

    sentences = [

      "Ich möchte etwas sagen.",

      "Bitte warten Sie kurz.",

      "Ich brauche Hilfe."

    ];

  }


  else if (
    text.indexOf("kaffee") !== -1
  ) {

    sentences = [

      "Ich möchte bitte einen Kaffee.",

      "Ich hätte gerne einen Kaffee mit Milch.",

      "Könnten Sie mir bitte einen Kaffee bringen?"

    ];

  }


  else if (
    text.indexOf("wasser") !== -1
    ||
    text.indexOf("trinken") !== -1
  ) {

    sentences = [

      "Ich möchte bitte etwas trinken.",

      "Ich hätte gerne etwas Wasser.",

      "Könnten Sie mir bitte etwas zu trinken geben?"

    ];

  }


  else if (
    text.indexOf("essen") !== -1
    ||
    text.indexOf("hunger") !== -1
  ) {

    sentences = [

      "Ich möchte bitte etwas essen.",

      "Ich habe Hunger.",

      "Bitte helfen Sie mir beim Essen."

    ];

  }


  else if (
    text.indexOf("hilfe") !== -1
  ) {

    sentences = [

      "Ich brauche bitte Hilfe.",

      "Könnten Sie mir bitte helfen?",

      "Bitte helfen Sie mir kurz."

    ];

  }


  else if (
    text.indexOf("schmerz") !== -1
  ) {

    sentences = [

      "Ich habe Schmerzen.",

      "Bitte helfen Sie mir, ich habe Schmerzen.",

      "Ich brauche wegen meiner Schmerzen Hilfe."

    ];

  }


  else if (
    text.indexOf("toilette") !== -1
    ||
    text.indexOf("wc") !== -1
  ) {

    sentences = [

      "Ich muss bitte auf die Toilette.",

      "Bitte helfen Sie mir auf die Toilette.",

      "Ich brauche Hilfe beim Toilettengang."

    ];

  }


  else if (
    text.indexOf("nicht verstanden") !== -1
    ||
    text.indexOf("verstehe nicht") !== -1
  ) {

    sentences = [

      "Ich habe Sie nicht verstanden.",

      "Bitte sagen Sie das noch einmal.",

      "Bitte sprechen Sie langsamer."

    ];

  }


  else if (
    text.indexOf("warten") !== -1
    ||
    text.indexOf("zeit") !== -1
  ) {

    sentences = [

      "Bitte warten Sie kurz.",

      "Ich brauche etwas Zeit zum Antworten.",

      "Bitte geben Sie mir einen Moment."

    ];

  }


  else {

    sentences = [

      makeSentence(
        originalText
      ),

      "Bitte " +
      lowerFirst(
        originalText
      ),

      "Ich möchte sagen: " +
      originalText

    ];

  }


  showSentences(
    sentences
  );

}


/* =====================================================
   SATZBUTTONS ANZEIGEN
===================================================== */

function showSentences(
  sentences
) {

  sentenceBox.innerHTML = "";


  for (
    var i = 0;
    i < sentences.length;
    i++
  ) {

    if (!sentences[i]) {
      continue;
    }


    createSentenceButton(
      sentences[i]
    );

  }

}


function createSentenceButton(
  sentence
) {

  var button =
    document.createElement(
      "button"
    );


  button.type =
    "button";


  button.className =
    "sentence-button";


  button.textContent =
    "✨ " +
    sentence;


  button.addEventListener(
    "click",
    function () {

      textInput.value =
        sentence;


      updateSentenceSuggestions();


      speakText(
        sentence
      );

    }
  );


  sentenceBox.appendChild(
    button
  );

}


/* =====================================================
   SATZ FORMATIEREN
===================================================== */

function makeSentence(
  text
) {

  if (!text) {
    return "";
  }


  var sentence =
    text.charAt(0)
      .toUpperCase()
    +
    text.slice(1);


  if (
    !/[.!?]$/.test(
      sentence
    )
  ) {

    sentence += ".";

  }


  return sentence;

}


function lowerFirst(
  text
) {

  if (!text) {
    return "";
  }


  return (
    text.charAt(0)
      .toLowerCase()
    +
    text.slice(1)
  );

}


/* =====================================================
   SCHNELLBUTTONS
===================================================== */

var quickButtons =
  document.querySelectorAll(
    "[data-speak]"
  );


for (
  var q = 0;
  q < quickButtons.length;
  q++
) {

  quickButtons[q]
    .addEventListener(
      "click",
      function () {

        var text =
          this.getAttribute(
            "data-speak"
          );


        speakText(
          text
        );

      }
    );

}


/* =====================================================
   GESPEICHERTE SÄTZE
===================================================== */

function getSavedTexts() {

  var saved =
    localStorage.getItem(
      "tongueboxSaved"
    );


  if (!saved) {

    return [];

  }


  try {

    return JSON.parse(
      saved
    );

  }

  catch (error) {

    return [];

  }

}


/* =====================================================
   SPEICHERN
===================================================== */

saveButton.addEventListener(
  "click",
  function () {

    var text =
      textInput.value.trim();


    if (!text) {

      statusBox.textContent =
        "Bitte zuerst einen Satz schreiben.";

      return;

    }


    var saved =
      getSavedTexts();


    if (
      saved.indexOf(
        text
      ) === -1
    ) {

      saved.push(
        text
      );


      localStorage.setItem(
        "tongueboxSaved",
        JSON.stringify(
          saved
        )
      );

    }


    showSavedTexts();


    statusBox.textContent =
      "⭐ Satz gespeichert.";

  }
);


/* =====================================================
   GESPEICHERTE ANZEIGEN
===================================================== */

function showSavedTexts() {

  var saved =
    getSavedTexts();


  savedBox.innerHTML = "";


  if (
    saved.length === 0
  ) {

    savedBox.innerHTML =
      "<p>Noch keine Sätze gespeichert.</p>";

    return;

  }


  for (
    var i = 0;
    i < saved.length;
    i++
  ) {

    createSavedItem(
      saved[i],
      i
    );

  }

}


/* =====================================================
   GESPEICHERTEN SATZ ERSTELLEN
===================================================== */

function createSavedItem(
  text,
  index
) {

  var item =
    document.createElement(
      "div"
    );


  item.className =
    "saved-item";


  var speakButton =
    document.createElement(
      "button"
    );


  speakButton.type =
    "button";


  speakButton.className =
    "saved-speak";


  speakButton.textContent =
    "🔊 " +
    text;


  speakButton.addEventListener(
    "click",
    function () {

      speakText(
        text
      );

    }
  );


  var actions =
    document.createElement(
      "div"
    );


  actions.className =
    "saved-actions";


  var editButton =
    document.createElement(
      "button"
    );


  editButton.type =
    "button";


  editButton.className =
    "edit-button";


  editButton.textContent =
    "✏️ Bearbeiten";


  editButton.addEventListener(
    "click",
    function () {

      editSavedText(
        index
      );

    }
  );


  var deleteButton =
    document.createElement(
      "button"
    );


  deleteButton.type =
    "button";


  deleteButton.className =
    "delete-button";


  deleteButton.textContent =
    "🗑 Löschen";


  deleteButton.addEventListener(
    "click",
    function () {

      deleteSavedText(
        index
      );

    }
  );


  actions.appendChild(
    editButton
  );


  actions.appendChild(
    deleteButton
  );


  item.appendChild(
    speakButton
  );


  item.appendChild(
    actions
  );


  savedBox.appendChild(
    item
  );

}


/* =====================================================
   BEARBEITEN
===================================================== */

function editSavedText(
  index
) {

  var saved =
    getSavedTexts();


  if (
    !saved[index]
  ) {
    return;
  }


  textInput.value =
    saved[index];


  saved.splice(
    index,
    1
  );


  localStorage.setItem(
    "tongueboxSaved",
    JSON.stringify(
      saved
    )
  );


  showSavedTexts();

  updateSentenceSuggestions();


  window.scrollTo(
    0,
    0
  );


  textInput.focus();


  statusBox.textContent =
    "✏️ Satz kann jetzt bearbeitet werden.";

}


/* =====================================================
   LÖSCHEN
===================================================== */

function deleteSavedText(
  index
) {

  var saved =
    getSavedTexts();


  saved.splice(
    index,
    1
  );


  localStorage.setItem(
    "tongueboxSaved",
    JSON.stringify(
      saved
    )
  );


  showSavedTexts();


  statusBox.textContent =
    "🗑 Satz gelöscht.";

}


/* =====================================================
   START
===================================================== */

updateSentenceSuggestions();

showSavedTexts();


});
</script>

</body>
</html>
