<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Tonguebox KI</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:6px;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef2f6;
  color:#111;
}

.app{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:30px;
  margin:10px 0 5px;
}

#timeInfo{
  text-align:center;
  font-size:19px;
  font-weight:bold;
  margin-bottom:12px;
}

button,
textarea,
select,
summary{
  font-family:inherit;
}

button{
  width:100%;
  min-height:95px;
  padding:10px;
  border:none;
  border-radius:18px;
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
}

button:focus,
textarea:focus,
select:focus,
summary:focus{
  outline:6px solid orange;
  outline-offset:3px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

/* JA / NEIN */

.yes{
  background:#2e7d32;
  color:white;
  min-height:135px;
  font-size:38px;
}

.no{
  background:#c62828;
  color:white;
  min-height:135px;
  font-size:38px;
}

/* AUFKLAPPBAR */

details{
  background:white;
  margin-bottom:10px;
  border-radius:18px;
  overflow:hidden;
}

summary{
  list-style:none;
  cursor:pointer;
  min-height:100px;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#dfe7f1;
  font-size:22px;
  font-weight:bold;
}

summary::-webkit-details-marker{
  display:none;
}

summary::after{
  content:"▼";
}

details[open] summary::after{
  content:"▲";
}

.content{
  padding:10px;
}

/* TEXT */

textarea{
  width:100%;
  min-height:230px;
  padding:16px;
  border:4px solid #222;
  border-radius:18px;
  font-size:27px;
  line-height:1.4;
  resize:none;
}

.speak{
  background:#1565c0;
  color:white;
}

.save{
  background:#2e7d32;
  color:white;
}

.clear{
  background:#555;
  color:white;
}

.stop{
  background:#c62828;
  color:white;
}

/* TAGESZEIT */

.timeButton{
  background:#fff8e1;
  border:3px solid #ffb300;
}

.smart{
  background:#ede7f6;
  border:3px solid #673ab7;
}

.suggestion{
  background:#ede7f6;
  border:3px solid #673ab7;
  text-align:left;
  margin-bottom:9px;
}

/* SCHNELL */

.quick{
  background:#e3f2fd;
  border:3px solid #1976d2;
}

.emergency{
  background:#b71c1c;
  color:white;
}

/* STIMME */

select{
  width:100%;
  min-height:75px;
  padding:10px;
  border:3px solid #444;
  border-radius:16px;
  font-size:20px;
}

/* STATUS */

#status{
  min-height:28px;
  margin-top:8px;
  font-size:18px;
  font-weight:bold;
}

/* GESPEICHERT */

.saved{
  background:#512da8;
  color:white;
  text-align:left;
  margin-bottom:7px;
}

.delete{
  background:#c62828;
  color:white;
  min-height:65px;
  margin-bottom:12px;
}

@media(max-width:500px){

  button{
    min-height:98px;
    font-size:20px;
  }

  .yes,
  .no{
    min-height:140px;
    font-size:35px;
  }

  textarea{
    min-height:240px;
    font-size:26px;
  }

  summary{
    min-height:100px;
    font-size:21px;
  }

}

</style>
</head>

<body>

<main class="app">

<h1>👅 Tonguebox KI</h1>

<div id="timeInfo">
Tageszeit wird erkannt...
</div>

<!-- JA / NEIN -->

<div class="grid2" style="margin-bottom:10px;">

<button
  class="yes speakPhrase"
  data-text="Ja">
✅ JA
</button>

<button
  class="no speakPhrase"
  data-text="Nein">
❌ NEIN
</button>

</div>

<!-- TAGESZEIT -->

<details>

<summary>
🕒 Passend zur Tageszeit
</summary>

<div class="content">

<div id="timeButtons" class="grid2"></div>

</div>

</details>

<!-- TEXT -->

<details>

<summary>
⌨️ Text schreiben
</summary>

<div class="content">

<textarea
  id="textInput"
  placeholder="Was möchtest du sagen?"
  aria-label="Text eingeben">
</textarea>

<div class="grid2" style="margin-top:9px;">

<button id="speakButton" class="speak">
🔊 Sprechen
</button>

<button id="saveButton" class="save">
⭐ Speichern
</button>

<button id="clearButton" class="clear">
🗑 Leeren
</button>

<button id="stopButton" class="stop">
⏹ Stopp
</button>

</div>

<div id="status"></div>

</div>

</details>

<!-- INTELLIGENTE VORSCHLÄGE -->

<details>

<summary>
✨ Intelligente Vorschläge
</summary>

<div class="content">

<button
  id="suggestionButton"
  class="smart"
  style="margin-bottom:9px;">
✨ Vorschläge erstellen
</button>

<div id="suggestionBox"></div>

</div>

</details>

<!-- TEXT ASSISTENT -->

<details>

<summary>
🧠 Text-Assistent
</summary>

<div class="content">

<div class="grid2">

<button id="completeButton" class="timeButton">
✍️ Vervollständigen
</button>

<button id="friendlyButton" class="timeButton">
🙂 Freundlicher
</button>

<button id="shortButton" class="timeButton">
⚡ Kürzer
</button>

<button id="questionButton" class="timeButton">
❓ Als Frage
</button>

</div>

</div>

</details>

<!-- SCHNELLKOMMUNIKATION -->

<details>

<summary>
⚡ Schnellkommunikation
</summary>

<div class="content">

<div class="grid2">

<button class="quick speakPhrase" data-text="Hallo">
👋 Hallo
</button>

<button class="quick speakPhrase" data-text="Danke">
🙏 Danke
</button>

<button class="quick speakPhrase" data-text="Bitte warten Sie kurz.">
⏳ Warten
</button>

<button class="quick speakPhrase" data-text="Bitte sagen Sie das noch einmal.">
🔁 Nochmal
</button>

<button class="quick speakPhrase" data-text="Ich brauche Hilfe.">
🆘 Hilfe
</button>

<button class="quick speakPhrase" data-text="Ich möchte etwas trinken.">
🥤 Trinken
</button>

<button class="quick speakPhrase" data-text="Ich möchte etwas essen.">
🍽 Essen
</button>

<button class="quick speakPhrase" data-text="Ich muss auf die Toilette.">
🚻 WC
</button>

<button class="quick speakPhrase" data-text="Ich habe Sie nicht verstanden.">
❓ Nicht verstanden
</button>

<button class="quick speakPhrase" data-text="Bitte geben Sie mir etwas Zeit zum Antworten.">
⏳ Mehr Zeit
</button>

<button class="quick speakPhrase" data-text="Ich habe Schmerzen.">
🤕 Schmerzen
</button>

<button class="emergency speakPhrase" data-text="Das ist ein Notfall. Bitte holen Sie sofort Hilfe.">
🚨 NOTFALL
</button>

</div>

</div>

</details>

<!-- STIMME -->

<details>

<summary>
🗣 Stimme auswählen
</summary>

<div class="content">

<select id="voiceSelect">
<option>Stimmen werden geladen...</option>
</select>

</div>

</details>

<!-- GESPEICHERT -->

<details>

<summary>
⭐ Gespeicherte Sätze
</summary>

<div class="content">

<div id="savedBox"></div>

</div>

</details>

</main>

<script>

document.addEventListener("DOMContentLoaded", function(){

var textInput =
  document.getElementById("textInput");

var statusBox =
  document.getElementById("status");

var voiceSelect =
  document.getElementById("voiceSelect");

var suggestionBox =
  document.getElementById("suggestionBox");

var savedBox =
  document.getElementById("savedBox");

var timeButtons =
  document.getElementById("timeButtons");

var timeInfo =
  document.getElementById("timeInfo");

var voices = [];


/* ===============================
   TAGESZEIT ERKENNEN
================================ */

function getDayTime(){

  var hour =
    new Date().getHours();

  if(hour >= 5 && hour < 10){
    return "morgen";
  }

  if(hour >= 10 && hour < 12){
    return "vormittag";
  }

  if(hour >= 12 && hour < 14){
    return "mittag";
  }

  if(hour >= 14 && hour < 18){
    return "nachmittag";
  }

  if(hour >= 18 && hour < 22){
    return "abend";
  }

  return "nacht";
}


/* ===============================
   TAGESZEIT-TEXTE
================================ */

function getTimePhrases(){

  var time =
    getDayTime();

  if(time === "morgen"){

    return [
      "Guten Morgen.",
      "Ich möchte frühstücken.",
      "Ich hätte gerne einen Kaffee.",
      "Ich möchte etwas trinken.",
      "Wie geht es Ihnen?",
      "Was ist heute geplant?"
    ];

  }

  if(time === "vormittag"){

    return [
      "Guten Vormittag.",
      "Ich hätte gerne etwas zu trinken.",
      "Ich brauche eine kurze Pause.",
      "Was machen wir als Nächstes?",
      "Bitte geben Sie mir etwas Zeit.",
      "Ich brauche Hilfe."
    ];

  }

  if(time === "mittag"){

    return [
      "Mahlzeit.",
      "Ich möchte etwas essen.",
      "Ich hätte gerne etwas zu trinken.",
      "Bitte helfen Sie mir beim Essen.",
      "Ich bin satt.",
      "Ich möchte noch etwas."
    ];

  }

  if(time === "nachmittag"){

    return [
      "Guten Nachmittag.",
      "Ich hätte gerne einen Kaffee.",
      "Ich möchte etwas trinken.",
      "Ich brauche eine Pause.",
      "Was machen wir heute noch?",
      "Ich möchte mich ausruhen."
    ];

  }

  if(time === "abend"){

    return [
      "Guten Abend.",
      "Ich möchte etwas essen.",
      "Ich möchte etwas trinken.",
      "Ich möchte mich ausruhen.",
      "Ich möchte ins Bett.",
      "Danke für heute."
    ];

  }

  return [
    "Ich brauche Hilfe.",
    "Ich muss auf die Toilette.",
    "Ich habe Schmerzen.",
    "Bitte helfen Sie mir.",
    "Ich kann nicht schlafen.",
    "Das ist ein Notfall."
  ];

}


/* ===============================
   TAGESZEIT ANZEIGEN
================================ */

function updateTimeArea(){

  var time =
    getDayTime();

  var labels = {
    morgen:"🌅 Guten Morgen",
    vormittag:"☀️ Guten Vormittag",
    mittag:"🍽 Mittagszeit",
    nachmittag:"🌤 Guten Nachmittag",
    abend:"🌙 Guten Abend",
    nacht:"🌙 Nacht"
  };

  timeInfo.textContent =
    labels[time];

  timeButtons.innerHTML = "";

  var phrases =
    getTimePhrases();

  for(var i = 0; i < phrases.length; i++){

    var button =
      document.createElement("button");

    button.type = "button";

    button.className =
      "timeButton";

    button.textContent =
      phrases[i];

    button.setAttribute(
      "data-text",
      phrases[i]
    );

    button.addEventListener(
    "click",
    function(){

      speakText(
        this.getAttribute("data-text")
      );

    });

    timeButtons.appendChild(button);

  }

}

updateTimeArea();


/* Alle 5 Minuten Tageszeit prüfen */

setInterval(
  updateTimeArea,
  300000
);


/* ===============================
   BEREICHE ZENTRIEREN
================================ */

var details =
  document.querySelectorAll("details");

for(var d = 0; d < details.length; d++){

  details[d].addEventListener(
  "toggle",
  function(){

    var current = this;

    if(!current.open){
      return;
    }

    for(var j = 0; j < details.length; j++){

      if(details[j] !== current){
        details[j].open = false;
      }

    }

    setTimeout(function(){

      current.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },180);

  });

}


/* ===============================
   STIMMEN
================================ */

function loadVoices(){

  if(!("speechSynthesis" in window)){
    return;
  }

  voices =
    window.speechSynthesis.getVoices();

  voiceSelect.innerHTML = "";

  var savedVoice =
    localStorage.getItem(
      "tongueboxVoice"
    );

  if(voices.length === 0){

    var loading =
      document.createElement("option");

    loading.textContent =
      "Stimmen werden geladen...";

    voiceSelect.appendChild(loading);

    return;

  }

  for(var i = 0; i < voices.length; i++){

    var option =
      document.createElement("option");

    option.value = i;

    option.textContent =
      voices[i].name +
      " – " +
      voices[i].lang;

    if(savedVoice === voices[i].name){
      option.selected = true;
    }

    voiceSelect.appendChild(option);

  }

}

loadVoices();

if("speechSynthesis" in window){

  speechSynthesis.onvoiceschanged =
    loadVoices;

}

voiceSelect.addEventListener(
"change",
function(){

  var index =
    parseInt(
      voiceSelect.value,
      10
    );

  if(voices[index]){

    localStorage.setItem(
      "tongueboxVoice",
      voices[index].name
    );

  }

});


/* ===============================
   SPRECHEN
================================ */

function speakText(message){

  message =
    String(message || "").trim();

  if(!message){
    return;
  }

  if(!("speechSynthesis" in window)){
    return;
  }

  speechSynthesis.cancel();

  var speech =
    new SpeechSynthesisUtterance(
      message
    );

  var index =
    parseInt(
      voiceSelect.value,
      10
    );

  if(voices[index]){

    speech.voice =
      voices[index];

    speech.lang =
      voices[index].lang;

  }
  else{

    speech.lang =
      "de-DE";

  }

  speech.rate = 0.95;

  speechSynthesis.speak(speech);

}


/* JA / NEIN + SCHNELL */

var phraseButtons =
  document.querySelectorAll(
    ".speakPhrase"
  );

for(var p = 0; p < phraseButtons.length; p++){

  phraseButtons[p].addEventListener(
  "click",
  function(){

    speakText(
      this.getAttribute("data-text")
    );

  });

}


/* ===============================
   TEXT SPRECHEN
================================ */

document
.getElementById("speakButton")
.addEventListener(
"click",
function(){

  speakText(
    textInput.value
  );

});


document
.getElementById("stopButton")
.addEventListener(
"click",
function(){

  speechSynthesis.cancel();

});


document
.getElementById("clearButton")
.addEventListener(
"click",
function(){

  textInput.value = "";

  suggestionBox.innerHTML = "";

});


/* ===============================
   INTELLIGENTE VORSCHLÄGE
================================ */

document
.getElementById("suggestionButton")
.addEventListener(
"click",
function(){

  var text =
    textInput.value.trim();

  var lower =
    text.toLowerCase();

  var list = [];

  if(!text){

    list =
      getTimePhrases()
        .slice(0,3);

  }

  else if(
    lower.indexOf("kaffee") !== -1
  ){

    list = [
      "Ich möchte bitte einen Kaffee.",
      "Ich hätte gerne einen Kaffee mit Milch.",
      "Könnten Sie mir bitte einen Kaffee bringen?"
    ];

  }

  else if(
    lower.indexOf("trinken") !== -1 ||
    lower.indexOf("wasser") !== -1
  ){

    list = [
      "Ich möchte etwas trinken.",
      "Ich hätte gerne Wasser.",
      "Bitte helfen Sie mir beim Trinken."
    ];

  }

  else if(
    lower.indexOf("essen") !== -1
  ){

    list = [
      "Ich möchte etwas essen.",
      "Bitte helfen Sie mir beim Essen.",
      "Ich hätte gerne noch etwas."
    ];

  }

  else if(
    lower.indexOf("hilfe") !== -1
  ){

    list = [
      "Ich brauche Hilfe.",
      "Könnten Sie mir bitte helfen?",
      "Bitte holen Sie jemanden."
    ];

  }

  else{

    list = [
      cleanText(text),
      friendlyText(text),
      questionText(text)
    ];

  }

  showSuggestions(list);

});


function showSuggestions(list){

  suggestionBox.innerHTML = "";

  for(var i = 0; i < list.length; i++){

    var button =
      document.createElement("button");

    button.className =
      "suggestion";

    button.textContent =
      "✨ " + list[i];

    button.setAttribute(
      "data-text",
      list[i]
    );

    button.addEventListener(
    "click",
    function(){

      var sentence =
        this.getAttribute("data-text");

      textInput.value =
        sentence;

      speakText(sentence);

    });

    suggestionBox.appendChild(button);

  }

}


/* ===============================
   TEXTASSISTENT
================================ */

document
.getElementById("completeButton")
.addEventListener(
"click",
function(){

  var text =
    textInput.value.trim();

  var lower =
    text.toLowerCase();

  if(lower.indexOf("kaffee") !== -1){

    textInput.value =
      "Ich möchte bitte einen Kaffee.";

  }
  else if(
    lower.indexOf("essen") !== -1
  ){

    textInput.value =
      "Ich möchte bitte etwas essen.";

  }
  else if(
    lower.indexOf("trinken") !== -1
  ){

    textInput.value =
      "Ich möchte bitte etwas trinken.";

  }
  else if(
    lower.indexOf("hilfe") !== -1
  ){

    textInput.value =
      "Ich brauche bitte Hilfe.";

  }
  else{

    textInput.value =
      cleanText(text);

  }

});


document
.getElementById("friendlyButton")
.addEventListener(
"click",
function(){

  textInput.value =
    friendlyText(
      textInput.value
    );

});


document
.getElementById("shortButton")
.addEventListener(
"click",
function(){

  var text =
    textInput.value;

  text =
    text.replace(
      /ich hätte gerne/gi,
      "Ich möchte"
    );

  text =
    text.replace(
      /ich würde gerne/gi,
      "Ich möchte"
    );

  textInput.value =
    cleanText(text);

});


document
.getElementById("questionButton")
.addEventListener(
"click",
function(){

  textInput.value =
    questionText(
      textInput.value
    );

});


function cleanText(text){

  text =
    String(text || "")
      .trim();

  if(!text){
    return "";
  }

  text =
    text.charAt(0).toUpperCase() +
    text.slice(1);

  if(!/[.!?]$/.test(text)){
    text += ".";
  }

  return text;

}


function friendlyText(text){

  text =
    String(text || "")
      .trim()
      .replace(/[.!?]+$/,"");

  if(!text){
    return "";
  }

  if(
    text.toLowerCase()
      .indexOf("bitte") === -1
  ){

    text =
      "Bitte " +
      text.charAt(0).toLowerCase() +
      text.slice(1);

  }

  return cleanText(text);

}


function questionText(text){

  text =
    String(text || "")
      .trim()
      .replace(/[.!?]+$/,"");

  if(!text){
    return "";
  }

  return (
    "Könnten Sie bitte " +
    text.charAt(0).toLowerCase() +
    text.slice(1) +
    "?"
  );

}


/* ===============================
   SPEICHERN
================================ */

function getSaved(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "tongueboxSaved"
      ) || "[]"
    );

  }
  catch(error){

    return [];

  }

}


document
.getElementById("saveButton")
.addEventListener(
"click",
function(){

  var text =
    textInput.value.trim();

  if(!text){
    return;
  }

  var saved =
    getSaved();

  if(saved.indexOf(text) === -1){

    saved.push(text);

    localStorage.setItem(
      "tongueboxSaved",
      JSON.stringify(saved)
    );

  }

  showSaved();

});


function showSaved(){

  savedBox.innerHTML = "";

  var saved =
    getSaved();

  if(saved.length === 0){

    savedBox.innerHTML =
      "<p>Noch keine Sätze gespeichert.</p>";

    return;

  }

  for(var i = 0; i < saved.length; i++){

    createSaved(
      saved[i],
      i
    );

  }

}


function createSaved(sentence,index){

  var speak =
    document.createElement("button");

  speak.className =
    "saved";

  speak.textContent =
    "🔊 " + sentence;

  speak.addEventListener(
  "click",
  function(){

    speakText(sentence);

  });


  var remove =
    document.createElement("button");

  remove.className =
    "delete";

  remove.textContent =
    "🗑 Löschen";

  remove.addEventListener(
  "click",
  function(){

    var saved =
      getSaved();

    saved.splice(index,1);

    localStorage.setItem(
      "tongueboxSaved",
      JSON.stringify(saved)
    );

    showSaved();

  });


  savedBox.appendChild(speak);

  savedBox.appendChild(remove);

}

showSaved();

});
</script>

</body>
</html>
