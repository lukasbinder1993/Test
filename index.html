<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Tonguebox</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:6px;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef2f6;
  color:#111;
}

.app{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:30px;
  margin:10px 0 4px;
}

.subtitle{
  text-align:center;
  font-size:18px;
  margin:0 0 8px;
}

#timeInfo{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

button,
textarea,
summary{
  font-family:inherit;
}

button{
  width:100%;
  min-height:95px;
  padding:12px;
  border:none;
  border-radius:18px;
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
}

button:focus-visible,
textarea:focus-visible,
summary:focus-visible{
  outline:6px solid orange;
  outline-offset:4px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

/* SCREENREADER */

.visually-hidden{
  position:absolute !important;
  width:1px !important;
  height:1px !important;
  padding:0 !important;
  margin:-1px !important;
  overflow:hidden !important;
  clip:rect(0,0,0,0) !important;
  white-space:nowrap !important;
  border:0 !important;
}

/* JA / NEIN */

.yes{
  background:#2e7d32;
  color:white;
  min-height:140px;
  font-size:38px;
}

.no{
  background:#c62828;
  color:white;
  min-height:140px;
  font-size:38px;
}

/* BEREICHE */

details{
  background:white;
  margin-bottom:10px;
  border-radius:18px;
  overflow:hidden;
}

summary{
  list-style:none;
  cursor:pointer;
  min-height:100px;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#dfe7f1;
  font-size:22px;
  font-weight:bold;
}

summary::-webkit-details-marker{
  display:none;
}

summary::after{
  content:"▼";
  font-size:23px;
}

details[open] summary::after{
  content:"▲";
}

.content{
  padding:10px;
}

/* TEXT */

textarea{
  width:100%;
  min-height:220px;
  padding:16px;
  border:4px solid #222;
  border-radius:18px;
  font-size:27px;
  line-height:1.4;
  resize:none;
}

.speak{
  background:#1565c0;
  color:white;
}

.save{
  background:#2e7d32;
  color:white;
}

.clear{
  background:#555;
  color:white;
}

.stop{
  background:#c62828;
  color:white;
}

/* VORSCHLÄGE */

.smart{
  background:#ede7f6;
  border:3px solid #673ab7;
}

.suggestion{
  background:#ede7f6;
  border:3px solid #673ab7;
  text-align:left;
  margin-bottom:9px;
}

/* SCHNELLKOMMUNIKATION */

.quick{
  background:#e3f2fd;
  border:3px solid #1976d2;
}

.timeButton{
  background:#fff8e1;
  border:3px solid #ffb300;
}

.emergency{
  background:#b71c1c;
  color:white;
}

/* STIMMEN */

.voiceButton{
  background:#f5f5f5;
  border:4px solid #555;
  color:#111;
  text-align:left;
  min-height:105px;
  margin-bottom:9px;
}

.voiceButton.active{
  background:#dcedc8;
  border:5px solid #2e7d32;
}

.voiceName{
  display:block;
  font-size:22px;
  font-weight:bold;
}

.voiceLang{
  display:block;
  font-size:17px;
  font-weight:normal;
  margin-top:6px;
}

.voiceTest{
  background:#1565c0;
  color:white;
  margin-top:8px;
}

/* STATUS */

.status{
  min-height:30px;
  margin-top:8px;
  font-size:18px;
  font-weight:bold;
}

/* GESPEICHERT */

.saved{
  background:#512da8;
  color:white;
  text-align:left;
  margin-bottom:7px;
}

.savedActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-bottom:14px;
}

.edit{
  background:#ffca28;
  min-height:70px;
}

.delete{
  background:#c62828;
  color:white;
  min-height:70px;
}

@media(max-width:500px){

  body{
    padding:5px;
  }

  h1{
    font-size:27px;
  }

  button{
    min-height:100px;
    font-size:20px;
  }

  .yes,
  .no{
    min-height:145px;
    font-size:35px;
  }

  summary{
    min-height:105px;
    font-size:21px;
  }

  textarea{
    min-height:230px;
    font-size:26px;
  }

  .voiceButton{
    min-height:115px;
  }
}
</style>
</head>

<body>

<main class="app">

<header>
  <h1>👅 Tonguebox</h1>
  <p class="subtitle">Unterstützte Kommunikation</p>

  <div
    id="timeInfo"
    aria-live="polite">
    Tageszeit wird erkannt...
  </div>
</header>


<!-- JA / NEIN IMMER SICHTBAR -->

<section aria-labelledby="answerHeading">

<h2
  id="answerHeading"
  class="visually-hidden">
  Sofortantworten
</h2>

<div class="grid2">

<button
  class="yes speakPhrase"
  data-text="Ja"
  type="button"
  aria-label="Ja sprechen">
  ✅ JA
</button>

<button
  class="no speakPhrase"
  data-text="Nein"
  type="button"
  aria-label="Nein sprechen">
  ❌ NEIN
</button>

</div>

</section>


<!-- TAGESZEIT -->

<details>

<summary>
🕒 Tageszeit
</summary>

<div class="content">

<div
  id="timeButtons"
  class="grid2"
  aria-label="Sätze passend zur Tageszeit">
</div>

</div>

</details>


<!-- TEXT SCHREIBEN -->

<details id="textSection">

<summary>
⌨️ Text schreiben
</summary>

<div class="content">

<label
  class="visually-hidden"
  for="textInput">
  Text eingeben
</label>

<textarea
  id="textInput"
  placeholder="Was möchtest du sagen?"
  spellcheck="true"
  aria-label="Text eingeben">
</textarea>

<div class="grid2" style="margin-top:9px;">

<button
  id="speakButton"
  class="speak"
  type="button">
  🔊 Sprechen
</button>

<button
  id="saveButton"
  class="save"
  type="button">
  ⭐ Speichern
</button>

<button
  id="clearButton"
  class="clear"
  type="button">
  🗑 Leeren
</button>

<button
  id="stopButton"
  class="stop"
  type="button">
  ⏹ Stopp
</button>

</div>

<div
  id="status"
  class="status"
  role="status"
  aria-live="polite"
  aria-atomic="true">
</div>

</div>

</details>


<!-- VORSCHLÄGE -->

<details>

<summary>
✨ Intelligente Vorschläge
</summary>

<div class="content">

<button
  id="suggestionButton"
  class="smart"
  type="button"
  style="margin-bottom:9px;">
  ✨ Vorschläge erstellen
</button>

<div
  id="suggestionStatus"
  class="status"
  role="status"
  aria-live="polite">
</div>

<div
  id="suggestionBox"
  aria-label="Satzvorschläge">
</div>

</div>

</details>


<!-- SCHNELLKOMMUNIKATION -->

<details>

<summary>
⚡ Schnellkommunikation
</summary>

<div class="content">

<div class="grid2">

<button class="quick speakPhrase" data-text="Hallo" type="button">
👋 Hallo
</button>

<button class="quick speakPhrase" data-text="Danke" type="button">
🙏 Danke
</button>

<button class="quick speakPhrase" data-text="Bitte warten Sie kurz." type="button">
⏳ Warten
</button>

<button class="quick speakPhrase" data-text="Bitte sagen Sie das noch einmal." type="button">
🔁 Nochmal
</button>

<button class="quick speakPhrase" data-text="Ich brauche Hilfe." type="button">
🆘 Hilfe
</button>

<button class="quick speakPhrase" data-text="Ich möchte etwas trinken." type="button">
🥤 Trinken
</button>

<button class="quick speakPhrase" data-text="Ich möchte etwas essen." type="button">
🍽 Essen
</button>

<button class="quick speakPhrase" data-text="Ich muss auf die Toilette." type="button">
🚻 WC
</button>

<button class="quick speakPhrase" data-text="Ich habe Sie nicht verstanden." type="button">
❓ Nicht verstanden
</button>

<button class="quick speakPhrase" data-text="Bitte sprechen Sie langsamer." type="button">
🐢 Langsamer
</button>

<button class="quick speakPhrase" data-text="Bitte geben Sie mir etwas Zeit zum Antworten." type="button">
⏳ Mehr Zeit
</button>

<button class="quick speakPhrase" data-text="Ich habe Schmerzen." type="button">
🤕 Schmerzen
</button>

<button
  class="emergency speakPhrase"
  data-text="Das ist ein Notfall. Bitte holen Sie sofort Hilfe."
  type="button"
  aria-label="Notfall. Sofort Hilfe holen">
  🚨 NOTFALL
</button>

</div>

</div>

</details>


<!-- STIMMEN -->

<details>

<summary>
🗣 Stimme auswählen
</summary>

<div class="content">

<p>
Tippe auf eine Stimme, um sie auszuwählen.
</p>

<div
  id="voiceStatus"
  class="status"
  role="status"
  aria-live="polite"
  aria-atomic="true">
</div>

<div
  id="voiceButtons"
  role="radiogroup"
  aria-label="Stimmen auswählen">
</div>

<button
  id="voiceTestButton"
  class="voiceTest"
  type="button">
  🔊 Stimme testen
</button>

</div>

</details>


<!-- GESPEICHERT -->

<details>

<summary>
⭐ Gespeicherte Sätze
</summary>

<div class="content">

<div
  id="savedStatus"
  class="status"
  role="status"
  aria-live="polite">
</div>

<div
  id="savedBox"
  aria-label="Gespeicherte Sätze">
</div>

</div>

</details>

</main>


<script>
document.addEventListener("DOMContentLoaded", function(){

var textInput =
  document.getElementById("textInput");

var statusBox =
  document.getElementById("status");

var suggestionBox =
  document.getElementById("suggestionBox");

var suggestionStatus =
  document.getElementById("suggestionStatus");

var savedBox =
  document.getElementById("savedBox");

var savedStatus =
  document.getElementById("savedStatus");

var timeButtons =
  document.getElementById("timeButtons");

var timeInfo =
  document.getElementById("timeInfo");

var voiceButtons =
  document.getElementById("voiceButtons");

var voiceStatus =
  document.getElementById("voiceStatus");

var voices = [];
var selectedVoiceName =
  localStorage.getItem("tongueboxVoice") || "";


/* =========================================
   TAGESZEIT
========================================= */

function getDayTime(){

  var hour =
    new Date().getHours();

  if(hour >= 5 && hour < 11){
    return "morgen";
  }

  if(hour >= 11 && hour < 15){
    return "mittag";
  }

  if(hour >= 15 && hour < 18){
    return "nachmittag";
  }

  if(hour >= 18 && hour < 23){
    return "abend";
  }

  return "nacht";
}


function getGreeting(){

  var time =
    getDayTime();

  if(time === "morgen"){
    return "Guten Morgen";
  }

  if(time === "mittag"){
    return "Guten Appetit";
  }

  if(time === "nachmittag"){
    return "Guten Nachmittag";
  }

  if(time === "abend"){
    return "Guten Abend";
  }

  return "Gute Nacht";
}


function getTimePhrases(){

  var time =
    getDayTime();

  if(time === "morgen"){

    return [
      "Guten Morgen.",
      "Guten Morgen, wie geht es Ihnen?",
      "Ich möchte frühstücken.",
      "Ich hätte gerne einen Kaffee."
    ];

  }

  if(time === "mittag"){

    return [
      "Guten Appetit.",
      "Guten Appetit zusammen.",
      "Ich möchte etwas essen.",
      "Bitte helfen Sie mir beim Essen."
    ];

  }

  if(time === "nachmittag"){

    return [
      "Guten Nachmittag.",
      "Ich hätte gerne einen Kaffee.",
      "Ich möchte etwas trinken.",
      "Ich brauche eine Pause."
    ];

  }

  if(time === "abend"){

    return [
      "Guten Abend.",
      "Ich wünsche Ihnen einen schönen Abend.",
      "Ich möchte mich ausruhen.",
      "Danke für heute."
    ];

  }

  return [
    "Gute Nacht.",
    "Ich möchte schlafen.",
    "Ich brauche Hilfe.",
    "Ich muss auf die Toilette."
  ];
}


function updateTimeArea(){

  var time =
    getDayTime();

  var labels = {
    morgen:"🌅 Guten Morgen",
    mittag:"🍽 Guten Appetit",
    nachmittag:"🌤 Guten Nachmittag",
    abend:"🌙 Guten Abend",
    nacht:"🌙 Gute Nacht"
  };

  timeInfo.textContent =
    labels[time];

  timeButtons.innerHTML = "";

  var phrases =
    getTimePhrases();

  for(var i = 0; i < phrases.length; i++){

    createTimeButton(
      phrases[i]
    );

  }
}


function createTimeButton(sentence){

  var button =
    document.createElement("button");

  button.type = "button";
  button.className = "timeButton";
  button.textContent = sentence;

  button.setAttribute(
    "aria-label",
    sentence + " sprechen"
  );

  button.addEventListener(
  "click",
  function(){

    speakText(sentence);

  });

  timeButtons.appendChild(button);
}


updateTimeArea();

setInterval(
  updateTimeArea,
  300000
);


/* =========================================
   BEREICHE AUTOMATISCH ZENTRIEREN
========================================= */

var details =
  document.querySelectorAll("details");

for(var d = 0; d < details.length; d++){

  details[d].addEventListener(
  "toggle",
  function(){

    var current =
      this;

    if(!current.open){
      return;
    }

    for(var j = 0; j < details.length; j++){

      if(details[j] !== current){
        details[j].open = false;
      }

    }

    setTimeout(function(){

      current.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },180);

  });
}


/* =========================================
   STIMMEN LADEN
========================================= */

function loadVoices(){

  if(!("speechSynthesis" in window)){

    voiceStatus.textContent =
      "Sprachausgabe wird nicht unterstützt.";

    return;
  }

  voices =
    window.speechSynthesis.getVoices();

  voiceButtons.innerHTML = "";

  if(voices.length === 0){

    voiceStatus.textContent =
      "Stimmen werden geladen...";

    return;
  }

  /*
    Deutschsprachige Stimmen zuerst.
  */

  voices.sort(function(a,b){

    var aGerman =
      a.lang.toLowerCase().startsWith("de");

    var bGerman =
      b.lang.toLowerCase().startsWith("de");

    if(aGerman && !bGerman){
      return -1;
    }

    if(!aGerman && bGerman){
      return 1;
    }

    return a.name.localeCompare(b.name);
  });


  /*
    Falls noch keine Stimme gespeichert wurde:
    möglichst eine deutsche Stimme auswählen.
  */

  if(!selectedVoiceName){

    for(var i = 0; i < voices.length; i++){

      if(
        voices[i].lang
        .toLowerCase()
        .startsWith("de")
      ){

        selectedVoiceName =
          voices[i].name;

        break;
      }
    }

    if(!selectedVoiceName && voices[0]){

      selectedVoiceName =
        voices[0].name;

    }

    localStorage.setItem(
      "tongueboxVoice",
      selectedVoiceName
    );
  }


  for(var v = 0; v < voices.length; v++){

    createVoiceButton(
      voices[v]
    );

  }

  voiceStatus.textContent =
    "Ausgewählte Stimme: " +
    selectedVoiceName;
}


function createVoiceButton(voice){

  var button =
    document.createElement("button");

  button.type =
    "button";

  button.className =
    "voiceButton";

  button.setAttribute(
    "role",
    "radio"
  );

  var isSelected =
    voice.name === selectedVoiceName;

  button.setAttribute(
    "aria-checked",
    isSelected
      ? "true"
      : "false"
  );

  if(isSelected){

    button.classList.add(
      "active"
    );

  }

  var name =
    document.createElement("span");

  name.className =
    "voiceName";

  name.textContent =
    isSelected
      ? "✅ " + voice.name
      : voice.name;


  var language =
    document.createElement("span");

  language.className =
    "voiceLang";

  language.textContent =
    "Sprache: " + voice.lang;


  button.appendChild(name);
  button.appendChild(language);


  button.setAttribute(
    "aria-label",
    voice.name +
    ", Sprache " +
    voice.lang +
    (
      isSelected
        ? ", ausgewählt"
        : ", auswählen"
    )
  );


  button.addEventListener(
  "click",
  function(){

    selectedVoiceName =
      voice.name;

    localStorage.setItem(
      "tongueboxVoice",
      selectedVoiceName
    );

    loadVoices();

    voiceStatus.textContent =
      "Stimme ausgewählt: " +
      voice.name;

    speakText(
      "Hallo. Das ist meine Stimme."
    );

  });


  voiceButtons.appendChild(
    button
  );
}


loadVoices();

if("speechSynthesis" in window){

  window.speechSynthesis.onvoiceschanged =
    loadVoices;

}


/* =========================================
   AUSGEWÄHLTE STIMME FINDEN
========================================= */

function getSelectedVoice(){

  for(var i = 0; i < voices.length; i++){

    if(
      voices[i].name ===
      selectedVoiceName
    ){

      return voices[i];

    }

  }

  return null;
}


/* =========================================
   STIMME TESTEN
========================================= */

document
.getElementById("voiceTestButton")
.addEventListener(
"click",
function(){

  speakText(
    "Hallo. Das ist die ausgewählte Stimme von Tonguebox."
  );

});


/* =========================================
   SPRECHEN
========================================= */

function speakText(message){

  message =
    String(message || "").trim();

  if(!message){
    return;
  }

  if(!("speechSynthesis" in window)){

    statusBox.textContent =
      "Sprachausgabe wird nicht unterstützt.";

    return;
  }

  window.speechSynthesis.cancel();

  var speech =
    new SpeechSynthesisUtterance(message);

  var selected =
    getSelectedVoice();

  if(selected){

    speech.voice =
      selected;

    speech.lang =
      selected.lang;

  }
  else{

    speech.lang =
      "de-DE";

  }

  speech.rate =
    0.95;

  speech.onstart =
  function(){

    statusBox.textContent =
      "Sprachausgabe gestartet.";

  };

  speech.onend =
  function(){

    statusBox.textContent =
      "Sprachausgabe beendet.";

  };

  window.speechSynthesis.speak(
    speech
  );
}


/* =========================================
   JA / NEIN UND SCHNELLBUTTONS
========================================= */

var phraseButtons =
  document.querySelectorAll(
    ".speakPhrase"
  );

for(var p = 0; p < phraseButtons.length; p++){

  phraseButtons[p].addEventListener(
  "click",
  function(){

    speakText(
      this.getAttribute(
        "data-text"
      )
    );

  });
}


/* =========================================
   TEXT SPRECHEN
========================================= */

document
.getElementById("speakButton")
.addEventListener(
"click",
function(){

  var text =
    textInput.value.trim();

  if(!text){

    statusBox.textContent =
      "Bitte zuerst Text eingeben.";

    return;
  }

  speakText(text);

});


/* =========================================
   STOPP
========================================= */

document
.getElementById("stopButton")
.addEventListener(
"click",
function(){

  if("speechSynthesis" in window){

    window.speechSynthesis.cancel();

  }

  statusBox.textContent =
    "Sprachausgabe gestoppt.";

});


/* =========================================
   LEEREN
========================================= */

document
.getElementById("clearButton")
.addEventListener(
"click",
function(){

  textInput.value = "";

  suggestionBox.innerHTML = "";

  statusBox.textContent =
    "Texteingabe geleert.";

});


/* =========================================
   INTELLIGENTE VORSCHLÄGE
========================================= */

document
.getElementById("suggestionButton")
.addEventListener(
"click",
function(){

  var text =
    textInput.value.trim();

  var lower =
    text.toLowerCase();

  var time =
    getDayTime();

  var greeting =
    getGreeting();

  var list = [];


  if(!text){

    list =
      getTimePhrases()
      .slice(0,3);

  }


  else if(
    lower.includes("hallo") ||
    lower.includes("grüß")
  ){

    list = [
      greeting + ".",
      greeting + ", schön Sie zu sehen.",
      greeting + ", wie geht es Ihnen?"
    ];

  }


  else if(
    lower.includes("kaffee")
  ){

    if(time === "morgen"){

      list = [
        "Guten Morgen, ich hätte gerne einen Kaffee.",
        "Guten Morgen, könnten Sie mir bitte einen Kaffee bringen?",
        "Ich möchte zum Frühstück gerne einen Kaffee."
      ];

    }
    else{

      list = [
        "Ich hätte gerne einen Kaffee.",
        "Könnten Sie mir bitte einen Kaffee bringen?",
        "Ich möchte bitte einen Kaffee."
      ];

    }

  }


  else if(
    lower.includes("essen") ||
    lower.includes("hunger")
  ){

    if(time === "mittag"){

      list = [
        "Guten Appetit.",
        "Guten Appetit zusammen.",
        "Bitte helfen Sie mir beim Essen."
      ];

    }

    else if(time === "abend"){

      list = [
        "Guten Abend, ich möchte etwas essen.",
        "Ich hätte gerne etwas zum Abendessen.",
        "Bitte helfen Sie mir beim Abendessen."
      ];

    }

    else{

      list = [
        "Ich möchte etwas essen.",
        "Ich habe Hunger.",
        "Bitte helfen Sie mir beim Essen."
      ];

    }

  }


  else if(
    lower.includes("trinken") ||
    lower.includes("wasser")
  ){

    list = [
      "Ich möchte bitte etwas trinken.",
      "Ich hätte gerne Wasser.",
      "Bitte helfen Sie mir beim Trinken."
    ];

  }


  else if(
    lower.includes("hilfe")
  ){

    list = [
      "Ich brauche Hilfe.",
      "Könnten Sie mir bitte helfen?",
      "Bitte helfen Sie mir kurz."
    ];

  }


  else{

    list = [
      cleanText(text),
      friendlyText(text),
      questionText(text)
    ];

  }

  showSuggestions(list);

});


function showSuggestions(list){

  suggestionBox.innerHTML = "";

  suggestionStatus.textContent =
    list.length +
    " Vorschläge verfügbar.";

  for(var i = 0; i < list.length; i++){

    createSuggestion(
      list[i],
      i
    );

  }
}


function createSuggestion(sentence,index){

  var button =
    document.createElement("button");

  button.type =
    "button";

  button.className =
    "suggestion";

  button.textContent =
    "✨ " + sentence;

  button.setAttribute(
    "aria-label",
    "Vorschlag " +
    (index + 1) +
    ": " +
    sentence
  );

  button.addEventListener(
  "click",
  function(){

    textInput.value =
      sentence;

    speakText(sentence);

  });

  suggestionBox.appendChild(
    button
  );
}


/* =========================================
   TEXT-HILFSFUNKTIONEN
========================================= */

function cleanText(text){

  text =
    String(text || "")
    .trim();

  if(!text){
    return "";
  }

  text =
    text.replace(/\s+/g," ");

  text =
    text.charAt(0).toUpperCase() +
    text.slice(1);

  if(!/[.!?]$/.test(text)){
    text += ".";
  }

  return text;
}


function lowerFirst(text){

  if(!text){
    return "";
  }

  return (
    text.charAt(0).toLowerCase() +
    text.slice(1)
  );
}


function friendlyText(text){

  text =
    String(text || "")
    .trim()
    .replace(/[.!?]+$/,"");

  if(!text){
    return "";
  }

  if(
    !text
    .toLowerCase()
    .includes("bitte")
  ){

    text =
      "Bitte " +
      lowerFirst(text);

  }

  return cleanText(text);
}


function questionText(text){

  text =
    String(text || "")
    .trim()
    .replace(/[.!?]+$/,"");

  if(!text){
    return "";
  }

  return (
    "Könnten Sie bitte " +
    lowerFirst(text) +
    "?"
  );
}


/* =========================================
   SPEICHERN
========================================= */

function getSaved(){

  try{

    var result =
      JSON.parse(
        localStorage.getItem(
          "tongueboxSaved"
        ) || "[]"
      );

    return Array.isArray(result)
      ? result
      : [];

  }
  catch(error){

    return [];

  }
}


function saveSaved(list){

  localStorage.setItem(
    "tongueboxSaved",
    JSON.stringify(list)
  );
}


document
.getElementById("saveButton")
.addEventListener(
"click",
function(){

  var text =
    textInput.value.trim();

  if(!text){

    statusBox.textContent =
      "Bitte zuerst Text eingeben.";

    return;
  }

  var saved =
    getSaved();

  if(saved.indexOf(text) === -1){

    saved.push(text);

    saveSaved(saved);

    statusBox.textContent =
      "Satz gespeichert.";

    savedStatus.textContent =
      "Ein neuer Satz wurde gespeichert.";

  }
  else{

    statusBox.textContent =
      "Dieser Satz ist bereits gespeichert.";

  }

  showSaved();

});


/* =========================================
   GESPEICHERTE SÄTZE
========================================= */

function showSaved(){

  savedBox.innerHTML = "";

  var saved =
    getSaved();

  if(saved.length === 0){

    savedBox.innerHTML =
      "<p>Noch keine Sätze gespeichert.</p>";

    return;
  }

  for(var i = 0; i < saved.length; i++){

    createSavedItem(
      saved[i],
      i
    );

  }
}


function createSavedItem(sentence,index){

  var speak =
    document.createElement("button");

  speak.type =
    "button";

  speak.className =
    "saved";

  speak.textContent =
    "🔊 " + sentence;

  speak.setAttribute(
    "aria-label",
    sentence + " sprechen"
  );

  speak.addEventListener(
  "click",
  function(){

    speakText(sentence);

  });


  var actions =
    document.createElement("div");

  actions.className =
    "savedActions";


  var edit =
    document.createElement("button");

  edit.type =
    "button";

  edit.className =
    "edit";

  edit.textContent =
    "✏️ Bearbeiten";

  edit.addEventListener(
  "click",
  function(){

    textInput.value =
      sentence;

    var section =
      document.getElementById(
        "textSection"
      );

    section.open =
      true;

    setTimeout(function(){

      textInput.focus();

    },200);

  });


  var remove =
    document.createElement("button");

  remove.type =
    "button";

  remove.className =
    "delete";

  remove.textContent =
    "🗑 Löschen";

  remove.addEventListener(
  "click",
  function(){

    var saved =
      getSaved();

    saved.splice(index,1);

    saveSaved(saved);

    savedStatus.textContent =
      "Satz gelöscht.";

    showSaved();

  });


  actions.appendChild(edit);
  actions.appendChild(remove);

  savedBox.appendChild(speak);
  savedBox.appendChild(actions);
}


showSaved();

});
</script>
