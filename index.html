<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tonguebox</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f2f5f8;
    margin: 0;
    padding: 10px;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 38px;
}

h2 {
    font-size: 26px;
}

.box {
    background: white;
    padding: 15px;
    margin-bottom: 18px;
    border-radius: 18px;
}


/* TEXTFELD */

#text {
    width: 100%;
    min-height: 250px;
    font-size: 30px;
    padding: 15px;
    border: 4px solid #333;
    border-radius: 18px;
    box-sizing: border-box;
}


/* BUTTONS */

button {
    cursor: pointer;
    min-height: 100px;
    font-size: 23px;
    font-weight: bold;
    border-radius: 18px;
    padding: 12px;
}


/* FOKUS */

button:focus,
textarea:focus,
select:focus {
    outline: 6px solid orange;
}


/* HAUPTBUTTONS */

.main-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 15px;
}

.speak {
    background: #1565c0;
    color: white;
    border: none;
}

.clear {
    background: #555;
    color: white;
    border: none;
}

.save {
    background: #2e7d32;
    color: white;
    border: none;
}

.stop {
    background: #c62828;
    color: white;
    border: none;
}


/* WORTVORHERSAGE */

.word-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
}

.word-button {
    background: #e8f5e9;
    border: 4px solid #2e7d32;
}


/* SATZVORSCHLÄGE */

.sentence-list {
    display: grid;
    gap: 12px;
}

.sentence-button {
    width: 100%;
    text-align: left;
    background: #ede7f6;
    border: 4px solid #673ab7;
}


/* JA NEIN */

.yes-no {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.yes {
    background: green;
    color: white;
    border: none;
    font-size: 38px;
    min-height: 140px;
}

.no {
    background: red;
    color: white;
    border: none;
    font-size: 38px;
    min-height: 140px;
}


/* SCHNELLKOMMUNIKATION */

.quick-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.quick {
    background: #e3f2fd;
    border: 4px solid #1976d2;
}


/* STIMME */

select {
    width: 100%;
    min-height: 70px;
    font-size: 22px;
    padding: 10px;
}


/* GESPEICHERTE TEXTE */

.saved-text {
    background: #f5f5f5;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 15px;
}

.saved-speak {
    width: 100%;
    background: #512da8;
    color: white;
    border: none;
}

.saved-delete {
    width: 100%;
    min-height: 70px;
    margin-top: 6px;
    background: #c62828;
    color: white;
    border: none;
}


/* STATUS */

#status {
    font-size: 20px;
    font-weight: bold;
    margin-top: 12px;
}


/* IPHONE */

@media (max-width: 600px) {

    #text {
        min-height: 280px;
        font-size: 28px;
    }

    button {
        min-height: 110px;
        font-size: 21px;
    }

}

</style>
</head>


<body>

<div class="container">

<h1>👅 Tonguebox</h1>

<p style="text-align:center;font-size:22px;">
Sprich mit deinen Augen
</p>


<!-- TEXTEINGABE -->

<div class="box">

<h2>💬 Text schreiben</h2>

<textarea
id="text"
placeholder="Hier schreiben..."
></textarea>


<h2>🧠 Wortvorhersage</h2>

<div
id="wordButtons"
class="word-buttons">
</div>


<div class="main-buttons">

<button
class="speak"
onclick="speakInput()">
🔊 Vorlesen
</button>

<button
class="save"
onclick="saveText()">
⭐ Speichern
</button>

<button
class="clear"
onclick="clearText()">
🗑 Leeren
</button>

<button
class="stop"
onclick="stopSpeech()">
⏹ Stopp
</button>

</div>

<div id="status"></div>

</div>


<!-- SATZVORSCHLÄGE -->

<div class="box">

<h2>✨ Satzvorschläge</h2>

<div
id="sentenceSuggestions"
class="sentence-list">
</div>

</div>


<!-- JA / NEIN -->

<div class="box">

<h2>⚡ Sofort antworten</h2>

<div class="yes-no">

<button
class="yes"
onclick="speak('Ja')">
✅ JA
</button>

<button
class="no"
onclick="speak('Nein')">
❌ NEIN
</button>

</div>

</div>


<!-- SCHNELLAKTIONEN -->

<div class="box">

<h2>⚡ Schnell sagen</h2>

<div class="quick-grid">

<button
class="quick"
onclick="speak('Hallo')">
👋 Hallo
</button>

<button
class="quick"
onclick="speak('Danke')">
🙏 Danke
</button>

<button
class="quick"
onclick="speak('Bitte warten Sie kurz.')">
⏳ Bitte warten
</button>

<button
class="quick"
onclick="speak('Bitte sagen Sie das noch einmal.')">
🔁 Noch einmal
</button>

<button
class="quick"
onclick="speak('Bitte sprechen Sie langsamer.')">
🐢 Langsamer
</button>

<button
class="quick"
onclick="speak('Ich habe Sie nicht verstanden.')">
❓ Nicht verstanden
</button>

<button
class="quick"
onclick="speak('Ich möchte etwas trinken.')">
🥤 Trinken
</button>

<button
class="quick"
onclick="speak('Ich möchte etwas essen.')">
🍽 Essen
</button>

<button
class="quick"
onclick="speak('Ich muss auf die Toilette.')">
🚻 WC
</button>

<button
class="quick"
onclick="speak('Ich brauche Hilfe.')">
🆘 Hilfe
</button>

<button
class="quick"
onclick="speak('Bitte geben Sie mir etwas Zeit zum Antworten.')">
⏱ Zeit
</button>

<button
class="quick"
onclick="speak('Ich kommuniziere mit einer Augensteuerung.')">
👁 Augensteuerung
</button>

</div>

</div>


<!-- STIMME -->

<div class="box">

<h2>🗣 Stimme</h2>

<select id="voiceSelect"></select>

</div>


<!-- GESPEICHERTE SÄTZE -->

<div class="box">

<h2>⭐ Gespeicherte Sätze</h2>

<div id="savedTexts"></div>

</div>

</div>


<script>

/* ================================================
   HTML ELEMENTE
================================================ */

var textField =
    document.getElementById("text");

var voiceSelect =
    document.getElementById("voiceSelect");

var wordButtons =
    document.getElementById("wordButtons");

var sentenceSuggestions =
    document.getElementById("sentenceSuggestions");

var savedTexts =
    document.getElementById("savedTexts");

var statusBox =
    document.getElementById("status");

var voices = [];


/* ================================================
   STIMMEN
================================================ */

function loadVoices() {

    voices =
        window.speechSynthesis.getVoices();

    voiceSelect.innerHTML = "";


    for (
        var i = 0;
        i < voices.length;
        i++
    ) {

        var option =
            document.createElement("option");

        option.value = i;

        option.textContent =
            voices[i].name +
            " - " +
            voices[i].lang;

        voiceSelect.appendChild(option);

    }


    var savedVoice =
        localStorage.getItem(
            "tongueboxVoice"
        );


    if (
        savedVoice !== null &&
        voices[savedVoice]
    ) {

        voiceSelect.value =
            savedVoice;

    }

}


window.speechSynthesis.onvoiceschanged =
    loadVoices;


loadVoices();


voiceSelect.onchange =
function() {

    localStorage.setItem(
        "tongueboxVoice",
        voiceSelect.value
    );

};


/* ================================================
   SPRECHEN
================================================ */

function speak(text) {

    if (!text) {
        return;
    }


    window.speechSynthesis.cancel();


    var speech =
        new SpeechSynthesisUtterance(
            text
        );


    var selectedVoice =
        voices[
            voiceSelect.value
        ];


    if (selectedVoice) {

        speech.voice =
            selectedVoice;

        speech.lang =
            selectedVoice.lang;

    }


    speech.rate = 0.95;

    speech.volume = 1;


    speech.onstart =
    function() {

        statusBox.textContent =
            "🔊 Tonguebox spricht";

    };


    speech.onend =
    function() {

        statusBox.textContent = "";

    };


    window.speechSynthesis.speak(
        speech
    );

}


/* ================================================
   TEXT VORLESEN
================================================ */

function speakInput() {

    var text =
        textField.value.trim();


    if (text === "") {

        statusBox.textContent =
            "Bitte zuerst Text schreiben.";

        return;

    }


    speak(text);

}


/* ================================================
   STOPP
================================================ */

function stopSpeech() {

    window.speechSynthesis.cancel();

    statusBox.textContent =
        "Sprachausgabe gestoppt.";

}


/* ================================================
   LEEREN
================================================ */

function clearText() {

    textField.value = "";

    statusBox.textContent = "";

    updateSuggestions();

}


/* ================================================
   WORTVORHERSAGE
================================================ */

var predictions = {

    "ich": [
        "möchte",
        "brauche",
        "habe"
    ],

    "möchte": [
        "bitte",
        "essen",
        "trinken"
    ],

    "brauche": [
        "Hilfe",
        "Zeit",
        "Wasser"
    ],

    "habe": [
        "Hunger",
        "Durst",
        "Schmerzen"
    ],

    "bitte": [
        "helfen",
        "warten",
        "noch einmal"
    ],

    "essen": [
        "bitte",
        "jetzt",
        "helfen"
    ],

    "trinken": [
        "Wasser",
        "Kaffee",
        "bitte"
    ],

    "kaffee": [
        "Milch",
        "Zucker",
        "bitte"
    ],

    "wasser": [
        "bitte",
        "kalt",
        "trinken"
    ],

    "hilfe": [
        "bitte",
        "jetzt",
        "brauche"
    ],

    "schmerzen": [
        "Kopf",
        "Bauch",
        "Rücken"
    ],

    "toilette": [
        "bitte",
        "jetzt",
        "helfen"
    ]

};


/* ================================================
   TEXT ÄNDERT SICH
================================================ */

textField.oninput =
function() {

    updateSuggestions();

};


/* ================================================
   LETZTES WORT
================================================ */

function getLastWord() {

    var text =
        textField.value
        .trim()
        .toLowerCase();


    if (text === "") {

        return "";

    }


    var words =
        text.split(/\s+/);


    var lastWord =
        words[
            words.length - 1
        ];


    lastWord =
        lastWord.replace(
            /[.,!?]/g,
            ""
        );


    return lastWord;

}


/* ================================================
   VORSCHLÄGE AKTUALISIEREN
================================================ */

function updateSuggestions() {

    var lastWord =
        getLastWord();


    var words;


    if (
        predictions[
            lastWord
        ]
    ) {

        words =
            predictions[
                lastWord
            ];

    }

    else {

        words = [
            "Ich",
            "Bitte",
            "Danke"
        ];

    }


    showWordButtons(
        words
    );


    createSentenceSuggestions();

}


/* ================================================
   WORTBUTTONS
================================================ */

function showWordButtons(words) {

    wordButtons.innerHTML = "";


    for (
        var i = 0;
        i < words.length;
        i++
    ) {

        var button =
            document.createElement(
                "button"
            );


        button.className =
            "word-button";


        button.textContent =
            words[i];


        button.setAttribute(
            "data-word",
            words[i]
        );


        button.onclick =
        function() {

            addWord(
                this.getAttribute(
                    "data-word"
                )
            );

        };


        wordButtons.appendChild(
            button
        );

    }

}


/* ================================================
   WORT EINFÜGEN
================================================ */

function addWord(word) {

    var currentText =
        textField.value;


    if (
        currentText !== "" &&
        currentText.slice(-1) !== " "
    ) {

        currentText += " ";

    }


    textField.value =
        currentText +
        word +
        " ";


    updateSuggestions();

}


/* ================================================
   SATZVORSCHLÄGE
================================================ */

function createSentenceSuggestions() {

    var text =
        textField.value.trim();


    sentenceSuggestions.innerHTML =
        "";


    if (text === "") {

        showSentence(
            "Ich möchte etwas sagen."
        );

        showSentence(
            "Bitte warten Sie kurz."
        );

        showSentence(
            "Ich brauche Hilfe."
        );

        return;

    }


    var lower =
        text.toLowerCase();


    if (
        lower.indexOf(
            "kaffee"
        ) !== -1
    ) {

        showSentence(
            "Ich möchte bitte einen Kaffee."
        );

        showSentence(
            "Ich hätte gerne einen Kaffee mit Milch."
        );

        showSentence(
            "Könnten Sie mir bitte einen Kaffee bringen?"
        );

    }


    else if (
        lower.indexOf(
            "wasser"
        ) !== -1
        ||
        lower.indexOf(
            "trinken"
        ) !== -1
    ) {

        showSentence(
            "Ich möchte bitte etwas trinken."
        );

        showSentence(
            "Ich hätte gerne Wasser."
        );

        showSentence(
            "Könnten Sie mir bitte etwas zu trinken geben?"
        );

    }


    else if (
        lower.indexOf(
            "essen"
        ) !== -1
        ||
        lower.indexOf(
            "hunger"
        ) !== -1
    ) {

        showSentence(
            "Ich möchte bitte etwas essen."
        );

        showSentence(
            "Ich habe Hunger."
        );

        showSentence(
            "Bitte helfen Sie mir beim Essen."
        );

    }


    else if (
        lower.indexOf(
            "hilfe"
        ) !== -1
    ) {

        showSentence(
            "Ich brauche bitte Hilfe."
        );

        showSentence(
            "Könnten Sie mir bitte helfen?"
        );

        showSentence(
            "Bitte helfen Sie mir kurz."
        );

    }


    else if (
        lower.indexOf(
            "schmerz"
        ) !== -1
    ) {

        showSentence(
            "Ich habe Schmerzen."
        );

        showSentence(
            "Bitte helfen Sie mir, ich habe Schmerzen."
        );

        showSentence(
            "Ich brauche wegen meiner Schmerzen Hilfe."
        );

    }


    else if (
        lower.indexOf(
            "toilette"
        ) !== -1
        ||
        lower.indexOf(
            "wc"
        ) !== -1
    ) {

        showSentence(
            "Ich muss bitte auf die Toilette."
        );

        showSentence(
            "Bitte helfen Sie mir auf die Toilette."
        );

        showSentence(
            "Ich brauche Hilfe beim Toilettengang."
        );

    }


    else {

        showSentence(
            makeSentence(
                text
            )
        );

        showSentence(
            "Bitte " +
            text
        );

        showSentence(
            "Ich möchte sagen: " +
            text
        );

    }

}


/* ================================================
   SATZBUTTON ERSTELLEN
================================================ */

function showSentence(sentence) {

    var button =
        document.createElement(
            "button"
        );


    button.className =
        "sentence-button";


    button.textContent =
        sentence;


    button.onclick =
    function() {

        textField.value =
            sentence;


        speak(
            sentence
        );


        updateSuggestions();

    };


    sentenceSuggestions.appendChild(
        button
    );

}


/* ================================================
   SATZ FORMATIEREN
================================================ */

function makeSentence(text) {

    if (!text) {

        return "";

    }


    var sentence =
        text.charAt(0)
        .toUpperCase()
        +
        text.slice(1);


    var last =
        sentence.slice(-1);


    if (
        last !== "." &&
        last !== "!" &&
        last !== "?"
    ) {

        sentence += ".";

    }


    return sentence;

}


/* ================================================
   SPEICHERN
================================================ */

function saveText() {

    var text =
        textField.value.trim();


    if (text === "") {

        statusBox.textContent =
            "Bitte zuerst Text schreiben.";

        return;

    }


    var saved =
        getSaved();


    if (
        saved.indexOf(
            text
        ) === -1
    ) {

        saved.push(
            text
        );

    }


    localStorage.setItem(
        "tongueboxSaved",
        JSON.stringify(
            saved
        )
    );


    displaySaved();


    statusBox.textContent =
        "⭐ Satz gespeichert.";

}


/* ================================================
   SPEICHER LESEN
================================================ */

function getSaved() {

    var data =
        localStorage.getItem(
            "tongueboxSaved"
        );


    if (!data) {

        return [];

    }


    try {

        return JSON.parse(
            data
        );

    }

    catch(error) {

        return [];

    }

}


/* ================================================
   GESPEICHERTE ANZEIGEN
================================================ */

function displaySaved() {

    var saved =
        getSaved();


    savedTexts.innerHTML = "";


    if (
        saved.length === 0
    ) {

        savedTexts.innerHTML =
            "<p>Noch keine Sätze gespeichert.</p>";

        return;

    }


    for (
        var i = 0;
        i < saved.length;
        i++
    ) {

        createSavedElement(
            saved[i],
            i
        );

    }

}


/* ================================================
   GESPEICHERTEN BUTTON ERSTELLEN
================================================ */

function createSavedElement(
    text,
    index
) {

    var container =
        document.createElement(
            "div"
        );


    container.className =
        "saved-text";


    var speakButton =
        document.createElement(
            "button"
        );


    speakButton.className =
        "saved-speak";


    speakButton.textContent =
        "🔊 " + text;


    speakButton.onclick =
    function() {

        speak(text);

    };


    var deleteButton =
        document.createElement(
            "button"
        );


    deleteButton.className =
        "saved-delete";


    deleteButton.textContent =
        "🗑 Löschen";


    deleteButton.onclick =
    function() {

        deleteSaved(
            index
        );

    };


    container.appendChild(
        speakButton
    );


    container.appendChild(
        deleteButton
    );


    savedTexts.appendChild(
        container
    );

}


/* ================================================
   GESPEICHERTEN LÖSCHEN
================================================ */

function deleteSaved(index) {

    var saved =
        getSaved();


    saved.splice(
        index,
        1
    );


    localStorage.setItem(
        "tongueboxSaved",
        JSON.stringify(
            saved
        )
    );


    displaySaved();

}


/* ================================================
   START
================================================ */

updateSuggestions();

displaySaved();

</script>

</body>
</html>
