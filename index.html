<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Tonguebox</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:6px;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef2f6;
  color:#111;
}

.app{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:30px;
  margin:8px 0 12px;
}

button,
textarea,
select,
summary{
  font-family:inherit;
}

button{
  width:100%;
  min-height:95px;
  border:none;
  border-radius:18px;
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
}

button:focus,
textarea:focus,
select:focus,
summary:focus{
  outline:6px solid orange;
  outline-offset:3px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}


/* JA / NEIN */

.yes{
  background:#2e7d32;
  color:white;
  min-height:130px;
  font-size:36px;
}

.no{
  background:#c62828;
  color:white;
  min-height:130px;
  font-size:36px;
}


/* TEXTEINGABE */

textarea{
  width:100%;
  min-height:220px;
  padding:15px;
  font-size:26px;
  line-height:1.4;
  border:4px solid #222;
  border-radius:18px;
  resize:none;
}

.speak{
  background:#1565c0;
  color:white;
}

.clear{
  background:#555;
  color:white;
}

.save{
  background:#2e7d32;
  color:white;
}

.stop{
  background:#c62828;
  color:white;
}


/* SCHNELLBUTTONS */

.quick{
  background:#e3f2fd;
  border:3px solid #1976d2;
}

.emergency{
  background:#b71c1c;
  color:white;
}


/* ASSISTENT */

.assistant{
  background:#fff3cd;
  border:3px solid #f9a825;
}

.suggestion{
  background:#ede7f6;
  border:3px solid #673ab7;
  text-align:left;
  margin-bottom:8px;
}


/* LAUTSTÄRKE */

.volume{
  background:#e8f5e9;
  border:3px solid #2e7d32;
}

#volumeDisplay{
  text-align:center;
  font-size:24px;
  font-weight:bold;
  margin-bottom:10px;
}


/* STIMME */

select{
  width:100%;
  min-height:75px;
  padding:10px;
  font-size:20px;
  border:3px solid #444;
  border-radius:16px;
  background:white;
}


/* STATUS */

#status{
  min-height:25px;
  margin-top:8px;
  font-size:18px;
  font-weight:bold;
}


/* AUFKLAPPBARE BEREICHE */

details{
  background:white;
  margin-bottom:10px;
  border-radius:18px;
  overflow:hidden;
}

summary{
  list-style:none;
  cursor:pointer;
  min-height:95px;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:22px;
  font-weight:bold;
  background:#dfe7f1;
}

summary::-webkit-details-marker{
  display:none;
}

summary::after{
  content:"▼";
  font-size:22px;
}

details[open] summary::after{
  content:"▲";
}

.content{
  padding:10px;
}


/* GESPEICHERT */

.saved{
  background:#512da8;
  color:white;
  text-align:left;
  margin-bottom:7px;
}

.delete{
  background:#c62828;
  color:white;
  min-height:65px;
  margin-bottom:12px;
}


/* IPHONE */

@media(max-width:500px){

  h1{
    font-size:27px;
  }

  button{
    min-height:98px;
    font-size:20px;
  }

  .yes,
  .no{
    min-height:135px;
    font-size:34px;
  }

  textarea{
    min-height:230px;
    font-size:25px;
  }

  summary{
    min-height:100px;
    font-size:21px;
  }

}

</style>
</head>

<body>

<main class="app">

<h1>👅 Tonguebox</h1>


<!-- JA / NEIN IMMER SICHTBAR -->

<div class="grid2" style="margin-bottom:10px;">

<button
  class="yes speakPhrase"
  data-text="Ja"
  type="button"
>
✅ JA
</button>

<button
  class="no speakPhrase"
  data-text="Nein"
  type="button"
>
❌ NEIN
</button>

</div>


<!-- TEXTEINGABE EIN- UND AUSKLAPPBAR -->

<details open>

<summary>
⌨️ Text schreiben
</summary>

<div class="content">

<textarea
  id="textInput"
  placeholder="Was möchtest du sagen?"
  aria-label="Text eingeben"
></textarea>

<div class="grid2" style="margin-top:9px;">

<button
  id="speakButton"
  class="speak"
  type="button"
>
🔊 Sprechen
</button>

<button
  id="clearButton"
  class="clear"
  type="button"
>
🗑 Leeren
</button>

<button
  id="saveButton"
  class="save"
  type="button"
>
⭐ Speichern
</button>

<button
  id="stopButton"
  class="stop"
  type="button"
>
⏹ Stopp
</button>

</div>

<div id="status"></div>

</div>

</details>


<!-- VORSCHLÄGE -->

<details>

<summary>
✨ Vorschläge
</summary>

<div class="content">

<button
  id="suggestionButton"
  class="assistant"
  type="button"
  style="margin-bottom:9px;"
>
✨ Vorschläge erstellen
</button>

<div id="suggestionBox"></div>

</div>

</details>


<!-- TEXT ASSISTENT -->

<details>

<summary>
🧠 Text-Assistent
</summary>

<div class="content">

<div class="grid2">

<button
  id="completeButton"
  class="assistant"
  type="button"
>
✍️ Vervollständigen
</button>

<button
  id="friendlyButton"
  class="assistant"
  type="button"
>
🙂 Freundlicher
</button>

<button
  id="shortButton"
  class="assistant"
  type="button"
>
⚡ Kürzer
</button>

<button
  id="questionButton"
  class="assistant"
  type="button"
>
❓ Als Frage
</button>

</div>

</div>

</details>


<!-- SCHNELLKOMMUNIKATION -->

<details>

<summary>
⚡ Schnellkommunikation
</summary>

<div class="content">

<div class="grid2">

<button class="quick speakPhrase" data-text="Hallo">
👋 Hallo
</button>

<button class="quick speakPhrase" data-text="Danke">
🙏 Danke
</button>

<button
  class="quick speakPhrase"
  data-text="Bitte warten Sie kurz."
>
⏳ Warten
</button>

<button
  class="quick speakPhrase"
  data-text="Bitte sagen Sie das noch einmal."
>
🔁 Nochmal
</button>

<button
  class="quick speakPhrase"
  data-text="Ich brauche Hilfe."
>
🆘 Hilfe
</button>

<button
  class="quick speakPhrase"
  data-text="Ich möchte etwas trinken."
>
🥤 Trinken
</button>

<button
  class="quick speakPhrase"
  data-text="Ich möchte etwas essen."
>
🍽 Essen
</button>

<button
  class="quick speakPhrase"
  data-text="Ich muss auf die Toilette."
>
🚻 WC
</button>

<button
  class="quick speakPhrase"
  data-text="Ich habe Sie nicht verstanden."
>
❓ Nicht verstanden
</button>

<button
  class="quick speakPhrase"
  data-text="Bitte geben Sie mir etwas Zeit zum Antworten."
>
⏳ Mehr Zeit
</button>

<button
  class="quick speakPhrase"
  data-text="Ich kommuniziere mit einer Augensteuerung."
>
👁 Augensteuerung
</button>

<button
  class="emergency speakPhrase"
  data-text="Das ist ein Notfall. Bitte holen Sie sofort Hilfe."
>
🚨 NOTFALL
</button>

</div>

</div>

</details>


<!-- LAUTSTÄRKE & STIMME -->

<details>

<summary>
🔊 Stimme & Lautstärke
</summary>

<div class="content">

<div id="volumeDisplay">
Lautstärke: 100 %
</div>

<div class="grid2">

<button
  id="volumeDown"
  class="volume"
  type="button"
>
🔉 Leiser
</button>

<button
  id="volumeUp"
  class="volume"
  type="button"
>
🔊 Lauter
</button>

</div>

<br>

<select
  id="voiceSelect"
  aria-label="Stimme auswählen"
>
<option>Stimmen werden geladen...</option>
</select>

</div>

</details>


<!-- GESPEICHERTE SÄTZE -->

<details>

<summary>
⭐ Gespeicherte Sätze
</summary>

<div class="content">

<div id="savedBox"></div>

</div>

</details>


</main>


<script>

document.addEventListener("DOMContentLoaded", function(){

var textInput =
  document.getElementById("textInput");

var statusBox =
  document.getElementById("status");

var voiceSelect =
  document.getElementById("voiceSelect");

var suggestionBox =
  document.getElementById("suggestionBox");

var savedBox =
  document.getElementById("savedBox");

var volumeDisplay =
  document.getElementById("volumeDisplay");

var voices = [];


/* LAUTSTÄRKE */

var volume =
  parseFloat(
    localStorage.getItem("tongueboxVolume")
  );

if(isNaN(volume)){
  volume = 1;
}

function showVolume(){

  volumeDisplay.textContent =
    "Lautstärke: " +
    Math.round(volume * 100) +
    " %";

}

document.getElementById("volumeUp").onclick =
function(){

  volume += 0.1;

  if(volume > 1){
    volume = 1;
  }

  volume =
    Math.round(volume * 10) / 10;

  localStorage.setItem(
    "tongueboxVolume",
    volume
  );

  showVolume();

};

document.getElementById("volumeDown").onclick =
function(){

  volume -= 0.1;

  if(volume < 0){
    volume = 0;
  }

  volume =
    Math.round(volume * 10) / 10;

  localStorage.setItem(
    "tongueboxVolume",
    volume
  );

  showVolume();

};

showVolume();


/* STIMMEN */

function loadVoices(){

  voices =
    window.speechSynthesis.getVoices();

  voiceSelect.innerHTML = "";

  var savedVoice =
    localStorage.getItem("tongueboxVoice");

  if(voices.length === 0){

    var option =
      document.createElement("option");

    option.textContent =
      "Stimmen werden geladen...";

    voiceSelect.appendChild(option);

    return;
  }

  for(var i = 0; i < voices.length; i++){

    var option =
      document.createElement("option");

    option.value = i;

    option.textContent =
      voices[i].name +
      " – " +
      voices[i].lang;

    if(savedVoice === voices[i].name){
      option.selected = true;
    }

    voiceSelect.appendChild(option);

  }

}

loadVoices();

if("speechSynthesis" in window){

  window.speechSynthesis.onvoiceschanged =
    loadVoices;

}

voiceSelect.onchange =
function(){

  var voice =
    voices[
      parseInt(
        voiceSelect.value,
        10
      )
    ];

  if(voice){

    localStorage.setItem(
      "tongueboxVoice",
      voice.name
    );

  }

};


/* SPRECHEN */

function speakText(message){

  if(!message){
    return;
  }

  window.speechSynthesis.cancel();

  var speech =
    new SpeechSynthesisUtterance(message);

  var index =
    parseInt(
      voiceSelect.value,
      10
    );

  if(voices[index]){

    speech.voice =
      voices[index];

    speech.lang =
      voices[index].lang;

  }
  else{

    speech.lang = "de-DE";

  }

  speech.rate = 0.95;

  speech.volume = volume;

  speech.onstart =
  function(){

    statusBox.textContent =
      "🔊 Tonguebox spricht...";

  };

  speech.onend =
  function(){

    statusBox.textContent = "";

  };

  window.speechSynthesis.speak(speech);

}


/* SPRECHEN BUTTON */

document.getElementById("speakButton").onclick =
function(){

  var value =
    textInput.value.trim();

  if(!value){

    statusBox.textContent =
      "Bitte Text eingeben.";

    return;
  }

  speakText(value);

};


/* STOPP */

document.getElementById("stopButton").onclick =
function(){

  window.speechSynthesis.cancel();

  statusBox.textContent =
    "⏹ Gestoppt";

};


/* LEEREN */

document.getElementById("clearButton").onclick =
function(){

  textInput.value = "";

  suggestionBox.innerHTML = "";

  statusBox.textContent = "";

};


/* SCHNELLBUTTONS */

var phraseButtons =
  document.querySelectorAll(".speakPhrase");

for(var i = 0; i < phraseButtons.length; i++){

  phraseButtons[i].onclick =
  function(){

    speakText(
      this.getAttribute("data-text")
    );

  };

}


/* VORSCHLÄGE */

document.getElementById("suggestionButton").onclick =
function(){

  var value =
    textInput.value.trim();

  var lower =
    value.toLowerCase();

  var suggestions = [];

  if(!value){

    suggestions = [
      "Ich möchte etwas sagen.",
      "Bitte warten Sie kurz.",
      "Ich brauche Hilfe."
    ];

  }

  else if(
    lower.indexOf("kaffee") !== -1
  ){

    suggestions = [
      "Ich möchte bitte einen Kaffee.",
      "Ich hätte gerne einen Kaffee mit Milch.",
      "Bitte bringen Sie mir einen Kaffee."
    ];

  }

  else if(
    lower.indexOf("trinken") !== -1 ||
    lower.indexOf("wasser") !== -1
  ){

    suggestions = [
      "Ich möchte bitte etwas trinken.",
      "Ich hätte gerne Wasser.",
      "Bitte helfen Sie mir beim Trinken."
    ];

  }

  else if(
    lower.indexOf("essen") !== -1 ||
    lower.indexOf("hunger") !== -1
  ){

    suggestions = [
      "Ich möchte bitte etwas essen.",
      "Ich habe Hunger.",
      "Bitte helfen Sie mir beim Essen."
    ];

  }

  else if(
    lower.indexOf("hilfe") !== -1
  ){

    suggestions = [
      "Ich brauche Hilfe.",
      "Könnten Sie mir bitte helfen?",
      "Bitte holen Sie jemanden."
    ];

  }

  else{

    suggestions = [
      cleanSentence(value),
      friendlyText(value),
      questionText(value)
    ];

  }

  showSuggestions(suggestions);

};


/* VORSCHLÄGE ANZEIGEN */

function showSuggestions(list){

  suggestionBox.innerHTML = "";

  for(var i = 0; i < list.length; i++){

    var button =
      document.createElement("button");

    button.className =
      "suggestion";

    button.type =
      "button";

    button.textContent =
      "✨ " + list[i];

    button.setAttribute(
      "data-text",
      list[i]
    );

    button.onclick =
    function(){

      var sentence =
        this.getAttribute("data-text");

      textInput.value =
        sentence;

      speakText(sentence);

    };

    suggestionBox.appendChild(button);

  }

}


/* TEXT VERVOLLSTÄNDIGEN */

document.getElementById("completeButton").onclick =
function(){

  var value =
    textInput.value.trim();

  var lower =
    value.toLowerCase();

  if(!value){
    return;
  }

  if(lower.indexOf("kaffee") !== -1){

    textInput.value =
      "Ich möchte bitte einen Kaffee.";

  }

  else if(lower.indexOf("trinken") !== -1){

    textInput.value =
      "Ich möchte bitte etwas trinken.";

  }

  else if(lower.indexOf("essen") !== -1){

    textInput.value =
      "Ich möchte bitte etwas essen.";

  }

  else if(lower.indexOf("hilfe") !== -1){

    textInput.value =
      "Ich brauche bitte Hilfe.";

  }

  else{

    textInput.value =
      cleanSentence(value);

  }

};


/* FREUNDLICHER */

document.getElementById("friendlyButton").onclick =
function(){

  var value =
    textInput.value.trim();

  if(!value){
    return;
  }

  textInput.value =
    friendlyText(value);

};


/* KÜRZER */

document.getElementById("shortButton").onclick =
function(){

  var value =
    textInput.value.trim();

  value =
    value.replace(
      /ich hätte gerne/gi,
      "Ich möchte"
    );

  value =
    value.replace(
      /ich würde gerne/gi,
      "Ich möchte"
    );

  value =
    value.replace(
      /könnten sie mir bitte/gi,
      "Bitte"
    );

  textInput.value =
    cleanSentence(value);

};


/* FRAGE */

document.getElementById("questionButton").onclick =
function(){

  var value =
    textInput.value.trim();

  if(!value){
    return;
  }

  textInput.value =
    questionText(value);

};


/* HILFSFUNKTIONEN */

function cleanSentence(value){

  value =
    value.trim();

  if(!value){
    return "";
  }

  value =
    value.charAt(0).toUpperCase() +
    value.slice(1);

  if(!/[.!?]$/.test(value)){
    value += ".";
  }

  return value;

}

function friendlyText(value){

  value =
    value.replace(/[.!?]+$/,"");

  if(
    value.toLowerCase()
      .indexOf("bitte") === -1
  ){

    value =
      "Bitte " +
      value.charAt(0).toLowerCase() +
      value.slice(1);

  }

  return cleanSentence(value);

}

function questionText(value){

  var lower =
    value.toLowerCase();

  if(lower.indexOf("kaffee") !== -1){

    return "Könnten Sie mir bitte einen Kaffee bringen?";

  }

  if(lower.indexOf("hilfe") !== -1){

    return "Könnten Sie mir bitte helfen?";

  }

  if(lower.indexOf("trinken") !== -1){

    return "Könnten Sie mir bitte etwas zu trinken geben?";

  }

  return (
    "Könnten Sie bitte " +
    value.replace(/[.!?]+$/,"") +
    "?"
  );

}


/* SPEICHERN */

function getSaved(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "tongueboxSaved"
      ) || "[]"
    );

  }
  catch(error){

    return [];

  }

}

document.getElementById("saveButton").onclick =
function(){

  var value =
    textInput.value.trim();

  if(!value){
    return;
  }

  var saved =
    getSaved();

  if(saved.indexOf(value) === -1){

    saved.push(value);

    localStorage.setItem(
      "tongueboxSaved",
      JSON.stringify(saved)
    );

  }

  showSaved();

  statusBox.textContent =
    "⭐ Gespeichert";

};


/* GESPEICHERTE SÄTZE */

function showSaved(){

  savedBox.innerHTML = "";

  var saved =
    getSaved();

  if(saved.length === 0){

    savedBox.innerHTML =
      "<p>Noch keine Sätze gespeichert.</p>";

    return;

  }

  for(var i = 0; i < saved.length; i++){

    createSavedButton(
      saved[i],
      i
    );

  }

}

function createSavedButton(sentence,index){

  var speak =
    document.createElement("button");

  speak.className =
    "saved";

  speak.type =
    "button";

  speak.textContent =
    "🔊 " + sentence;

  speak.onclick =
  function(){

    speakText(sentence);

  };

  var remove =
    document.createElement("button");

  remove.className =
    "delete";

  remove.type =
    "button";

  remove.textContent =
    "🗑 Löschen";

  remove.onclick =
  function(){

    var saved =
      getSaved();

    saved.splice(index,1);

    localStorage.setItem(
      "tongueboxSaved",
      JSON.stringify(saved)
    );

    showSaved();

  };

  savedBox.appendChild(speak);

  savedBox.appendChild(remove);

}

showSaved();

});
</script>

</body>
</html>
