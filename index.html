<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Tonguebox</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:6px;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef2f6;
  color:#111;
}

.app{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:30px;
  margin:10px 0 14px;
}

button,
textarea,
select,
summary{
  font-family:inherit;
}

button{
  width:100%;
  min-height:95px;
  padding:10px;
  border:none;
  border-radius:18px;
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
}

button:focus,
textarea:focus,
select:focus,
summary:focus{
  outline:6px solid orange;
  outline-offset:3px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

/* JA / NEIN */

.yes{
  background:#2e7d32;
  color:white;
  min-height:135px;
  font-size:38px;
}

.no{
  background:#c62828;
  color:white;
  min-height:135px;
  font-size:38px;
}

/* AUFKLAPPBARE BEREICHE */

details{
  background:white;
  margin-bottom:10px;
  border-radius:18px;
  overflow:hidden;
  scroll-margin-top:20px;
  scroll-margin-bottom:20px;
}

summary{
  list-style:none;
  cursor:pointer;
  min-height:100px;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#dfe7f1;
  font-size:22px;
  font-weight:bold;
}

summary::-webkit-details-marker{
  display:none;
}

summary::after{
  content:"▼";
  font-size:24px;
}

details[open] summary::after{
  content:"▲";
}

.content{
  padding:10px;
}

/* TEXTEINGABE */

textarea{
  width:100%;
  min-height:230px;
  padding:16px;
  border:4px solid #222;
  border-radius:18px;
  font-size:27px;
  line-height:1.4;
  resize:none;
}

.speak{
  background:#1565c0;
  color:white;
}

.save{
  background:#2e7d32;
  color:white;
}

.clear{
  background:#555;
  color:white;
}

.stop{
  background:#c62828;
  color:white;
}

/* SCHNELLKOMMUNIKATION */

.quick{
  background:#e3f2fd;
  border:3px solid #1976d2;
}

.emergency{
  background:#b71c1c;
  color:white;
}

/* TEXTASSISTENT */

.assistant{
  background:#fff3cd;
  border:3px solid #f9a825;
}

.suggestion{
  background:#ede7f6;
  border:3px solid #673ab7;
  text-align:left;
  margin-bottom:8px;
}

/* LAUTSTÄRKE */

.volume{
  background:#e8f5e9;
  border:3px solid #2e7d32;
}

#volumeDisplay{
  text-align:center;
  font-size:24px;
  font-weight:bold;
  margin-bottom:10px;
}

/* STIMME */

select{
  width:100%;
  min-height:75px;
  padding:10px;
  border:3px solid #444;
  border-radius:16px;
  font-size:20px;
  background:white;
}

/* STATUS */

#status{
  min-height:28px;
  margin-top:8px;
  font-size:18px;
  font-weight:bold;
}

/* GESPEICHERTE SÄTZE */

.saved{
  background:#512da8;
  color:white;
  text-align:left;
  margin-bottom:7px;
}

.delete{
  background:#c62828;
  color:white;
  min-height:65px;
  margin-bottom:12px;
}

/* IPHONE */

@media(max-width:500px){

  body{
    padding:5px;
  }

  h1{
    font-size:27px;
  }

  button{
    min-height:98px;
    font-size:20px;
  }

  .yes,
  .no{
    min-height:140px;
    font-size:35px;
  }

  textarea{
    min-height:240px;
    font-size:26px;
  }

  summary{
    min-height:100px;
    font-size:21px;
  }
}
</style>
</head>

<body>

<main class="app">

<h1>👅 Tonguebox</h1>

<!-- JA / NEIN IMMER SICHTBAR -->

<div class="grid2" style="margin-bottom:10px;">

<button
  class="yes speakPhrase"
  data-text="Ja"
  type="button">
✅ JA
</button>

<button
  class="no speakPhrase"
  data-text="Nein"
  type="button">
❌ NEIN
</button>

</div>

<!-- TEXTEINGABE -->

<details>

<summary>
⌨️ Text schreiben
</summary>

<div class="content">

<textarea
  id="textInput"
  placeholder="Was möchtest du sagen?"
  aria-label="Text eingeben"
  spellcheck="true">
</textarea>

<div class="grid2" style="margin-top:9px;">

<button
  id="speakButton"
  class="speak"
  type="button">
🔊 Sprechen
</button>

<button
  id="saveButton"
  class="save"
  type="button">
⭐ Speichern
</button>

<button
  id="clearButton"
  class="clear"
  type="button">
🗑 Leeren
</button>

<button
  id="stopButton"
  class="stop"
  type="button">
⏹ Stopp
</button>

</div>

<div
  id="status"
  role="status"
  aria-live="polite">
</div>

</div>

</details>

<!-- SATZVORSCHLÄGE -->

<details>

<summary>
✨ Satzvorschläge
</summary>

<div class="content">

<button
  id="suggestionButton"
  class="assistant"
  type="button"
  style="margin-bottom:9px;">
✨ Vorschläge erstellen
</button>

<div id="suggestionBox"></div>

</div>

</details>

<!-- TEXTASSISTENT -->

<details>

<summary>
🧠 Text-Assistent
</summary>

<div class="content">

<div class="grid2">

<button
  id="completeButton"
  class="assistant"
  type="button">
✍️ Vervollständigen
</button>

<button
  id="friendlyButton"
  class="assistant"
  type="button">
🙂 Freundlicher
</button>

<button
  id="shortButton"
  class="assistant"
  type="button">
⚡ Kürzer
</button>

<button
  id="questionButton"
  class="assistant"
  type="button">
❓ Als Frage
</button>

</div>

</div>

</details>

<!-- SCHNELLKOMMUNIKATION -->

<details>

<summary>
⚡ Schnellkommunikation
</summary>

<div class="content">

<div class="grid2">

<button class="quick speakPhrase" data-text="Hallo" type="button">
👋 Hallo
</button>

<button class="quick speakPhrase" data-text="Danke" type="button">
🙏 Danke
</button>

<button class="quick speakPhrase" data-text="Bitte warten Sie kurz." type="button">
⏳ Warten
</button>

<button class="quick speakPhrase" data-text="Bitte sagen Sie das noch einmal." type="button">
🔁 Nochmal
</button>

<button class="quick speakPhrase" data-text="Ich brauche Hilfe." type="button">
🆘 Hilfe
</button>

<button class="quick speakPhrase" data-text="Ich möchte etwas trinken." type="button">
🥤 Trinken
</button>

<button class="quick speakPhrase" data-text="Ich möchte etwas essen." type="button">
🍽 Essen
</button>

<button class="quick speakPhrase" data-text="Ich muss auf die Toilette." type="button">
🚻 WC
</button>

<button class="quick speakPhrase" data-text="Ich habe Sie nicht verstanden." type="button">
❓ Nicht verstanden
</button>

<button class="quick speakPhrase" data-text="Bitte sprechen Sie langsamer." type="button">
🐢 Langsamer
</button>

<button class="quick speakPhrase" data-text="Bitte geben Sie mir etwas Zeit zum Antworten." type="button">
⏳ Mehr Zeit
</button>

<button class="quick speakPhrase" data-text="Ich kommuniziere mit einer Augensteuerung." type="button">
👁 Augensteuerung
</button>

<button class="quick speakPhrase" data-text="Ich habe Schmerzen." type="button">
🤕 Schmerzen
</button>

<button class="emergency speakPhrase" data-text="Das ist ein Notfall. Bitte holen Sie sofort Hilfe." type="button">
🚨 NOTFALL
</button>

</div>

</div>

</details>

<!-- STIMME & LAUTSTÄRKE -->

<details>

<summary>
🔊 Stimme & Lautstärke
</summary>

<div class="content">

<div id="volumeDisplay">
Lautstärke: 100 %
</div>

<div class="grid2">

<button
  id="volumeDown"
  class="volume"
  type="button">
🔉 Leiser
</button>

<button
  id="volumeUp"
  class="volume"
  type="button">
🔊 Lauter
</button>

</div>

<br>

<select
  id="voiceSelect"
  aria-label="Stimme auswählen">

<option value="">
Stimmen werden geladen...
</option>

</select>

</div>

</details>

<!-- GESPEICHERTE SÄTZE -->

<details>

<summary>
⭐ Gespeicherte Sätze
</summary>

<div class="content">

<div id="savedBox"></div>

</div>

</details>

</main>

<script>
document.addEventListener("DOMContentLoaded", function(){

var textInput = document.getElementById("textInput");
var statusBox = document.getElementById("status");
var voiceSelect = document.getElementById("voiceSelect");
var suggestionBox = document.getElementById("suggestionBox");
var savedBox = document.getElementById("savedBox");
var volumeDisplay = document.getElementById("volumeDisplay");
var voices = [];


/* =========================================
   AUTOMATISCHE ZENTRIERUNG
   UND NUR EIN BEREICH GLEICHZEITIG
========================================= */

var allDetails = document.querySelectorAll("details");

for(var d = 0; d < allDetails.length; d++){

  allDetails[d].addEventListener("toggle", function(){

    var current = this;

    if(!current.open){
      return;
    }

    for(var j = 0; j < allDetails.length; j++){

      if(allDetails[j] !== current){
        allDetails[j].open = false;
      }

    }

    setTimeout(function(){

      current.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },180);

  });

}


/* =========================================
   LAUTSTÄRKE
========================================= */

var volume = parseFloat(
  localStorage.getItem("tongueboxVolume")
);

if(isNaN(volume)){
  volume = 1;
}

function updateVolume(){

  volumeDisplay.textContent =
    "Lautstärke: " +
    Math.round(volume * 100) +
    " %";

}

function saveVolume(){

  volume =
    Math.round(volume * 10) / 10;

  localStorage.setItem(
    "tongueboxVolume",
    String(volume)
  );

  updateVolume();

}

document.getElementById("volumeUp").addEventListener(
"click",
function(){

  volume += 0.1;

  if(volume > 1){
    volume = 1;
  }

  saveVolume();

});

document.getElementById("volumeDown").addEventListener(
"click",
function(){

  volume -= 0.1;

  if(volume < 0){
    volume = 0;
  }

  saveVolume();

});

updateVolume();


/* =========================================
   STIMMEN
========================================= */

function loadVoices(){

  if(!("speechSynthesis" in window)){
    return;
  }

  voices =
    window.speechSynthesis.getVoices();

  voiceSelect.innerHTML = "";

  var savedVoice =
    localStorage.getItem("tongueboxVoice");

  if(voices.length === 0){

    var option =
      document.createElement("option");

    option.textContent =
      "Stimmen werden geladen...";

    voiceSelect.appendChild(option);

    return;
  }

  for(var i = 0; i < voices.length; i++){

    var option =
      document.createElement("option");

    option.value = String(i);

    option.textContent =
      voices[i].name +
      " – " +
      voices[i].lang;

    if(savedVoice === voices[i].name){
      option.selected = true;
    }

    voiceSelect.appendChild(option);

  }

}

loadVoices();

if("speechSynthesis" in window){
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

voiceSelect.addEventListener(
"change",
function(){

  var index =
    parseInt(
      voiceSelect.value,
      10
    );

  if(!isNaN(index) && voices[index]){

    localStorage.setItem(
      "tongueboxVoice",
      voices[index].name
    );

  }

});


/* =========================================
   SPRECHEN
========================================= */

function speakText(message){

  message =
    String(message || "").trim();

  if(!message){
    return;
  }

  if(!("speechSynthesis" in window)){

    statusBox.textContent =
      "Sprachausgabe wird nicht unterstützt.";

    return;
  }

  window.speechSynthesis.cancel();

  var speech =
    new SpeechSynthesisUtterance(message);

  var index =
    parseInt(
      voiceSelect.value,
      10
    );

  if(!isNaN(index) && voices[index]){

    speech.voice = voices[index];
    speech.lang = voices[index].lang;

  }else{

    speech.lang = "de-DE";

  }

  speech.rate = 0.95;
  speech.volume = volume;

  speech.onstart =
  function(){

    statusBox.textContent =
      "🔊 Tonguebox spricht...";

  };

  speech.onend =
  function(){

    statusBox.textContent = "";

  };

  window.speechSynthesis.speak(speech);

}


/* TEXT SPRECHEN */

document.getElementById("speakButton").addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  if(!value){

    statusBox.textContent =
      "Bitte zuerst Text eingeben.";

    return;
  }

  speakText(value);

});


/* STOPP */

document.getElementById("stopButton").addEventListener(
"click",
function(){

  if("speechSynthesis" in window){
    window.speechSynthesis.cancel();
  }

  statusBox.textContent =
    "⏹ Gestoppt.";

});


/* LEEREN */

document.getElementById("clearButton").addEventListener(
"click",
function(){

  textInput.value = "";
  suggestionBox.innerHTML = "";
  statusBox.textContent = "";

});


/* SCHNELLBUTTONS */

var phraseButtons =
  document.querySelectorAll(".speakPhrase");

for(var p = 0; p < phraseButtons.length; p++){

  phraseButtons[p].addEventListener(
  "click",
  function(){

    var message =
      this.getAttribute("data-text");

    speakText(message);

  });

}


/* =========================================
   SATZVORSCHLÄGE
========================================= */

document.getElementById("suggestionButton").addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  var lower =
    value.toLowerCase();

  var suggestions = [];

  if(!value){

    suggestions = [
      "Ich möchte etwas sagen.",
      "Bitte warten Sie kurz.",
      "Ich brauche Hilfe."
    ];

  }
  else if(lower.indexOf("kaffee") !== -1){

    suggestions = [
      "Ich möchte bitte einen Kaffee.",
      "Ich hätte gerne einen Kaffee mit Milch.",
      "Bitte bringen Sie mir einen Kaffee."
    ];

  }
  else if(
    lower.indexOf("wasser") !== -1 ||
    lower.indexOf("trinken") !== -1 ||
    lower.indexOf("durst") !== -1
  ){

    suggestions = [
      "Ich möchte bitte etwas trinken.",
      "Ich hätte gerne Wasser.",
      "Bitte helfen Sie mir beim Trinken."
    ];

  }
  else if(
    lower.indexOf("essen") !== -1 ||
    lower.indexOf("hunger") !== -1
  ){

    suggestions = [
      "Ich möchte bitte etwas essen.",
      "Ich habe Hunger.",
      "Bitte helfen Sie mir beim Essen."
    ];

  }
  else if(lower.indexOf("hilfe") !== -1){

    suggestions = [
      "Ich brauche Hilfe.",
      "Könnten Sie mir bitte helfen?",
      "Bitte holen Sie jemanden."
    ];

  }
  else if(
    lower.indexOf("wc") !== -1 ||
    lower.indexOf("toilette") !== -1
  ){

    suggestions = [
      "Ich muss auf die Toilette.",
      "Bitte helfen Sie mir auf die Toilette.",
      "Ich brauche Hilfe beim Toilettengang."
    ];

  }
  else{

    suggestions = [
      cleanSentence(value),
      friendlyText(value),
      questionText(value)
    ];

  }

  showSuggestions(suggestions);

});


function showSuggestions(list){

  suggestionBox.innerHTML = "";

  for(var i = 0; i < list.length; i++){

    var button =
      document.createElement("button");

    button.type = "button";
    button.className = "suggestion";

    button.textContent =
      "✨ " + list[i];

    button.setAttribute(
      "data-sentence",
      list[i]
    );

    button.addEventListener(
    "click",
    function(){

      var sentence =
        this.getAttribute(
          "data-sentence"
        );

      textInput.value = sentence;

      speakText(sentence);

    });

    suggestionBox.appendChild(button);

  }

}


/* =========================================
   TEXT VERVOLLSTÄNDIGEN
========================================= */

document.getElementById("completeButton").addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  var lower =
    value.toLowerCase();

  if(!value){

    statusBox.textContent =
      "Bitte zuerst Text eingeben.";

    return;

  }

  if(lower.indexOf("kaffee") !== -1){

    textInput.value =
      "Ich möchte bitte einen Kaffee.";

  }
  else if(
    lower.indexOf("trinken") !== -1 ||
    lower.indexOf("wasser") !== -1
  ){

    textInput.value =
      "Ich möchte bitte etwas trinken.";

  }
  else if(lower.indexOf("essen") !== -1){

    textInput.value =
      "Ich möchte bitte etwas essen.";

  }
  else if(lower.indexOf("hilfe") !== -1){

    textInput.value =
      "Ich brauche bitte Hilfe.";

  }
  else if(
    lower.indexOf("wc") !== -1 ||
    lower.indexOf("toilette") !== -1
  ){

    textInput.value =
      "Ich muss bitte auf die Toilette.";

  }
  else{

    textInput.value =
      cleanSentence(value);

  }

  statusBox.textContent =
    "✍️ Text vervollständigt.";

});


/* FREUNDLICHER */

document.getElementById("friendlyButton").addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  if(!value){
    return;
  }

  textInput.value =
    friendlyText(value);

  statusBox.textContent =
    "🙂 Freundlicher formuliert.";

});


/* KÜRZER */

document.getElementById("shortButton").addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  if(!value){
    return;
  }

  value =
    value.replace(
      /ich hätte gerne/gi,
      "Ich möchte"
    );

  value =
    value.replace(
      /ich würde gerne/gi,
      "Ich möchte"
    );

  value =
    value.replace(
      /könnten sie mir bitte/gi,
      "Bitte"
    );

  value =
    value.replace(
      /ich möchte gerne/gi,
      "Ich möchte"
    );

  textInput.value =
    cleanSentence(value);

  statusBox.textContent =
    "⚡ Text gekürzt.";

});


/* ALS FRAGE */

document.getElementById("questionButton").addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  if(!value){
    return;
  }

  textInput.value =
    questionText(value);

  statusBox.textContent =
    "❓ Frage erstellt.";

});


/* =========================================
   HILFSFUNKTIONEN
========================================= */

function cleanSentence(value){

  value =
    String(value || "").trim();

  if(!value){
    return "";
  }

  value =
    value.replace(/\s+/g," ");

  value =
    value.charAt(0).toUpperCase() +
    value.slice(1);

  if(!/[.!?]$/.test(value)){
    value += ".";
  }

  return value;

}

function friendlyText(value){

  value =
    value.replace(/[.!?]+$/,"");

  if(
    value.toLowerCase()
      .indexOf("bitte") === -1
  ){

    value =
      "Bitte " +
      value.charAt(0).toLowerCase() +
      value.slice(1);

  }

  return cleanSentence(value);

}

function questionText(value){

  var lower =
    value.toLowerCase();

  if(lower.indexOf("kaffee") !== -1){

    return "Könnten Sie mir bitte einen Kaffee bringen?";

  }

  if(lower.indexOf("hilfe") !== -1){

    return "Könnten Sie mir bitte helfen?";

  }

  if(
    lower.indexOf("trinken") !== -1 ||
    lower.indexOf("wasser") !== -1
  ){

    return "Könnten Sie mir bitte etwas zu trinken geben?";

  }

  if(lower.indexOf("essen") !== -1){

    return "Könnten Sie mir bitte etwas zu essen geben?";

  }

  return (
    "Könnten Sie bitte " +
    value.replace(/[.!?]+$/,"") +
    "?"
  );

}


/* =========================================
   SPEICHERN
========================================= */

function getSaved(){

  try{

    var result =
      JSON.parse(
        localStorage.getItem(
          "tongueboxSaved"
        ) || "[]"
      );

    if(Array.isArray(result)){
      return result;
    }

    return [];

  }
  catch(error){

    return [];

  }

}

function saveList(list){

  localStorage.setItem(
    "tongueboxSaved",
    JSON.stringify(list)
  );

}

document.getElementById("saveButton").addEventListener(
"click",
function(){

  var value =
    textInput.value.trim();

  if(!value){

    statusBox.textContent =
      "Bitte zuerst Text eingeben.";

    return;

  }

  var saved =
    getSaved();

  if(saved.indexOf(value) === -1){

    saved.push(value);

    saveList(saved);

    statusBox.textContent =
      "⭐ Gespeichert.";

  }
  else{

    statusBox.textContent =
      "Dieser Satz ist bereits gespeichert.";

  }

  showSaved();

});


/* =========================================
   GESPEICHERTE SÄTZE
========================================= */

function showSaved(){

  var saved =
    getSaved();

  savedBox.innerHTML = "";

  if(saved.length === 0){

    savedBox.innerHTML =
      "<p>Noch keine Sätze gespeichert.</p>";

    return;

  }

  for(var i = 0; i < saved.length; i++){

    createSavedItem(
      saved[i],
      i
    );

  }

}

function createSavedItem(sentence,index){

  var speakButton =
    document.createElement("button");

  speakButton.type =
    "button";

  speakButton.className =
    "saved";

  speakButton.textContent =
    "🔊 " + sentence;

  speakButton.addEventListener(
  "click",
  function(){

    speakText(sentence);

  });


  var deleteButton =
    document.createElement("button");

  deleteButton.type =
    "button";

  deleteButton.className =
    "delete";

  deleteButton.textContent =
    "🗑 Löschen";

  deleteButton.addEventListener(
  "click",
  function(){

    var saved =
      getSaved();

    saved.splice(index,1);

    saveList(saved);

    showSaved();

  });


  savedBox.appendChild(
    speakButton
  );

  savedBox.appendChild(
    deleteButton
  );

}

showSaved();

});
</script>

</body>
</html>
