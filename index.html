<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tonguebox KI</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 10px;
  font-family: Arial, sans-serif;
  background: #eef3f8;
  color: #111;
}

.app {
  max-width: 1000px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 42px;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  font-size: 24px;
  margin-bottom: 20px;
}

.box {
  background: white;
  padding: 18px;
  border-radius: 22px;
  margin-bottom: 18px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12);
}

h2 {
  font-size: 28px;
  margin-top: 0;
}

/* TEXTFELD */

textarea {
  width: 100%;
  min-height: 280px;
  font-size: 32px;
  line-height: 1.4;
  padding: 20px;
  border-radius: 20px;
  border: 4px solid #333;
  resize: vertical;
}

textarea:focus,
button:focus,
select:focus {
  outline: 7px solid orange;
  outline-offset: 4px;
}

/* WORTVORHERSAGE */

.wordSuggestions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 14px;
}

.wordButton {
  min-height: 100px;
  font-size: 24px;
  font-weight: bold;
  background: #e8f5e9;
  border: 4px solid #2e7d32;
  border-radius: 20px;
}

/* HAUPTBUTTONS */

.mainButtons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 14px;
}

button {
  cursor: pointer;
}

.mainButton {
  min-height: 120px;
  font-size: 27px;
  font-weight: bold;
  border: none;
  border-radius: 20px;
}

.speak {
  background: #1565c0;
  color: white;
}

.ai {
  background: #673ab7;
  color: white;
}

.save {
  background: #2e7d32;
  color: white;
}

.clear {
  background: #555;
  color: white;
}

/* JA / NEIN */

.yesNo {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.yes,
.no {
  min-height: 150px;
  font-size: 40px;
  font-weight: bold;
  border: none;
  border-radius: 22px;
}

.yes {
  background: #2e7d32;
  color: white;
}

.no {
  background: #c62828;
  color: white;
}

/* KI VORSCHLÄGE */

.aiSuggestions {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

.aiSuggestion {
  width: 100%;
  min-height: 120px;
  padding: 18px;
  font-size: 24px;
  font-weight: bold;
  text-align: left;
  background: #ede7f6;
  border: 4px solid #673ab7;
  border-radius: 20px;
}

/* SCHNELLAKTIONEN */

.quickGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.quick {
  min-height: 120px;
  padding: 15px;
  font-size: 24px;
  font-weight: bold;
  border-radius: 20px;
  border: 4px solid #1976d2;
  background: #e3f2fd;
}

.help {
  background: #fff3cd;
  border-color: #ff9800;
}

.emergency {
  background: #b71c1c;
  color: white;
  border-color: #7f0000;
}

/* STIMMEN */

select {
  width: 100%;
  min-height: 80px;
  font-size: 23px;
  border-radius: 14px;
  padding: 10px;
}

label {
  display: block;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 10px;
}

#status {
  font-size: 21px;
  font-weight: bold;
  margin-top: 12px;
}

/* IPHONE */

@media(max-width:600px) {

  body {
    padding: 6px;
  }

  h1 {
    font-size: 35px;
  }

  textarea {
    min-height: 300px;
    font-size: 30px;
  }

  .wordSuggestions {
    grid-template-columns: 1fr 1fr 1fr;
  }

  .wordButton {
    min-height: 105px;
    font-size: 20px;
  }

  .mainButton,
  .quick,
  .aiSuggestion {
    min-height: 125px;
    font-size: 22px;
  }

  .yes,
  .no {
    min-height: 155px;
    font-size: 38px;
  }

}

</style>
</head>

<body>

<main class="app">

<h1>👅 Tonguebox KI</h1>

<div class="subtitle">
Sprich mit deinen Augen
</div>


<!-- TEXT -->

<section class="box">

<h2>💬 Was möchtest du sagen?</h2>

<textarea
  id="text"
  aria-label="Text eingeben"
  placeholder="Hier schreiben...">
</textarea>

<!-- WORTVORHERSAGE -->

<div
  id="wordSuggestions"
  class="wordSuggestions">
</div>


<div class="mainButtons">

<button
  class="mainButton speak"
  onclick="sprechen()">
  🔊 VORLESEN
</button>

<button
  class="mainButton ai"
  onclick="kiHilfe()">
  ✨ KI-VORSCHLÄGE
</button>

<button
  class="mainButton save"
  onclick="textSpeichern()">
  ⭐ SPEICHERN
</button>

<button
  class="mainButton clear"
  onclick="textLeeren()">
  🗑 LEEREN
</button>

</div>

<div
  id="status"
  role="status"
  aria-live="polite">
</div>

</section>


<!-- KI -->

<section class="box">

<h2>✨ KI-Satzvorschläge</h2>

<div
  id="aiSuggestions"
  class="aiSuggestions">

  <p>
    Schreibe ein paar Wörter und wähle
    „KI-Vorschläge“.
  </p>

</div>

</section>


<!-- JA NEIN -->

<section class="box">

<h2>⚡ Sofort antworten</h2>

<div class="yesNo">

<button
  class="yes"
  onclick="direktSprechen('Ja')">
  ✅ JA
</button>

<button
  class="no"
  onclick="direktSprechen('Nein')">
  ❌ NEIN
</button>

</div>

</section>


<!-- SCHNELLAKTIONEN -->

<section class="box">

<h2>⚡ Schnell sagen</h2>

<div class="quickGrid">

<button class="quick"
onclick="direktSprechen('Hallo')">
👋 Hallo
</button>

<button class="quick"
onclick="direktSprechen('Danke')">
🙏 Danke
</button>

<button class="quick"
onclick="direktSprechen('Bitte warten Sie kurz. Ich brauche etwas Zeit zum Antworten.')">
⏳ Bitte warten
</button>

<button class="quick"
onclick="direktSprechen('Bitte sagen Sie das noch einmal.')">
🔁 Noch einmal
</button>

<button class="quick"
onclick="direktSprechen('Bitte sprechen Sie langsamer.')">
🐢 Langsamer
</button>

<button class="quick"
onclick="direktSprechen('Ich habe Sie nicht verstanden.')">
❓ Nicht verstanden
</button>

<button class="quick help"
onclick="direktSprechen('Ich brauche Hilfe.')">
🆘 Hilfe
</button>

<button class="quick"
onclick="direktSprechen('Ich möchte etwas trinken.')">
🥤 Trinken
</button>

<button class="quick"
onclick="direktSprechen('Ich möchte etwas essen.')">
🍽 Essen
</button>

<button class="quick"
onclick="direktSprechen('Ich muss auf die Toilette.')">
🚻 WC
</button>

<button class="quick"
onclick="direktSprechen('Bitte geben Sie mir etwas Zeit zum Antworten.')">
⏱ Zeit
</button>

<button class="quick"
onclick="direktSprechen('Ich kann nicht sprechen. Ich kommuniziere mit einer Augensteuerung.')">
👁 Augensteuerung
</button>

<button class="quick emergency"
onclick="direktSprechen('Das ist ein Notfall. Bitte holen Sie sofort Hilfe.')">
🚨 NOTFALL
</button>

</div>

</section>


<!-- STIMME -->

<section class="box">

<h2>🗣 Stimme</h2>

<label for="voice">
Stimme auswählen
</label>

<select id="voice"></select>

</section>

</main>


<script>

const textfeld =
  document.getElementById("text");

const voiceSelect =
  document.getElementById("voice");

const status =
  document.getElementById("status");

let stimmen = [];


/* =====================
   STIMMEN
===================== */

function stimmenLaden() {

  stimmen =
    speechSynthesis.getVoices();

  voiceSelect.innerHTML = "";

  stimmen.forEach((voice,index) => {

    const option =
      document.createElement("option");

    option.value = index;

    option.textContent =
      voice.name + " – " + voice.lang;

    voiceSelect.appendChild(option);

  });

  const gespeichert =
    localStorage.getItem(
      "tongueboxVoice"
    );

  if (
    gespeichert !== null &&
    stimmen[gespeichert]
  ) {
    voiceSelect.value =
      gespeichert;
  }

}

speechSynthesis.onvoiceschanged =
  stimmenLaden;

stimmenLaden();

voiceSelect.addEventListener(
  "change",
  function() {

    localStorage.setItem(
      "tongueboxVoice",
      voiceSelect.value
    );

  }
);


/* =====================
   SPRECHEN
===================== */

function textVorlesen(text) {

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  const voice =
    stimmen[voiceSelect.value];

  if (voice) {

    utterance.voice = voice;
    utterance.lang = voice.lang;

  }

  utterance.rate = 0.95;
  utterance.volume = 1;

  speechSynthesis.speak(
    utterance
  );

}


function sprechen() {

  const text =
    textfeld.value.trim();

  if (!text) {

    status.textContent =
      "Bitte zuerst etwas schreiben.";

    return;

  }

  textVorlesen(text);

}


function direktSprechen(text) {

  textVorlesen(text);

}


/* =====================
   TEXT LEEREN
===================== */

function textLeeren() {

  textfeld.value = "";

  wortVorhersage();

  status.textContent = "";

}


/* =====================
   WORTVORHERSAGE
===================== */

const woerter = {

  ich: [
    "möchte",
    "brauche",
    "habe"
  ],

  möchte: [
    "bitte",
    "etwas",
    "gerne"
  ],

  brauche: [
    "Hilfe",
    "Wasser",
    "Zeit"
  ],

  habe: [
    "Schmerzen",
    "Durst",
    "Hunger"
  ],

  bitte: [
    "helfen",
    "warten",
    "noch einmal"
  ],

  wasser: [
    "bitte",
    "kalt",
    "trinken"
  ],

  kaffee: [
    "bitte",
    "Milch",
    "Zucker"
  ],

  schmerzen: [
    "Rücken",
    "Kopf",
    "Beine"
  ],

  toilet: [
    "bitte",
    "helfen",
    "jetzt"
  ],

  toilette: [
    "bitte",
    "helfen",
    "jetzt"
  ],

  default: [
    "Ich",
    "Bitte",
    "Danke"
  ]

};


textfeld.addEventListener(
  "input",
  wortVorhersage
);


function wortVorhersage() {

  const text =
    textfeld.value.trim();

  let letztesWort = "";

  if (text) {

    const teile =
      text
        .toLowerCase()
        .split(/\s+/);

    letztesWort =
      teile[teile.length - 1];

  }

  const vorschlaege =
    woerter[letztesWort] ||
    woerter.default;

  const bereich =
    document.getElementById(
      "wordSuggestions"
    );

  bereich.innerHTML = "";

  vorschlaege.forEach(wort => {

    const button =
      document.createElement("button");

    button.className =
      "wordButton";

    button.textContent =
      wort;

    button.onclick =
      function() {

        let aktuellerText =
          textfeld.value;

        if (
          aktuellerText.length > 0 &&
          !aktuellerText.endsWith(" ")
        ) {

          aktuellerText += " ";

        }

        textfeld.value =
          aktuellerText +
          wort +
          " ";

        wortVorhersage();

      };

    bereich.appendChild(
      button
    );

  });

}

wortVorhersage();


/* =====================
   KI
===================== */

async function kiHilfe() {

  const text =
    textfeld.value.trim();

  if (!text) {

    status.textContent =
      "Bitte zuerst einige Wörter eingeben.";

    return;

  }

  status.textContent =
    "✨ KI erstellt Vorschläge...";


  try {

    /*
      HIER DEINE CLOUDFLARE
      WORKER-ADRESSE EINTRAGEN
    */

    const response = await fetch(
      "https://DEIN-WORKER.workers.dev",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          text: text
        })
      }
    );


    if (!response.ok) {

      throw new Error(
        "KI konnte nicht geladen werden"
      );

    }


    const daten =
      await response.json();


    if (
      !daten.vorschlaege ||
      !Array.isArray(
        daten.vorschlaege
      )
    ) {

      throw new Error(
        "Ungültige Antwort"
      );

    }


    zeigeKIVorschlaege(
      daten.vorschlaege
    );

    status.textContent =
      "✨ Wähle einen Vorschlag.";

  }

  catch (fehler) {

    console.error(fehler);

    status.textContent =
      "KI ist gerade nicht erreichbar.";

  }

}


/* =====================
   KI BUTTONS
===================== */

function zeigeKIVorschlaege(
  vorschlaege
) {

  const bereich =
    document.getElementById(
      "aiSuggestions"
    );

  bereich.innerHTML = "";


  vorschlaege
    .slice(0,3)
    .forEach(text => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "aiSuggestion";

      button.textContent =
        "✨ " + text;


      button.onclick =
        function() {

          textfeld.value =
            text;

          wortVorhersage();

          textVorlesen(
            text
          );

        };


      bereich.appendChild(
        button
      );

    });

}


/* =====================
   SPEICHERN
===================== */

function textSpeichern() {

  const text =
    textfeld.value.trim();

  if (!text) {

    status.textContent =
      "Bitte zuerst etwas schreiben.";

    return;

  }

  let gespeichert =
    JSON.parse(
      localStorage.getItem(
        "tongueboxTexte"
      ) || "[]"
    );


  if (
    !gespeichert.includes(
      text
    )
  ) {

    gespeichert.push(
      text
    );

    localStorage.setItem(
      "tongueboxTexte",
      JSON.stringify(
        gespeichert
      )
    );

  }


  status.textContent =
    "⭐ Satz gespeichert.";

}

</script>

</body>
</html>
