<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Tonguebox</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:8px;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f5f7;
  color:#111;
}

.app{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:32px;
  margin:8px 0 14px;
}

.card{
  background:white;
  border-radius:18px;
  padding:12px;
  margin-bottom:12px;
}

textarea{
  width:100%;
  min-height:230px;
  padding:16px;
  font-size:28px;
  line-height:1.35;
  border:4px solid #222;
  border-radius:18px;
  resize:none;
}

button,
select{
  width:100%;
  min-height:95px;
  border-radius:18px;
  font-size:22px;
  font-weight:bold;
}

button{
  border:none;
}

button:focus,
textarea:focus,
select:focus{
  outline:6px solid orange;
  outline-offset:3px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.speak{
  background:#1565c0;
  color:white;
}

.save{
  background:#2e7d32;
  color:white;
}

.clear{
  background:#555;
  color:white;
}

.stop{
  background:#c62828;
  color:white;
}

.yes{
  background:#2e7d32;
  color:white;
  font-size:36px;
  min-height:130px;
}

.no{
  background:#c62828;
  color:white;
  font-size:36px;
  min-height:130px;
}

.quick{
  background:#e3f2fd;
  border:3px solid #1976d2;
}

.emergency{
  background:#b71c1c;
  color:white;
}

select{
  padding:10px;
  border:3px solid #444;
  background:white;
}

.saved{
  margin-top:10px;
}

.saved button{
  margin-bottom:8px;
  background:#512da8;
  color:white;
  min-height:90px;
}

.delete{
  background:#c62828 !important;
}

#status{
  min-height:28px;
  font-size:19px;
  font-weight:bold;
  margin-top:8px;
}

@media(max-width:500px){

  body{
    padding:6px;
  }

  h1{
    font-size:29px;
  }

  textarea{
    min-height:250px;
    font-size:27px;
  }

  button{
    min-height:100px;
    font-size:21px;
  }

}
</style>
</head>

<body>

<main class="app">

<h1>👅 Tonguebox</h1>

<div class="card">

<textarea
id="text"
placeholder="Hier schreiben..."
aria-label="Text eingeben">
</textarea>

<div class="grid2" style="margin-top:10px;">

<button class="speak" id="speak">
🔊 Sprechen
</button>

<button class="save" id="save">
⭐ Speichern
</button>

<button class="clear" id="clear">
🗑 Leeren
</button>

<button class="stop" id="stop">
⏹ Stopp
</button>

</div>

<div id="status"></div>

</div>


<div class="card">

<div class="grid2">

<button class="yes" data-speak="Ja">
✅ JA
</button>

<button class="no" data-speak="Nein">
❌ NEIN
</button>

</div>

</div>


<div class="card">

<div class="grid2">

<button class="quick" data-speak="Hallo">
👋 Hallo
</button>

<button class="quick" data-speak="Danke">
🙏 Danke
</button>

<button
class="quick"
data-speak="Bitte warten Sie kurz. Ich brauche etwas Zeit zum Antworten.">
⏳ Warten
</button>

<button
class="quick"
data-speak="Bitte sagen Sie das noch einmal.">
🔁 Nochmal
</button>

<button
class="quick"
data-speak="Ich brauche Hilfe.">
🆘 Hilfe
</button>

<button
class="quick"
data-speak="Ich möchte etwas trinken.">
🥤 Trinken
</button>

<button
class="quick"
data-speak="Ich muss auf die Toilette.">
🚻 WC
</button>

<button
class="quick"
data-speak="Ich habe Sie nicht verstanden.">
❓ Nicht verstanden
</button>

<button
class="quick"
data-speak="Ich kann nicht sprechen. Ich kommuniziere mit einer Augensteuerung.">
👁 Kommunikation
</button>

<button
class="emergency"
data-speak="Das ist ein Notfall. Bitte holen Sie sofort Hilfe.">
🚨 NOTFALL
</button>

</div>

</div>


<div class="card">

<select id="voice" aria-label="Stimme auswählen">
<option>Stimmen laden...</option>
</select>

</div>


<div class="card">

<h2 style="margin-top:0;">
⭐ Gespeichert
</h2>

<div id="saved" class="saved"></div>

</div>

</main>


<script>

var text = document.getElementById("text");
var voiceSelect = document.getElementById("voice");
var savedBox = document.getElementById("saved");
var statusBox = document.getElementById("status");

var voices = [];


/* STIMMEN */

function loadVoices(){

  voices = speechSynthesis.getVoices();

  voiceSelect.innerHTML = "";

  if(voices.length === 0){

    var option = document.createElement("option");

    option.textContent = "Keine Stimme verfügbar";

    voiceSelect.appendChild(option);

    return;
  }

  var savedVoice =
    localStorage.getItem("tongueboxVoice");

  voices.forEach(function(voice,index){

    var option =
      document.createElement("option");

    option.value = index;

    option.textContent =
      voice.name + " – " + voice.lang;

    if(savedVoice === voice.name){
      option.selected = true;
    }

    voiceSelect.appendChild(option);

  });

}

loadVoices();

speechSynthesis.onvoiceschanged =
  loadVoices;


voiceSelect.addEventListener(
"change",
function(){

  var voice =
    voices[Number(voiceSelect.value)];

  if(voice){

    localStorage.setItem(
      "tongueboxVoice",
      voice.name
    );

  }

});


/* SPRECHEN */

function speakText(message){

  if(!message){
    return;
  }

  speechSynthesis.cancel();

  var speech =
    new SpeechSynthesisUtterance(message);

  var voice =
    voices[Number(voiceSelect.value)];

  if(voice){

    speech.voice = voice;
    speech.lang = voice.lang;

  }

  speech.rate = 0.95;
  speech.volume = 1;

  speech.onstart = function(){
    statusBox.textContent =
      "🔊 Tonguebox spricht";
  };

  speech.onend = function(){
    statusBox.textContent = "";
  };

  speechSynthesis.speak(speech);

}


/* HAUPTBUTTONS */

document.getElementById("speak")
.addEventListener("click",function(){

  var value = text.value.trim();

  if(!value){

    statusBox.textContent =
      "Bitte zuerst Text schreiben.";

    return;
  }

  speakText(value);

});


document.getElementById("clear")
.addEventListener("click",function(){

  text.value = "";

  statusBox.textContent = "";

  text.focus();

});


document.getElementById("stop")
.addEventListener("click",function(){

  speechSynthesis.cancel();

  statusBox.textContent =
    "⏹ Gestoppt";

});


/* SCHNELLBUTTONS */

document
.querySelectorAll("[data-speak]")
.forEach(function(button){

  button.addEventListener(
    "click",
    function(){

      speakText(
        this.getAttribute("data-speak")
      );

    }
  );

});


/* SPEICHERN */

function getSaved(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "tongueboxSaved"
      ) || "[]"
    );

  }

  catch(error){

    return [];

  }

}


document.getElementById("save")
.addEventListener("click",function(){

  var value =
    text.value.trim();

  if(!value){

    statusBox.textContent =
      "Bitte zuerst Text schreiben.";

    return;
  }

  var saved =
    getSaved();

  if(saved.indexOf(value) === -1){

    saved.push(value);

    localStorage.setItem(
      "tongueboxSaved",
      JSON.stringify(saved)
    );

  }

  showSaved();

  statusBox.textContent =
    "⭐ Gespeichert";

});


function showSaved(){

  var saved =
    getSaved();

  savedBox.innerHTML = "";

  if(saved.length === 0){

    savedBox.innerHTML =
      "<p>Noch keine Sätze gespeichert.</p>";

    return;
  }

  saved.forEach(function(sentence,index){

    var speakButton =
      document.createElement("button");

    speakButton.textContent =
      "🔊 " + sentence;

    speakButton.addEventListener(
      "click",
      function(){

        speakText(sentence);

      }
    );

    var deleteButton =
      document.createElement("button");

    deleteButton.textContent =
      "🗑 Löschen";

    deleteButton.className =
      "delete";

    deleteButton.addEventListener(
      "click",
      function(){

        var current =
          getSaved();

        current.splice(index,1);

        localStorage.setItem(
          "tongueboxSaved",
          JSON.stringify(current)
        );

        showSaved();

      }
    );

    savedBox.appendChild(
      speakButton
    );

    savedBox.appendChild(
      deleteButton
    );

  });

}


showSaved();

</script>

</body>
</html>
