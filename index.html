<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f8c">
<title>Tonguebox – Universal Auto Reply</title>
<style>
:root{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --primary:#087f8c; --ok:#198754; --no:#c62828; --warn:#b26a00;
  --help:#6f42c1; --bg:transparent; --card:transparent; --text:#10232a; --focus:#ffd600;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--text)}
main{max-width:820px;margin:auto;padding:12px}
h1{text-align:center;margin:8px 0 2px;font-size:1.8rem}
.subtitle{text-align:center;margin:0 0 12px;font-weight:750}
.status{
  margin:12px 0 16px;padding:14px;border:3px solid var(--primary);border-radius:18px;
  background:transparent;text-align:center;font-size:1.05rem;font-weight:850
}
button,textarea,select{font:inherit}
button{
  width:100%;min-height:98px;border:0;border-radius:18px;padding:14px;
  background:var(--primary);color:#fff;font-size:1.22rem;font-weight:850;cursor:pointer
}
button:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:7px solid var(--focus);outline-offset:4px
}
textarea{
  width:100%;min-height:120px;border:3px solid #78909c;border-radius:18px;
  padding:14px;font-size:1.18rem;background:#fff;color:var(--text)
}
select{
  width:100%;min-height:76px;border:3px solid #78909c;border-radius:18px;
  padding:12px;background:#fff;color:var(--text);font-size:1.05rem
}
.accordion{margin:14px 0;border:3px solid var(--primary);border-radius:22px;overflow:hidden;background:transparent}
.accordion-toggle{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  min-height:108px;border-radius:0;text-align:left;padding:18px
}
.arrow{font-size:1.5rem;flex:0 0 auto}
.panel{display:none}.panel.open{display:block}.panel-inner{padding:14px}
.toolbar,.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#replyGrid,#topicPhrases{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reply{min-height:112px}
.reply.yes{background:var(--ok)} .reply.no{background:var(--no)}
.reply.warn{background:var(--warn)} .reply.help{background:var(--help)}
.stop{background:#455a64}.danger{background:#ad1457}
.transcript{min-height:82px;padding:14px;border:2px solid #b0bec5;border-radius:16px;background:transparent;font-size:1.1rem}
.small{font-size:.96rem;line-height:1.4;font-weight:650}
.saved-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin:10px 0}
.saved-row .delete{width:auto;min-width:94px;background:var(--no)}
.hidden{display:none!important}
.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#e7f5f7;margin:4px;font-weight:800}
@media(max-width:650px){
  .toolbar,.grid,#replyGrid,#topicPhrases{grid-template-columns:1fr}
  button{min-height:108px;font-size:1.25rem}
  .saved-row{grid-template-columns:1fr}.saved-row .delete{width:100%}
}
@media(prefers-color-scheme:dark){
  :root{--bg:transparent;--card:transparent;--text:#eef7f8}
  textarea,select{background:#101517;color:#eef7f8}
  .status,.transcript{background:transparent}.badge{background:#28434a}
}
</style>
</head>
<body>
<main>
  <h1>🧠 Tonguebox Universal</h1>
  <p class="subtitle">Person spricht → Antworten erscheinen → auswählen → Tonguebox spricht</p>

  <div id="status" class="status">Bereit.</div>

  <section class="accordion">
    <button class="accordion-toggle" aria-expanded="true" aria-controls="listenPanel">
      <span>🎧 Automatisch zuhören</span><span class="arrow">▼</span>
    </button>
    <div id="listenPanel" class="panel open">
      <div class="panel-inner">
        <div class="toolbar">
          <button id="startBtn">🎧 START</button>
          <button id="stopBtn" class="stop">⏹ STOPP</button>
        </div>
        <p id="modeInfo" class="small"></p>
        <div id="transcript" class="transcript">Noch nichts erkannt.</div>
      </div>
    </div>
  </section>

  <section class="accordion">
    <button class="accordion-toggle" aria-expanded="true" aria-controls="replyPanel">
      <span>⚡ Antworten</span><span class="arrow">▼</span>
    </button>
    <div id="replyPanel" class="panel open">
      <div class="panel-inner">
        <div id="replyGrid"></div>
      </div>
    </div>
  </section>

  <section class="accordion">
    <button class="accordion-toggle" aria-expanded="false" aria-controls="topicsPanel">
      <span>🗂️ Themen</span><span class="arrow">▶</span>
    </button>
    <div id="topicsPanel" class="panel">
      <div class="panel-inner">
        <div id="topicGrid" class="grid"></div>
        <div id="topicPhrases" style="margin-top:12px"></div>
      </div>
    </div>
  </section>

  <section class="accordion">
    <button class="accordion-toggle" aria-expanded="false" aria-controls="savedPanel">
      <span>💬 Meine Sätze</span><span class="arrow">▶</span>
    </button>
    <div id="savedPanel" class="panel">
      <div class="panel-inner">
        <textarea id="saveInput" placeholder="Persönlichen Satz eingeben …"></textarea>
        <button id="saveBtn" style="margin-top:12px">💾 Satz speichern</button>
        <div id="savedList" style="margin-top:12px"></div>
      </div>
    </div>
  </section>

  <section class="accordion">
    <button class="accordion-toggle" aria-expanded="false" aria-controls="voicePanel">
      <span>🗣️ Stimme</span><span class="arrow">▶</span>
    </button>
    <div id="voicePanel" class="panel">
      <div class="panel-inner">
        <select id="voiceSelect"></select>
        <button id="voiceTest" style="margin-top:12px">🔊 Stimme testen</button>
      </div>
    </div>
  </section>

  <section class="accordion">
    <button class="accordion-toggle" aria-expanded="false" aria-controls="manualPanel">
      <span>✍️ Selbst schreiben</span><span class="arrow">▶</span>
    </button>
    <div id="manualPanel" class="panel">
      <div class="panel-inner">
        <textarea id="manualText" placeholder="Eigene Antwort …"></textarea>
        <button id="manualSpeak" style="margin-top:12px">🔊 Sprechen</button>
      </div>
    </div>
  </section>

  <section class="accordion">
    <button class="accordion-toggle" aria-expanded="false" aria-controls="helpPanel">
      <span>🆘 Soforthilfe</span><span class="arrow">▶</span>
    </button>
    <div id="helpPanel" class="panel">
      <div class="panel-inner">
        <button id="panic" class="danger">🆘 Bitte warten – ich kommuniziere mit Augensteuerung.</button>
      </div>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const statusBox = $("#status");
const transcriptBox = $("#transcript");
const replyGrid = $("#replyGrid");
let listening = false, speaking = false;
let recognition = null, recorder = null, stream = null, recordTimer = null;
let whisper = null, whisperLoading = false;
let selectedMode = "none";

/* ---------- Akkordeon ---------- */
document.querySelectorAll(".accordion-toggle").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const id = btn.getAttribute("aria-controls");
    const p = document.getElementById(id);
    const isOpen = p.classList.contains("open");
    p.classList.toggle("open", !isOpen);
    btn.setAttribute("aria-expanded", String(!isOpen));
    btn.querySelector(".arrow").textContent = !isOpen ? "▼" : "▶";
  });
});

/* ---------- Browsermodus ---------- */
function detectMode(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SR){
    selectedMode = "native";
    $("#modeInfo").textContent = "✅ Direkte Spracherkennung verfügbar.";
    return;
  }
  if(navigator.mediaDevices?.getUserMedia && window.MediaRecorder && window.WebAssembly){
    selectedMode = "whisper";
    $("#modeInfo").textContent = "✅ Universeller Modus: lokale Whisper-Spracherkennung wird verwendet.";
    return;
  }
  selectedMode = "manual";
  $("#modeInfo").textContent = "⚠️ Dieser Browser unterstützt keine automatische Erkennung. Manuelle Eingabe bleibt verfügbar.";
}
detectMode();

/* ---------- Stimmen ---------- */
const VOICE_KEY = "tonguebox_voice";
let voices = [];
function loadVoices(){
  voices = speechSynthesis.getVoices();
  const select = $("#voiceSelect");
  const saved = localStorage.getItem(VOICE_KEY);
  select.innerHTML = "";
  const german = voices.filter(v => (v.lang||"").toLowerCase().startsWith("de"));
  const list = german.length ? german : voices;
  list.forEach(v=>{
    const o = document.createElement("option");
    o.value = v.name; o.textContent = `${v.name} (${v.lang})`;
    if(v.name===saved) o.selected = true;
    select.appendChild(o);
  });
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();
$("#voiceSelect").addEventListener("change",e=>localStorage.setItem(VOICE_KEY,e.target.value));

function speak(text){
  text=(text||"").trim(); if(!text) return;
  speaking = true;
  stopRecognitionOnly();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-AT";
  const vn = $("#voiceSelect").value || localStorage.getItem(VOICE_KEY);
  const vv = speechSynthesis.getVoices().find(v=>v.name===vn);
  if(vv) u.voice = vv;
  u.onstart = ()=>statusBox.textContent="🔊 Tonguebox spricht.";
  u.onend = ()=>{
    speaking=false;
    if(listening){ statusBox.textContent="🎧 Ich höre wieder zu."; setTimeout(startRecognition,600); }
    else statusBox.textContent="Bereit.";
  };
  u.onerror = u.onend;
  speechSynthesis.speak(u);
}
$("#voiceTest").onclick = ()=>speak("Hallo, das ist meine ausgewählte Stimme.");

/* ---------- Antwortlogik ---------- */
function detectIntent(text){
  const t=text.toLowerCase().trim();
  if(/\b(oder|erste|zweite|option|auswahl)\b/.test(t)) return "choice";
  if(/\b(wann|uhrzeit|um wie viel|um wieviel)\b/.test(t)) return "time";
  if(/\b(wo|adresse|ort)\b/.test(t)) return "place";
  if(/\b(wie geht|geht es dir|alles gut)\b/.test(t)) return "wellbeing";
  if(/\b(kannst du|könntest du|möchtest du|willst du|hast du|bist du|passt dir|geht es|kommst du|brauchst du|soll ich|ist das)\b/.test(t)) return "yesno";
  if(/\b(was|wie|wer|welche|welcher|welches|warum|wieso|weshalb)\b/.test(t)) return "open";
  if(t.endsWith("?")) return "question";
  return "statement";
}
function repliesFor(intent,text){
  const map={
    yesno:[["✅ Ja.","yes"],["❌ Nein.","no"],["🤔 Vielleicht.","warn"],["🔁 Bitte wiederholen.","help"]],
    choice:[["1️⃣ Die erste Möglichkeit.","yes"],["2️⃣ Die zweite Möglichkeit.","yes"],["🚫 Keine von beiden.","no"],["🔁 Bitte noch einmal.","help"]],
    time:[["✅ Ja, die Uhrzeit passt.","yes"],["❌ Nein, die Uhrzeit passt nicht.","no"],["🕐 Etwas später bitte.","warn"],["🕐 Etwas früher bitte.","warn"]],
    place:[["📍 Ja, dort passt es.","yes"],["❌ Nein, dort geht es nicht.","no"],["📩 Bitte schick mir die Adresse.","help"],["🔁 Bitte Ort wiederholen.","help"]],
    wellbeing:[["😊 Mir geht es gut, danke.","yes"],["😐 Es geht so.","warn"],["😟 Mir geht es nicht so gut.","no"],["🙏 Danke fürs Fragen.","yes"]],
    open:[["🤔 Einen Moment, ich überlege.","warn"],["🔁 Bitte wiederholen.","help"],["💬 Bitte genauer erklären.","help"],["✍️ Ich schreibe meine Antwort.","warn"]],
    question:[["✅ Ja.","yes"],["❌ Nein.","no"],["🤔 Einen Moment bitte.","warn"],["🔁 Bitte wiederholen.","help"]],
    statement:[["✅ Verstanden.","yes"],["🔁 Bitte wiederholen.","help"],["🐢 Bitte langsamer.","help"],["✍️ Einen Moment bitte.","warn"]]
  };
  let r = map[intent] || map.statement;
  if(/\b(termin|arzt|ärztin|krankenhaus|ambulanz)\b/i.test(text)){
    r = r.slice(0,3).concat([["📅 Bitte schick mir die Information schriftlich.","help"]]);
  }
  return r;
}
function analyze(text){
  text=(text||"").trim(); if(!text) return;
  transcriptBox.textContent=text;
  const replies=repliesFor(detectIntent(text),text);
  replyGrid.innerHTML="";
  replies.forEach(([label,kind])=>{
    const b=document.createElement("button");
    b.className="reply "+kind;
    b.textContent=label;
    b.onclick=()=>speak(label.replace(/^[^\p{L}\p{N}]+/u,"").trim());
    replyGrid.appendChild(b);
  });
  statusBox.textContent="✨ Antworten bereit.";
}

/* ---------- Native SpeechRecognition ---------- */
function makeNativeRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const r = new SR();
  r.lang="de-AT"; r.continuous=true; r.interimResults=true;
  r.onstart=()=>statusBox.textContent="🎧 Ich höre zu.";
  r.onresult=e=>{
    let interim="", finalText="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const part=e.results[i][0].transcript;
      if(e.results[i].isFinal) finalText += part+" "; else interim += part;
    }
    if(interim) transcriptBox.textContent="… "+interim;
    if(finalText.trim()) analyze(finalText.trim());
  };
  r.onend=()=>{ if(listening && !speaking) setTimeout(startRecognition,500); };
  r.onerror=e=>{
    if(e.error==="not-allowed"){ listening=false; statusBox.textContent="Mikrofonzugriff wurde nicht erlaubt."; }
  };
  return r;
}

/* ---------- Whisper-Fallback im Browser ---------- */
async function loadWhisper(){
  if(whisper) return whisper;
  if(whisperLoading) {
    while(whisperLoading) await new Promise(r=>setTimeout(r,200));
    return whisper;
  }
  whisperLoading=true;
  statusBox.textContent="🧠 Spracherkennung wird einmalig geladen …";
  try{
    const mod = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
    mod.env.allowLocalModels = false;
    whisper = await mod.pipeline("automatic-speech-recognition","Xenova/whisper-tiny");
    statusBox.textContent="✅ Spracherkennung bereit.";
  }catch(err){
    console.error(err);
    statusBox.textContent="⚠️ Lokale Spracherkennung konnte nicht geladen werden.";
  }finally{
    whisperLoading=false;
  }
  return whisper;
}

async function blobTo16kFloat32(blob){
  const arrayBuffer = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  const decoded = await ctx.decodeAudioData(arrayBuffer.slice(0));
  const data = decoded.getChannelData(0);
  const srcRate = decoded.sampleRate;
  if(srcRate===16000){ await ctx.close(); return new Float32Array(data); }
  const ratio = srcRate/16000;
  const len = Math.round(data.length/ratio);
  const out = new Float32Array(len);
  for(let i=0;i<len;i++){
    const pos=i*ratio, a=Math.floor(pos), b=Math.min(a+1,data.length-1), f=pos-a;
    out[i]=data[a]*(1-f)+data[b]*f;
  }
  await ctx.close();
  return out;
}

async function transcribeBlob(blob){
  const model = await loadWhisper();
  if(!model || !blob || blob.size<1000) return;
  try{
    statusBox.textContent="🧠 Sprache wird erkannt …";
    const audio = await blobTo16kFloat32(blob);
    const result = await model(audio,{language:"german",task:"transcribe"});
    const text=(result?.text||"").trim();
    if(text) analyze(text); else statusBox.textContent="🎧 Ich höre weiter zu.";
  }catch(err){
    console.error(err);
    statusBox.textContent="⚠️ Sprache konnte nicht erkannt werden.";
  }
}

async function startWhisperChunk(){
  if(!listening || speaking) return;
  try{
    if(!stream) stream=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    });
    const types=["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/ogg"];
    const type=types.find(t=>MediaRecorder.isTypeSupported(t))||"";
    const chunks=[];
    recorder=type?new MediaRecorder(stream,{mimeType:type}):new MediaRecorder(stream);
    recorder.ondataavailable=e=>{ if(e.data?.size) chunks.push(e.data); };
    recorder.onstop=async()=>{
      const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});
      if(listening && !speaking) await transcribeBlob(blob);
      if(listening && !speaking) setTimeout(startWhisperChunk,250);
    };
    recorder.start();
    statusBox.textContent="🎧 Ich höre zu.";
    recordTimer=setTimeout(()=>{ if(recorder?.state==="recording") recorder.stop(); },4000);
  }catch(err){
    console.error(err);
    listening=false;
    statusBox.textContent="Mikrofon konnte nicht gestartet werden.";
  }
}

function startRecognition(){
  if(!listening || speaking) return;
  if(selectedMode==="native"){
    if(!recognition) recognition=makeNativeRecognition();
    try{ recognition.start(); }catch(e){}
  }else if(selectedMode==="whisper"){
    startWhisperChunk();
  }else{
    statusBox.textContent="Automatische Erkennung ist in diesem Browser nicht möglich.";
  }
}
function stopRecognitionOnly(){
  clearTimeout(recordTimer);
  if(recognition){ try{recognition.stop();}catch(e){} }
  if(recorder?.state==="recording"){ try{recorder.stop();}catch(e){} }
}
function stopAll(){
  listening=false; stopRecognitionOnly();
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  statusBox.textContent="⏹ Gestoppt.";
}
$("#startBtn").onclick=()=>{ listening=true; startRecognition(); };
$("#stopBtn").onclick=stopAll;

/* ---------- Themen ---------- */
const TOPICS={
 "☕ Kaffee":["Ich möchte bitte einen Kaffee.","Mit Milch bitte.","Ohne Zucker bitte.","Nein danke."],
 "🥤 Trinken":["Ich möchte bitte etwas trinken.","Bitte Wasser.","Bitte langsam.","Danke, das reicht."],
 "🍽️ Essen":["Ich möchte bitte etwas essen.","Bitte noch etwas.","Danke, ich bin fertig.","Das schmeckt mir."],
 "😣 Schmerzen":["Ich habe Schmerzen.","Die Schmerzen sind stärker.","Bitte stellen Sie Ja-oder-Nein-Fragen.","Ich brauche Hilfe."],
 "🏥 Krankenhaus":["Bitte warten Sie kurz.","Bitte Ja-oder-Nein-Fragen.","Ich brauche Hilfe.","Bitte noch einmal erklären."],
 "🏠 Zuhause":["Bitte hilf mir kurz.","Ich brauche etwas.","Alles passt.","Bitte einen Moment warten."],
 "📅 Termin":["Ja, der Termin passt.","Nein, der Termin passt nicht.","Geht es später?","Bitte schriftlich schicken."],
 "📞 Telefon":["Hallo, ich kommuniziere mit Sprachausgabe.","Bitte langsam sprechen.","Bitte wiederholen.","Einen Moment bitte."],
 "✅ Ja / Nein":["Ja.","Nein.","Vielleicht.","Ich weiß es noch nicht."],
 "🆘 Hilfe":["Ich brauche Hilfe.","Bitte warten.","Bitte holen Sie jemanden.","Es ist dringend."]
};
function renderTopics(){
  const g=$("#topicGrid"); g.innerHTML="";
  Object.keys(TOPICS).forEach(topic=>{
    const b=document.createElement("button"); b.textContent=topic;
    b.onclick=()=>{
      const w=$("#topicPhrases"); w.innerHTML="";
      TOPICS[topic].forEach(s=>{
        const x=document.createElement("button"); x.textContent=s; x.onclick=()=>speak(s); w.appendChild(x);
      });
    };
    g.appendChild(b);
  });
}
renderTopics();

/* ---------- Eigene Sätze ---------- */
const SAVE_KEY="tonguebox_saved_phrases";
function getSaved(){ try{return JSON.parse(localStorage.getItem(SAVE_KEY)||"[]")}catch(e){return[]} }
function renderSaved(){
  const w=$("#savedList"), list=getSaved(); w.innerHTML="";
  if(!list.length){w.textContent="Noch keine Sätze gespeichert.";return}
  list.forEach((s,i)=>{
    const row=document.createElement("div"); row.className="saved-row";
    const b=document.createElement("button"); b.textContent=s; b.onclick=()=>speak(s);
    const d=document.createElement("button"); d.className="delete"; d.textContent="🗑 Löschen";
    d.onclick=()=>{const l=getSaved();l.splice(i,1);localStorage.setItem(SAVE_KEY,JSON.stringify(l));renderSaved()};
    row.append(b,d); w.appendChild(row);
  });
}
$("#saveBtn").onclick=()=>{
  const v=$("#saveInput").value.trim(); if(!v)return;
  const l=getSaved(); if(!l.includes(v))l.push(v);
  localStorage.setItem(SAVE_KEY,JSON.stringify(l)); $("#saveInput").value=""; renderSaved();
};
renderSaved();

/* ---------- Manuell + Hilfe ---------- */
$("#manualSpeak").onclick=()=>speak($("#manualText").value);
$("#panic").onclick=()=>speak("Bitte warten. Ich kommuniziere mit Augensteuerung und brauche einen kurzen Moment.");
</script>
</body>
</html>
