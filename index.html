<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Tonguebox</title>

<style>

/* =========================
   GRUNDLAYOUT
========================= */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:6px;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef2f6;
  color:#111;
}

.app{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:30px;
  margin:10px 0 4px;
}

.subtitle{
  text-align:center;
  font-size:18px;
  margin:0 0 8px;
}

#timeInfo{
  text-align:center;
  font-size:21px;
  font-weight:bold;
  margin-bottom:12px;
}


/* =========================
   SCREENREADER
========================= */

.visually-hidden{
  position:absolute !important;
  width:1px !important;
  height:1px !important;
  padding:0 !important;
  margin:-1px !important;
  overflow:hidden !important;
  clip:rect(0,0,0,0) !important;
  white-space:nowrap !important;
  border:0 !important;
}


/* =========================
   FOKUS
========================= */

button,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

button:focus-visible,
textarea:focus-visible{
  outline:7px solid #ff9800;
  outline-offset:4px;
}


/* =========================
   ALLGEMEINE BUTTONS
========================= */

button{
  width:100%;
  min-height:100px;
  padding:14px;
  border:none;
  border-radius:20px;
  font-size:21px;
  font-weight:bold;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}


/* =========================
   JA / NEIN
========================= */

.yes{
  background:#2e7d32;
  color:white;
  min-height:145px;
  font-size:38px;
}

.no{
  background:#c62828;
  color:white;
  min-height:145px;
  font-size:38px;
}


/* =========================
   KATEGORIEN
========================= */

.category{
  margin-top:10px;
  margin-bottom:10px;
}


/*
  DIE GANZE KATEGORIE IST EIN BUTTON
*/

.categoryButton{
  width:100%;
  min-height:110px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:18px 20px;

  background:#dfe7f1;
  color:#111;

  border:4px solid #b0bec5;
  border-radius:20px;

  font-size:23px;
  font-weight:bold;

  text-align:left;
}


/*
  Der ganze Bereich gehört zum Button.
*/

.categoryButton span{
  pointer-events:none;
}


.categoryButton.open{
  background:#c5d4e8;
  border-color:#1565c0;

  border-bottom-left-radius:0;
  border-bottom-right-radius:0;
}


.arrow{
  font-size:28px;
  margin-left:14px;
}


.categoryContent{
  display:none;

  background:white;

  padding:12px;

  border-left:4px solid #b0bec5;
  border-right:4px solid #b0bec5;
  border-bottom:4px solid #b0bec5;

  border-bottom-left-radius:20px;
  border-bottom-right-radius:20px;
}


.categoryContent.open{
  display:block;
}


/* =========================
   TEXT
========================= */

textarea{
  width:100%;
  min-height:230px;

  padding:16px;

  border:4px solid #222;
  border-radius:18px;

  font-size:27px;
  line-height:1.4;

  resize:none;
}

.speak{
  background:#1565c0;
  color:white;
}

.save{
  background:#2e7d32;
  color:white;
}

.clear{
  background:#555;
  color:white;
}

.stop{
  background:#c62828;
  color:white;
}


/* =========================
   TAGESZEIT
========================= */

.timeButton{
  background:#fff8e1;
  border:4px solid #ffb300;
}


/* =========================
   VORSCHLÄGE
========================= */

.smart{
  background:#ede7f6;
  border:4px solid #673ab7;
}

.suggestion{
  background:#ede7f6;
  border:4px solid #673ab7;
  text-align:left;
  margin-bottom:10px;
}


/* =========================
   SCHNELLKOMMUNIKATION
========================= */

.quick{
  background:#e3f2fd;
  border:4px solid #1976d2;
}

.emergency{
  background:#b71c1c;
  color:white;
}


/* =========================
   STIMMEN
========================= */

.voiceIntro{
  font-size:20px;
  line-height:1.4;
}

.voiceButton{
  width:100%;

  min-height:155px;

  margin-bottom:14px;

  padding:20px;

  background:#fff;

  border:5px solid #1976d2;
  border-radius:24px;

  color:#111;

  text-align:left;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:flex-start;

  gap:8px;
}


.voiceButton.selected{
  background:#dcedc8;
  border:7px solid #2e7d32;
}


.voiceName{
  display:block;

  width:100%;

  font-size:28px;
  font-weight:bold;
}


.voiceLang{
  display:block;

  font-size:21px;
  font-weight:normal;
}


.voiceSelectedLabel{
  display:block;

  font-size:21px;
  font-weight:bold;

  color:#1b5e20;
}


.voiceTest{
  min-height:130px;
  margin-top:10px;

  background:#1565c0;
  color:white;

  font-size:25px;
}


/* =========================
   STATUS
========================= */

.status{
  min-height:32px;
  margin-top:9px;
  font-size:19px;
  font-weight:bold;
}


/* =========================
   GESPEICHERT
========================= */

.saved{
  background:#512da8;
  color:white;
  text-align:left;
  margin-bottom:8px;
}

.savedActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:14px;
}

.edit{
  background:#ffca28;
  min-height:75px;
}

.delete{
  background:#c62828;
  color:white;
  min-height:75px;
}


/* =========================
   IPHONE
========================= */

@media(max-width:500px){

  body{
    padding:5px;
  }

  h1{
    font-size:27px;
  }

  button{
    min-height:105px;
    font-size:21px;
  }

  .yes,
  .no{
    min-height:150px;
    font-size:36px;
  }

  textarea{
    min-height:240px;
    font-size:26px;
  }

  /*
    KATEGORIEN EXTRA GROSS
  */

  .categoryButton{
    min-height:120px;
    font-size:23px;
    padding:20px;
  }

  .arrow{
    font-size:30px;
  }

  /*
    STIMMEN EXTRA GROSS
  */

  .voiceButton{
    min-height:165px;
    padding:22px;
  }

  .voiceName{
    font-size:28px;
  }

  .voiceLang{
    font-size:21px;
  }

}

</style>
</head>


<body>

<main class="app">

<header>

<h1>
👅 Tonguebox
</h1>

<p class="subtitle">
Unterstützte Kommunikation
</p>

<div
  id="timeInfo"
  aria-live="polite">
Tageszeit wird erkannt...
</div>

</header>


<!-- =========================
     JA / NEIN
========================= -->

<section>

<h2 class="visually-hidden">
Sofortantworten
</h2>

<div class="grid2">

<button
  class="yes speakPhrase"
  data-text="Ja"
  type="button"
  aria-label="Ja sprechen">
✅ JA
</button>

<button
  class="no speakPhrase"
  data-text="Nein"
  type="button"
  aria-label="Nein sprechen">
❌ NEIN
</button>

</div>

</section>


<!-- =========================
     TAGESZEIT
========================= -->

<section class="category">

<button
  class="categoryButton"
  type="button"
  aria-expanded="false"
  aria-controls="timeCategory">

<span>
🕒 Tageszeit
</span>

<span class="arrow">
▼
</span>

</button>


<div
  id="timeCategory"
  class="categoryContent">

<div
  id="timeButtons"
  class="grid2">
</div>

</div>

</section>


<!-- =========================
     TEXT SCHREIBEN
========================= -->

<section class="category">

<button
  id="textCategoryButton"
  class="categoryButton"
  type="button"
  aria-expanded="false"
  aria-controls="textCategory">

<span>
⌨️ Text schreiben
</span>

<span class="arrow">
▼
</span>

</button>


<div
  id="textCategory"
  class="categoryContent">

<label
  class="visually-hidden"
  for="textInput">
Text eingeben
</label>

<textarea
  id="textInput"
  placeholder="Was möchtest du sagen?"
  spellcheck="true"
  aria-label="Text eingeben">
</textarea>


<div
  class="grid2"
  style="margin-top:10px;">

<button
  id="speakButton"
  class="speak"
  type="button">
🔊 Sprechen
</button>

<button
  id="saveButton"
  class="save"
  type="button">
⭐ Speichern
</button>

<button
  id="clearButton"
  class="clear"
  type="button">
🗑 Leeren
</button>

<button
  id="stopButton"
  class="stop"
  type="button">
⏹ Stopp
</button>

</div>


<div
  id="status"
  class="status"
  role="status"
  aria-live="polite">
</div>

</div>

</section>


<!-- =========================
     INTELLIGENTE VORSCHLÄGE
========================= -->

<section class="category">

<button
  class="categoryButton"
  type="button"
  aria-expanded="false"
  aria-controls="suggestionCategory">

<span>
✨ Intelligente Vorschläge
</span>

<span class="arrow">
▼
</span>

</button>


<div
  id="suggestionCategory"
  class="categoryContent">

<button
  id="suggestionButton"
  class="smart"
  type="button">
✨ Vorschläge erstellen
</button>


<div
  id="suggestionStatus"
  class="status"
  role="status"
  aria-live="polite">
</div>


<div
  id="suggestionBox">
</div>

</div>

</section>


<!-- =========================
     SCHNELLKOMMUNIKATION
========================= -->

<section class="category">

<button
  class="categoryButton"
  type="button"
  aria-expanded="false"
  aria-controls="quickCategory">

<span>
⚡ Schnellkommunikation
</span>

<span class="arrow">
▼
</span>

</button>


<div
  id="quickCategory"
  class="categoryContent">

<div class="grid2">


<button
  class="quick speakPhrase"
  data-text="Hallo"
  type="button">
👋 Hallo
</button>


<button
  class="quick speakPhrase"
  data-text="Danke"
  type="button">
🙏 Danke
</button>


<button
  class="quick speakPhrase"
  data-text="Bitte warten Sie kurz."
  type="button">
⏳ Warten
</button>


<button
  class="quick speakPhrase"
  data-text="Bitte sagen Sie das noch einmal."
  type="button">
🔁 Nochmal
</button>


<button
  class="quick speakPhrase"
  data-text="Ich brauche Hilfe."
  type="button">
🆘 Hilfe
</button>


<button
  class="quick speakPhrase"
  data-text="Ich möchte etwas trinken."
  type="button">
🥤 Trinken
</button>


<button
  class="quick speakPhrase"
  data-text="Ich möchte etwas essen."
  type="button">
🍽 Essen
</button>


<button
  class="quick speakPhrase"
  data-text="Ich muss auf die Toilette."
  type="button">
🚻 WC
</button>


<button
  class="quick speakPhrase"
  data-text="Ich habe Sie nicht verstanden."
  type="button">
❓ Nicht verstanden
</button>


<button
  class="quick speakPhrase"
  data-text="Bitte sprechen Sie langsamer."
  type="button">
🐢 Langsamer
</button>


<button
  class="quick speakPhrase"
  data-text="Bitte geben Sie mir etwas Zeit zum Antworten."
  type="button">
⏳ Mehr Zeit
</button>


<button
  class="quick speakPhrase"
  data-text="Ich kommuniziere mit einer Augensteuerung."
  type="button">
👁 Augensteuerung
</button>


<button
  class="quick speakPhrase"
  data-text="Ich habe Schmerzen."
  type="button">
🤕 Schmerzen
</button>


<button
  class="emergency speakPhrase"
  data-text="Das ist ein Notfall. Bitte holen Sie sofort Hilfe."
  type="button">
🚨 NOTFALL
</button>


</div>

</div>

</section>


<!-- =========================
     STIMMAUSWAHL
========================= -->

<section class="category">

<button
  class="categoryButton"
  type="button"
  aria-expanded="false"
  aria-controls="voiceCategory">

<span>
🗣 Stimme auswählen
</span>

<span class="arrow">
▼
</span>

</button>


<div
  id="voiceCategory"
  class="categoryContent">

<p class="voiceIntro">
Tippe auf eine Stimme. Die komplette große Schaltfläche ist auswählbar.
</p>


<div
  id="voiceStatus"
  class="status"
  role="status"
  aria-live="polite">
</div>


<div
  id="voiceButtons"
  role="radiogroup"
  aria-label="Stimmen auswählen">
</div>


<button
  id="voiceTestButton"
  class="voiceTest"
  type="button">
🔊 Ausgewählte Stimme testen
</button>

</div>

</section>


<!-- =========================
     GESPEICHERTE SÄTZE
========================= -->

<section class="category">

<button
  class="categoryButton"
  type="button"
  aria-expanded="false"
  aria-controls="savedCategory">

<span>
⭐ Gespeicherte Sätze
</span>

<span class="arrow">
▼
</span>

</button>


<div
  id="savedCategory"
  class="categoryContent">

<div
  id="savedStatus"
  class="status"
  role="status"
  aria-live="polite">
</div>

<div id="savedBox"></div>

</div>

</section>


</main>


<script>

document.addEventListener(
"DOMContentLoaded",
function(){


var textInput =
  document.getElementById("textInput");

var statusBox =
  document.getElementById("status");

var suggestionBox =
  document.getElementById("suggestionBox");

var suggestionStatus =
  document.getElementById("suggestionStatus");

var savedBox =
  document.getElementById("savedBox");

var savedStatus =
  document.getElementById("savedStatus");

var timeButtons =
  document.getElementById("timeButtons");

var timeInfo =
  document.getElementById("timeInfo");

var voiceButtons =
  document.getElementById("voiceButtons");

var voiceStatus =
  document.getElementById("voiceStatus");


var voices = [];

var selectedVoiceName =
  localStorage.getItem("tongueboxVoice") || "";


/* =========================
   KATEGORIEN
========================= */

var categoryButtons =
  document.querySelectorAll(".categoryButton");


for(
  var c = 0;
  c < categoryButtons.length;
  c++
){

  categoryButtons[c]
  .addEventListener(
  "click",
  function(){

    var currentButton =
      this;

    var targetId =
      currentButton.getAttribute(
        "aria-controls"
      );

    var target =
      document.getElementById(
        targetId
      );

    var isOpen =
      currentButton.getAttribute(
        "aria-expanded"
      ) === "true";


    /*
      ALLE ANDEREN SCHLIESSEN
    */

    for(
      var i = 0;
      i < categoryButtons.length;
      i++
    ){

      categoryButtons[i]
      .setAttribute(
        "aria-expanded",
        "false"
      );

      categoryButtons[i]
      .classList.remove(
        "open"
      );

      var otherId =
        categoryButtons[i]
        .getAttribute(
          "aria-controls"
        );

      var otherContent =
        document.getElementById(
          otherId
        );

      if(otherContent){

        otherContent
        .classList.remove(
          "open"
        );
      }

      var arrow =
        categoryButtons[i]
        .querySelector(
          ".arrow"
        );

      if(arrow){
        arrow.textContent =
          "▼";
      }
    }


    /*
      WENN VORHER GESCHLOSSEN:
      JETZT ÖFFNEN
    */

    if(!isOpen){

      currentButton
      .setAttribute(
        "aria-expanded",
        "true"
      );

      currentButton
      .classList.add(
        "open"
      );

      target
      .classList.add(
        "open"
      );

      var currentArrow =
        currentButton
        .querySelector(
          ".arrow"
        );

      if(currentArrow){
        currentArrow.textContent =
          "▲";
      }


      /*
        ZENTRIEREN
      */

      setTimeout(
      function(){

        currentButton.scrollIntoView({
          behavior:"smooth",
          block:"center"
        });

      },
      180
      );

    }

  });

}


/* =========================
   TAGESZEIT
========================= */

function getDayTime(){

  var hour =
    new Date().getHours();

  if(hour >= 5 && hour < 11){
    return "morgen";
  }

  if(hour >= 11 && hour < 15){
    return "mittag";
  }

  if(hour >= 15 && hour < 18){
    return "nachmittag";
  }

  if(hour >= 18 && hour < 23){
    return "abend";
  }

  return "nacht";
}


function getGreeting(){

  var time =
    getDayTime();

  if(time === "morgen"){
    return "Guten Morgen";
  }

  if(time === "mittag"){
    return "Guten Appetit";
  }

  if(time === "nachmittag"){
    return "Guten Nachmittag";
  }

  if(time === "abend"){
    return "Guten Abend";
  }

  return "Gute Nacht";
}


function getTimePhrases(){

  var time =
    getDayTime();

  if(time === "morgen"){

    return [
      "Guten Morgen.",
      "Guten Morgen, wie geht es Ihnen?",
      "Ich möchte frühstücken.",
      "Ich hätte gerne einen Kaffee."
    ];
  }

  if(time === "mittag"){

    return [
      "Guten Appetit.",
      "Guten Appetit zusammen.",
      "Ich möchte etwas essen.",
      "Bitte helfen Sie mir beim Essen."
    ];
  }

  if(time === "nachmittag"){

    return [
      "Guten Nachmittag.",
      "Ich hätte gerne einen Kaffee.",
      "Ich möchte etwas trinken.",
      "Ich brauche eine Pause."
    ];
  }

  if(time === "abend"){

    return [
      "Guten Abend.",
      "Ich wünsche Ihnen einen schönen Abend.",
      "Ich möchte mich ausruhen.",
      "Danke für heute."
    ];
  }

  return [
    "Gute Nacht.",
    "Ich möchte schlafen.",
    "Ich brauche Hilfe.",
    "Ich muss auf die Toilette."
  ];
}


function updateTimeArea(){

  var time =
    getDayTime();

  var labels = {

    morgen:
      "🌅 Guten Morgen",

    mittag:
      "🍽 Guten Appetit",

    nachmittag:
      "🌤 Guten Nachmittag",

    abend:
      "🌙 Guten Abend",

    nacht:
      "🌙 Gute Nacht"
  };


  timeInfo.textContent =
    labels[time];


  timeButtons.innerHTML =
    "";


  var phrases =
    getTimePhrases();


  for(
    var i = 0;
    i < phrases.length;
    i++
  ){

    createTimeButton(
      phrases[i]
    );
  }

}


function createTimeButton(sentence){

  var button =
    document.createElement(
      "button"
    );

  button.type =
    "button";

  button.className =
    "timeButton";

  button.textContent =
    sentence;

  button.setAttribute(
    "aria-label",
    sentence + " sprechen"
  );


  button.addEventListener(
  "click",
  function(){

    speakText(sentence);

  });


  timeButtons.appendChild(
    button
  );
}


updateTimeArea();

setInterval(
  updateTimeArea,
  300000
);


/* =========================
   STIMMEN LADEN
========================= */

function loadVoices(){

  if(
    !(
      "speechSynthesis"
      in
      window
    )
  ){

    voiceStatus.textContent =
      "Sprachausgabe wird nicht unterstützt.";

    return;
  }


  voices =
    speechSynthesis.getVoices();


  voiceButtons.innerHTML =
    "";


  if(
    voices.length === 0
  ){

    voiceStatus.textContent =
      "Stimmen werden geladen...";

    return;
  }


  voices.sort(
  function(a,b){

    var aGerman =
      a.lang
      .toLowerCase()
      .startsWith("de");

    var bGerman =
      b.lang
      .toLowerCase()
      .startsWith("de");


    if(
      aGerman &&
      !bGerman
    ){
      return -1;
    }

    if(
      !aGerman &&
      bGerman
    ){
      return 1;
    }

    return a.name.localeCompare(
      b.name
    );
  });


  if(!selectedVoiceName){

    for(
      var i = 0;
      i < voices.length;
      i++
    ){

      if(
        voices[i]
        .lang
        .toLowerCase()
        .startsWith("de")
      ){

        selectedVoiceName =
          voices[i].name;

        break;
      }
    }


    if(
      !selectedVoiceName &&
      voices[0]
    ){

      selectedVoiceName =
        voices[0].name;
    }


    localStorage.setItem(
      "tongueboxVoice",
      selectedVoiceName
    );
  }


  for(
    var v = 0;
    v < voices.length;
    v++
  ){

    createVoiceButton(
      voices[v]
    );
  }


  voiceStatus.textContent =
    "Aktuelle Stimme: " +
    selectedVoiceName;
}


/* =========================
   GROSSER STIMMENBUTTON
========================= */

function createVoiceButton(voice){

  var button =
    document.createElement(
      "button"
    );


  button.type =
    "button";

  button.className =
    "voiceButton";

  button.setAttribute(
    "role",
    "radio"
  );


  var selected =
    voice.name ===
    selectedVoiceName;


  button.setAttribute(
    "aria-checked",
    selected
      ? "true"
      : "false"
  );


  if(selected){

    button.classList.add(
      "selected"
    );
  }


  var name =
    document.createElement(
      "span"
    );

  name.className =
    "voiceName";

  name.textContent =
    selected
      ? "✅ " + voice.name
      : "🗣 " + voice.name;


  var language =
    document.createElement(
      "span"
    );

  language.className =
    "voiceLang";

  language.textContent =
    "Sprache: " +
    voice.lang;


  button.appendChild(
    name
  );

  button.appendChild(
    language
  );


  if(selected){

    var selectedLabel =
      document.createElement(
        "span"
      );

    selectedLabel.className =
      "voiceSelectedLabel";

    selectedLabel.textContent =
      "✅ AUSGEWÄHLT";

    button.appendChild(
      selectedLabel
    );
  }


  button.setAttribute(
    "aria-label",
    voice.name +
    ", Sprache " +
    voice.lang +
    (
      selected
      ? ", ausgewählt"
      : ", auswählen"
    )
  );


  button.addEventListener(
  "click",
  function(){

    selectedVoiceName =
      voice.name;


    localStorage.setItem(
      "tongueboxVoice",
      selectedVoiceName
    );


    loadVoices();


    setTimeout(
    function(){

      speakText(
        "Hallo. Das ist meine ausgewählte Stimme."
      );

    },
    100
    );

  });


  voiceButtons.appendChild(
    button
  );
}


loadVoices();


if(
  "speechSynthesis"
  in
  window
){

  speechSynthesis.onvoiceschanged =
    loadVoices;
}


/* =========================
   AUSGEWÄHLTE STIMME
========================= */

function getSelectedVoice(){

  for(
    var i = 0;
    i < voices.length;
    i++
  ){

    if(
      voices[i].name ===
      selectedVoiceName
    ){

      return voices[i];
    }
  }

  return null;
}

/* =========================
   SPRECHEN
========================= */

function speakText(message){

  message =
    String(
      message || ""
    ).trim();

  if(!message){
    return;
  }


  if(
    !(
      "speechSynthesis"
      in
      window
    )
  ){

    statusBox.textContent =
      "Sprachausgabe wird nicht unterstützt.";

    return;
  }


  speechSynthesis.cancel();


  var speech =
    new SpeechSynthesisUtterance(
      message
    );


  var selected =
    getSelectedVoice();


  if(selected){

    speech.voice =
      selected;

    speech.lang =
      selected.lang;
  }

  else{

    speech.lang =
      "de-DE";
  }


  speech.rate =
    0.95;


  speechSynthesis.speak(
    speech
  );
}

/* =========================
   INTELLIGENTE VORSCHLÄGE
========================= */

document
.getElementById(
  "suggestionButton"
)
.addEventListener(
"click",
function(){

  var text =
    textInput.value.trim();

  var lower =
    text.toLowerCase();

  var time =
    getDayTime();

  var greeting =
    getGreeting();

  var list = [];


  if(!text){

    list =
      getTimePhrases()
      .slice(0,3);

  }


  else if(
    lower.includes("hallo")
  ){

    list = [
      greeting + ".",
      greeting + ", schön Sie zu sehen.",
      greeting + ", wie geht es Ihnen?"
    ];

  }


  else if(
    lower.includes("kaffee")
  ){

    if(time === "morgen"){

      list = [
        "Guten Morgen, ich hätte gerne einen Kaffee.",
        "Könnten Sie mir bitte einen Kaffee bringen?",
        "Ich möchte gerne einen Kaffee."
      ];

    }

    else{

      list = [
        "Ich hätte gerne einen Kaffee.",
        "Könnten Sie mir bitte einen Kaffee bringen?",
        "Ich möchte bitte einen Kaffee."
      ];

    }

  }


  else if(
    lower.includes("essen") ||
    lower.includes("hunger")
  ){

    if(time === "mittag"){

      list = [
        "Guten Appetit.",
        "Ich möchte etwas essen.",
        "Bitte helfen Sie mir beim Essen."
      ];

    }

    else if(time === "abend"){

      list = [
        "Guten Abend, ich möchte etwas essen.",
        "Ich hätte gerne Abendessen.",
        "Bitte helfen Sie mir beim Essen."
      ];

    }

    else{

      list = [
        "Ich möchte etwas essen.",
        "Ich habe Hunger.",
        "Bitte helfen Sie mir beim Essen."
      ];

    }

  }


  else if(
    lower.includes("trinken")
  ){

    list = [
      "Ich möchte etwas trinken.",
      "Ich hätte gerne Wasser.",
      "Bitte helfen Sie mir beim Trinken."
    ];

  }


  else if(
    lower.includes("hilfe")
  ){

    list = [
      "Ich brauche Hilfe.",
      "Könnten Sie mir bitte helfen?",
      "Bitte helfen Sie mir."
    ];

  }


  else{

      cleanText(text),

    ];

});


function showSuggestions(list){

  suggestionBox.innerHTML =
    "";

  suggestionStatus.textContent =
    list.length +
    " Vorschläge verfügbar.";


  for(
    var i = 0;
    i < list.length;
    i++
  ){

    createSuggestion(
      list[i],
      i
    );
  }
}


function createSuggestion(
  sentence,
  index
){

  var button =
    document.createElement(
      "button"
    );

  button.type =
    "button";

  button.className =
    "suggestion";

  button.textContent =
    "✨ " +
    sentence;

  button.setAttribute(
    "aria-label",
    "Vorschlag " +
    (index + 1) +
    ": " +
    sentence
  );


  button.addEventListener(
  "click",
  function(){

    textInput.value =
      sentence;

    speakText(
      sentence
    );

  });


  suggestionBox.appendChild(
    button
  );
}


/* =========================
   TEXTHILFEN
========================= */

function cleanText(text){

  text =
    String(
      text || ""
    ).trim();

  if(!text){
    return "";
  }

  text =
    text.replace(
      /\s+/g,
      " "
    );


  text =
    text.charAt(0)
    .toUpperCase() +
    text.slice(1);


  if(
    !/[.!?]$/.test(text)
  ){

    text += ".";
  }

  return text;
}


function lowerFirst(text){

  if(!text){
    return "";
  }

  return (
    text.charAt(0)
    .toLowerCase() +
    text.slice(1)
  );
}


function friendlyText(text){

  text =
    String(
      text || ""
    )
    .trim()
    .replace(
      /[.!?]+$/,
      ""
    );

  if(!text){
    return "";
  }


  if(
    !text
    .toLowerCase()
    .includes("bitte")
  ){

    text =
      "Bitte " +
      lowerFirst(text);
  }

  return cleanText(text);
}


function questionText(text){

  text =
    String(
      text || ""
    )
    .trim()
    .replace(
      /[.!?]+$/,
      ""
    );

  if(!text){
    return "";
  }


  return (
    "Könnten Sie bitte " +
    lowerFirst(text) +
    "?"
  );
}


/* =========================
   GESPEICHERTE SÄTZE
========================= */

function getSaved(){

  try{

    var result =
      JSON.parse(
        localStorage.getItem(
          "tongueboxSaved"
        ) || "[]"
      );

    return Array.isArray(result)
      ? result
      : [];

  }

  catch(error){

    return [];
  }
}


function saveSaved(list){

  localStorage.setItem(
    "tongueboxSaved",
    JSON.stringify(list)
  );
}


/* SPEICHERN */

document
.getElementById(
  "saveButton"
)
.addEventListener(
"click",
function(){

  var text =
    textInput.value.trim();

  if(!text){

    statusBox.textContent =
      "Bitte zuerst Text eingeben.";

    return;
  }


  var saved =
    getSaved();


  if(
    saved.indexOf(text) ===
    -1
  ){

    saved.push(text);

    saveSaved(saved);

    statusBox.textContent =
      "Satz gespeichert.";

  }

  showSaved();

});


/* ANZEIGEN */

function showSaved(){

  savedBox.innerHTML =
    "";

  var saved =
    getSaved();


  if(
    saved.length === 0
  ){

    savedBox.innerHTML =
      "<p>Noch keine Sätze gespeichert.</p>";

    return;
  }


  for(
    var i = 0;
    i < saved.length;
    i++
  ){

    createSavedItem(
      saved[i],
      i
    );
  }
}


function createSavedItem(
  sentence,
  index
){

  var speak =
    document.createElement(
      "button"
    );

  speak.type =
    "button";

  speak.className =
    "saved";

  speak.textContent =
    "🔊 " +
    sentence;


  speak.addEventListener(
  "click",
  function(){

    speakText(
      sentence
    );

  });


  var actions =
    document.createElement(
      "div"
    );

  actions.className =
    "savedActions";


  var edit =
    document.createElement(
      "button"
    );

  edit.type =
    "button";

  edit.className =
    "edit";

  edit.textContent =
    "✏️ Bearbeiten";


  edit.addEventListener(
  "click",
  function(){

    textInput.value =
      sentence;


    var textButton =
      document.getElementById(
        "textCategoryButton"
      );


    if(
      textButton.getAttribute(
        "aria-expanded"
      ) !== "true"
    ){

      textButton.click();
    }


    setTimeout(
    function(){

      textInput.focus();

    },
    200
    );

  });


  var remove =
    document.createElement(
      "button"
    );

  remove.type =
    "button";

  remove.className =
    "delete";

  remove.textContent =
    "🗑 Löschen";


  remove.addEventListener(
  "click",
  function(){

    var saved =
      getSaved();

    saved.splice(
      index,
      1
    );

    saveSaved(
      saved
    );

    savedStatus.textContent =
      "Satz gelöscht.";

    showSaved();

  });


  actions.appendChild(
    edit
  );

  actions.appendChild(
    remove
  );

  savedBox.appendChild(
    speak
  );

  savedBox.appendChild(
    actions
  );
}


showSaved();

});
