<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tonguebox – Sprich mit deinen Augen</title>

<style>

/* =========================================
   GRUNDEINSTELLUNGEN
========================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 12px;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef2f5;
    color: #17212b;
}

main {
    max-width: 1000px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 2.5rem;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    font-size: 1.3rem;
    margin-top: 0;
    margin-bottom: 25px;
}


/* =========================================
   WEISSE BEREICHE
========================================= */

.text-section {
    background: white;
    padding: 20px;
    border-radius: 20px;
    margin-bottom: 20px;

    box-shadow:
        0 3px 10px rgba(0,0,0,0.08);
}


/* =========================================
   JA / NEIN GANZ OBEN
========================================= */

.quick-answer-title {
    text-align: center;
    margin-top: 0;
    margin-bottom: 18px;
}

.yes-no {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.yes {
    min-height: 150px;

    border: none;
    border-radius: 20px;

    background: #198754;
    color: white;

    font-size: 2.5rem;
    font-weight: bold;

    cursor: pointer;
}

.no {
    min-height: 150px;

    border: none;
    border-radius: 20px;

    background: #c62828;
    color: white;

    font-size: 2.5rem;
    font-weight: bold;

    cursor: pointer;
}


/* =========================================
   TEXTEINGABE
========================================= */

textarea {
    width: 100%;
    min-height: 180px;

    padding: 18px;

    font-size: 1.5rem;

    border: 3px solid #555;
    border-radius: 16px;

    resize: vertical;
}


/* =========================================
   BUTTONS
========================================= */

button {
    cursor: pointer;
    font-family: inherit;
}

.big-button {
    width: 100%;
    min-height: 105px;

    margin-top: 14px;
    padding: 18px;

    font-size: 1.6rem;
    font-weight: bold;

    border: none;
    border-radius: 16px;

    background: #0066cc;
    color: white;
}

.action-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

    gap: 15px;
    margin-top: 15px;
}

.action-grid button {
    min-height: 90px;

    padding: 15px;

    font-size: 1.3rem;
    font-weight: bold;

    border: none;
    border-radius: 15px;

    background: #0066cc;
    color: white;
}


/* =========================================
   AUF- UND ZUKLAPPBARE BEREICHE
========================================= */

.accordion {
    margin-bottom: 18px;

    border-radius: 20px;
    overflow: hidden;

    background: white;

    box-shadow:
        0 3px 10px rgba(0,0,0,0.08);
}


/* großer Kategorie-Button */

.accordion-toggle {
    width: 100%;
    min-height: 125px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    padding: 22px;

    border: none;

    background: #087f8c;
    color: white;

    font-size: 1.6rem;
    font-weight: bold;

    text-align: left;
}


/* Kategorie geöffnet */

.accordion-toggle.open {
    background: #065f69;
}


/* linke Seite */

.accordion-left {
    display: flex;
    align-items: center;
    gap: 18px;
}

.accordion-icon {
    font-size: 2.5rem;
}

.accordion-title {
    font-size: 1.55rem;
}


/* Pfeil */

.accordion-arrow {
    font-size: 2rem;

    min-width: 40px;

    text-align: center;

    transition: transform 0.2s ease;
}

.accordion-toggle.open
.accordion-arrow {
    transform: rotate(180deg);
}


/* Inhalt standardmäßig versteckt */

.accordion-content {
    display: none;

    padding: 20px;

    border-top:
        4px solid #d9e3e8;

    background: white;
}


/* geöffneter Inhalt */

.accordion-content.open {
    display: block;
}


/* =========================================
   SÄTZE INNERHALB DER KATEGORIEN
========================================= */

.phrase-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));

    gap: 16px;
}

.phrase-button {
    min-height: 110px;

    padding: 18px;

    border: none;
    border-radius: 16px;

    background: #5b3cc4;
    color: white;

    font-size: 1.3rem;
    font-weight: bold;
}


/* =========================================
   STIMME
========================================= */

select {
    width: 100%;
    min-height: 80px;

    padding: 15px;

    font-size: 1.3rem;

    border: 3px solid #555;
    border-radius: 15px;

    background: white;
}


/* =========================================
   GESPEICHERTE SÄTZE
========================================= */

.saved-button {
    background: #7349c6;
}

.delete-button {
    width: 100%;
    min-height: 70px;

    margin-top: 8px;

    border: none;
    border-radius: 14px;

    background: #b71c1c;
    color: white;

    font-size: 1.1rem;
    font-weight: bold;
}


/* =========================================
   BLICKERFASSUNG / FOKUS
========================================= */

button:focus-visible,
textarea:focus-visible,
select:focus-visible {

    outline: 7px solid #ffd400;
    outline-offset: 5px;
}


/* =========================================
   STATUS
========================================= */

#status {
    padding: 15px;

    font-size: 1.2rem;
    font-weight: bold;

    text-align: center;
}


/* =========================================
   IPHONE / KLEINE BILDSCHIRME
========================================= */

@media(max-width:650px) {

    body {
        padding: 8px;
    }

    h1 {
        font-size: 2rem;
    }

    .yes,
    .no {
        min-height: 135px;
        font-size: 2.2rem;
    }

    .accordion-toggle {
        min-height: 130px;
        padding: 18px;
    }

    .accordion-title {
        font-size: 1.35rem;
    }

    .accordion-icon {
        font-size: 2.2rem;
    }

    .phrase-grid {
        grid-template-columns: 1fr;
    }

}


/* sehr kleines Display */

@media(max-width:400px) {

    .yes-no {
        gap: 10px;
    }

    .yes,
    .no {
        min-height: 125px;
        font-size: 2rem;
    }

}

</style>

<script>

/* =========================================
   ELEMENTE
========================================= */

const textField =
    document.getElementById("speechText");

const voiceSelect =
    document.getElementById("voiceSelect");

const status =
    document.getElementById("status");

let voices = [];


/* =========================================
   AUF- UND ZUKLAPPEN

   Immer nur EIN Bereich gleichzeitig offen
========================================= */

document
.querySelectorAll(".accordion-toggle")
.forEach(function(button) {

    button.addEventListener(
        "click",
        function() {

            const targetId =
                button.dataset.target;

            const target =
                document.getElementById(
                    targetId
                );

            const alreadyOpen =
                target.classList.contains(
                    "open"
                );


            /* alle Bereiche schließen */

            document
            .querySelectorAll(
                ".accordion-content"
            )
            .forEach(function(content) {

                content.classList.remove(
                    "open"
                );

            });


            document
            .querySelectorAll(
                ".accordion-toggle"
            )
            .forEach(function(toggle) {

                toggle.classList.remove(
                    "open"
                );

                toggle.setAttribute(
                    "aria-expanded",
                    "false"
                );

            });


            /* gewünschten Bereich öffnen */

            if(!alreadyOpen) {

                target.classList.add(
                    "open"
                );

                button.classList.add(
                    "open"
                );

                button.setAttribute(
                    "aria-expanded",
                    "true"
                );


                setTimeout(function() {

                    button.scrollIntoView({

                        behavior: "smooth",
                        block: "start"

                    });

                },100);

            }

        }
    );

});


/* =========================================
   STIMMEN LADEN
========================================= */

function loadVoices() {

    voices =
        window.speechSynthesis.getVoices();


    voiceSelect.innerHTML = "";


    if(voices.length === 0) {

        const option =
            document.createElement(
                "option"
            );

        option.textContent =
            "Noch keine Stimmen verfügbar";

        voiceSelect.appendChild(
            option
        );

        return;

    }


    voices.forEach(
        function(voice) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                voice.voiceURI;

            option.textContent =
                voice.name +
                " – " +
                voice.lang;

            voiceSelect.appendChild(
                option
            );

        }
    );


    const savedVoice =
        localStorage.getItem(
            "tongueboxVoice"
        );


    if(savedVoice) {

        const exists =
            voices.some(
                function(voice) {

                    return (
                        voice.voiceURI ===
                        savedVoice
                    );

                }
            );


        if(exists) {

            voiceSelect.value =
                savedVoice;

        }

    }

}


window.speechSynthesis.onvoiceschanged =
    loadVoices;


loadVoices();


/* iPhone/Safari lädt Stimmen teilweise verzögert */

setTimeout(
    loadVoices,
    500
);

setTimeout(
    loadVoices,
    1500
);


voiceSelect.addEventListener(
    "change",
    function() {

        localStorage.setItem(
            "tongueboxVoice",
            voiceSelect.value
        );

    }
);


/* =========================================
   SPRECHEN
========================================= */

function speak(text) {

    if(
        !text ||
        !text.trim()
    ) {

        status.textContent =
            "Bitte zuerst einen Text eingeben.";

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    const selectedVoice =
        voices.find(
            function(voice) {

                return (
                    voice.voiceURI ===
                    voiceSelect.value
                );

            }
        );


    if(selectedVoice) {

        utterance.voice =
            selectedVoice;

        utterance.lang =
            selectedVoice.lang;

    }


    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;


    utterance.onstart =
        function() {

            status.textContent =
                "🔊 Tonguebox spricht.";

        };


    utterance.onend =
        function() {

            status.textContent =
                "✓ Fertig.";

        };


    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================================
   VORLESEN
========================================= */

document
.getElementById("speakButton")
.addEventListener(
    "click",
    function() {

        speak(
            textField.value
        );

    }
);


/* =========================================
   STOPPEN
========================================= */

document
.getElementById("stopButton")
.addEventListener(
    "click",
    function() {

        window.speechSynthesis.cancel();

        status.textContent =
            "⏹ Sprachausgabe gestoppt.";

    }
);


/* =========================================
   TEXT LÖSCHEN
========================================= */

document
.getElementById("clearButton")
.addEventListener(
    "click",
    function() {

        textField.value = "";

        status.textContent =
            "🗑 Text gelöscht.";

        textField.focus();

    }
);


/* =========================================
   GESPEICHERTE SÄTZE LADEN
========================================= */

function getSavedSentences() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "tongueboxSentences"
            ) || "[]"
        );

    }

    catch(error) {

        return [];

    }

}


/* =========================================
   SATZ SPEICHERN
========================================= */

document
.getElementById("saveButton")
.addEventListener(
    "click",
    function() {

        const text =
            textField.value.trim();


        if(!text) {

            status.textContent =
                "Bitte zuerst einen Satz eingeben.";

            return;

        }


        const sentences =
            getSavedSentences();


        if(
            !sentences.includes(text)
        ) {

            sentences.push(
                text
            );


            localStorage.setItem(
                "tongueboxSentences",
                JSON.stringify(
                    sentences
                )
            );


            status.textContent =
                "💾 Satz gespeichert.";

        }

        else {

            status.textContent =
                "Dieser Satz ist bereits gespeichert.";

        }


        showSavedSentences();

    }
);


/* =========================================
   GESPEICHERTE SÄTZE ANZEIGEN
========================================= */

function showSavedSentences() {

    const area =
        document.getElementById(
            "savedSentences"
        );


    area.innerHTML = "";


    const sentences =
        getSavedSentences();


    if(sentences.length === 0) {

        const info =
            document.createElement("p");

        info.textContent =
            "Noch keine eigenen Sätze gespeichert.";

        area.appendChild(
            info
        );

        return;

    }


    sentences.forEach(
        function(sentence,index) {

            const wrapper =
                document.createElement(
                    "div"
                );


            const speakButton =
                document.createElement(
                    "button"
                );


            speakButton.type =
                "button";

            speakButton.className =
                "phrase-button saved-button";

            speakButton.textContent =
                sentence;

            speakButton.setAttribute(
                "aria-label",
                sentence + " sprechen"
            );


            speakButton.addEventListener(
                "click",
                function() {

                    speak(
                        sentence
                    );

                }
            );


            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.type =
                "button";

            deleteButton.className =
                "delete-button";

            deleteButton.textContent =
                "🗑 Löschen";


            deleteButton.setAttribute(
                "aria-label",
                sentence + " löschen"
            );


            deleteButton.addEventListener(
                "click",
                function() {

                    const list =
                        getSavedSentences();


                    list.splice(
                        index,
                        1
                    );


                    localStorage.setItem(
                        "tongueboxSentences",
                        JSON.stringify(
                            list
                        )
                    );


                    showSavedSentences();


                    status.textContent =
                        "🗑 Satz gelöscht.";

                }
            );


            wrapper.appendChild(
                speakButton
            );

            wrapper.appendChild(
                deleteButton
            );

            area.appendChild(
                wrapper
            );

        }
    );

}


/* =========================================
   START
========================================= */

showSavedSentences();

</script>

</body>

</html>
