<section class="box">

  <h2>⚡ Schnelle Kommunikation</h2>

  <div class="quick-grid">

    <button class="quick ja"
      onclick="direktSprechen('Ja')">

    <button class="quick nein"

    </button>

    <button class="quick"
      onclick="direktSprechen('Hallo')">

    </button>

    <button class="quick"

      onclick="direktSprechen('Mir geht es gut')">

      onclick="direktSprechen('Ich habe Schmerzen')">

      onclick="direktSprechen('Bitte geben Sie mir etwas Zeit zum Antworten')">

      onclick="direktSprechen('Ich habe Sie verstanden')">

    <button class="quick"
      onclick="direktSprechen('Ich habe Sie nicht verstanden')">
