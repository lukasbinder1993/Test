<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Tonguebox – Sprich mit deinen Augen</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 12px;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef2f5;
    color: #17212b;
}

main {
    max-width: 1000px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 2.5rem;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    font-size: 1.3rem;
    margin-top: 0;
    margin-bottom: 25px;
}

button,
select,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}


/* =========================
   ACCORDION
========================= */

.accordion {
    margin-bottom: 18px;
    border-radius: 20px;
    overflow: hidden;
    background: white;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.accordion-toggle {
    width: 100%;
    min-height: 120px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;
    padding: 22px;

    border: none;

    background: #087f8c;
    color: white;

    font-size: 1.6rem;
    font-weight: bold;
    text-align: left;
}

.accordion-toggle.open {
    background: #065f69;
}

.accordion-left {
    display: flex;
    align-items: center;
    gap: 18px;
}

.accordion-icon {
    font-size: 2.5rem;
}

.accordion-title {
    font-size: 1.5rem;
}

.accordion-arrow {
    font-size: 2rem;
}

.accordion-toggle.open .accordion-arrow {
    transform: rotate(180deg);
}

.accordion-content {
    display: none;
    padding: 20px;
    background: white;
}

.accordion-content.open {
    display: block;
}


/* =========================
   JA / NEIN
========================= */

.yes-no {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.yes,
.no {
    min-height: 150px;
    border: none;
    border-radius: 20px;
    color: white;
    font-size: 2.5rem;
    font-weight: bold;
}

.yes {
    background: #198754;
}

.no {
    background: #c62828;
}


/* =========================
   TEXT
========================= */

textarea {
    width: 100%;
    min-height: 180px;
    padding: 18px;

    border: 3px solid #555;
    border-radius: 16px;

    font-size: 1.5rem;
}

.big-button {
    width: 100%;
    min-height: 100px;

    margin-top: 14px;
    padding: 18px;

    border: none;
    border-radius: 16px;

    background: #0066cc;
    color: white;

    font-size: 1.5rem;
    font-weight: bold;
}

.action-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));

    gap: 15px;
    margin-top: 15px;
}

.action-grid button {
    min-height: 85px;
    padding: 15px;

    border: none;
    border-radius: 15px;

    background: #0066cc;
    color: white;

    font-size: 1.15rem;
    font-weight: bold;
}


/* =========================
   VORSCHLÄGE
========================= */

.phrase-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

    gap: 16px;
}

.phrase-button,
.ai-suggestion {
    min-height: 105px;
    padding: 18px;

    border: none;
    border-radius: 16px;

    color: white;

    font-size: 1.2rem;
    font-weight: bold;
}

.phrase-button {
    background: #5b3cc4;
}

.ai-suggestion {
    background: #7b2cbf;
}

.ai-box {
    padding: 16px;
    margin-bottom: 18px;

    background: #eef7ff;
    border-radius: 16px;

    line-height: 1.5;
}


/* =========================
   STIMME
========================= */

select {
    width: 100%;
    min-height: 75px;

    padding: 15px;

    border: 3px solid #555;
    border-radius: 15px;

    font-size: 1.2rem;
    background: white;
}


/* =========================
   GESPEICHERTE SÄTZE
========================= */

.saved-button {
    background: #7349c6;
}

.delete-button {
    width: 100%;
    min-height: 65px;

    margin-top: 8px;

    border: none;
    border-radius: 14px;

    background: #b71c1c;
    color: white;

    font-size: 1rem;
    font-weight: bold;
}


/* =========================
   FOKUS
========================= */

button:focus-visible,
textarea:focus-visible,
select:focus-visible {
    outline: 7px solid #ffd400;
    outline-offset: 5px;
}


/* =========================
   STATUS
========================= */

#status {
    padding: 15px;

    font-size: 1.1rem;
    font-weight: bold;

    text-align: center;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px) {

    body {
        padding: 8px;
    }

    h1 {
        font-size: 2rem;
    }

    .accordion-toggle {
        min-height: 125px;
        padding: 18px;
    }

    .accordion-title {
        font-size: 1.3rem;
    }

    .phrase-grid {
        grid-template-columns: 1fr;
    }

    .yes,
    .no {
        min-height: 135px;
        font-size: 2.2rem;
    }

}

</style>

</head>

<body>

<main>

<h1>🤖 Tonguebox</h1>

<p class="subtitle">
Sprich mit deinen Augen
</p>


<!-- JA / NEIN -->

<section class="accordion">

<button
type="button"
class="accordion-toggle"
data-target="yesno"
aria-expanded="false">

type="button"

type="button"
id="clearButton">

</button>

<button
type="button"
id="saveButton">

</button>

</div>

</div>

</section>


<!-- INTELLIGENTE VORSCHLÄGE -->

<section class="accordion">

<button
type="button"
class="accordion-toggle"
data-target="ai"
aria-expanded="false">

<span class="accordion-left">
<span class="accordion-icon">✨</span>
<span class="accordion-title">
Intelligente Phrasenvorschläge
</span>
</span>

<span class="accordion-arrow">▼</span>

</button>

<div
id="ai"
class="accordion-content">

<div class="ai-box">

Schreibe zum Beispiel:
<strong>Kaffee</strong>,
<strong>Durst</strong>,

oder
<strong>Hilfe</strong>.

<section class="accordion">

type="button"

aria-expanded="false">

<span class="accordion-left">

</button>

onclick="speak('Wie geht es dir?')">

onclick="speak('Kannst du mir bitte helfen?')">

</button>

<button class="phrase-button"
onclick="speak('Ich möchte etwas trinken.')">

<section class="accordion">

<span class="accordion-left">

<span class="accordion-title">
Krankenhaus
</span>
</span>

<span class="accordion-arrow">▼</span>

</button>

<div
id="hospital"
class="accordion-content">

<div class="phrase-grid">

<button class="phrase-button"
onclick="speak('Ich kann nicht sprechen und kommuniziere über dieses Gerät.')">

</span>

</button>

id="food"
class="accordion-content">

onclick="speak('Ich möchte etwas essen.')">

onclick="speak('Ich möchte etwas trinken.')">

<script>

/* =========================
   ELEMENTE
========================= */

const textField =
    document.getElementById("speechText");

const voiceSelect =
    document.getElementById("voiceSelect");

const status =
    document.getElementById("status");

const inlinePredictions =
    document.getElementById("inlinePredictions");

const aiSuggestions =
    document.getElementById("aiSuggestions");

let voices = [];


/* =========================
   ACCORDION
========================= */

document
.querySelectorAll(".accordion-toggle")
.forEach(function(button) {

    button.addEventListener(
        "click",
        function() {

            const target =
                document.getElementById(
                    button.dataset.target
                );

            const alreadyOpen =
                target.classList.contains("open");


            document
            .querySelectorAll(".accordion-content")
            .forEach(function(content) {

                content.classList.remove("open");

            });


            document
            .querySelectorAll(".accordion-toggle")
            .forEach(function(toggle) {

                toggle.classList.remove("open");

                toggle.setAttribute(
                    "aria-expanded",
                    "false"
                );

            });


            if(!alreadyOpen) {

                target.classList.add("open");

                button.classList.add("open");

                button.setAttribute(
                    "aria-expanded",
                    "true"
                );

            }

        }
    );

});


/* =========================
   STIMMEN
========================= */

function loadVoices() {

    voices =
        window.speechSynthesis.getVoices();

    voiceSelect.innerHTML = "";


    if(voices.length === 0) {

        const option =
            document.createElement("option");

        option.textContent =
            "Noch keine Stimmen verfügbar";

        voiceSelect.appendChild(option);

        return;

    }


    voices.forEach(function(voice) {

        const option =
            document.createElement("option");

        option.value =
            voice.voiceURI;

        option.textContent =
            voice.name + " – " + voice.lang;

        voiceSelect.appendChild(option);

    });


    const savedVoice =
        localStorage.getItem(
            "tongueboxVoice"
        );


    if(savedVoice) {

        voiceSelect.value =
            savedVoice;

    }

}


window.speechSynthesis.onvoiceschanged =
    loadVoices;

loadVoices();

setTimeout(loadVoices,500);
setTimeout(loadVoices,1500);


voiceSelect.addEventListener(
"change",
function() {

    localStorage.setItem(
        "tongueboxVoice",
        voiceSelect.value
    );

});


/* =========================
   SPRECHEN
========================= */

function speak(text) {

    if(!text || !text.trim()) {

        status.textContent =
            "Bitte zuerst einen Text eingeben.";

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(text);


    const selectedVoice =
        voices.find(function(voice) {

            return (
                voice.voiceURI ===
                voiceSelect.value
            );

        });


    if(selectedVoice) {

        utterance.voice =
            selectedVoice;

        utterance.lang =
            selectedVoice.lang;

    }


    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;


    window.speechSynthesis.speak(
        utterance
    );


    status.textContent =
        "🔊 Tonguebox spricht.";

}


/* =========================
   TEXTBUTTONS
========================= */

document
.getElementById("speakButton")
.addEventListener(
"click",
function() {

    speak(
        textField.value
    );

});


document
.getElementById("stopButton")
.addEventListener(
"click",
function() {

    window.speechSynthesis.cancel();

    status.textContent =
        "⏹ Sprachausgabe gestoppt.";

});


document
.getElementById("clearButton")
.addEventListener(
"click",
function() {

    textField.value = "";

    updateSuggestions();

    status.textContent =
        "🗑 Text gelöscht.";

});


/* =========================
   THEMEN
========================= */

const topicGroups = {

    kaffee: {

        keywords: [
            "kaffee",
            "cappuccino",
            "espresso",
            "latte",
            "milchkaffee"
        ],

        suggestions: [
            "Ich möchte einen Kaffee.",
            "Bitte mit Milch.",
            "Bitte ohne Milch.",
            "Bitte mit Zucker.",
            "Bitte ohne Zucker.",
            "Noch einen Kaffee bitte.",
            "Der Kaffee ist zu heiß.",
            "Der Kaffee ist zu kalt."
        ]
    },


    trinken: {

        keywords: [
            "trinken",
            "durst",
            "wasser",
            "saft",
            "tee",
            "getränk"
        ],

        suggestions: [
            "Ich möchte etwas trinken.",
            "Ich habe Durst.",
            "Ich möchte Wasser.",
            "Ich möchte einen Saft.",
            "Ich möchte einen Tee.",
            "Bitte noch etwas zu trinken.",
            "Nein danke, ich habe genug."
        ]
    },


    essen: {

        keywords: [
            "essen",
            "hunger",
            "frühstück",
            "mittagessen",
            "abendessen"
        ],

        suggestions: [
            "Ich möchte etwas essen.",
            "Ich habe Hunger.",
            "Was gibt es zu essen?",
            "Bitte noch etwas.",
            "Nein danke.",
            "Das schmeckt gut.",
            "Ich bin fertig."
        ]
    },


    schmerzen: {

        keywords: [
            "schmerz",
            "schmerzen",
            "weh",
            "aua"
        ],

        suggestions: [
            "Ich habe Schmerzen.",
            "Die Schmerzen sind stark.",
            "Die Schmerzen sind leicht.",
            "Bitte helfen Sie mir.",
            "Bitte fragen Sie mich, wo es weh tut."
        ]
    },


    toilette: {

        keywords: [
            "toilette",
            "wc",
            "klo"
        ],

        suggestions: [
            "Ich muss auf die Toilette.",
            "Bitte helfen Sie mir zur Toilette.",
            "Wo ist die Toilette?",
            "Ich brauche Hilfe beim WC.",
            "Bitte warten Sie einen Moment."
        ]
    },


    telefon: {

        keywords: [
            "telefon",
            "anrufen",
            "anruf",
            "telefonieren"
        ],

        suggestions: [
            "Ich möchte telefonieren.",
            "Ich kommuniziere über eine Sprachausgabe.",
            "Bitte warten Sie, während ich meine Antwort schreibe.",
            "Bitte sprechen Sie langsamer.",
            "Bitte wiederholen Sie das.",
            "Danke für Ihre Geduld."
        ]
    },


    hilfe: {

        keywords: [
            "hilfe",
            "helfen",
            "unterstützung"
        ],

        suggestions: [
            "Ich brauche Hilfe.",
            "Kannst du mir bitte helfen?",
            "Bitte komm zu mir.",
            "Ich brauche Unterstützung.",
            "Bitte warten Sie einen Moment."
        ]
    }

};


/* =========================
   ALLGEMEINE SÄTZE
========================= */

const generalSuggestions = [

    "Hallo.",
    "Guten Morgen.",
    "Guten Tag.",
    "Wie geht es dir?",
    "Danke.",
    "Bitte.",
    "Ich möchte etwas sagen.",
    "Ich möchte etwas fragen.",
    "Bitte warten Sie einen Moment.",
    "Bitte wiederholen Sie das."

];


/* =========================
   THEMA ERKENNEN
========================= */

function detectTopic(input) {

    const text =
        input.toLowerCase().trim();


    for(const topicName in topicGroups) {

        const topic =
            topicGroups[topicName];


        const found =
            topic.keywords.some(
                function(keyword) {

                    return text.includes(
                        keyword
                    );

                }
            );


        if(found) {

            return topicName;

        }

    }


    return null;

}


/* =========================
   BUTTON ERZEUGEN
========================= */

function createSuggestionButton(
    text,
    container
) {

    const button =
        document.createElement("button");


    button.type =
        "button";

    button.className =
        "ai-suggestion";

    button.textContent =
        text;


    button.addEventListener(
        "click",
        function() {

            textField.value =
                text;

            speak(text);

        }
    );


    container.appendChild(
        button
    );

}


/* =========================
   VORSCHLÄGE AKTUALISIEREN
========================= */

function updateSuggestions() {

    const input =
        textField.value.trim();


    inlinePredictions.innerHTML = "";

    aiSuggestions.innerHTML = "";


    const topic =
        detectTopic(input);


    let suggestions = [];


    if(topic) {

        suggestions =
            topicGroups[
                topic
            ].suggestions;

    }

    else {

        suggestions =
            generalSuggestions;

    }


    suggestions
    .slice(0,3)
    .forEach(function(sentence) {

        createSuggestionButton(
            sentence,
            inlinePredictions
        );

    });


    suggestions
    .slice(0,8)
    .forEach(function(sentence) {

        createSuggestionButton(
            sentence,
            aiSuggestions
        );

    });

}


/* Vorschläge beim Schreiben */

textField.addEventListener(
    "input",
    updateSuggestions
);


/* =========================
   SÄTZE SPEICHERN
========================= */

function getSavedSentences() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "tongueboxSentences"
            ) || "[]"
        );

    }

    catch(error) {

        return [];

    }

}


document
.getElementById("saveButton")
.addEventListener(
"click",
function() {

    const text =
        textField.value.trim();


    if(!text) {

        status.textContent =
            "Bitte zuerst einen Satz eingeben.";

        return;

    }


    const sentences =
        getSavedSentences();


    if(!sentences.includes(text)) {

        sentences.push(text);


        localStorage.setItem(
            "tongueboxSentences",
            JSON.stringify(sentences)
        );


        status.textContent =
            "💾 Satz gespeichert.";

    }

    else {

        status.textContent =
            "Dieser Satz ist bereits gespeichert.";

    }


    showSavedSentences();

});


function showSavedSentences() {

    const area =
        document.getElementById(
            "savedSentences"
        );


    area.innerHTML = "";


    const sentences =
        getSavedSentences();


    if(sentences.length === 0) {

        const info =
            document.createElement("p");

        info.textContent =
            "Noch keine eigenen Sätze gespeichert.";

        area.appendChild(info);

        return;

    }


    sentences.forEach(
    function(sentence,index) {

        const wrapper =
            document.createElement("div");


        const speakButton =
            document.createElement("button");


        speakButton.type =
            "button";

        speakButton.className =
            "phrase-button saved-button";

        speakButton.textContent =
            sentence;


        speakButton.addEventListener(
        "click",
        function() {

            speak(sentence);

        });


        const deleteButton =
            document.createElement("button");


        deleteButton.type =
            "button";

        deleteButton.className =
            "delete-button";

        deleteButton.textContent =
            "🗑 Löschen";


        deleteButton.addEventListener(
        "click",
        function() {

            const list =
                getSavedSentences();

            list.splice(
                index,
                1
            );


            localStorage.setItem(
                "tongueboxSentences",
                JSON.stringify(list)
            );


            showSavedSentences();

        });


        wrapper.appendChild(
            speakButton
        );

        wrapper.appendChild(
            deleteButton
        );

        area.appendChild(
            wrapper
        );

    });

}


/* =========================
   START
========================= */

showSavedSentences();

updateSuggestions();

</script>
