<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonguebox Smart – stabile Testversion</title>
<style>
:root{
  --teal:#087f8c;
  --green:#218838;
  --red:#c62828;
  --orange:#b76500;
  --yellow:#ffd400;
  --text:#10242a;
  --border:#c8d8dc;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:#fff;
}
.app{
  max-width:720px;
  margin:0 auto;
  padding:10px;
}
h1{
  text-align:center;
  font-size:28px;
  margin:10px 0 4px;
}
.subtitle{
  text-align:center;
  font-weight:700;
  margin-bottom:14px;
}
.card{
  border:3px solid var(--teal);
  border-radius:20px;
  padding:14px;
  margin:14px 0;
  background:#fff;
}
.status{
  text-align:center;
  font-size:18px;
  font-weight:800;
}
button,input,textarea{font:inherit}
button{
  width:100%;
  min-height:118px;
  border:0;
  border-radius:18px;
  padding:14px;
  background:var(--teal);
  color:#fff;
  font-size:22px;
  font-weight:800;
  cursor:pointer;
}
button:focus-visible,
input:focus-visible,
textarea:focus-visible{
  outline:7px solid var(--yellow);
  outline-offset:3px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.yes{background:var(--green)}
.no{background:var(--red)}
.warn{background:var(--orange)}
textarea,input{
  width:100%;
  border:3px solid var(--border);
  border-radius:16px;
  padding:14px;
  font-size:21px;
  background:#fff;
  color:var(--text);
}
textarea{min-height:100px}
.small{
  font-size:15px;
  font-weight:700;
  color:#53676d;
  margin:8px 0;
}
.acc{
  margin:14px 0;
}
.acc-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:108px;
  text-align:left;
  padding:18px 20px;
}
.acc-panel{
  display:none;
  margin-top:10px;
}
.acc.open .acc-panel{
  display:block;
}
.acc.open .acc-head{
  border-radius:18px;
  outline:4px solid rgba(255,212,0,.35);
}
#answers button{min-height:140px}




@media(max-width:600px){
  .app{padding:8px}
  h1{font-size:26px}
  .grid{grid-template-columns:1fr 1fr}
  button{min-height:122px;font-size:21px}
  #answers button{min-height:145px}
}

/* Für die systemeigene iPhone-Blickerfassung:
   nur große Auswahlflächen – keine eigene Verweildauer. */
.eye-mode-bar{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin:12px 0 16px;
}
#eyeModeButton{
  min-height:100px;
  background:#218838;
}
body.eye-mode button{
  min-height:128px;
}
body.eye-mode .acc-head{
  min-height:128px;
}
body.eye-mode #answers button{
  min-height:155px;
}
body.eye-mode button,
body.eye-mode textarea,
body.eye-mode input{
  scroll-margin-top:18px;
}
body.eye-mode button:focus-visible{
  outline:7px solid var(--yellow);
  outline-offset:3px;
}
@media(max-width:600px){
  body.eye-mode .grid{grid-template-columns:1fr 1fr!important}
  body.eye-mode button{font-size:22px!important;min-height:132px!important}
  body.eye-mode #answers button{min-height:160px!important}
}
</style>
</head>
<body>

<main class="app">
  <h1>🧠 Tonguebox</h1>
  <div class="subtitle">Einfach · schnell · für Blickerfassung</div>

  <div class="card status" id="status">Bereit.</div>

  <div class="eye-mode-bar">
    <button id="eyeModeButton" class="active" aria-pressed="true">
      👁 Blickmodus EIN
    </button>
  </div>

  <section class="acc open">
    <button class="acc-head" aria-expanded="true">
      <span>⚡ Schnell antworten</span><span>⌄</span>
    </button>
    <div class="acc-panel">
      <div id="answers" class="grid"></div>
    </div>
  </section>

  <section class="acc">
    <button class="acc-head" aria-expanded="false">
      <span>🧠 Frage beantworten</span><span>⌄</span>
    </button>
    <div class="acc-panel">
      <div class="card">
        <textarea id="question" placeholder="Frage eingeben …"></textarea>
        <button id="analyseButton" style="margin-top:12px">🧠 Antworten zeigen</button>
      </div>
    </div>
  </section>

  <section class="acc">
    <button class="acc-head" aria-expanded="false">
      <span>🔊 Eigener Satz</span><span>⌄</span>
    </button>
    <div class="acc-panel">
      <div class="card">
        <textarea id="ownText" placeholder="Eigenen Satz schreiben …"></textarea>
        <button id="speakButton" style="margin-top:12px">🔊 Sprechen</button>
      </div>
    </div>
  </section>

  <section class="acc">
    <button class="acc-head" aria-expanded="false">
      <span>🕒 Vorschläge für jetzt</span><span>⌄</span>
    </button>
    <div class="acc-panel">
      <div id="momentPhrases" class="grid"></div>
    </div>
  </section>

  <section class="acc">
    <button class="acc-head" aria-expanded="false">
      <span>🎧 Zuhören testen</span><span>⌄</span>
    </button>
    <div class="acc-panel">
      <div class="card">
        <button id="listenButton">🎧 Zuhören</button>
        <div class="small" id="listenInfo">
          Wenn dein Browser Spracherkennung unterstützt, kann Tonguebox zuhören.
        </div>
      </div>
    </div>
  </section>

  <section class="acc">
    <button class="acc-head" aria-expanded="false">
      <span>⚙️ Einstellungen</span><span>⌄</span>
    </button>
    <div class="acc-panel">
      <div class="card">
        <button id="resetButton" class="warn">🗑 Gelerntes zurücksetzen</button>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
"use strict";


var STORAGE_KEY = "tonguebox_simple_learning_v2";

function byId(id){ return document.getElementById(id); }

function setStatus(text){
  byId("status").textContent = text;
}

function safeLoad(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){
    return {};
  }
}

function safeSave(data){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){}
}

function learn(sentence){
  var data = safeLoad();
  data[sentence] = (data[sentence] || 0) + 1;
  safeSave(data);
}

function learnedTop(){
  var data = safeLoad();
  return Object.keys(data).sort(function(a,b){
    return data[b] - data[a];
  });
}

function normalize(text){
  return (text || "").toLowerCase().trim();
}

function isYesNoQuestion(text){
  var q = normalize(text);
  if (/^(wer|wie|was|wann|wo|warum|wieso|welche|welcher|welches)/.test(q)) return false;
  if (q.indexOf(" oder ") >= 0 && q.indexOf("ja oder nein") < 0) return false;
  return /^(bist|bin|sind|ist|hast|hat|haben|kannst|kann|willst|will|möchtest|mochtest|magst|soll|darf|musst|muss|kommst|kommt|gehst|geht|brauchst|braucht|passt|stimmt)/.test(q);
}

function suggestions(text){
  var q = normalize(text);

  if (isYesNoQuestion(q)){
    return ["Ja.","Nein.","Vielleicht.","Bitte wiederholen."];
  }
  if (q.indexOf("kaffee") >= 0){
    return ["Ja, bitte einen Kaffee.","Nein danke.","Mit Milch bitte.","Ohne Zucker bitte."];
  }
  if (q.indexOf("trinken") >= 0 || q.indexOf("wasser") >= 0 || q.indexOf("durst") >= 0){
    return ["Bitte Wasser.","Ja, bitte.","Nein danke.","Etwas anderes bitte."];
  }
  if (q.indexOf("essen") >= 0 || q.indexOf("hunger") >= 0){
    return ["Ja, ich möchte essen.","Nein danke.","Bitte noch etwas.","Ich bin fertig."];
  }
  if (q.indexOf("schmerz") >= 0 || q.indexOf("weh") >= 0){
    return ["Ja, ich habe Schmerzen.","Nein, keine Schmerzen.","Es ist stärker.","Bitte hilf mir."];
  }
  if (q.indexOf("toilette") >= 0 || q.indexOf("wc") >= 0){
    return ["Ich muss auf die Toilette.","Noch nicht.","Bitte hilf mir.","Einen Moment bitte."];
  }
  if (q.indexOf("termin") >= 0){
    return ["Der Termin passt.","Der Termin passt nicht.","Bitte später.","Bitte schriftlich schicken."];
  }

  var learned = learnedTop();
  var base = ["Ja.","Nein.","Einen Moment bitte.","Bitte wiederholen."];
  return learned.concat(base).filter(function(v,i,a){
    return a.indexOf(v) === i;
  }).slice(0,4);
}

function speak(text){
  if (!text) return;
  learn(text);

  if (!("speechSynthesis" in window)){
    setStatus("Sprachausgabe wird in diesem Browser nicht unterstützt.");
    return;
  }

  try{
    window.speechSynthesis.cancel();
    var utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "de-AT";
    window.speechSynthesis.speak(utterance);
    setStatus("🔊 " + text);
  }catch(e){
    setStatus("Sprachausgabe konnte nicht gestartet werden.");
  }
}

function renderAnswers(list){
  var box = byId("answers");
  box.innerHTML = "";

  list.slice(0,4).forEach(function(text,index){
    var button = document.createElement("button");
    button.textContent = text;

    if (text === "Ja.") button.className = "yes";
    if (text === "Nein.") button.className = "no";
    if (index === 2 && !button.className) button.className = "warn";

    button.addEventListener("click", function(){
      speak(text);
      renderMoment();
    });

    box.appendChild(button);
  });
}

function timePhrases(){
  var h = new Date().getHours();
  if (h < 10) return ["Guten Morgen!","Ich möchte einen Kaffee.","Ich möchte etwas trinken.","Was steht heute an?"];
  if (h < 14) return ["Ich möchte etwas essen.","Ich möchte etwas trinken.","Einen Moment bitte.","Alles passt."];
  if (h < 18) return ["Ich möchte einen Kaffee.","Ich brauche eine Pause.","Was steht heute noch an?","Bitte hilf mir kurz."];
  if (h < 22) return ["Guten Abend!","Ich bin müde.","Ich möchte etwas trinken.","Danke für heute."];
  return ["Ich brauche Hilfe.","Ich möchte etwas trinken.","Ich kann nicht schlafen.","Bitte einen Moment warten."];
}

function renderMoment(){
  var list = learnedTop().concat(timePhrases()).filter(function(v,i,a){
    return a.indexOf(v) === i;
  }).slice(0,8);

  var box = byId("momentPhrases");
  box.innerHTML = "";

  list.forEach(function(text){
    var button = document.createElement("button");
    button.textContent = text;
    button.addEventListener("click", function(){ speak(text); });
    box.appendChild(button);
  });
}

byId("analyseButton").addEventListener("click", function(){
  var q = byId("question").value.trim();
  if (!q) return;
  renderAnswers(suggestions(q));
  setStatus(isYesNoQuestion(q) ? "✅ Ja/Nein-Frage erkannt." : "🧠 Antworten bereit.");
});

byId("speakButton").addEventListener("click", function(){
  speak(byId("ownText").value.trim());
});

document.querySelectorAll(".acc-head").forEach(function(button){
  button.addEventListener("click", function(){
    var section = button.closest(".acc");
    var willOpen = !section.classList.contains("open");

    document.querySelectorAll(".acc").forEach(function(item){
      item.classList.remove("open");
      var head = item.querySelector(".acc-head");
      if(head) head.setAttribute("aria-expanded","false");
    });

    if(willOpen){
      section.classList.add("open");
      button.setAttribute("aria-expanded","true");
      setTimeout(function(){
        button.scrollIntoView({behavior:"smooth", block:"start"});
      },80);
    }
  });
});

byId("resetButton").addEventListener("click", function(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  
/* Blickmodus verändert nur die Größe der Bedienelemente.
   Auswahl und Verweildauer werden vollständig vom iPhone-System gesteuert. */
var EYE_KEY = "tonguebox_eye_mode_v1";
var eyeMode = true;

try{
  var savedEye = localStorage.getItem(EYE_KEY);
  if(savedEye === "0") eyeMode = false;
}catch(e){}

function updateEyeMode(){
  var btn = byId("eyeModeButton");
  document.body.classList.toggle("eye-mode", eyeMode);
  btn.setAttribute("aria-pressed", String(eyeMode));
  btn.textContent = eyeMode ? "👁 Große Blickflächen EIN" : "👁 Große Blickflächen AUS";
  try{ localStorage.setItem(EYE_KEY, eyeMode ? "1" : "0"); }catch(e){}
}

byId("eyeModeButton").addEventListener("click", function(){
  eyeMode = !eyeMode;
  updateEyeMode();
  setStatus(eyeMode ? "👁 Große Blickflächen eingeschaltet." : "Normale Buttongröße.");
});

updateEyeMode();

renderAnswers(["Ja.","Nein.","Einen Moment bitte.","Ich brauche Hilfe."]);
  renderMoment();
  setStatus("🗑 Gelerntes wurde zurückgesetzt.");
});

byId("listenButton").addEventListener("click", function(){
  var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!Recognition){
    byId("listenInfo").textContent = "Safari auf diesem Gerät stellt Tonguebox hier keine nutzbare automatische Spracherkennung bereit. Die restliche App funktioniert trotzdem.";
    setStatus("🎧 Automatisches Zuhören ist in diesem Browser nicht verfügbar.");
    return;
  }

  try{
    var recognition = new Recognition();
    recognition.lang = "de-AT";
    recognition.interimResults = false;
    recognition.continuous = false;

    recognition.onresult = function(event){
      var text = event.results[0][0].transcript;
      byId("question").value = text;
      renderAnswers(suggestions(text));
      setStatus("🎧 Frage erkannt.");
    };

    recognition.onerror = function(){
      setStatus("Spracherkennung konnte nicht gestartet werden.");
    };

    recognition.start();
    setStatus("🎧 Ich höre zu …");
  }catch(e){
    setStatus("Spracherkennung konnte nicht gestartet werden.");
  }
});

renderAnswers(["Ja.","Nein.","Einen Moment bitte.","Ich brauche Hilfe."]);
renderMoment();

})();
</script>
</body>
</html>
