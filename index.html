* {

}

html {
    scroll-behavior: smooth;

body {

}

main {
    max-width: 1000px;

}

h1 {

    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    font-size: 1.3rem;
    margin-top: 0;
    margin-bottom: 25px;
}

button,
textarea,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}


/* =====================================
   AUF- UND ZUKLAPPEN
===================================== */

.accordion {
    margin-bottom: 18px;
    border-radius: 20px;
    overflow: hidden;
    background: white;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.accordion-toggle {
    width: 100%;
    min-height: 120px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    padding: 22px;

    border: none;

    background: #087f8c;
    color: white;

    font-size: 1.55rem;
    font-weight: bold;

    text-align: left;
}

.accordion-toggle.open {
    background: #065f69;
}

.accordion-left {
    display: flex;
    align-items: center;
    gap: 18px;
}

.accordion-icon {
    font-size: 2.4rem;
}

.accordion-arrow {
    font-size: 2rem;
}

.accordion-toggle.open
.accordion-arrow {
    transform: rotate(180deg);
}

.accordion-content {
    display: none;
    padding: 20px;
    background: white;
}

.accordion-content.open {
    display: block;
}


/* =====================================
   JA / NEIN
===================================== */

.yes-no {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.yes,
.no {
    min-height: 150px;

    border: none;
    border-radius: 20px;

    color: white;

    font-size: 2.5rem;
    font-weight: bold;
}

.yes {
    background: #198754;
}

.no {
    background: #c62828;
}


/* =====================================
   TEXTEINGABE
===================================== */

textarea {
    width: 100%;
    min-height: 170px;

    padding: 18px;

    border: 3px solid #555;
    border-radius: 16px;

    font-size: 1.5rem;
}


/* =====================================
   LIVE KI-VORSCHLÄGE
===================================== */

.live-ai-box {
    margin-top: 18px;
    padding: 18px;

    border-radius: 18px;

    background: #f3edff;

    border: 3px solid #7b2cbf;
}

.live-ai-title {
    margin-top: 0;
    margin-bottom: 8px;

    font-size: 1.35rem;
}

.topic-status {
    margin-bottom: 15px;

    font-size: 1.1rem;
    font-weight: bold;
}

.ai-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(220px,1fr));

    gap: 15px;
}

.ai-suggestion {
    min-height: 105px;

    padding: 18px;

    border: none;
    border-radius: 16px;

    background: #7b2cbf;
    color: white;

    font-size: 1.2rem;
    font-weight: bold;
}


/* =====================================
   BUTTONS
===================================== */

.big-button {
    width: 100%;
    min-height: 100px;

    margin-top: 16px;

    padding: 18px;

    border: none;
    border-radius: 16px;

    background: #0066cc;
    color: white;

    font-size: 1.5rem;
    font-weight: bold;
}

.action-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit,minmax(200px,1fr));

    gap: 15px;

    margin-top: 15px;
}

.action-grid button {
    min-height: 85px;

    border: none;
    border-radius: 15px;

    background: #0066cc;
    color: white;

    font-size: 1.15rem;
    font-weight: bold;

/* =====================================
   PHRASE BUTTONS
===================================== */

.phrase-grid {

    gap: 16px;

.phrase-button {
    min-height: 105px;

    padding: 18px;

    border: none;
    border-radius: 16px;

    background: #5b3cc4;
    color: white;

    font-size: 1.2rem;
    font-weight: bold;

/* =====================================
   STIMME
===================================== */

select {

    border-radius: 15px;

/* =====================================

===================================== */

.delete-button {

<script>

/* =====================================
   ELEMENTE
===================================== */

const textField =
    document.getElementById("speechText");

const voiceSelect =
    document.getElementById("voiceSelect");

const status =
    document.getElementById("status");

const inlinePredictions =
    document.getElementById("inlinePredictions");

const aiSuggestions =
    document.getElementById("aiSuggestions");

const topicStatus =
    document.getElementById("topicStatus");

let voices = [];


/* =====================================
   BEREICH IN DIE MITTE HOLEN
===================================== */

function centerSection(section) {

    setTimeout(function() {

        section.scrollIntoView({

            behavior: "smooth",
            block: "center"

        });

    },150);

}


/* =====================================
   AUF- UND ZUKLAPPEN
===================================== */

document
.querySelectorAll(".accordion-toggle")
.forEach(function(button) {

    button.addEventListener(
        "click",
        function() {

            const target =
                document.getElementById(
                    button.dataset.target
                );

            const section =
                button.closest(
                    ".accordion"
                );

            const alreadyOpen =
                target.classList.contains(
                    "open"
                );


            document
            .querySelectorAll(
                ".accordion-content"
            )
            .forEach(function(content) {

                content.classList.remove(
                    "open"
                );

            });


            document
            .querySelectorAll(
                ".accordion-toggle"
            )
            .forEach(function(toggle) {

                toggle.classList.remove(
                    "open"
                );

                toggle.setAttribute(
                    "aria-expanded",
                    "false"
                );

            });


            if(!alreadyOpen) {

                target.classList.add(
                    "open"
                );

                button.classList.add(
                    "open"
                );

                button.setAttribute(
                    "aria-expanded",
                    "true"
                );


                centerSection(
                    section
                );

            }

        }
    );

});


/* =====================================
   STIMMEN
===================================== */

function loadVoices() {

    voices =
        window.speechSynthesis.getVoices();


    voiceSelect.innerHTML = "";


    if(voices.length === 0) {

        const option =
            document.createElement(
                "option"
            );

        option.textContent =
            "Noch keine Stimmen verfügbar";

        voiceSelect.appendChild(
            option
        );

        return;

    }


    voices.forEach(
    function(voice) {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            voice.voiceURI;

        option.textContent =
            voice.name +
            " – " +
            voice.lang;

        voiceSelect.appendChild(
            option
        );

    });


    const saved =
        localStorage.getItem(
            "tongueboxVoice"
        );


    if(saved) {

        voiceSelect.value =
            saved;

    }

}


window.speechSynthesis.onvoiceschanged =
    loadVoices;

loadVoices();

setTimeout(loadVoices,500);
setTimeout(loadVoices,1500);


voiceSelect.addEventListener(
"change",
function() {

    localStorage.setItem(
        "tongueboxVoice",
        voiceSelect.value
    );

});


/* =====================================
   SPRECHEN
===================================== */

function speak(text) {

    if(!text || !text.trim()) {

        status.textContent =
            "Bitte zuerst Text eingeben.";

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    const selectedVoice =
        voices.find(
        function(voice) {

            return (
                voice.voiceURI ===
                voiceSelect.value
            );

        });


    if(selectedVoice) {

        utterance.voice =
            selectedVoice;

        utterance.lang =
            selectedVoice.lang;

    }


    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;


    window.speechSynthesis.speak(
        utterance
    );


    status.textContent =
        "🔊 Tonguebox spricht.";

}

{

name: "💊 Medikamente",

keywords: [

    "medikament",
    "medikamente",
    "tablette",
    "medizin"

],

suggestions: [

    "Ich brauche meine Medikamente.",
    "Wann bekomme ich meine Medikamente?",
    "Bitte erklären Sie mir dieses Medikament.",
    "Habe ich meine Medikamente schon bekommen?",
    "Bitte warten Sie einen Moment."

]

}

];


/* =====================================
   TEXTE NORMALISIEREN
===================================== */

function normalizeText(text) {

    return text
        .toLowerCase()
        .trim()
        .replace(/ä/g,"ae")
        .replace(/ö/g,"oe")
        .replace(/ü/g,"ue")
        .replace(/ß/g,"ss");

}


/* =====================================
   THEMA ERKENNEN
===================================== */

function detectTopic(input) {

    const cleanedInput =
        normalizeText(input);


    if(!cleanedInput) {

        return null;

    }


    for(
        let i = 0;
        i < topics.length;
        i++
    ) {

        const topic =
            topics[i];


        for(
            let x = 0;
            x < topic.keywords.length;
            x++
        ) {

            const keyword =
                normalizeText(
                    topic.keywords[x]
                );


            if(
                cleanedInput.includes(
                    keyword
                )
            ) {

                return topic;

            }


            /*
            Auch Teilwörter erkennen:

            z.B.
            "Kaff" -> Kaffee
            "Schmerz" -> Schmerzen
            */

            if(
                cleanedInput.length >= 3 &&
                keyword.startsWith(
                    cleanedInput
                )
            ) {

                return topic;

            }

        }

    }


    return null;

}


/* =====================================
   ALLGEMEINE VORSCHLÄGE
===================================== */

const generalSuggestions = [

    "Hallo.",
    "Guten Morgen.",
    "Guten Tag.",
    "Wie geht es dir?",
    "Ich möchte etwas sagen.",
    "Ich möchte etwas fragen.",
    "Ich brauche Hilfe.",
    "Bitte warten Sie einen Moment."

];


/* =====================================
   VORSCHLAGS-BUTTON
===================================== */

function addSuggestion(
    sentence,
    container
) {

    const button =
        document.createElement(
            "button"
        );


    button.type =
        "button";

    button.className =
        "ai-suggestion";


    button.textContent =
        sentence;


    button.addEventListener(
        "click",
        function() {

            textField.value =
                sentence;


            speak(
                sentence
            );


            updateSuggestions();

        }
    );


    container.appendChild(
        button
    );

}


/* =====================================
   VORSCHLÄGE LIVE AKTUALISIEREN
===================================== */

function updateSuggestions() {

    const text =
        textField.value;


    const topic =
        detectTopic(
            text
        );


    inlinePredictions.innerHTML =
        "";

    aiSuggestions.innerHTML =
        "";


    let suggestions;


    if(topic) {

        topicStatus.textContent =
            "✨ Erkanntes Thema: " +
            topic.name;


        suggestions =
            topic.suggestions;


        status.textContent =
            "🧠 Passende Vorschläge zu " +
            topic.name +
            " gefunden.";

    }

    else if(text.trim()) {

        topicStatus.textContent =
            "🔎 Noch kein bestimmtes Thema erkannt.";


        suggestions =
            generalSuggestions;

    }

    else {

        topicStatus.textContent =
            "Schreibe ein Wort – Tonguebox sucht passende Themen.";


        suggestions =
            generalSuggestions;

    }


    /*
    Direkt unter Textfeld:
    6 Vorschläge
    */

    suggestions
    .slice(0,6)
    .forEach(
    function(sentence) {

        addSuggestion(
            sentence,
            inlinePredictions
        );

    });


    /*
    Im großen KI-Bereich:
    bis zu 8 Vorschläge
    */

    suggestions
    .slice(0,8)
    .forEach(
    function(sentence) {

        addSuggestion(
            sentence,
            aiSuggestions
        );

    });

}


/* =====================================
   WICHTIG:
   JEDER TASTENDRUCK AKTUALISIERT
   DIE VORSCHLÄGE
===================================== */

textField.addEventListener(
    "input",
    updateSuggestions
);

textField.addEventListener(
    "keyup",
    updateSuggestions
);

textField.addEventListener(
    "change",
    updateSuggestions
);


/* =====================================
   TEXT VORLESEN
===================================== */

document
.getElementById("speakButton")
.addEventListener(
"click",
function() {

    speak(
        textField.value
    );

});


/* =====================================
   STOPPEN
===================================== */

document
.getElementById("stopButton")
.addEventListener(
"click",
function() {

    window.speechSynthesis.cancel();

    status.textContent =
        "⏹ Sprachausgabe gestoppt.";

});


/* =====================================
   TEXT LÖSCHEN
===================================== */

document
.getElementById("clearButton")
.addEventListener(
"click",
function() {

    textField.value =
        "";

    updateSuggestions();

    status.textContent =
        "🗑 Text gelöscht.";

});


/* =====================================
   SÄTZE SPEICHERN
===================================== */

function getSavedSentences() {

    try {

        return JSON.parse(

            localStorage.getItem(
                "tongueboxSentences"
            ) || "[]"

        );

    }

    catch(error) {

        return [];

    }

}


document
.getElementById("saveButton")
.addEventListener(
"click",
function() {

    const text =
        textField.value.trim();


    if(!text) {

        status.textContent =
            "Bitte zuerst einen Satz eingeben.";

        return;

    }


    const sentences =
        getSavedSentences();


    if(
        !sentences.includes(text)
    ) {

        sentences.push(
            text
        );


        localStorage.setItem(
            "tongueboxSentences",
            JSON.stringify(
                sentences
            )
        );


        status.textContent =
            "💾 Satz gespeichert.";

    }

    else {

        status.textContent =
            "Dieser Satz ist bereits gespeichert.";

    }


    showSavedSentences();

});


/* =====================================
   GESPEICHERTE SÄTZE ANZEIGEN
===================================== */

function showSavedSentences() {

    const area =
        document.getElementById(
            "savedSentences"
        );


    area.innerHTML =
        "";


    const sentences =
        getSavedSentences();


    if(
        sentences.length === 0
    ) {

        const info =
            document.createElement(
                "p"
            );


        info.textContent =
            "Noch keine eigenen Sätze gespeichert.";


        area.appendChild(
            info
        );


        return;

    }


    sentences.forEach(
    function(sentence,index) {

        const wrapper =
            document.createElement(
                "div"
            );


        const speakButton =
            document.createElement(
                "button"
            );


        speakButton.type =
            "button";

        speakButton.className =
            "phrase-button saved-button";

        speakButton.textContent =
            sentence;


        speakButton.addEventListener(
        "click",
        function() {

            speak(
                sentence
            );

        });


        const deleteButton =
            document.createElement(
                "button"
            );


        deleteButton.type =
            "button";

        deleteButton.className =
            "delete-button";

        deleteButton.textContent =
            "🗑 Löschen";


        deleteButton.addEventListener(
        "click",
        function() {

            const list =
                getSavedSentences();


            list.splice(
                index,
                1
            );


            localStorage.setItem(
                "tongueboxSentences",
                JSON.stringify(
                    list
                )
            );


            showSavedSentences();

        });


        wrapper.appendChild(
            speakButton
        );

        wrapper.appendChild(
            deleteButton
        );


        area.appendChild(
            wrapper
        );

    });

}


/* =====================================
   START
===================================== */

showSavedSentences();

updateSuggestions();

</script>
